Zweites Kapitel

Cornelie war auf dem Postamt gewesen und hatte dort einen Brief empfangen. Die skurrile Handschrift mit dem großen Schwung der Anfangsbuchstaben, gegen die sie eine leise Abneigung nie hatte überwinden können, auch als sie die Briefumschläge mit dieser Schrift noch in Zärtlichkeit an die Lippen gedrückt hatte ...

Rudi Imgart versicherte sie seiner Freundschaft und bot ihr seine Hilfe an für den Fall, daß sie sie bedürfen sollte!

Ein Almosen ... Cornelie knirschte mit den Zähnen, zerknitterte das Blatt – eine Welle heißen Hasses schlug über sie hin – sie spie aus vor würgendem Ekel. Sie zerriß den Brief in kleine Stücke und streute sie in die Luft. Ihre Glieder zitterten in nervösem Froste. – Auch dieses war nun erlitten und konnte so nicht noch einmal gelitten werden.

Hatte sie immer noch geglaubt, unter allen Irrungen und Krämpfen der Liebe müsse ein Unzerstörbares sie mit diesem Manne ewig verbinden – müsse sich gerade jetzt in seiner Kraft offenbaren ...?

Vorbei – vorbei – vorüber ...

Nun durfte sie den Namen des Mannes aus ihrer und ihres Kindes Zukunft löschen.

Nun lag das Leben vor ihr als ein leeres Blatt, mit frischen, noch nie versuchten Schriftzügen zu bedecken.

Ein neu Beginnen. Cornelie atmete tief. Jetzt wollte sie das Dasein wieder leben. Wollte es mit ganzem Willen auf sich nehmen.

In die Einsamkeit hatte Cornelie flüchten wollen und war, wie in alten Märchen, gleichsam in Schlaf und Traum in ein anderes Leben hinabgesunken, das unter dem hellen Tagesschein, in dem sie bisher gewohnt hatte, sich regte und bewegte, erfüllt war von Gestalten und Schicksalen, von denen sie vorher nicht das mindeste ahnte. Sie war sich ein Einzelfall gewesen – ein Unerhörtes, Niedagewesenes, nie wieder Seiendes, ausgestoßen aus der Gemeinschaft alles Menschlichen, von dem sie wußte, und das ihr bis heut allein als Menschliches gegolten hatte. Wie weit dahinten lagen nun alle bekannten Begriffe – – Wie unsicher schienen die Umrisse ihrer Existenz geworden, wie matt und zerflossen, elend gleichgültig die Farben ihres bisherigen Seins – selbst ihrer Liebe, die kaum noch zu ihr zu gehören schien, die ihr über den Rand des dunklen Brunnens, in dem sie zu versinken begann, mit toten, leeren Gespensteraugen nachblickte.

Um sie her, aus dem Dunkel der Nacht, drang es auf sie ein von neuen Dingen, neuen Erscheinungen, die schattenhaft sich durcheinander bewegten und regten und leise raunten von unerhörten Geheimnissen und schweren Gefühlen und von tiefem Wissen, das in dieser Unterwelt
 verborgen, seiner Auferstehung, seiner Erhebung zum Lichte der Erkenntnis harrte ...

Und doch schien die Sonne auch hier, und die gleichen Blumen blühten wie im Tageslicht – und am Himmel schwebte der gleiche, vertraute Sagenvogel, von dem einst in der eigenen warmen Kinderstube die Mutter Liedchen gesungen und Märchen erzählt hatte. Mit ungeschickten Kinderfingern hatte sie ihm Brosämlein und Kuchenbrocken auf die Fensterbank gestreut, damit er ihr ein Brüderlein oder Schwesterlein bringe. Die schöne Mama hatte daneben gestanden und geheimnisvoll gelächelt ... Und die ersten Schauer des Unbegreiflichen, des großen Wunders des eigenen Daseins hatten an ihr kleines Mädchenherz gerührt, bei jenem befangenen, glücklich-bangen Lächeln der Mutter ...

Die Luft in dem niederen Raume, dessen Decke Cornelie von ihrem Lager aus mit der ausgestreckten Hand berühren konnte, war schwül und dumpfig. Sie hatte am Abend das Fenster öffnen wollen und dabei gesehen, daß die weißen Gardinen, die es so sauber umhüllten, in der Mitte zugenäht waren, gleichsam um jedem Versuch einer Lüftung von vornherein vorzubeugen. Als Cornelie ihre Schere nahm und diese seltsame Naht auftrennte, welche ihr die etwas übertriebene Ordnungsliebe der Frau Uffenbacher angenehm zu bestätigen schien, entdeckte sie den tieferen Grund dieser Maßregel. Das Holz der Fensterumrahmung war so vermorscht, die Haften und Riegel so vom Rost zerfressen, daß die Flügel, sobald sie sie aufzustoßen
 versuchte, auf der Stelle in die Nesseln, die unter dem Fenster blühten, hinabzustürzen drohten und nur mit einer energischen Anstrengung ihrer Arme noch an diesem Unglücksfall verhindert werden konnten. Augenscheinlich wurde die Tür zur Durchlüftung des Raumes für ausreichend erachtet, und dies war wohl der Grund, daß sich aus der Küche emporsteigend, ein fettiger Schmalzgeruch der Zimmerluft eindringlich mitgeteilt hatte. Trotzdem der Dunst von Speisen Cornelie unerträgliche Übelkeit verursachte, mochte sie doch die Tür nicht offen stehen lassen – sie empfand allzu unbehaglich die Neugier, die draußen lauerte.

Immerhin, eine Nacht konnte man bei geschlossenen Türen und Fenstern verbringen. Morgen, in der Frühe, würde sie zu einem Tischler senden und die Sache auf eigene Kosten richten lassen.

Aber nun wurden nach und nach alle die Gerüche lebendig, die in dem eingeschlossenen kleinen Zimmer schon so lange Zeit gefangen gehalten worden waren.

Aus dem vorsintflutlichen Kanapee krochen uralte Düfte von Menschenschweiß, von dörflichem Knaster und Pfeifenrauch, aus dem wurmstichigen Holzwerk des Waschtisches und der Bettlade, ja aus Kissen und Decken wand sich ein fader, süßlich-ekler Brodem, gemischt aus Moschus, Kamillen, Ammoniak und Karbol. Cornelies geschärfte Sinne vermeinten den Dunst von Blut und Wunden zu spüren – von Blut, das über das Lager geflossen, auf dem sie ruhte – von Wunden, die hier erlitten waren in
 einsamer Not ... Angst und Ekel beklemmten sie bis zur Atemlosigkeit. Sie warf die Decken von sich und wollte aufspringen – da hielt sie zitternd inne und lauschte ... der Schweiß brach ihr aus, lief ihr in kalten Tröpfchen das Rückgrat hinab. Ein Wimmern drang zu ihr, ein leises, ersticktes Winseln und Weinen, so, als werde es erstickt in den Kissen eines Bettes. Und doch wurde es stärker und stärker, schwoll auf zu jähem Schluchzen, sank zusammen zu ergebenem Weinen, wurde wieder lauter, wurde zum verzweifelten Jammern eines verlassenen, der dunklen Nacht und den dunklen Schicksalsmächten sein Elend klagenden Geschöpfes.

Cornelie starrte mit weitaufgerissenen Augen in die Finsternis. So grauenvolles Weinen hatte sie noch nie vernommen ... Doch, doch – sie kannte jeden Laut – es war ihr allmählich, als höre sie sich selbst, losgelöst vom eigenen Körper, dort drinnen schluchzen ... War es nur eine Stimme? Eine zweite gesellte sich aus größerer Entfernung hinzu – es war nicht mehr ein einzelnes Mädchenweinen – die Klagelaute drangen vom Boden herauf und aus den Mauern hervor – es schien Cornelien, als wimmere das ganze kleine dürftige Haus, als vereinten sich alle Tränen, die in seinem Innern schon geflossen sein mochten, zu einem Regen, der mit geisterhaftem Gewinsel aus den Poren des Mauerwerkes, aus den Ritzen der Dielen, aus den Kissen der Lagerstätten empordrang und hilflos, hoffnungslos, doch unerschöpflich der Nacht und dem
 Dunkel die Schmerzen klagte, die dem harten Tageslicht verborgen werden mußten.

So viele heiße, liebevolle Herzen hatten hier der Liebe fluchen gelernt, hatten hier in wilden Angstkrämpfen das Muttergefühl in der Brust ersticken und morden müssen.

Was Wunder, wenn der fühllose Mörtel der Wände bebte, wenn das Holz der Dielen, das alle die zahllosen Tränen aufgesogen hatte, ächzte unter dem Brand der salzigen Tropfen ...

Die Stunden vergingen und Cornelie saß aufrecht in ihrem Bette, lauschend auf die geisterhaften Stimmen ihrer eigenen Schmerzen, und sie wurden ihr zu einem Klagestöhnen, das nicht mehr ihr eigenes blieb, das aus fernen, fernen Zeiten durch die Jahrhunderte scholl, gleich einem ewigen, unstillbaren Gesang der Zertretenen, Verlassenen, Besiegten.

Drittes Kapitel

Unter den Blinden ist der Einäugige König, hatte Cornelie Reimann gedacht, als die ersten Zeichen zu ihr gedrungen waren, daß ihr Buch: »Beiträge zur Psychologie der Frau«, das vor einigen Monaten erschien, ein gewaltiges Aufsehen machte und sie zu einer Berühmtheit erhob, die sie niemals erwartet hätte. Waren die einfachen Beobachtungen, die sie zusammenstellte, den Menschen so fremd? Es mußte wohl sein.

Hatte nicht sogar der Mann, der sie zu lieben vorgab, sie zerstörend beleidigt, indem er alle Grundbedingungen ihrer Persönlichkeit mißkannte?

Der laue Frühlingstag lockte unter knorrigen, von rosenroten Blüten bedeckten Apfelbäumen auf der Landstraße weiter und weiter zu wandern. Heut zum erstenmal, seit sie besinnungslos vor Schrecken und Not aus dem Hause ihrer Mutter geflohen war, schien es ihr, als schaue sie das Flimmern eines goldenen Fadens, an dem sie sich herauszutasten vermöchte aus dem dumpfen Umherirren, in den dunklen Gängen tausendfacher Qualen. Ein neues Werk – in dem sie vergessen könnte ... Ein Werk, das ihrem Kinde, wenn sie sterben mußte, die Existenz sichern sollte.

Unter dem Tirilieren der Lerchen über den hellgrünen Feldern spann sie an dem Plane und freute sich, wie die
 Gedanken heller und schärfer wurden, wie logisch Ring sich an Ring fügte.

Als Cornelie heimkam, war die Sonne schon eine Weile untergegangen. Sie sah in der Dämmerung Frau Uffenbacher breit und wuchtig in ihrer kleinen Haustür stehen. Die Hanne war bei ihr und drei der Fräuleins; die Rose von Ulm war am Morgen abgereist. Cornelie hörte lautes, heftiges Schwatzen und zögerte, um einen Augenblick abzupassen, in dem sie unbemerkt die Treppe hinaufschlüpfen konnte. Seit man ihren Zustand offen erkannte, war ihr zumute, als gehe sie nackend zwischen den Menschen hindurch. Sie fühlte deren Blicke wie die Stiche böser Insekten auf ihrer empfindlichen Haut, und bis tief in ihre Brust hinein.

Während sie in der Dämmerung am Himbeergebüsch des Gartens stehenblieb, hörte sie Annerles helle Stimme:

»Jesses, da kommt sie ja schon, Frau Uffenbacher! Hab' ich's nit gesagt, sie wird halt spazieren gegangen sein!«

Cornelie trat langsam näher.

»Ist es schon Essenszeit? Es tut mir leid, wenn ich habe warten lassen,« sagte sie obenhin. Mit einem leichten Neigen des Kopfes wollte sie an der Gruppe vorüber.

»Das geschieht mir aber nit wieder,« schrie Frau Uffenbacher sie an, der Zorn der vollblütigen Frau brach zuweilen ganz unvermittelt aus ihr hervor.

»Was geschieht nicht wieder?« fragte Cornelie befremdet.

»Daß Sie hier fortgehn, ohne mir auch nur ein Wörtle zu sagen, und stundenlang fortbleibe und mir wisse nit, wo Sie sich aufhalte! Das gibt's nit – die Angscht will ich nit noch einmal habbe!«

»Aber – Frau Uffenbacher,« sagte Cornelie irritiert, »warum hatten Sie denn Angst? Ich bin doch ein erwachsener Mensch! Was soll mir denn hier zustoßen? Sind die Landstraßen in der Gegend so unsicher?«

»Ja, was meine Sie denn,« schrie die Uffenbacherin laut und drohend, »in dem Zustand, wo Sie sich befinde, da rennt man doch nit stundelang auf die Landstraß'! Wenn Ihne da was zustößt, und Sie komme im Straßengrabe nieder? ... Nachher hab' ich mit der Polizei zu schaffe! Das könnt' mir passe! Oder Sie krieget's in den Kopf und tun sich ein Leid an! Gar noch! 's wär' nit das erschte Mal!«

Cornelie stand mit gesenktem Kopf und ließ die Scheltworte der wütenden Frau auf sich niederprasseln.

Morgen früh reise ich wieder, dachte sie mutlos. Es muß doch einen Ort geben, wo ich mich unbehelligt verkriechen kann.

Hochmütig sagte sie: »Bitte mir das Abendessen auf mein Zimmer zu senden.« Dann stieg sie, ohne sich umzusehen, langsam und ein wenig schwer die schmale Holztreppe hinauf.

»Was ist denn die – was will denn die!« keifte die Uffenbacherin mit hochrotem Gesicht und schaute sich wütend unter ihren Damen um.

»Ja, Frau Uffenbacher, die läßt sich nicht behandeln, wie wir armen Hascherle!« meinte das Annerle.

»No – wie behandele ich euch denn?« schrie die Uffenbacherin. Die Arme in die Seiten gestemmt, pflanzte sie sich drohend vors Annerle, so daß sie fast erschrecklich anzusehen war, die gewaltige Frau, in dem aus ihr kochenden und polternden Jähzorn.

Es wurde ein wüster, kreischender, tobender Weiberzank, der den lauen Frühlingsabend mißtönend durchhallte.

Cornelie lag oben auf dem tabaksduftigen Kanapee. Die zugenähten Gardinen vor den Fenstern konnten den Schall der Schimpfworte, die hin und wieder flogen, nur wenig dämpfen. Ihre geringe Kenntnis von den volkstümlichen Ausdrücken für die zarten Dinge der Liebe wurde an diesem Abend um eine tüchtige Anzahl saftiger Kernworte vermehrt.

Sie beschloß, am frühen Morgen ihren Koffer zu packen, die für den Monat vorausbezahlte Pension fahren zu lassen und weiter zu ziehen. Konnte sie bei dem Geschrei und Geheul, das hier an der Tagesordnung zu sein schien, ihre Arbeit über das Seelenleben des modernen Kulturweibes mit einiger Wahrscheinlichkeit auf Erfolg zu einem guten Ende bringen?

Und doch schien es ihr beinahe unmöglich, eine neue Unterkunft zu suchen und sich all den fragenden, verwunderten, mißtrauischen Blicken aufs neue auszusetzen. Eine Angst ergriff sie, in der sie aufsprang und mit flatterndem Herzschlag mühsam und bange atmete. Sie trat
 an das winzige Fenster, hob die Gardine und blickte hinab. Da sah die vornehme Philosophin Cornelie Reimann etwas, das sie noch niemals gesehen hatte: Frau Uffenbacher wendete sich mit einem jähen Schwung ihrer stattlichen Hüften, hob ihre Röcke hoch auf und streckte ihren Pensionärinnen, den gesamten besseren Damen als Zeichen ihrer äußersten Verachtung ihr weißleuchtendes, breites und mächtiges Hinterteil entgegen. Dann verschwand sie unter dem gellenden Entrüstungsschrei der von solchem Schimpf Betroffenen in dem Flur ihrer »Anstalt«, und dröhnend schlug die Küchentür hinter ihr zu.

Der schwarz und weiße Sagenvogel, der, einen zapzelnden Frosch im roten Schnabel, von blauer Höhe herab zugeschaut hatte, schlug gelassen seine schweren Flügel auf und nieder und enteilte zu seinem friedlichen Nest auf der Pfarrscheune.

Viertes Kapitel

Das blonde Annerle grüßte mit Ehrerbietung, als sie der Neuen am nächsten Morgen auf dem Flur in den Weg trat. Bescheiden fragte sie, wie die gnädige Frau geschlafen habe.

Auf das kühle Dankwort Corneliens flüsterte sie errötend: »Man schläft nit extra gut hier im Tränenhaus – so heißen wir die verfluchte Hütte ... Ach – gnädige Frau passen gar nicht hierher ...«

Cornelie zuckte ungeduldig die Achseln. »Ich werde wieder abreisen,« sagte sie, und wollte in ihr Zimmer zurücktreten, fügte jedoch im nächsten Augenblick lebhafter hinzu: »Ich verstehe nicht, warum Sie sich die Unverschämtheit dieser schauerlichen Person gefallen lassen. Ich habe mich in ihr geirrt. Sie schien mir anfangs eine verständige und wohlwollende Frau.«

»Ja,« rief Annerle, »so scheint sie, und damit lockte sie uns alle hierher – damit umgarnt sie auch den Geheimrat! Der hält arg große Stücke auf sie und will mir nit glauben, wenn ich ihm sage: ›Herr Geheimrat, Sie sollten die Frau Uffenbacher kennen, wie wir sie kennen! Da würden Sie Augen machen!‹«

»Der Geheimrat?« fragte Cornelie befremdet.

»Der Herr Geheimrat hat dem Vater der Toni die
 Frau Uffenbacher empfohlen, und darum
 will er nun nicht die Wahrheit hören – so sind die Mannsbilder,« berichtete Annerle, unter ihren blonden Flatterlöckchen mit den etwas vorstehenden Augen Cornelie anblickend. Sie lächelte über die Mannsbilder und Cornelie lächelte auch, aus Höflichkeit.

Plötzlich ging ein Erschrecken über ihre Züge. »Wohnt dieser – dieser Geheimrat hier im Haus?«

Jetzt war Annerles ganzes rundes Gesicht eine fröhliche Heiterkeit. »O – Jesses! Der Herr Geheimrat – hier wohnen! Das muß ich ihm erzählen! Der wird lachen. Nein – der schaut nur zuweilen von Stuttgart herüber, ob hier alles in Ordnung hergeht! O – da kann die Uffenbacherin aber schmeicheln und schön tun! Und eine Würdigkeit! Da sollt' man meinen, es könnt' gar nit sein, daß sie sich so schweinisch beträgt, wie gestern abend. Wir haben uns alle für Sie geschämt.«

Cornelie wendete den Kopf ab und errötete. Annerle sah ein, daß es besser war, das Thema zu wechseln. Die kleine mollige Person in der karrierten Morgenjacke, darunter sich kugelrund das Bäuchlein hob, richtete sich ein wenig auf den Zehen zu Cornelies Ohr und flüsterte geheimnisvoll: »Der Herr Geheimrat hat der Uffenbacherin das Geld gegeben, um die Anstalt zu übernehmen, nachdem ihre letzte Besitzerin verstorben ist, und das Häusle zum Verkauf stand.«

»Woher wissen Sie denn das alles?« fragte Cornelie verwundert und wider Willen interessiert.

Annerle schlug die Augen nieder.

»Ich war schon einmal hier,« sagte sie mit einer künstlich gespielten Verlegenheit. »S'ischt schon mein Zweites ...«

»Ah so ...«

»Ja – das Liesel ist bei meinen Eltern ... Aber gnädige Frau müssen deshalb nicht schlecht von mir denken –«

Annerle hatte diese Redensart häufig in Romanen gelesen, die von verführten Mädchen handelten, und fand sie jetzt entschieden angebracht. »Ich und mei Hansel, wir leben wie brave Eheleut' zusammen – nur heiraten können wir uns halt nit – seine Eltern sind jüdisch und mein Onkel ist doch der Dekan.«

Sie machte eine Pause und war zufrieden mit der Wirkung des zuletzt ausgespielten Trumpfes auf die Fremde.

»Bitt' schön, gnädige Frau – ich vertrau' auf Ihre Dischkretion ... es wäre arg für mich, wenn's daheim auskäm, daß ich schon wieder in der Hoffnung bin ... Ja – geltens –, so ein verliebter Mann ...! Und mei Hansel hat immer gesagt: ›Annerle, nur nichts gegen 's Gesetz ... Da steht Zuchthaus drauf ...‹ Wisse Sie – sein Alter ist als noch so ganz im Alten Testament.«

»Wie merkwürdig ist das alles,« flüsterte Cornelie. »Aber kann Ihnen der – der – Ihr Freund nicht eine andere Unterkunft verschaffen?«

»Ha – mei Hansel – und mir was verschaffen. Jesses, der sagt: Laß mich zufrieden – 's ist schon arg genug, daß d' so garstig ausschaust. Ich wüßt' schon noch
 andere Orte – aber, das ischt's ja – wir könne hier nit fort – wir habe uns dem Satan in die Händ' geliefert –! Wenn die Männer wüßten, was so ein arm's Mädele auszustehen hat ... Gnädige Frau, das ist ein bitterböses Weib – die Uffenbacherin –, die hat ihre Freud' d'ran, ihr Gift und ihre Bosheit an uns auszulassen ... Sie weiß von uns allen die Adressen – die läßt sie sich gleich zu Anfang geben ... Für einen Sterbensfall sagt sie – ja – ja ... damit sie uns in der Hand hat, und wir nit 's Maul auftun dürfen, wenn sie uns einen Fraß vorsetzt, wie für die Säue. Gnädige Frau haben doch nicht etwa Ihre richtige Adresse angegeben, von Ihrem Zuhaus?«

»Ja – das habe ich,« sagte Cornelie geängstigt.

»Das hätten gnädige Frau nicht tun dürfen,« bemerkte Annerle und hob ihr in die Luft strebendes Näschen mit weiser Überlegenheit noch höher. »Hätt' ich gnädige Frau nur rate dürfe! Von meinen Leuten weiß sie ja – denn ich bin's doch gewesen, die 's beim Herrn Geheimrat vermittelt hat, daß er ihr das Geld gab! Dafür dacht' ich, ich könnt' auf eine menschenwürdige Behandlung rechnen. – Prost Mahlzeit! Nun hat man zu kuschen! Und gar das arme Tonerle – der ihr Vater verliert seine Stellung, wenn's auskommt, wer die Verwandten sind, wo seine Tochter den Sommer zubringt. Wenn das Mädele wagt, sich zu beklagen, da heißt's: Du hascht's nit anders habe wolle – jetzt schweig' und leid'!«

Cornelie neigte den Kopf und bewegte nervös die Finger, die kalt und feucht geworden waren.

»Ach, gnädige Frau ...« begann das kleine rundliche Mädchen elegisch – sie besaß einen regen Schönheitssinn, darum hatte es ihr diese Schlanke, Vornehme gleich angetan. »Wenn ich Ihnen in irgend etwas behilflich sein könnt'?« Eine bewundernde Andacht war in der Stimme.

»Ich danke Ihnen.« Das müde und traurige Lächeln, das Annerle bis zu Tränen rührte, kam wieder über das schmale Gesicht mit der kühnen Nase. »Wir müssen uns wohl am besten auch sagen: Du hast's haben wollen – jetzt schweig' und leid' ...«

Annerle fühlte, es war genug mit den Annäherungsversuchen. So begab sie sich zu Toni, um dieser ihre Erfahrungen mit der neuen Vornehmen freundschaftlich zu berichten.

Die bayerische Toni hatte es sich bequem gemacht und räumte, in eine rosageblümte Nachtjacke und einen braunen Moireerock gekleidet, ihre Kommodenschubladen auf. Sie war daheim, in dem kinderreichen Haushalt eines Mittelschullehrers an hunderterlei wechselnde Arbeiten gewöhnt. Hier schlichen die langen Tage in trüber Einförmigkeit den kurzen Sommernächten entgegen. Darum traf man Toni meist bei der Aufräumung ihrer Kommode, oder mit dem Stopfen ihrer Strümpfe, Hemden und sonstigen Bekleidungsgegenstände beschäftigt. Alles war von äußerster Einfachheit und durch langen Gebrauch abgenutzt, aber mit Sorgsamkeit erhalten.

Toni zählte nicht mehr als siebzehn Lenze. Von einem Liebesfrühling, dessen Freuden sie hier bei Frau Uffenbacher
 abzubüßen gezwungen wurde, hätte sie kaum sprechen können. Ihre Erfahrungen in der Liebe waren kurz, dunkel und verworren. Sie beschränkten sich auf wenige Stunden, die ihr in der Erinnerung nur Angst und Schrecken zu enthalten schienen. Toni war ein knochiges Mädchen von unreinem Teint und breitem, gewöhnlichen Gesicht, dem nur die treuherzigen Augen ein freundliches Licht verliehen. Aber sie hatte sich darüber klar werden müssen, daß es nicht einmal dieser spärliche Reiz gewesen war, der ihren Verführer lockte. Ach nein – es waren nur die paar tausend Mark, die sie vor kurzem von einer Tante geerbt hatte, und die die geschäftige Phantasie guter Freunde sofort zu einigen Hunderttausenden umschuf, mit denen ein verschuldeter Abenteurer sich hatte vor dem Ruin retten wollen.

Zwei von Tonis Freundinnen waren zur gleichen Zeit dem Schurken zur Beute gefallen. Er wollte die Wahl haben. Von den Eltern konnte ihm unter so zwingenden Umständen doch keiner die Tochter weigern, hatte er wohl gemeint. Aber dieses Rechenexempel wurde ruchbar und Toni wurde von allem in Kenntnis gesetzt. Nun zeigte sie sich demütig einverstanden mit ihrem Vater, als er dem Verführer die Tochter weigerte. Sie sollte ihn niemals wiedersehen und sie verlangte auch nicht danach. Aber sie mußte neun Monate lang sein Kind unter dem Herzen tragen. Das blasse, gedunsene Gesicht der Siebzehnjährigen hatte in dieser Zeit einen Ausdruck von geistiger Stumpfheit angenommen, von ungeheuerer Gleichgültigkeit,
 die fast wie Dummheit wirkte und die doch nur ein Schild war, die verzweifelte Selbsthilfe eines noch sehr jungen und gesunden Organismus gegen das tötende Entsetzen.

Und auch gegen das Heimweh. Das fürchterliche Heimweh, das Toni ergriff, wenn sie ihre Kommodenschubladen aufräumte – das Heimweh nach der Mama, nach der Großmutter und den kleinen Geschwistern, von denen sie noch niemals entfernt gewesen war. Dabei quälte sie fortwährend ein unerträglicher Hunger. Wo sie ging und stand sah man Toni an einem Landjäger kauen – an einer dieser steinharten, geräucherten, flachgepreßten bayerischen Würste, welche die einzigen Liebesgaben bildeten, die Tonis Familie ihr ab und zu in der Verbannung zukommen ließ.

Fünftes Kapitel

Auf halber Höhe des langgedehnten Hügelgeländes, das auf seinem Gipfel die Dorfstraße trug, führte zwischen Haferfeldern ein schmaler, blumenumwachsener Weg zu einem Hain alter zottiger Apfelbäume. Weiße und rosige Blättchen wehten bei jedem Luftzug über Cornelie hin, die auf ihrem Tuch im Grase saß und zu arbeiten versuchte. Dabei mußte sie aber fortwährend über all die Zustände nachdenken, die Annerle ihr vorhin enthüllt hatte. Wenn es so stand, besaß sie ja gar nicht mehr die Freiheit, fortzugehen! Und auch wenn sie blieb, setzte sie ihre Mutter bei jeder Meinungsverschiedenheit mit diesem unheimlichen Weibe der Gefahr eines anonymen Anklagebriefes aus. Wie ein unbedachtes Kind hatte sie sich benommen. Sollte nun ihre Mutter Unsicherheit und Erwartung dieser Monate mit ihr leiden, nur weil sie sich zu schwach fühlte, zu ertragen, was alle die kleinen Mädchen doch ertrugen? Wie sie sich für ihre Willenlosigkeit verachtete!

Ein Bauer, der nach seinen Feldern gesehen hatte, war an Cornelie vorübergegangen, war zurückgekommen, um sie genau zu betrachten, und hatte sie dann in einer gewissen Entfernung umkreist, sie beobachtend, wie man ein fremdes Tier in seinen verwunderlichen Beschäftigungen beobachtet. Das hatte Cornelie maßlos gereizt – sie war
 geneigt, ihre ganze Verstimmung lediglich jener Störung zuzuschreiben. Der von hohen Mauern umhegte gräfliche Park erschien ihr plötzlich als ein Zufluchtsort, wo der Druck von ihr genommen werden könne. Dort gab es sicher Bänke und Tische. Man konnte seine Blätter behaglich ausbreiten. Das Schreiben auf den Knien, eine Stellung, bei der einem alle Glieder schmerzten, war der geistigen Sammlung nicht eben zuträglich. Hatte Frau Uffenbacher ihr nicht gesagt, daß die Herrschaft verreist sei? Der Gärtner mochte durch ein Trinkgeld zu gewinnen sein.

Cornelie lächelte ein wenig in sich hinein. Sie mußte sich vorstellen, daß die Herrschaft anwesend war, sie ihre Karte hinaufschickte – und ob dies unter andern Verhältnissen nicht genügt haben würde, damit man ihr den Park, solange sie es wünschte, zur Verfügung stellte? Es war ihr in diesem Augenblick wieder alles gegenwärtig, was dieses letzte Jahr ihr gebracht hatte. Sie sah ihre Stuben angefüllt mit den üppigen, schwer duftenden Gewächshausblumen, sie sah die Stöße von Zeitungen, welche Tag um Tag gesandt wurden von Menschen, die sie nicht kannte, in deren jeder ihr Name – der Name Cornelie Reimann – als ein aufgehender Morgenstern, ein Fanal in der Dunkelheit gepriesen wurde – sie sah bewundernde Augen, verehrende Blicke von Männern und Frauen auf sich gerichtet – sie hörte das Flüstern, das um sie her entstand, sobald sie ein Theater, einen Gesellschaftssaal betrat – sie atmete wieder die allgemeine Huldigung, die zu ihr empordrang und sie, wo sie auch ging und stand,
 gleichsam in einen feinen Weihrauchduft hüllte. Sie spürte wieder mit einem seltsamen Vibrieren ihres Herzens die Flammen des Begehrens, die entzündet aus den Weihrauchdüften des Ruhmes heiß zu ihr emporgezüngelt waren, die ihr mit einem Male die verlorene Jugend zurückzuerobern schienen ... Nein – der Ruhm war nicht kalt, des Lorbeers Blüten dufteten betäubend, waren umflochten von Girlanden blutroter Rosen ... Und die Welt gehörte ihr – zu Genuß und Besitz ...

Ihre Lippen wölbten sich voll und rosig in ihrem glühenden Antlitz und ihre Augen glänzten ...

Das Verweilen in Frau Uffenbachers geheimnisvollem Häuschen erhielt jetzt plötzlich nur die Bedeutung einer vorübergehenden abenteuerlichen Laune, es bekam den Reiz eines Exils, in dem eine Herrscherin zeitweilig ihre Krone verbirgt – in dem sie, der noch unermeßliche Macht und Gewalt vorbehalten ist, sich aus eigenem Willen aller ihrer Ehren und Herrlichkeiten für eine kurze Weile begibt ...

Annerle stand vor der Tür und wartete, sie stand dort, eine neue Flanellwindel behäkelnd, schon geraume Zeit, um Corneliens Rückkehr nicht zu versäumen. Cornelie fragte hochmütig nach dem Weg zum gräflichen Park.

Annerle bot sich sogleich als Führerin an. Sie äußerte Bedenken, ob der Gärtner eine Fremde wohl einlassen würde. – Cornelie wagte, durch Annerles Ansprache jäh aus allen Phantasien gerissen, keinerlei Widerspruch gegen ihren Vorschlag. Sie hätte dem Mädchen nicht einmal andeuten
 können, daß sie zu arbeiten beabsichtige. Es würde ihr wie eine Entweihung vorgekommen sein, als zeige sie vorwitzig ihre verborgene Krone – das Manuskript, das sie in einem Leinenbeutelchen am Arme hängend trug.

Zerstreut aß sie auf ihrem Zimmer ein Beefsteak, welches Frau Uffenbacher mit allzuviel Zwiebeln zuzubereiten pflegte, und streckte sich, ermüdet von dem sonnigen, warmen Morgen, auf dem alten Kanapee aus.

Annerle hatte inzwischen beschlossen, die Schweizer-Mari und die arme Toni an der Ehre eines Spazierganges mit der geheimnisvollen Neuen teilnehmen zu lassen. Ihr gutes Herz konnte einmal keine Freude allein genießen, und ihr Tatendrang ergriff mit Begeisterung jede Gelegenheit, sich in den Mittelpunkt der Ereignisse zu bringen.

Doch schien es auch Frau Uffenbacher lieblich, mit der vornehmen Dame im gräflichen Park zu promenieren. Bei dem Gärtner, dem Verwalter, am Ende gar dem Herrn Pfarrer oder dem Dr. Schwärzle, dem sie leicht begegnen mochten, konnte man sich als Beschützerin einer geheimnisvollen Fremden von hohem Range aufspielen. Der einfache bürgerliche Name, den Cornelie angegeben hatte, war der alten Schwäbin längst nicht interessant genug. Dahinter steckte noch manches, und die gute Frau Uffenbacher erging sich sowohl abends in ihren Träumen unter dem karrierten Federbett, wie auch bei ihren Besuchen im Dorf in den üppigsten Vorstellungen, was alles an herrlichen Dingen für ihre eigene Zukunft aus so hohen Beziehungen entsprießen könne!

Cornelie ahnte wenig, daß man schon am abendlichen Biertisch in der »Wirtschaft« oben im Dorf darüber dischkurierte, ob sie eine »Regierende« oder nur »halt so eine Fürschtin« sei, und welche romantische oder gar politische Umtriebe sie in den abgelegenen Erdenwinkel verjagt hatten. Cornelies gleichgültiges Ablehnen von Frau Uffenbachers Anerbieten, sie in Dorf und Park umherzuführen, hatte diese schwerer gekränkt, als sie ahnen konnte. Und nun wollte die freche kleine Person, das Annerle, deren Freundschaft zu dem Geheimrat ihr ohnehin ein Dorn im Auge war, der Frau Uffenbacher den Triumph mir nichts dir nichts vorweg nehmen!

Der Sturm der Wut begann bereits in ihrer gewaltigen Brust zu kochen und ihr das Blut in den Kopf zu treiben. Als die Mari, die Toni und das Annerle gegen drei Uhr, die auseinandergegangenen Gestalten zum erstenmal wieder in Korsetts gezwängt, mit Jacken, Hüten, Schleiern und Sonnenschirmen die Treppe hinab kamen, brach das Unheil furchtbar aus und es gab ein Toben schwäbischer Flüche und Verwünschungen, daß das kleine Haus darob in seinen Grundfesten erzitterte.

»Wer hat die Erlaubnis für den gräflichen Park? Ich oder ihr? Das gäb' Geschichte, wann die Herrschaft solchem Sauvolk wie ihr eins seid, ihren Park auftun wollt'! Der Herr Vollrat hat mir eigens gesagt: Sie, Frau Uffenbacher, jederzeit –! Aber das Gesindel, das Sie da beherbergen, ja – ›Gesindel‹ hat er gesagt! Was fallt euch
 bei – daß ihr euch hier herausputzt – schämen solltet ihr euch vorm hellen Tageslicht! Ihr H...!«

»Frau Uffenbacher!« rief über ihr eine Stimme mit hartem, hochmütigen Klang, »ich wünsche Sie zu sprechen! Sofort!«

Das war keine Bitte mehr, das war ein Befehl – so streng, und aus einer so fernen Höhe herab gegeben, daß er auf den wollüstigen Zorn der Frau wirkte wie ein Sturzbad kalten Wassers auf tobende Flammen. Sie verstummte jäh und sagte nach einigen Sekunden ganz sanft: »Ich komm' schon!«

»Ich warte,« antwortete Cornelie mit derselben hochmütigen Kälte, die im Gegensatz zu der freundlichen Milde, in der sie sonst zu sprechen pflegte, wie eine unerhörte Beleidigung wirkte. Sie verschwand und schloß die Tür ihres Zimmers.

Einige Sekunden später tappte der schwere Tritt der Uffenbacherin die schmale Holztreppe hinauf.

»Das gnädige Fräulein sind gewiß erschrocken,« begann die Frau, ihr dunkelrotes, aufgeblähtes Gesicht zu einem harmlosen Lächeln zwingend, »ja, die Gesellschaft, die ich hier hab', da muß man als mal dreinfahre, anders ischt da kei Ordnung zu halte!«

Cornelie erhob sich von dem Stuhl, auf dem sie gesessen hatte, und die Hebamme bekam plötzlich den Eindruck, sie habe nicht gewußt, daß die Gestalt vor ihr so viel größer und höher sei, als sie selbst. Auch sonst hatte sich das Gesicht des Fräuleins verändert. Aus der schmerzhaften
 Gleichgültigkeit war plötzlich eine Entschlossenheit geworden, die die weichen Züge straffte. Die großen Augen blickten mit einer so strengen Macht, daß die Uffenbacherin fast eine Schwäche und ein Zittern in den Knien befiel.

Cornelie sprach zu ihr, nicht laut und ziemlich langsam. Aber jedes Wort besaß einen Klang, spröde und scharf wie ein Diamantensplitter.

»Frau Uffenbacher,« sagte sie und hielt das Weib fortwährend unter ihrem Blick, »ich will Ihnen jetzt etwas sagen und danach mögen Sie sich einrichten! Wenn ich hier im Hause bleiben soll, so darf niemals wieder ein solcher Auftritt stattfinden, wie gestern und wie eben dort draußen! Hören Sie –! Niemals wieder! Wie können Sie sich unterstehen, junge Mädchen, die sich zu Ihnen in Pension begeben haben, deren Geld Sie nehmen, über die Sie keine Macht und Gewalt irgendeiner Art besitzen, mit Worten und Gebärden, wie ich sie hier gehört und gesehen habe, zu beschimpfen –?«

Die Uffenbacherin öffnete den Mund zu einer Verteidigung, aber Cornelie hob die Hand und Frau Uffenbacher senkte den Kopf und schluckte und schloß den breiten Mund.

»Das Leben dieser Mädchen draußen in der Welt geht Sie gar nichts an, verstehen Sie mich? Erlauben Sie sich noch ein einziges Mal in Worten oder Taten ein Urteil darüber, vergessen Sie noch einmal die Höflichkeit gegen die Mädchen, die sich Ihnen anvertraut haben, dann werde ich deren Partei ergreifen. Dann werde ich dafür sorgen,
 daß sie ein würdigeres Unterkommen finden – ich werde es für sie suchen, und Sie werden mir wohl glauben, daß ich es ohne Mühe finden kann. Der Vater der Toni und dieser Geheimrat, von dem Sie abhängen, werden durch mich benachrichtigt werden, was hier vorgeht. Und wir verlassen alle – hören Sie – alle! an demselben Tage das Haus. Sie sind dann ruiniert. Das werden Sie wohl begreifen! Ich werde dafür sorgen, daß jedermann erfährt, wie Sie Ihr Amt hier ausführen ...«

Cornelie hielt inne und ließ der Uffenbacherin einige Sekunden Zeit zur Überlegung. Sie genügten, die Frau zur Besinnung zu bringen.

»Ich hab' mich hinreißen lasse,« brummte sie stammelnd. »Die Geduld geht einem halt aus! Es soll schon nit wieder vorkomme.«

»Das erwarte ich von Ihnen. Sie wissen nun, was Ihnen bevorsteht, und Sie werden wohl nicht zweifeln, daß ich mein Wort halte.«

Frau Uffenbacher bewegte wie in einem krampfhaften Kauen und Würgen die Kinnbacken. Dergleichen war ihr noch nicht geschehen, in ihrer ganzen Praxis nicht. Immer hatte sie nur winselnde, hilflose, ihrer Macht preisgegebene Weiber unter ihren Händen gehabt. Nun fühlte sie mit dumpfem Staunen etwas Fremdes, die Kraft eines Geistes, vor der ihre brutale und dumme Macht sich feige verkroch, wie der Hund vor dem Blick des Herrn.

Sie nahm sich zusammen, stammelte Entschuldigungen und Versprechungen und fragte schließlich demütig, das
 Fräulein werde doch ihre Worte nicht wahr machen, sie sei ein armes Weib, und müsse auch hart um ihren Verdienst arbeiten, und neun Kinder habe sie gehabt, die seien ihr alle gestorben, bis auf die paar, die in die Welt gegangen seien und sich nicht mehr um sie kümmerten. Cornelie hörte wenig mehr auf ihr Geschwätz, sondern starrte stumm zusammengefaßt vor sich nieder und wunderte sich, wie sie zu dem Mut gekommen sei, den Kampf mit diesem fürchterlichen Weibe aufzunehmen. Es war ihr unheimlich, daß sie so schnell die erste Schlacht gewonnen hatte. Doch war es wohl nur die erste Schlacht gewesen und weitere mußten folgen.

»Wünschen das gnädige Fräulein, daß ich den Tee herauf bringe?« fragte die Uffenbacherin. »Der Bäck' im Dorf hat frischen Zwiebelkuchen, der ischt als sehr gut – die Hanne könnt' springe und hole.«

Cornelie schüttelte schweigend den Kopf. Aber als Frau Uffenbacher, die sich entlassen sah, die Tür schon erreicht hatte, rief sie ihr nach: »Ich werde von jetzt ab meine Mahlzeiten mit den übrigen Mädchen nehmen.«
