Sechstes Kapitel

Es kam nun eine stille Zeit. Ein Friede, der dem Annerle schier unheimlich dünkte, herrschte zwischen der Uffenbacherin und ihren Fräuleins. Die Alte bezeigte ihnen demütige Unterwürfigkeit und nur die Hanne erfuhr, wenn Türen und Fenster geschlossen waren, in der Küche die wahre Meinung der Gekränkten.

Die Schweizer-Mari übte sich auf der Wiese im Spiel mit dem dicken Ziehkind des Hauses, das die Fräuleins das Versuchskind nannten, in mütterlichen Handgriffen. Die Toni räumte ihre Kommodenschubladen auf, kaute an einem Landjäger, untersuchte die Gurken im dreieckigen Gärtchen, ob sie noch nicht bald einen Salat geben könnten und erhielt an den Sonntagen den Besuch ihres Vaters, eines protestantischen Lehrers an der Mittelschule einer kleinen bayerischen Stadt, den keines der anderen Mädchen jemals erblicken durfte.

Am Sonntag kam häufig die Rose von Ulm, um ihr Kleines bei der Frau Lebzelter in der unteren Dorfstraße zu besuchen. Zuweilen wurde sie von dem Leutnant in Zivil begleitet, dann frühstückten sie beide oben im Wirtshaus und die Rose bezahlte. Aber auch an solchen Tagen ließ sie es sich nicht nehmen, bei der Frau Uffenbacher einzuschauen. Eine sonderbare Anhänglichkeit fesselte die
 früheren Gäste an das Tränenhaus, daß sie immer wieder kamen und mit Seufzen und Stöhnen sich in den niederen Stuben umschauten, wo sie ihres jungen Lebens bitterste Schmerzen gelitten hatten. Nur die Mutter des Agathle, das bei der rothaarigen Bärbe in der Pflege war, ließ sich niemals blicken, sondern fragte zuweilen brieflich an, ob die Kleine immer noch lebe, andere Kinder stürben doch, wenn man sie zu einer Ziehmutter gebe. Die Bärbe hatte nun erst recht einen Trotz darauf, das Agathle groß zu bringen, und lief die Nächte durch mit dem Kind auf den Armen im Stübchen auf und nieder, weil es zahnte und unruhig war. Am Tage saß sie an der Maschine und nähte für die Bäuerinnen Kinderwäsche – denn das Kostgeld für die Agath' hatte die Mutter aus lauter Ärger über den Eigensinn der Bärbe schon lange zu schicken vergessen.

Das Annerle war immer geschäftig, sie führte eine ausgebreitete Korrespondenz, packte und verschnürte zahllose Pakete und empfing andere aus allen Windrichtungen. Es war immer mit ihr ein eifriges und geheimnisvolles Treiben, als sei man acht Tage vor Weihnachten.

Cornelie hatte sich eine Tagesordnung aus Arbeit, Ruhe und Umherschlendern gemacht, die eine angenehme Gleichförmigkeit und dadurch so etwas wie Häuslichkeitsgefühl mit sich brachte. In ihrem Zimmer lagen große Stöße von Büchern; die Empfindung zu haben, jeden Augenblick sich der Gesellschaft auserlesener Geister erfreuen zu können, sollte sie vor der trivialen Melancholie schützen, die ringsumher in der Luft verborgen lauerte.

Annerle hingegen stopfte sich mit abenteuerlichen Liebesgeschichten voll wie mit Kuchen und Zuckerwerk. Der mythische Hans wie der unwahrscheinliche Geheimrat versorgten sie reichlich mit solcher Art von Druckerschwärze.

Cornelie begann gefesselt zu werden von dem kleinen Annerle und ihren Erzählungen aus dieser Zwischenwelt, wo das scheinbar Unzusammengehörigste durch ein Gewirr mannigfacher Fäden verbunden wurde. Wie Annerles Sprache eine Mischung aus schwäbischem und bayerischem Dialekt bildete, so war sie auch unaufhörlich unterwegs zwischen Württemberg, Bayern und Baden. Durch ihr langjähriges Verhältnis zu dem Sohn ihres Chefs hatte sie eine sonderbare Art von Vertrauensstellung auch bei dessen Eltern und wurde zu allerlei diplomatischen Missionen unter dem Personal der Filialen des großen Warenhauses verwendet. Sie gehörte gewissermaßen zur Familie und gehörte auch wieder nicht dazu, es war einfach eine Taktfrage, die sie, wie es schien, richtig zu stellen und geschmeidig zu beantworten wußte. Sie zeigte Geschenke von der Mutter ihres Gefährten, und seine Brüder schrieben ihr neckische Postkarten. Wo sie nur einige Wochen geweilt hatte, besaß sie gleich eine Unzahl von Freundinnen und Verehrern, wußte sich überall nützlich zu machen und war alsbald durch ein kunstvolles Gewebe von hin- und hergehenden Gefälligkeiten mit den verschiedensten Gesellschaftsschichten verknüpft. »Mei Hansel« wurde beständig in Atem gehalten durch Besorgungen und Vermittlungen, von denen die wenigsten
 ihr selbst zugute kamen. Denn so gern sie Geschenke entgegennahm, gleich überlegte sie auch, wem sie mit der eben erhaltenen Gabe nun wieder eine Freude machen könne.

Zum erstenmal lernte Cornelie in der kleinen Buchhalterin eine jener munteren Lebenskünstlerinnen kennen, die ihr in der Historie wohl unter klingenderen Namen, in der Literaturgeschichte zuweilen durch die Schilderung eines verliebten Autors, in ihrer bürgerlichen Mädchenexistenz aber noch nie entgegengetreten waren.

Die jungen Fräuleins saßen bei dem schönen warmen Sonnenschein in der Laube und warteten auf das Mittagessen. Annerles Häkelnadel fuhr eilig zwischen grauen Wollmaschen hin und wider. Sie verfertigte ein warmes Tuch für die Mutter ihrer Freundin Lucie, die Frau Fabrikbesitzer Bubenberg in Ilferlingen, die so arg das Reißen in der Schulter hatte. Dabei erzählte sie vom Hansel.

»O Jesses – mei Mädeles, was so ein Mann alles von einem verlangt! Hat sich mei Hansel an einem luschtigen Abend mit einer Kellnerin verscharmiert – betrunken ist er gewesen, – das hat er mir geschwore, und ich glaub's ihm schon – aber nun denkt's euch, das Ding kommt in die Hoffnung und mei Hansel weiß sich kein Rat – und das End' von der Geschicht ischt, ich muß zu dem Mädele hin und muß es tröste und ihm ein Unterkommen schaffe. – Ich hab' mir die Augen fast aus dem Kopf geheult, dazumal – und der Hansel sagt noch ganz getrost: das
 tut doch unserer Lieb' keinen Abbruch ... Gar schon ...! 's hat ihr auf die letzt' auch keinen getan, aber ich war halt kreuzunglücklich zu dere Zeit. Seine Ruh' hat man keine Stund' mit so ein'm Leichtfuß –! Aber wie der Herr Tirektor« – Annerle sagte vor lauter Hochachtung und Wichtigkeit stets »Tirektor« statt Direktor – »der Herr Tirektor Häberle von Pforzheim, der die Tapetenfabrik hat, und wann er in Geschäften nach Stuggert kommt, tut er immer in der Konditorei sitzen, wo ich mit meiner Freundin bedient hab' – nur so aus Gefälligkeit – wie der mir einen Heiratsantrag gemacht hat – da hab' ich in mich hineingelacht und hab' gedacht: Mei Hansel ist doch ein anders goldiger Kerl. Der Herr Tirektor ist ja kein Unebner; nur ein bissel arg dürr!«

»Weischt, Annerle, da muß ich dich gerad' bewundern, daß du zu dem andern Maidli gange bischt,« rief die Mari, »nimmer hätt' ich das gekonnt und wenn ich hätt' sollen sterben ... Du bischt halt gar gut!« ...

»Die Frau Bubenberg von Ilferlingen hat auch gesagt, es wär' gegen mei' Würd' gewesen,« sagte das Annerle und reckte sich und ihr Näschen in die Höh'. »Ich hab' ihr geantwortet: Mei Würd' trag' ich in mir selbst und eine Ehefrau, die ihre Würd' zu wahre hätt', die bin ich nit, und will ich auch gar nit sein. Das wär' mir schon viel zu fad, wenn ich jeden Tag an mei Würd' zu denken hätt'. – Die Ehefrauen, die habbe gut rede, die wisset nix. Unsereins fühlt's, wie's so einem arm' Ding zu Mut ist ... Jesses – und mei Hansel, der hätt' mich bald auffressen
 vor Lieb' und Reumütigkeit ... Er ist nun schon so, denkt nit weiter als an sein Vergnügen, wenn er luschtig ist, ich mag ihn auch nit anders ... Ja ... gnädige Frau – so geht's zu in dere Welt!«

»Nennen Sie mich nicht immer gnädige Frau,« sagte Cornelie, »ich bin keine ›gnädige Frau‹. Ich bin nichts anderes als Sie alle. Nennen Sie mich ruhig Fräulein Cornelie.«

»Cornelie ist ein arg schöner Name und wie geschaffen für die gnä– – – für das Fräulein.« Annerle sprach das Fräulein pointiert hochdeutsch aus. »Wir wisset's doch, daß Sie aus einem andern Holz geschnitten sind als mir, mir haben auch Augen im Kopf ...«

Cornelie zog die Brauen zusammen. »Bitte nicht ... sagte sie nervös und hob, um die Aufmerksamkeit abzulenken, den Deckel von der Schüssel, die Hanne soeben mit einem Krach auf den Tisch gestellt hatte.

»Ach du lieber Gott, wieder Lunge!«

»Der Satan!« schimpft Mari »mir steigt der Ekel schon im Hals herauf.«

Lunge mit saurer Soß' war ein Gericht, das, wie Frau Uffenbacher den Damen erklärt hatte, besonders bekömmlich für ihren Zustand sei. Sie erhielt die Lunge, welche die Bauern nicht essen wollten, für ein paar Pfennige vom Metzger, und so setzte sie sie den Fräuleins jede Woche zweimal vor, denn es gab zwei Metzger in Schopfingen. So wurde der Nachmittagstee, den Annerle aus der Konditorei bezog, die einzige angenehme Mahlzeit des Tages.

Als die Mari aus Stuttgart von einigen Einkäufen heimkehrte, trat das breitschulterige Schweizermädel, dunkelrot vor Aufregung, mit einem in Seidenpapier gehüllten Päckchen vor Cornelie. Sie lächelte schüchtern und wurde dabei von Annerle aufmunternd in die Seite gepufft.

»Ich hab' Ihne auch was mitgebracht, Freile Cornelie,« kam's unbeholfen kindlich in den harten Kehllauten ihres kaum verständlichen Schwizerdütsch. »Nehmen Sie's nicht für ungut – seien's mir nicht bös – ich dacht' nur, weil, wenn mein Stündle kommt und ich bald fortgeh, wollt' ich einer jeden ein klein's Andenken ...«

Die Tränen quollen ihr, in der Angst, das Fräulein könne beleidigt sein. Cornelie aber lächelte liebenswürdig und nahm aus ihren Händen eine Mundtasse mit dem Buchstaben »C« groß und deutlich in blauer Farbe darauf gemalt, entgegen. Sie dankte herzlich, und bewunderte die Tasse nach Gebühr. Annerle rief triumphierend: »Siehscht, die Fräulein Cornelie ischt nit so kleinlich, ich hab' dir's gleich gesagt, daß sie sich freuen wird.«

»Gewiß freu' ich mich,« rief Cornelie, »und ich werde täglich aus der Tasse trinken, die von der Frau Uffenbacher ist so schwer und grob.«

»Es ischt nur,« stotterte die erglühende Mari, »weil ich's nicht mit anschauen konnt', daß das Fräulein aus der Tass' trinke mußt, wo die Frau Uffenbacher des Nachts ihre Zähn' drin aufbewahrt!«

»O Gott im Himmel!« rief Cornelie, die Hände vors
 Gesicht schlagend und Annerle schrie: »Mari, du Schneegans, das hatte' wir ihr doch nit sage wolle!«

»Ja, mein Heiland, 's ischt mir so heraus gefahren,« beteuerte die Mari und sah so lieb und verstört aus, daß Cornelie über dem Trösten und der Freude an dem prächtigen, treuherzigen Geschöpf den Ekel überwand.


Siebentes Kapitel

Cornelie saß in ihrem Zimmer an dem wurmstichigen Tisch, den sie ans offene Fenster gerückt hatte, und schrieb:

»Modelt die Frau sich nach der Kunst, oder ist die Kunst nur ein sichtbares Symbol für Umwandlungen im Wesen des Weibes?

Ruhevoll unschuldig blühten die heiligen Jungfrauen und die jungfräulichen Mütter der Primitiven, unbewußt der eigenen Lieblichkeit, gleich den Lilien auf dem Felde. Das Weib der Renaissance aber wurde das Weib-Siegerin. Königlich thronte sie auf dem Sessel ihrer Macht und ihre Macht ruhte auf der Begierde des Mannes. Das Wissen hatten die Jahrhunderte ihr verliehen, und es gab ihrem Lächeln einen satten Stolz, ihren Händen die sichere Haltung der Besitzenden.

In den Frauen des Rokoko zeigt sich schon der leise Zynismus, der alle Reize seiner Reichtümer durchforscht hat, dem die eigene Macht kein heiliges Geheimnis mehr ist, der leichtfertig zu spötteln beginnt über die Grenzen der königlichen Herrschaft – über ihre Allgewalt und ihre Unzulänglichkeit.

Das kokette Lächeln der gepuderten Reifrockdamen, die ihre wollüstigen Busen zur Schau tragen, wie die Insignien
 ihres fleischlichen und galanten Königreichs, birgt schon ein wenig Verachtung des Besiegten. In ihren lüstern blickenden Augen dämmert der noch in Scherz verhüllte Schmerz über eine Herrschaft, die ihrem Ende naht, weil das Weib ihrer überdrüssig zu werden beginnt.

Welche geheimnisvollen Gesetze treiben sie, den Gebieten ihrer unumschränkten Gewalt entschlossen den Rücken zu kehren?

Die Frau von heute, wie die Kunst sie in ihrer typischen Wesensart zu erfassen sucht, ist eine Gestalt der Sehnsucht geworden. Sie trauert weder, noch genießt sie – ihre ranken, schlanken Glieder dehnen sich nach etwas Unendlichem; die Linien ihres Profils bedeuten ein Lechzen nach dem Unaussprechlichen, ihre Augen suchen das Übersinnliche hinter den Dingen dieses Staubes ... Ihre Hände – müde und doch verlangend geöffnet – tasten unsicher nach Kostbarkeiten und Früchten des Wissens, die nur ihren Träumen sichtbar, über ihnen in blauen Lüften zu schweben scheinen – ihre Füße berühren nur noch flüchtig diesen Boden und streben nach unbekannten Fernen, wo in dunklen Tiefen die Erkenntnisse des Lebens ruhen, zu denen bisher nur der Mann den Schlüssel besaß. Genügt der stolzen unzufriedenen Frau unserer Gegenwart noch eine Herrschaft über die Sinne des Mannes, den sie liebt? Einer mystischen Vereinigung der Seelen und der Geister strebt sie, von dunklem Drange getrieben, entgegen. Und doch ahnt sie – eine neue Eva – schon, daß das Kosten von jener lockenden Frucht der Erkenntnis sie für ewig
 aus dem Paradiese ihrer Jugend und alles selig blinden Glückes vertreiben wird.«

Nachdem Cornelie diese Sätze beendet hatte, hielt sie inne und ruhte ein wenig. Resignierte Wehmut im Erfassen der auch für ihr eigenes Dasein so verhängnisvollen Wahrheit mischte sich mit dem Vergnügen an der Formel, die sie dafür gefunden.

Jetzt hörte sie, zum ersten Male wieder seit manchem Tage, vom Flur herauf ein Geheul und Gekreisch böser Weiberstimmen tönen. In der nächsten Minute wurde ihre Türe aufgerissen, das Annerle stürzte herein, durch Zorn und Weinen zerzaust, rot, geschwollen und fürchterlich entstellt.

»Die Sau!« schrie sie gellend, »das Aas von einem Weib! Die Augen, wenn ich ihr auskratzen könnt, dem Satansbraten!«

»Um Gottes willen – Annerle –, was ist geschehen –? Beruhigen Sie sich doch!«

»Beruhigen?« heulte Annerle, »oh, mei Freile Cornelie, was das Weib mir antan hat, die böse, böse Hex ... Hab' ich Ihnen nit gesagt – anonyme Brief' schreibt's, das Vieh ... An meine Leut' daheim! Und nun wissen's alle, wie's um mich steht – und daß ich zum zweitenmal in der Hoffnung bin ... Oh, mei Jesus ... Mei Mutter möcht gerad ins Wasser gehn vor Scham!«

Cornelie starrte sie an, eiskalt vor Schrecken.

»Das hat die Uffenbacher getan ...«

Annerle trocknete sich mit dem bereits völlig durchweichten Taschentuch das tränentropfende Gesicht.

»In der Kontitorei wissets sie's auch allbereits,« schluchzte sie. »Oh, mei Fräulein Cornelie, was hat unsereins zu leide.«

Auf der Stelle wollte das Annerle das Tränenhaus verlassen und dem Herrn Geheimrat ihr Leid klagen, doch die Toni vermittelte verständig, sie meinte, Annerle sei selbst unvorsichtig gewesen.

Und so blieb am Ende alles beim alten. Annerle nahm ihre Rache auf ihre eigne Art. Sie schleuderte der Uffenbacherin im Vorübergehen vergiftete Bemerkungen zu, über Personen, die wegen Absendung anonymer Schmähbriefe zu vielen Jahren Zuchthaus verurteilt waren. Eines Abends fand die Hebamme einen Zeitungsartikel, der sich mit einem solchen Falle beschäftigte, durch Stecknadeln auf dem karrierten Kopfkissen ihres Bettes befestigt. Diese Tat gewährte Annerle eine entschiedene Erleichterung.

Zuweilen seufzte sie noch: »Wenn ich jetzt als nur erfahre möcht', was der Herr Tirektor Häberle von mir denkt!«

Sie sollte es erfahren, und das wurde ein glorreicher Tag für das Annerle von Pfaffenhofen. Aus der Konditorei kam durch die Post eine runde Schachtel an ihre Adresse, die enthielt eine köstliche, mit bunten Früchten belegte Nußtorte. In weißen Zuckerperlen stand in ihrer Mitte zu lesen:

Dem Fräulein Anna

 in unveränderter Verehrung und Hochschätzung

 ein entsagender Freund.

Die zwischen den Kuchen waltende Freundin aber schrieb als Kommentar:

»Der Herr Tirektor Häberle läßt Dir herzlich Glück wünschen. Er fragte mich, womit er Dir eine Freud' machen könnt', da hab' ich gesagt, in Dei'm Zustand wär' man als arg auf Süßes. ›So nehmen wir eine Nußtorte, die hat sie immer am liebsten gegessen,‹ hat er gesagt – ›aber mit viel Früchten drauf – Sie wissen schon, Fräulein!‹ Und dazu hat er einen tiefen Seufzer getan, und ganz blaß ist er gewesen, und hat kein Wort geredt den ganzen Abend.«

Annerle strahlte. »Ein sehr anständiger Mann, der Herr Tirektor Häberle,« sagte sie in tadellosem Hochdeutsch, was bei ihr stets das höchste Maß der Anerkennung ausdrücken sollte.

Achtes Kapitel

Cornelie kam vom Kirchhof, der von einer grauen Feldsteinmauer umgeben, auf windverwehter Höhe jenseits des Dorfes lag. Ihr hatte sehr davor gebangt, die Geburt eines Menschen zum ersten Male in dichtester Nähe mitzuerleben – mit zu durchfühlen ... Während sie nach Stuttgart gefahren war, sich dort einige Bücher zu besorgen, war die Schweizer-Mari niedergekommen. Sie fand das Mädchen friedlich und erlöst in ihrem Bett und das Kleine war ohne weitere Zeremonien auf der Grenzscheide zwischen geweihter Erde und ordinärem Feldrain, wo die aus dem Hause Uffenbach zur Ruhe kamen, dem Staube übergeben worden. Heute hatte sie sein Gräblein besucht, auf dem ein paar dünne Halme wilden Hafers und einige blasse Skabiosen sproßten. Cornelie hatte einen Kranz aus Wiesenblumen dazu gelegt und ging nun langsam heim, durch den schwülen Duft und die laute Fröhlichkeit der Heuernte. Eine Sehnsucht nach Tod und Vergehen schwoll wie eine gewaltige Welle aus Meerestiefen aus ihres Wesens innerstem Verlangen empor – überflutete alle Dämme, die Vernunft und Wille errichtet hatten – gierte – lechzte nach Vernichtung wie nach letztem Glück.

Mit dem Kind im Arm an der Kirchhofsecke auf dem
 öden windumwehten Hügel zu schlafen, schien ihr so süß und friedlich.

Nach dem anreizenden Stachel, den das neue unbekannte Leben anfangs für sie gehabt, war sie in der letzten Zeit völlig zurückgesunken in eine unermeßliche Gleichgültigkeit. Nichts, was die Zukunft ihr noch bringen konnte, und kein Mensch, von dem sie wußte, dünkte ihr wert, um seinetwillen auch nur eine Stunde länger zu leben. Die Liebe und jedes Band zwischen ihr und allen, die ihr einmal nahegestanden, war in ihr abgestorben, und mit dem letzten Rest von Haß gegen den Mann, der sich unter der falschen Flagge einer inneren Gemeinschaft, die niemals bestanden, in die wohlverwahrte Festung ihres Herzens eingeschlichen hatte – der sich den Vater ihres Kindes nennen durfte – schwand auch das letzte Gefühl für ihn aus ihrer Brust.

Und das Kind? Das Kind? Würde sie es lieben –? Würde sie es hassen? Würde es ihr ebenso gleichgültig bleiben, wie alles andere auf dieser Welt, weil ihr Gefühl gestorben war an der fürchterlichen Enttäuschung, die sie erlitten hatte?

Sie fragte und fragte ... Niemand gab ihr Antwort und sie wußte selbst keine Antwort. Aber sie erinnerte sich der Zeit, da sie ihren Vater verlor. Sie war damals dreizehn Jahre alt gewesen, und hatte sich in unermeßlicher Verzweiflung in ihren Gebeten an den Thron Gottes gleichsam angeklammert – hatte mit Fäusten der Wut und Empörung an die Pforten gehämmert, die das Wunder
 vor ihr verschlossen – Gott war unerschütterlich geblieben, die Pforten des Wunders hatten sich nicht geöffnet – sie hatte ihn verlieren müssen. Und dann waren die Jahre gekommen, an die sie nun so oft denken mußte, die man die schönsten der Jugend nennt, und die gleichgültig und leer für sie gewesen waren, weil sie selbst innerlich tot war, abgestumpft für jedes Gefühl, unfähig jeder wirklichen Anteilnahme.

Endlich hatte die erste starke Liebe zu einem Manne sie aus jenem Zustande von Erstarrung geweckt – eine Liebe, die niemals erwidert wurde. Doch was sollte sie nun wohl wecken?

Wie sollte sie aus Eis und Schlacken soviel Wärme zusammensuchen, wie ein kleines Kindchen zum Leben braucht. Wie sollte sie, erzitternd unter der Qual dieser inneren Kälte die Glut und Kraft zu einer Mutterschaft hernehmen, die täglich neu gegen eine Welt von Hohn und Mißbilligung verteidigt werden mußte.

Cornelie blieb stehen auf der einsamen Straße und rang die Hände und blickte mit vor Angst weit aufgerissenen Augen umher.

»Mein Gott, mein Gott, laß mich doch sterben – gönne mir, daß ich sterben kann,« murmelte sie, wie eine Kranke in unerträglichen Schmerzen.

Plötzlich befiel sie das Bewußtsein, den Tod regieren und mit eigener Hand sich zu Willen zwingen zu können, wie eine wundervolle, tröstende Erlösung. Nein – sie brauchte nicht zu leben, wenn sie nicht leben wollte, und
 ihr Kind brauchte nicht zu leben, wenn sie es nicht wollte! Kein Gott war im Himmel, kein Gesetz auf Erden, von dem sie gezwungen werden konnte, weiterzugehen, wenn sie zu müde war – kämpfen zu sollen, wenn sie nur noch zu schlafen begehrte.

Eine listige, heimliche Freude dämmerte in ihrer Seele – als betröge sie irgend jemand um einen seltsamen Triumph, wenn sie sich und das Kleine allen Bitterkeiten, die man ihnen zu trinken geben wollte, still und sicher entzöge.

Und die Angst vor dem Leben löste sich auf in der Begier nach dem Tode ... Wenn sie wieder kommen und sie überwältigen wollte, so brauchte Cornelie nur unterzutauchen in das ewige Meer des Vergehens, wo es so gut und friedlich zu ruhen war.

Ihre Phantasie begann spielend und versucherisch die Wege zu gehen, die dorthin führten – begann allen Möglichkeiten nachzuträumen, berauschte sich an den Schrecken des Todes, wie an Opiumdüften des Vergessens.

Sie sah ihr Kind nicht mehr lebendig, rosig, mit Blumen bekränzt, wie sie es einmal in einem schönen Traum geschaut hatte –, sie sah es schlaff in ihrem Schoße liegen, die Gliederchen steif, das Mündchen in dem grünweißen Gesicht mit einem süß-wehen Ausdruck ein wenig schief gezogen, sie fühlte die Kälte der kleinen Leiche erstarrend in ihr eigenes Herz dringen, empfand mit einer grausigen Beruhigung, wie das Leben auch aus ihrem Körper wich, und er sich in der letzten Todesnot zusammenkrampfte ...

Oh – sie wußte ja, der Tod hatte wartend hinter ihr gestanden, alle diese Monate schon – und sie hatte sich erschöpft, hatte übermächtig gerungen, im Kampf mit der Versuchung, sich nach ihm umzuwenden. Er hatte nur immer stillgestanden und gewartet und gelächelt. Er wußte, daß sie die Sehnsucht verzehrte, von ihm geküßt – von ihm in den Arm genommen zu werden. Er wußte, daß es damit enden mußte, daß sie von selbst zu ihm kam.

Der Sonnenschein reizte ihre Nerven, erbitterte sie förmlich mit seinem Glanz, sie ertrug das »Draußen« nur, wenn die Dämmerung wie ein zarter silberner Nebel milde über alle Gegenstände niedersank. Begegnete sie dann auf dem Wiesenweg einem heimkehrenden Schnitter, der gebeugt und schwer oder aufrecht und stark die Sense über der Schulter, an ihr vorüberschritt, so grüßte sie ihn still in ihrem Herzen als das uralte Abbild und Symbol des Freundes, nach dem sie verlangte.

Es ist ein Schnitter, der heißt Tod –

 Er hat Gewalt vom höchsten Gott,

 Hüte dich, schön's Blümelein ...

Sie spürte im Vorübergehen den Dunst von Schweiß und Kraft, der von dem Sensenmann ausging und der ihre überfeinerten Geruchssinne erregte mit einem Gemisch von Widerwillen und Erinnerungszauber. Und so wurde ihr der Mann schlechthin zu einem Bilde des Todes: Leben zeugend, um doppelt Leben zu vernichten, nur von einem blinden Drang getrieben, den er selbst nicht zu deuten gewußt
 hätte. War das ruhelose Sehnen und Gieren nach Liebe, das sie verzehrt hatte, all die Jahre ihrer Jugend hindurch, im Grunde nicht auch nur ein Verlangen nach Vernichtung, als nach der Erfüllung alles Seins? ...

Die letzten Fuhren waren in den Scheunen geborgen. Hoch stand das Korn zwischen den nun flachen, leeren Wiesen, auf denen der Storch gravitätisch nach Futter für die junge Brut suchte, die auf der Pfarrscheune schon mächtig die Schnäbel aufsperrte und für die er gar nicht genug herbeischleppen konnte. Jetzt mochten die Gewitter, die seit mehr als einem Tage drohend am Himmel standen, sich entladen, nun mochte der Regen strömen. Tier und Mensch ersehnte Abkühlung und Frische.

Der Sonntag kam. Die Paare drehten sich in dem vor Hitze und Menschendunst dampfenden Saal des »Sternen«. Fiedeln und Brummbässe kreischten, das Bier strömte aus den Fässern in die durstigen Bauernkehlen. Draußen schlang die Nacht dunkle, warme Schleier um das Dorf. Es regte sich kein Windchen, ohrbetäubend schrillten die Grillen, ein banges Warten lag in der Luft.

Die Hanne hatte auch mit im »Sternen« tanzen wollen. Das war eine, die ihre Röcke zu schwenken verstand, ihre Schätze wechselten mit jedem neuen Mond. Aber heut' erwartete die Uffenbacherin für die Nacht den Ruf zu einer Bäuerin, deshalb sollte ihre Magd daheimbleiben, sehr zu deren Verdruß. Sie war schon den ganzen Tag vor sich hinbrummend und schimpfend im Hause umhergeschlurft. Abends versuchte sie noch einmal, ihre Herrin
 umzustimmen. Die Alte war schlechter Laune, wie immer, wenn sie ihre Nachtruhe drangeben sollte, und verweigerte der Hanne die Erlaubnis zum Tanz. Es gab eine wilde Auseinandersetzung zwischen beiden – wenige Zeit darauf verließ die Hanne, mit tückischem, dumpf-sinnlichen Ausdruck in den plumpen Zügen das Haus und blieb eine lange Weile verschwunden. Die Fräuleins mutmaßten, sie werde ohne Erlaubnis die Nacht fortbleiben, wie dies schon öfters geschehen war. Die Uffenbacherin erklärte zornig, dann werde sie nicht wieder eingelassen und die Kündigung sei ihr gewiß. Doch gegen neun Uhr stellte sich Hanne wieder ein, redete mit niemand ein Wort und ging auf ihre Kammer.

Mitternacht mochte bereits vorüber sein, als Cornelie durch ein Schlagen an der Haustür und die Rufe roher Männerstimmen erwachte. Sie glaubte, man benachrichtige die Frau zu ihrem Wehenmutterdienst, aber so war es nicht. Ein Fenster klirrte, die Uffenbacherin schimpfte in den saftigsten Ausdrücken hinunter. Gebrüll und wieherndes Gelächter antwortete. Fäuste und Steine hieben gegen die Türe, das Schloß im morschen Holze krachte unter dem Gerüttel der trunkenen Burschen, die mit den unflätigsten Worten Einlaß verlangten und drohten, Türen und Fenster einzuschlagen, wenn die H... ihnen nicht gutwillig öffneten.

Cornelie war in Schweiß gebadet und doch von eisiger Kälte durchschüttelt unter ihren Decken. Vom Rückenmark kroch ihr eine Lähmung durch alle Glieder. Vor Entsetzen
 lag sie wie im Starrkrampf, die Finger und Zehen gekrümmt, die Zähne knirschend gegeneinanderschlagend. Jeden Augenblick konnte sie gewärtig sein, daß die Hölle, die unten an der gebrechlichen Türe rüttelte, die rostigen Bänder sprengen und zu ihr eindringen werde – daß das Fürchterliche, Grauenvolle sie wehrlos preisgegeben finden mußte. Schon flogen Steine in die geöffneten Fenster, ein Irrsinn des Vernichtens hatte die Trunkenen ergriffen. Sie brüllten und johlten die wüstesten Lieder und dazwischen krächzte und schimpfte die' Alte ... Das Dorf lag weit, jede Hilfe war fern ... Der nackte, rohe, unbändige Trieb des Geschlechtes tobte in unflätiger Begierde nach dem Fleisch des Weibes. Cornelie fühlte den Wirbel der finstern, tierhaften Urmächte des Lebens um sich kreisen – er griff nach ihr empor, riß sie in seinen Schlund –, sie sah rote Fäuste durch die Dunkelheit nach ihr langen, branntweindunstiger Atem umfing sie. – Mit einer wilden Energie reckte sie sich empor, die Betäubung von sich abzuschütteln, da wurde ihre Tür geöffnet, Annerle und Toni im Hemd mit bloßen Füßen kamen zitternd und weinend vor Furcht, sich zu ihr zu flüchten.

»O mein Jesus, Fräulein Cornelie, die Viecher ... Hören Sie nit hin, die wüschte Worte – o mei – wann die eindringe, da Gnade uns Gott!«

»Das hat die Hanne anstift ... ganz sicher die Hanne ...«

Die jungen Geschöpfe klammerten sich an Cornelie und sie hatte ihre Arme um beide geschlungen. Auch die Mari
 kam, wankend vor Schwäche aus ihrem Kindbett. Nun faßten sie wieder Mut und schoben mit vereinten Kräften den Waschtisch vor die Tür, die längst keinen Riegel mehr besaß.

Draußen schüttete die Uffenbacherin Hafen nach Hafen mit Wasser über die Köpfe der wüsten Gesellen. Sie drohte mit Polizei und Gefängnis. Das schien die Burschen allmählich zu ernüchtern. Lachend forderten sie jetzt nur noch die Herausgabe der Hanne, die sich still auf ihrer Kammer hielt. Es brauste ein Sturm durch den Birnbaum, die halbreifen, harten Früchte prasselten auf die Köpfe der Hitzigen, Staub und Strohhalme in Wirbeln emporgeweht, blendeten ihnen die Augen. Blitze zuckten, der Donner krachte. Da zogen sie schimpfend und johlend ab, um dem Regen zu entgehen, der nun mit Macht herniederbrach.

Neuntes Kapitel

Mancherlei Besuch kehrte in der nächsten Zeit im Tränenhaus ein. Als ein lustiges buntes Vögelchen flirrte die hübsche Lucie Bubenberg, Annerles Freundin, durch die trüben Räume. Annerle nannte sie: Madame la Baronne und wollte damit pikante Geheimnisse andeuten. Lucie war die wohlangesehene Tochter eines begüterten Industriellen und einer sehr duldsamen Mutter, die durch die Beziehungen ihrer Tochter zu einem württembergischen Standesherrn nur geschmeichelt war. Lucie selbst nannte sich: »Das Glücksvögerl« und schaute mit einem aus Neugier und Mitleid gemischten Interesse auf die Bewohnerinnen der »Villa Uffingen«.

So fragte sie die bayerische Toni, die mit glänzenden Augen Luciens Erzählungen aus der ihr so fremden Welt des Vergnügens lauschte, wie es nur gekommen, daß sie, die doch einen braven, soliden Eindruck mache, hier gelandet sei.

»Wir sind halt Schlittschuh gelaufen,« erzählte die sonst so schweigsame Toni, »und da hat er mich heimgebracht, und wir sind jedesmal an der Tür von seiner Wohnung vorbeigekommen, und er hat mir erzählt, er hätte einen Papagei, der könnte singen: Freut euch des
 Lebens ... und da hab' i so arg Lust kriegt, den Papagei zu hören, und bin halt mit ihm 'naufgangen ...«

»Hat's Ihnen denn ein bissel Pläsier gemacht – nachher?« erkundigte sich Lucie mit Teilnahme.

Toni schüttelte finster den Kopf.

»I hab' mich halt entsetzt – er war arg wüscht ... Aber ich bin doch noch zweimal bei ihm gewesen – i dacht', i müßt' –, weil er doch nun mein Schatz wär – er hat mir auch gedroht, er will mich totschießen ...«

»Der Schuft!« knirschte Annerle, Lucie fragte mit unsicherer Stimme:

»Hat's denn wenigstens einen Papagei drin gehabt?«

»Den hat's schon gehabt –« sagte Toni ergeben, »aber singen hat er nicht können.«

Viel war während der Anwesenheit des »Glücksvögerls« von allerlei Mitteln die Rede, durch die man hätte den Aufenthalt im Tränenhaus vermeiden können.

»Ich probier' alles, ich hab' vor nix Furcht,« erklärte die kleine, hübsche Lucie. »Die Mama denkt, ich besuch' eine Freundin in der Schweiz – aber ich geh' zu einem Doktor, den mir der Geheimrat empfohlen hat. Mein Baron will nicht, daß ich mir die Figur verderbe!«

Cornelie war allmählich doch neugierig auf den sich so vielfach betätigenden »Herrn Geheimrat« geworden, und als am nächsten Tag der Willkommruf erscholl: »Da schau – der Herr Geheimrat,« floh sie nicht wie sonst, sondern blieb auf ihrem Liegestuhl in der Laube.

Mit einem weiten Schwung seines weichen grauen Filzhutes
 begrüßte der freundlich blickende, kleine, alte Herr seine Freundinnen, die ihn sofort mit munterem Geplausch umringten. Die Lucie tuschelte mit ihm über ihre Schweizerfahrt, der Toni hatte er Grüße ihres Vaters auszurichten, die Annerle klagte ihm, daß sie sich gar nicht recht extra fühle. Darauf erhielt sie unter viel Gekicher ein Pülverchen aus seiner Brusttasche. Für jede der Damen hatte er eine Aufmerksamkeit, seine Taschen schienen unergründlich. Die Uffenbacherin stand mit triumphierender Miene in der Laubentür. So gefiel es ihr. – Sie strahlte nicht nur in einer reinen weißen Schürze, sondern auch im Glanze von Zufriedenheit und Würde, indem sie dem Herrn Geheimrat schilderte, wie sich der Herr Kreisphysikus und der Herr Polizeiinspektor, als sie letzthin zur Besichtigung dagewesen seien, lobend über ihre »Anstalt« ausgesprochen hätten.

»›So findet man's selten,‹ habe der Kreisphysikus gesagt, ›in dem Zimmer möchte man ja gleich selbst – Sommerfrische halten.‹ Die Fräulein Cornelie habe so schöne Bukettle auf ihrem Tisch und so arg viel Bücher. Und der Herr Kreisphysikus habe eins von dene große Bücher vom Tisch genomme und 'neingeschaut und ganz reschpektvoll gerufe: ›Alle Wetter –! Gratulier' zu der Lektür'!‹ Und so gemütlich säßen die Dam' jeden Nachmittag in der Laub' und es wär' ein Fried' und ein' Freundschaft unter ihne', daß mer sich's nit besser wünsche könnt'.«

Sie triefte von Anerkennung und Wohlwollen und
 machte ganz verliebte Augen zu dem Gaste hin, denn sie hatte durchaus nicht die Absicht, dem Herrn Geheimrat den Zins zu zahlen, wenn er etwa deshalb schon so bald wiedergekommen wär'!

Cornelie fühlte sich enttäuscht. Ihre Phantasie hatte sich unter dem »Herrn Geheimrat« einen ernsten Menschenfreund oder einen überlegenen Zyniker, einen alten Feinschmecker des Lebens vorzustellen beliebt. Nun sah sie einen gutmütigen Philister, der mit friedevollem Behagen Curellasches Brustpulver austeilte und wohl nur ein ganz klein wenig perverse Lüste inmitten der dickbauchigen jungen Dinger empfand.

Hatte er etwa das Annerle zuerst in den Garten der Liebe eingeführt? Oder war er ihr illegitimer Herr Papa? Am Ende auch Väterchen der Lucie mit der sehr duldsamen Mama?

Hier war alles nicht so, wie es zu sein schien, und nahm man das Gegenteil von dem, was Dinge, Beziehungen und Menschen zu bedeuten schienen, so wußte man auch wieder nicht, ob man sich nicht auf falscher Fährte befand. Cornelie kam es wie ein grotesker Humor des Schicksals vor, daß sie selbst, die bisher nur im Klaren, Einfachen gelebt hatte, hinfort zu dieser verwirrten, schillernden, zweideutigen Welt gehören sollte.

Und doch – dachte sie jener Mittel, welche die hübsche Lucie so warm gepriesen, wußte sie, daß diese Hilfe für sie niemals in Betracht gekommen wäre. »Mir scheint
 es Mord,« hatte sie zu Lucie gesagt. »Und gerade an dem einen Geschöpf, das uns vielleicht noch das Glück geben kann, das für uns aufgehoben ist. Darüber wär' ich nie hinweggekommen ...«

»Mord ... Wenn Sie's so fühlen ...« flüsterte Lucie. Sie war während des Gespräches ein wenig blaß geworden. Ihre braunen Augen tauchten mit einem hungrig forschenden Blick in Corneliens graue.

»Freuen Sie sich denn wahrhaftig auf den Wurm?«

»Nein,« antwortete Cornelie ehrlich.

»Da schauen Sie ...«

»Ich warte auf die Zeit, in der ich mich freuen werde,« sagte Cornelie leise ... »Ich denke, der Sieg muß einmal kommen.«

Nach diesem wurden die Mädchen schweigsam und man ging in der Abenddämmerung den gewohnten Wiesenpfad an der Höhe entlang, über dem der Ernte entgegenbleichenden Haferfelde. Die Ferne lag in schwerem trüben Sommerdunst, aus dem bewölkten Himmel fielen warme Tropfen. Zur Seite der schmalen Wegspur wuchs auf hartem Gestengel wilde Zichorie mit hellblauen, duftlosen Blumen, die letzten des bunten Gewimmels, das im Frühling den Rain überschäumte. Gewohnheitsmäßig schritten die Mädchen dort auf und nieder, eine hinter der anderen, die Köpfe gesenkt, die unförmig werdenden Gestalten mit müden Schritten vorwärts geschoben. Corneliens Phantasie sah diese Reihe ins Unermeßliche ausgedehnt – die
 Köpfe gesenkt – die unförmigen Gestalten müde vorwärts geschoben – so wanderten sie geduldig, aus Dämmerung und Nebel tauchend, im trüben, schweren Sommerdunst der verhüllten Ferne entgegen ...

»Ah – geht – ihr seid's fad!« rief Lucie überlaut und begann zu singen: »Morgen fahr' i mit meinem Schatzerl in die Berge hinein – juvivallera – juvivallera – ein Glücksvögerl bin i, ein Glücksvögerl bleib' i, holdrio-o-o!«


Zehntes Kapitel

Aus Zürich traf noch eine lustige Ansichtskarte von der Lucie ein. Auch ihr Baron hatte unterschrieben. Dann hörte man geraume Zeit nichts mehr von dem reizenden Persönchen.

Cornelie fragte nicht weiter. Sie hatte, um ihren quälenden Phantasien zu entfliehen, die Gesellschaft der jungen Mädchen aufgesucht. Und solange die Lucie anwesend war, hatte sie sich dem Zauber ihres Wesens nicht entziehen können. Zuweilen war ein Neid in ihr aufgestiegen, vor dieser Fähigkeit, gedankenlos lachend zu genießen. Doch was ging sie im Grunde das leichtsinnige Mädel an? Sie wurde nun aufs neue von Widerwillen erfaßt gegen das verzerrte, verrenkte Abbild der Heiligtümer ihrer eignen Tempel, das sie in ihren Hausgenossinnen beständig vor Augen sah.

Sie fühlte sich in der letzten Zeit körperlich kräftiger, streifte viel in der Gegend umher, schrieb und studierte. Sie lauschte, in traurige Träume versunken, dem mit heftiger Ungeduld sich regenden jungen Leben unter ihrem Herzen. Dieses Seltsame, einen fremden Willen in sich zu tragen, der da mit bestimmter Energie seinen Zielen entgegenstrebt ... Sehr früh hatte sie ihn in sich gespürt – hatte an ihm zuerst erkannt, sie sei zur Mutterschaft
 erkoren ... Dieses Schauerlich-Heilige, sich nur als ein Gefäß zu fühlen, in dem sich eine neue Zukunft mit tausend Möglichkeiten und Hoffnungen vorbereitet, ergriff sie oft mit staunendem Ahnen über die unergründlichen Quellen alles Werdens. Und sie begann mit einem leisen Bedauern des Mannes zu denken, der sich all dieses heimlich-tiefen Erlebens, das er hätte mit ihr teilen sollen, beraubte, weil er einen unbestimmten Begriff der Freiheit als ein Schild vor die Bürde der Verantwortung hielt, die seinen geschonten ästhetischen Sinnen allzuschwer und niedrig zu tragen dünkte. In diesem Bedauern zerrann allmählich der krankhafte Abscheu, der sie bisher jedes Erinnern hatte meiden lassen.

Das Ungestüm, mit dem das kleine Geschöpf in ihr sich seiner engen Haft zu erwehren schien, mußte sie schon an den einst so sehr Geliebten, an seine heftige, stürmische Natur gemahnen. Solche Art fühlte sie als etwas dem eignen Wesen völlig Fremdes. Ihre schwersten Kämpfe waren allzeit schweigend und ohne viel äußere Bewegung durchgerungen worden. Jäh und still war sie ihren Weg gegangen, und als der laute Ruhm ihr begegnete, hatte sie anfangs nur erschrocken versucht, ihm zu entweichen. Er hatte sie erobert, nicht sie ihn – so war es wohl gewesen.

Und auch der Mann hatte sie erobert, jäh, ungestüm, mit der Lebenswärme und Jugendkraft, die so strahlend von ihm ausging, daß sie sich ihr in schneller Bezauberung unterwarf.

Schon als ein Mädchen von fünfzehn Jahren dünkte es sie ein wunderliches Rätsel, wie eine Verbindung zwischen zwei Menschen heiliger, reiner und fester werden könne durch die Erfüllung einer äußeren Form, durch Worte, die ein vom Staat oder von der Kirche Bevollmächtigter spricht. Wie so vielen Rätseln, mochten auch diesem praktische Ursachen zugrunde liegen. Was kümmerten diese praktischen Ursachen sie und ihren Geliebten? Ihnen beiden kam es doch nur darauf an, zum Inhalt und Kern der wahrhaftigen Liebesvereinigung durchzudringen. So wenigstens hatte Cornelie gemeint.

Allmählich – in diesen Monaten inneren Schauens – erkannte sie immer tiefer, daß das Wesen der Ehe, mochte sie durch eine Trauung bürgerlich sanktioniert sein oder nicht, im letzten Grunde die Herrschaft und Tyrannei der Frau über den Mann bedeutet. Und hier – auf diesem Punkte hatte ihr die Kraft versagt. So war es immer schon gewesen. Jedesmal wenn ein Mann ihr huldigte, war ein Augenblick gekommen, wo sie hätte um seinen Besitz kämpfen müssen, wo er es gewissermaßen als Liebesbeweis erwartete, daß sie mit listiger oder stürmischer Tyrannei ihr Recht auf ihn geltend machen müsse. Und dann war es, als ob der weibliche Instinkt ihr versagte – lässig, vornehm, degoutiert öffnete sie die Hände, und entließ ihn zurück in die Unabhängigkeit, in die Gleichgültigkeit. So hatte sie früher manchen Bewerber von sich gescheucht.

So hatte sie zuletzt auch auf Rudi Imgart verzichtet.
 War sie, trotz aller Liebes- und Hingebungsfähigkeit, zur Ehe unbrauchbar?

Gerade der hohe Begriff von menschlicher Freiheit und Selbstverantwortung, den sie in sich entwickelt hatte, und auf den sie stolz war, weil sie fühlte, daß er sie über die Mehrzahl der Frauen stellte, machte es ihr unmöglich, ihr ganzes Wesen in der Herrschbegier der Liebe zu konzentrieren.

Freude an der gegenseitigen Freiheit hatte sie zueinander geführt, ein frohes Schenken und Nehmen hatte ihnen beiden die Liebe bedeutet. – Cornelie war es nur natürlich, als die Stunde der Gefahr kam, von dem Manne, den sie liebte, die feinste Treue, die ritterlichste Hingebung zu erwarten.

Er hatte versagt. – Einen Mann, den sie hätte beherrschen und unter ihren Willen zwingen müssen, der wäre ihr widerlich geworden. Sie hätte ihn nicht haben mögen zum Vater ihres Kindes. Aber noch weniger hätte sie ihn an ihr heiligstes Gefühl für Recht und Unrecht rühren lassen.

Jetzt sah sie um sich her in dem Reden, Denken und Handeln all dieser Mädchen das typische Frauenwesen sich enthüllen – nicht mehr versteckt unter mannigfachen, gesellschaftlichen und konventionellen Masken. Sie sah es sich in seiner ungeschminkten Wahrheit enthüllen, sie sah die schrankenlose Nachsicht und geduldige Güte der Mädchen gegen ihre Liebhaber, die sich doch alle mehr oder weniger feige und erbärmlich benahmen, sie sah aber auch
 ihr verzweifeltes Hängen an dem bißchen Freude, was sie durch den Mann bekamen, sah, wie alle, mit Ausnahme der armen Toni, deren Geschick in sich selbst eine Ausnahme bildete, sich unaufhörlich demütig, emsig bemühten, die Gunst ihrer Gebieter auf jede nur mögliche Weise, und sei es um den Preis der letzten Selbstachtung, zu bewahren, die Männer festzuhalten, mit zäher, entschlossener, gieriger Kraft, und in ihrem kleinen Reiche, dessen Grenzen ja eng genug gesteckt sein mochten, unbedingt das Zepter zu führen.

Keine von ihnen ließ sich die Kosten ihres Aufenthaltes bei der Uffenbacher von ihrem Liebhaber zahlen – durch Erniedrigungen der bittersten Art, durch Schluchzen und Jammern vor Basen und Onkels, hatten sie es alle erreicht, die jungen Männer von dieser Steuer zu befreien, um nur ja nicht darüber ihrer Neigung verlustig zu gehen. Selbst die Luis, das arme Dienstmädel, das keine Base und keinen Onkel besaß, war erst vier Wochen vor ihrer Zeit gekommen und half bei der Uffenbacher in Küche und Garten, um nur halbes Kostgeld zu zahlen, und ihrem Dienstherrn, einem wohlhabenden und verheirateten Manne, der sie verführt hatte, keine Ungelegenheiten zu machen.

Von der Rose von Ulm aber wurde erzählt, sie habe die ganze Woche kein Obst und kein Süßes gegessen, damit sie dem Herrn Leutnant, wenn er sie Sonntags besuchte, im Gasthof ein warmes Frühstück vorsetzen konnte.

Sie waren es sich gar nicht einmal bewußt, daß sie Opfer brachten – es wäre ihnen nicht eingefallen, daß
 Männer auch anders sein und handeln könnten. Cornelie würde nicht gewagt haben, sie darüber aufzuklären. Folgten sie doch, unbeirrt von Bildung und Idealen, einfach den Urinstinkten des Weibes, waren also in ihrem Recht.

Cornelie kam sich zwischen ihnen als eine Absonderlichkeit – beinahe als eine Anomalie vor. Sie hatte nie geahnt, daß ihre innere Kultur sie so weit von der allgemeinen Spezies »Weib« entfernte, weil ihre Umgebung ja bisher mehr oder minder auch aus solchen Abweichungen bestanden hatte. Zuweilen war sie sich fast unheimlich.

Unter diesen sie fortwährend umgebenden Einflüssen begann sie langsam – nach und nach – den Vater ihres Kindes milder, gerechter zu beurteilen. Wahrscheinlich hatte sie Zartheiten der Empfindung und des Handelns von ihm erwartet, zu denen er seiner Mannesnatur nach einfach nicht fähig war – zu denen die Art des Mannes sich nur unter dem Drucke bürgerlichen Pflichtenzwanges nötigen läßt.

Gleich einem siebzehnjährigen Backfisch hatte sie gläubig auf »das Wunderbare« geharrt: Seinen frischen Frohsinn hatte sie als Ergänzung ihrer schwerblütigen Grüblernatur mit innerm Jubel geliebt – hatte geträumt, aus einem freudigen Genießer könne ein freudiger Entsager, ein Mann der Tat und des Kampfes hervorgehen. Aber Zeichen und Wunder geschehen nur unter dem Feuerkuß der Leidenschaft –. Auch er wäre wohl im Rausch der Sinne über seine eigne, im Grunde zaghafte Natur hinauszuheben gewesen – immer doch nur für die Augenblicke der
 Leidenschaft ... Als sie seine schützende Liebe am notwendigsten gebraucht hätte, war ihr versagt, seine Glut zu reizen – sie hätte solches wie eine Entweihung ihrer keimenden Mutterschaft empfunden. Da hätten andere Mächte reden müssen ... Und er wurde blind und taub gegen ihre sanften Stimmen aus Angst vor dem Leben. War möglicherweise die Furcht ein sicherer Instinkt, daß seine Kräfte wirklich nicht ausgereicht hätten ...?

Vielleicht glich seine Begabung jenen Traubensorten, die nur in der Sonne gedeihen, sich zartbehaucht am Rebgelände schaukeln und auch im Sonnenschein genossen werden müssen, wenn sie nicht dürr und trocken werden sollen. Und hatte Cornelie in manchen stolzen Augenblicken die Gewißheit in sich empfunden, daß ihre Schaffenskraft durch Qual und Leiden wie durch eine notwendige Folter gehen mußte, um ihre letzte beste Süßigkeit und Würze herzugeben – durfte sie ihm grollen, weil er so verschieden von ihr selbst, aus dem unbegreiflich reichen Schoß der Mutter Natur hervorgegangen war?

Täglich wurde Cornelie ruhiger, in der Sicherheit, recht gehandelt zu haben, als sie eine Lebensgemeinschaft ablehnte, die dem Manne zum täglichen Opfer geworden wäre. Mit stillem Lächeln nahm der Haß von ihr Abschied. Sie konnte wieder der Stunden denken, da sie beide fröhlich durch Herbstgold und Winterschimmer gewandert waren, an alle traulichen Zwiegespräche über feine, köstliche Dinge, von denen nur sie beide wußten.

Sie stellte sich nun gerne vor, daß das Böse, Grausame,
 welches in der letzten schweren Zeit an ihm hervorgetreten war, wieder verschwinden mußte. Sie hatte ihm sein besseres Teil gerettet und er blieb die heitere, etwas phantastische Gestalt, der fahrende Geselle, mit den leichten Versen auf den Lippen, dem schnell lodernden Zorn gegen alle dumpfe Alltäglichkeit – mit der glühenden Andacht vor der Schönheit der Welt.

Sie meinte, wenn sie sich recht intensiv der lieben und schönen Seiten seines Wesens erinnere, könne sie ihrem Kinde als ein Erbe alles, was sie an seinem Vater geliebt hatte, übermitteln. Auf diese Weise kam sie dazu, wenn auch nicht mit Sehnsucht oder hingebender Wärme, so doch mit einer Freundlichkeit und einer Art mütterlicher Nachsicht seiner zu denken. Das würde sie noch vor wenigen Wochen nicht für möglich gehalten haben.

Und gerade in dieser Zeit geschah es, daß ein Brief von Rudi Imgart sie auf mancherlei Umwegen erreichte. Er fragte bescheiden, aber inständig nach ihrem Ergehen und bat sie, ihm ihren Aufenthaltsort und die Zeit, da sie ihr Kind erwarte, mitzuteilen. Es war ein Ton in den wenigen Worten, wie in der schüchternen Bitte eines Knaben an seine Mutter, ihm zu verzeihen, und ihm wieder gut zu sein. Das stand wohl nicht ausgesprochen dort auf dem Blatte, aber Cornelie las es zwischen den Zeilen, wie sie immer in seiner Seele zu lesen vermocht hatte. Sie weinte über den Brief und fühlte dabei, wie hoffnungslos kalt es in ihr geworden war. Wäre sie nun in der Gesinnung den kleinen Bewohnerinnen des Tränenhauses ähnlicher
 gewesen – am Ende hatte sie ihrem Kinde den Vater zu retten vermocht ...

War es nicht noch möglich, wenn sie auch auf ihr letztes Besitztum, ihren letzten Weibesstolz verzichtete? Forderte die Mutterschaft auch dieses härteste Opfer von ihr?

Einmal hatte sie geglaubt, für ihr Kind stolz sein zu müssen – hatte in den ersten Regungen seines jungen Lebens seine Antwort zu spüren gemeint.

Sollte sie geirrt haben? Es überkam sie eine abergläubische Furcht, wenn sie sich nicht bis zum äußersten demütige, könne das Schicksal, oder Gott, oder welche geheimnisvolle Macht über den Menschen walte und Zerknirschung, Selbstentäußerung, Demut erwarte, ihre Schuld an dem Kinde strafen. Der Gedanke verließ sie nicht wieder.

Nach einigen Tagen antwortete sie Rudi Imgart kurz und freundlich, nannte ihren Aufenthaltsort, bat ihn jedoch, ihre Zurückgezogenheit zu achten, und nicht weiter nach ihr zu fragen.

Und wieder nach einer kurzen Zeit schleppten Toni und Annerle mit geschäftiger Wichtigkeit einen Korb, den der Postbote gebracht hatte, in Corneliens Zimmer. Sie begannen sofort an Schnüren und Siegeln zu reißen und sahen dabei neugierig zu Cornelien auf, die zusammengefaßt neben ihnen stand und keine Miene machte, ihre teilnehmende Wißbegier zu befriedigen.

Da erhob sich denn Toni zuerst, warf Annerle einen mahnenden Blick zu, und nachdem sie den Korb bis zum
 bequemen Öffnen fertig aus seinen Hüllen gelöst hatten, verließen sie beide das Zimmer.

Cornelie wandte sich ab, ging zum Fenster, starrte in die Nesselwildnis, die darunter mit sommerlicher Üppigkeit dunkelgrün emporgeschossen war und dachte, wie weh es tun müsse, wenn man dort mit den Händen hineingreife. Sie verfolgte den Storch, der schwerfällig die großen Flügel schlagend, in der Luft sichtbar wurde, wie er seiner abendlichen Wiesenjagd zusteuerte.

Vom Herzen aus lief ihr ein ziehender Schmerz, den sie lange nicht mehr gespürt hatte, durch die Brust und an den Armen hinunter bis in die Fingerspitzen.

Sie erschrak. So wund war alles noch in ihr?

Dann ging sie und öffnete den Korb. Er war gefüllt mit weißem feinen Linnenzeug, wie ein Kindlein es braucht, wenn es zum Leben kommt. Gleich Flaumgewölk entquoll es ihm, als Cornelie hineingriff und die Gegenstände aus der weichsten Wolle, dem zartesten Gewebe, durch ihre kalten Finger gleiten ließ.

Sie saß auf dem Boden, legte den Kopf an das Weidengeflecht und ihre Tränen fielen auf die Hemdchen und Jäckchen, wie Nachttau aus den Tiefen der Erde quillt. Und so weinte sie ihren letzten Stolz in Schlaf und Traum.

Als sie sich endlich erhob und die kleinen Dinge zu denen, die sie selbst genäht hatte, ordnete, war ihr Gesicht noch von Tränen feucht, doch rosenrot und wie ein nadelfeines, grünes Grasspitzchen streckte eine kleine, wunderlich
 junge Freude ein Fühlfädchen durch erstorbene Trümmer.

Sie dankte Rudi und bat ihn, ihr Kind lieb zu haben, wenn sie sterben sollte. Aber sie glaubte jetzt nicht mehr so sicher, daß sie sterben würde.

An demselben Abend erhielt Annerle die Nachricht, sie solle ihre mütterliche Freundin, die Frau Bubenberg aus Ilferlingen auf dem Bahnsteig treffen. Frau Bubenberg fuhr zu ihrer Tochter nach Zürich. Und schluchzend erzählte Annerle, als sie heimkam: Ein Telegramm habe sie dorthin gerufen, die Ärzte gäben wenig Hoffnung für das Leben der reizenden Lucie, welche dort in einer Frauenklinik sich einer schweren Operation habe unterziehen müssen. Im besten Fall war eine lange Leidenszeit dem armen Glücksvogel gewiß.

»Der Baron hat's halt gewollt,« murmelte Annerle.

Schweigsam saßen die Mädchen beisammen. Wie Nebelschatten zogen die Erinnerungen der Versuchung durch ihre fröstelnden Herzen.

Elftes Kapitel

Frau Uffenbacher hatte ihr Haus nun richtig gefüllt. Von der Dachkammer bis zur Gartenstaffel war jeder Raum ausgenützt. Weil der Toni ihr Papa gesagt hatte, seine Tochter müsse sich in alles fügen, gab ihr die Uffenbacher statt ihres netten Zimmers das feuchte, dunkle der Mari. Für eine »Neue« war ihr Herr selbst gekommen, um zu mieten. Ein ernster, stiller Mann – er hatte die Matratzen untersucht, und wollte nur ein Zimmer mit der Aussicht nach den Schweizerbergen. Noch ehe die »Neue« eintraf, kam ein Liegestuhl mit weichen Kissen, eine Kiste mit Trauben und Pfirsichen, eine zweite mit Weinflaschen und Kognak. Sie war eine große, blonde Person, wie aus dem Rubenssaal des Münchener Museums herabgestiegen. Die schwere Masse von weißem und rosigem Weiberfleisch wälzte sich verdrossen im Liegestuhl, schaute wenig nach den Schweizerbergen und hatte den Kognak schneller als Trauben und Pfirsiche vertilgt. Umgeben von kalten Hühnern, deren abgenagte Knochen sie auf die Zimmerdielen spuckte, von Gänseleberpasteten, deren ausgeleerte Büchsen sich auf dem Scherbenhaufen hinter dem Hause türmten und von unzählbaren Flaschen verschiedener anregender Getränke, führte sie ein verdrießlich-gefräßiges Dasein. Nur
 zuweilen hörte man ein breites Lachen, mit dem sie die Geschichten zu würzen pflegte, die sie der Uffenbacherin aus ihrer Kellnerinnen-Vergangenheit zu berichten pflegte.

An einem kühlen, windigen Regenabend, der im August, die erste Ahnung des nahenden Herbstes brachte, kehrten dann noch zwei Mädchen in Reformkleidern im Tränenhause ein. Die eine mußte sich sofort zu Bett legen – man bekam sie überhaupt nicht mehr zu sehen. Die Uffenbacherin schlurfte brummend im Haus umher und schimpfte. Man habe sie betrogen, das sei eine ganz böse Geschicht'.

Und wieder durchbebte nächtliches Weinen, Stöhnen und Wimmern die baufälligen Mauern und Dielen der windschiefen Hütte. Obwohl die Hebamme eine Antipathie gegen alle Ärzte besaß, mußte schon in der zweiten Nacht der Dr. Schwärzle geholt werden. Es wurde ihr unheimlich bei dem fortgesetzten Ächzen des halb besinnungslos auf ihrem Lager sich windenden Mädchens.

»Das Herz ischt's. Die hält's nit durch – das Herz ist nit gesund,« sagte die Uffenbacherin bekümmert am anderen Morgen zu Cornelie. Ihre gewaltigen Backentaschen waren bleich und welk geworden vor Angst. »Gott soll mich bewahren – hätt' ich das gewußt, hätt' ich sie gar nit erst eingelasse ... Die Schererei mit der Polizei ... Uff...«

Sie wollte sie wieder ausquartieren, sie wollte sie nach München zurück schicken, woher sie gekommen waren, die beiden jungen Geschöpfe in Reformkleidern, mit tiefen
 Künstlerscheiteln, von denen die eine nun so grausam leiden mußte, während die andere Schlanke, Zarte, zuweilen in der Wohnstube unten erschien und nach der Hebamme rief. Bei einer solchen Gelegenheit blieb sie einen Augenblick am Kachelofen stehen, wo man bei dem rauhen Wetter ein Feuer angezündet hatte. Sie versuchte, sich die kalten, vor Angst klappernden Glieder zu wärmen.

»Wie schwer ist es doch, einen Menschen, den man lieb hat, leiden zu sehen und nicht helfen zu können,« sagte Cornelie, die auch durch das Feuer hier gehalten wurde, und blickte das verstörte Mädchen teilnehmend an.

»Schauerlich – schauerlich!« murmelte diese. »Die Frau will uns wieder fort haben – ich soll weiter mit der Unglücklichen,« brach sie laut schreiend aus. »Oh – oh – sieht sie denn nicht, daß das Mädchen stirbt – sie soll sie doch sterben lassen ... ruhig sterben lassen ... Es ist ja doch das beste – das einzige für sie!«

Plötzlich starrte sie zwischen ihren Schmerzensschreien auf Cornelie ... in ihre glühenden dunklen Augen kam ein Erkennen, ihr verweintes Gesicht zuckte, sie hielt die Hände vor sich, als sähe sie eine Erscheinung.

Cornelie wurde rot und biß sich die Lippen. Hier war jemand, der von ihr wußte ...

Das hagere Gesicht lächelte und mit einem Male dem Schmerz entrückt flüsterte das Mädchen in großer Erschütterung:

»Mein Gott – mein Gott – Sie sind doch ... Sie sind ... Cornelie Reimann?«

Cornelie antwortete ihr nur mit den Augen.

»Bitte – bitte nicht ...« stammelte sie abwehrend und zog ihre Hände an sich, weil die andere sie ihr zu küssen versuchte.

»Verzeihen Sie,« schluchzte das bebende Mädchen dazwischen, »es ist zu viel –. Ich bin so aufgewühlt ... Ich bin ja keine Exaltierte ... nur ... Sie ... Sie ...! Wie wir Sie liebten – liebten! meine Freundin und ich – was Sie uns Jungen sind ... ahnen Sie es auch nur? Wie Sie uns alle führen ...«

»Führen –? Hierher?« Cornelie wandte gequält das finstere Gesicht ab.

»Verzeihen Sie mir,« sagte das junge Mädchen sehr sanft, »ich bin taktlos – aber Sie wissen ja alles – auch daß man jeden Takt vergessen kann? Nicht wahr? Und daß von allen Taktlosigkeiten doch diese grenzenlose Verehrung nicht berührt wird ...?«

»Sie lieben Ihre eigene Sehnsucht,« sagte Cornelie mit leiser Ablehnung.

»Wir fühlen in Ihnen die Kraft, nach der wir ringen,« antwortete das Mädchen nun einfacher und klarer. Sie strebte sichtlich vor Corneliens beherrschter Haltung der eigenen überreizten Bewegung Herr zu werden, bis eine neue Erschütterung sich auf ihren nervösen Zügen spiegelte.

»Es ist so unfaßbar, daß Sie hier sind – und eigentlich – wenn man Sie recht begreifen will ... es ist wie ein Wunder und doch so natürlich! – Vielleicht ist es die Rettung! Es könnte meiner armen Freundin ein solcher
 Trost, eine solche Stärkung sein ... Sie müssen zu ihr ... der Doktor sagt: Das Herz – aber es ist doch nur die Qual dieser Wochen, die das Herz nicht tragen konnte ...«

Cornelies Blick verdunkelte sich, ihr Gesicht wurde kalt, ihre Haltung hochmütig vor innerem Entsetzen.

»Nein – nein – nicht das –. Ich kann nicht die Verantwortung für anderer Schicksal tragen ... Ich will nicht.«

»Sie tragen keine Verantwortung. In diesem Falle gewiß nicht ... Meine Freundin liebte ihren Lehrer ... Ich will ihn nicht nennen. Er ist – Sie kennen ihn gewiß – er ist einer von den Größten in der Kunst. Es ist die ganz alltägliche Geschichte – es wäre so gekommen, auch wenn sie niemals ein Wort von Ihnen gelesen hätte. Er war ja doch das Höchste auf Erden, zu dem sie betete – mehr noch als zu Ihnen – wie sollte sie ihm denn da widerstehen? Nur glaubte sie stärker zu sein, als sie es in Wahrheit ist. Sie wollte ihr Kind haben, und konnte es doch nicht durchführen – sie gestand ihren Eltern alles – die haben sie verstoßen – alle ihre Briefe, alle Telegramme zurückgesandt. Prediger ist ihr Vater – Prediger der christlichen Liebe ...« Sie schüttelte wütend die mageren Hände. In ihren glühenden Augen brannte der Haß der jüdischen Rasse. »Ach – wenn ich den Leuten etwas antun könnte ...«

Cornelie schwieg und senkte den Kopf, als träfe ein Teil dieses Hasses sie selbst.

»Und der Mann?« fragte sie dann leise, hoffnungslos.

Das Mädchen zuckte die Schultern, sie machte eine Bewegung mit der Hand, als schiebe sie etwas hinweg.

»Er war ja viel zu groß – viel zu berühmt, um eine kleine Malschülerin zu seiner Frau zu machen. Sie hat es auch immer gewußt. Mit ihm wäre sie wohl fertig geworden –. Sie war ein stolzes Mädchen. An den Beschimpfungen, mit denen man sie zu Haus zerschlagen hat – daran zerbricht sie ... Gehen Sie zu ihr, Fräulein Reimann ... wenn jemand noch helfen kann, sind Sie es.«

Die Freundin begann wieder zu weinen. »Bereiten Sie sie vor,« sagte Cornelie leise. »Und rufen Sie mich dann.«

Das Mädchen ging. Über der unförmigen Nase die glühenden Augen richteten sich von der Tür noch einmal beschwörend auf Cornelie. Die saß auf der schmalen Holzbank, welche nach schwäbischer Bauernsitte rings um die Wand lief; die Hände hatte sie fest gefaltet, so starrte sie wehevoll auf die gescheuerten Dielen. Die Kuckucksuhr schlug eine Viertelstunde nach der andern. Annerle schaute herein und zog sich nach einem Blick auf Corneliens gedankenversunkene Gestalt wieder zurück. Die Hanne kam herein, ließ sich stöhnend auf eine andere Seite der Bank nieder und aß ein Brot mit Wurst.

»Das wird eine schwere Nacht,« begann sie. Cornelie nickte nur mit dem Kopf. Auch die Hanne schwieg. Man hörte ihr Kauen und Schmatzen und das Krachen der Holzscheite im Ofen, das Rieseln des Regens an den kleinen Fensterscheiben.

Dann kam die Freundin, blickte Cornelie liebevoll an und winkte ihr hinaus.

»Es war so schwer, das Weib zu entfernen,« seufzte sie. »Ich glaube, sie hat jetzt weniger Schmerzen. Wäre sie nur nicht so apathisch. Mich ängstigt ihre Gleichgültigkeit.«

Cornelie trat lautlos ein, wandte sich mit leisen, stillen Bewegungen zu dem Bett.

Gleichmäßig kam und ging das röchelnde Ächzen aus der Kranken bläulichen Lippen. Bei jedem Ächzen hoben sich die Hände und Arme wie von einer Maschine bewegt, fielen auf die Decke nieder und hoben sich wieder. Das Antlitz trug eine seltsam silberweiße Farbe mit bläulichen Schatten um die Augen – aber diese Augen sahen niemand mehr. Cornelie stand eine Weile neben der Sterbenden. Sie nahm ein Tuch und wischte ihr zart die von kaltem Schweiß beperlte Stirn, flößte ihr mit Hilfe der Freundin einige Tropfen Flüssigkeit zwischen die zersprungenen Lippen.

»Sie hat doch noch Kraft,« flüsterte die Getreue. »Sehen Sie nur die Händ... Ich glaube sie lächelte, als ich Ihren Namen nannte ... Du, Annelies, Liebe – hörst du mich,« versuchte sie aufs neue, »denke nur, Cornelie Reimann ist hier.«

Cornelie fuhr es wie ein Schlag durchs Herz, als sie ihren Namen nennen hörte.

»Lassen Sie sie ruhen,« flüsterte sie der Unerfahrenen warnend zu. Das Antlitz der Kranken schrumpfte in diesem Augenblick zusammen wie ein dürres Blatt, der bläuliche
 Mund öffnete sich, der Körper bäumte hoch auf, die Hände rangen in der Luft – Cornelie hielt sie aufrecht, während die Uffenbacherin zur Hilfe herbeigeeilt kam.

In der Nacht, nach einem erneuten furchtbaren Schmerzensanfall, wurde sie erlöst, noch ehe das Kind von ihrer zerstörten Kraft geboren werden konnte.

Die Freundin der jungen Toten benachrichtigte telegraphisch die Eltern und den berühmten Meister von ihrem Ableben.

Annerle, Toni und auch die blasse bescheidene Luis hatten das Lager ihrer erlösten Schwester mit allen Rosen und Reseden, die sie in der unteren Dorfstraße bei den armen Ziehmüttern zusammenbetteln konnten, umkränzt.

So lag die Tote, Rosen auf der Brust und Rosen in den Händen, mit dem schmalen verschlossenen norddeutschen Gesichtchen zwischen den hellbraunen Scheiteln, die der Farbe einer jungen Hindin glichen, als am nächsten Morgen ihr Bruder eintraf, die Leiche heimzuholen.

Ein junger Assessor mit korrekt gestutztem blonden Bärtchen, im korrekten schwarzen Rock, mit demselben verschlossenen Gesichtsausdruck, den die Leiche auf ihrem weißen Lager trug. Die Uffenbacherin führte ihn hinein, wo die Getreue still neben der Toten saß. Er blieb nur wenige Minuten, gab im Flur der Uffenbacherin einige kurze Anweisungen über die Beförderung des Sarges zur Bahnstation und verließ mit demselben festen korrekten
 Schritt, mit dem er eingetreten war, das Tränenhaus.

Einige Minuten später erschien die Freundin bei Cornelie. Ihre Hände zitterten, ihre Gesichtszüge zuckten im Nervenkrampf.

»Ich kann nicht allein sein,« stieß sie hervor, und die glühenden schwarzen Augen hingen mit einem wunderbaren Blick an Cornelie.

»War es sehr qualvoll?« fragte diese. »Ich sah ihn vom Fenster. Er sah aus wie ein Mensch, der sich beherrschen kann.«

»Ob er das konnte ...« Plötzlich begann das Mädchen hysterisch zu lachen. »Wissen Sie was er sagte, als er die Rosen in Annelies' Händen sah: Von wem sind denn die? Und als ich antwortete: Von uns – da sah er mich an – o ich weiß, er dachte: Dies exaltierte Judenmädel ... Aber er sagte nur: Welche Sentimentalität ... Und dann so ganz geschäftsmäßig: ›Meine Schwester ist bei einem Ausflug in den Bergen abgestürzt. Die Zeitungen werden eine diesbezügliche Nachricht bringen. Wir erwarten von Ihrer Diskretion, daß Sie die Version auch Ihren Bekannten gegenüber aufrecht halten ...‹ – Daß ich ihn nicht ins Gesicht geschlagen habe!«

Cornelie schauderte. Leise nahm sie die Hände des zerwühlten Mädchens, streichelte und liebkoste sie, und diese fiel endlich vor ihr auf die Knie, drückte den schwarzen Krauskopf in ihren Schoß und schluchzte sich Erleichterung.

Der Sarg war auf einem bäuerlichen Leiterwagen zur Station geschafft worden.

Annerle, die mit der Luis und der Toni seinem Verladen in einen Packwagen beigewohnt hatte, war bei der roten Bärbe eingekehrt und stärkte sich dort durch ein Kirschwasser, das sie selbst geschenkt hatte.

Die Uffenbacherin »veschperte« mit der dicken Blonden in der Küche und probierte eine neue Sorte Wein.

Cornelie hatte die Freundin, die aufgeregt und fiebernd durch unnütze Geschäftigkeit die traurigen Dinge noch trauriger machte, endlich am Arm genommen und sie dem letzten unwürdigen Eindruck des auf den Brettern des leeren Erntewagens dahinschaukelnden Sarges entzogen, indem sie sie in ihr Zimmer führte und sie sich aussprechen ließ. Erinnerungen an die Tote – an die gemeinsame Studienzeit in München, Geständnisse eines brennenden Neides, als der angebetete Lehrer sich der Freundin zugeneigt habe – Freundschafts-Aufopferung, welche die eigne Leidenschaft zu betäuben suchte ... Dazwischen Deklamationen über Welt- und Gesellschaftsordnung, junge rasende Empörung über die Eiswände der Konvention, an denen die beiden Sturmgeister sich die heißen Köpfe wund gestoßen hatten ... Begeisterungsausbrüche über neue Rechte des Weibes, Rechte des Menschen, sein Leben zu leben, nicht das der andern ...

Cornelie ließ das Mädchen geduldig all den Jammer ihres in den letzten Tagen so grausam mißhandelten Herzens
 in blutrünstigen Worten austoben. Sie neidete der jungen Jüdin das konvulsivische Entrüstungs-Pathos – diesen sinnlichen Fanatismus der Wut. Sie selbst fühlte nur immer wieder: Grausame, grausame Natur ... Sie fühlte nur: Weibesschicksal, das durch keine Gesetze, keine Rechte abzuwenden war. Das immer wieder vernichten mußte, so lange Mädchen leben und lieben – so lange Männer Männer bleiben ...

Wie schal, klein und nichtig schienen diesem Ewigen gegenüber alle die phantastischen oder ausgeklügelten Umwälzungsvorschläge, von denen sie in den letzten Wochen gelesen hatte. Sandkörner – in einen Abgrund geblasen.

Aber es mußte ja schön sein, den Glauben daran zu haben ...

Und es war hart, ohne einen solchen Glauben an ein leuchtendes Ziel einen neuen unbekannten Weg zu gehen.

Aber sie konnte sich nicht betrügen mit funkelnden Gedanken und schäumenden Worten, die in sich selbst versanken, wenn die Sonne der Wirklichkeit heiß über ihnen brannte.

Später half sie die wenigen Sachen, welche die Verstorbene im Handköfferchen mit sich geführt hatte, und ihr phantastisches Reformfähnchen zusammenzupacken und an die Eltern zu adressieren. Die Freundin vermochte die Feder nicht in den von einem Nervenzittern befallenen Händen zu führen, als sie Namen und Titel des gehaßten Predigers niederzuschreiben versuchte.

Das Köfferchen hatte auf seinem Grunde auch ein
 schmales Päckchen Briefe enthalten. Die lagen nun noch auf dem Tische. Die Freundin wurde plötzlich rot, als sie sie zögernd mit der Hand berührte.

»Ins Feuer!« sagte Cornelie bestimmt.

»Ich gönnte es ihm, daß er sie noch einmal lesen müßte – jetzt ...« flüsterte die Jüdin. Ihre Augen funkelten.

»Ins Feuer,« wiederholte Cornelie. Sie nahm die mit blutrotem Seidenband umwundenen weißen Zettel aus den heißen Fingern der anderen, öffnete die Ofentür und hielt ein Zündholz an die Blätter. In wenigen Augenblicken waren sie aus einer hellen Flamme zu einem Häuflein verkohlten Staubes geworden.

Cornelie streifte mit dem Blicke das Gesicht des Mädchens, das gierig atmend, mit dunkel glühenden Augen dem Vorgang gefolgt war.

... Begehrte er dich morgen, der große Meister – du würdest ihm nicht widerstehen, ging es ihr durch den Sinn.

Zum Abendzug brachte sie die Malerin zur Bahn.

Der Fluß rauschte kühl unter den Erlen, ein feuchter Wind wehte stark über das Land, das nach der Ernte leer und weit in der Dämmerung lag. Zarte Nebel zogen Schleiertücher über die kahlen Äcker, auf denen Cornelie das Korn hatte wogen, reifen und fallen sehen. Von den letzten Regentagen war ein herbstlich-herber Hauch in der Luft zurück geblieben.

Wie lange noch? Wie lange –? Würde sie im kommenden Winter den Schnee vor den Fenstern wirbeln
 sehen ...? Tot sein ... Wie seltsam, daß man sich vom Nichtsein keine Vorstellung machen kann, solange man sich lebend fühlt ...

Cornelies Hand wurde ergriffen, mit einem leisen Mißbehagen duldete sie die Küsse des fiebernden Mädchenmundes auf ihrer Haut.

»Lassen Sie mich bei Ihnen – lassen Sie mich Sie pflegen, Sie lieben ...«

»Kind, das ist unmöglich,« antwortete Cornelie ein wenig hart und nüchtern.

»Es würde mich so beglücken. – Ich kann – ich kann es nicht ertragen, Sie mir hier unter diesen Menschen zu denken.«

Cornelie wandte den Kopf zur Seite. Sie war gerührt und empfand doch das Anerbieten als ein unberufenes Eindringen in ihren Lebenskreis, den sie nicht öffnen mochte, am wenigsten für dieses in schwülen Schmerzen aufgelöste Mitgefühl.

»Sorgen Sie nicht um mich. Ich weiß, weshalb ich hier bin und an keinem anderen Orte. Mißverstehen Sie mich nicht – es ist nicht etwa aus Buße oder aus Lust am Martyrium. Nein – ich fühle einfach, daß ich hierher gehöre ...«

Sie schwieg eine Weile, denn sie sprach ungern von sich, doch fühlte sie, wie grausam es gewesen sein würde, sich ganz zu verschließen, vor dem so sehr nach Trost lechzenden Geschöpf an ihrer Seite. Und so begann sie wieder, schwer, langsam:

»Anfangs wußte ich wohl selbst nicht, was ich hier sollte ... Wir glauben alle, unser ganz persönliches Leben nach unserm Wollen zu führen, und dabei leben wir doch zugleich mit dem persönlichen noch ein typisches Leben der Zeit, das wir aber nur in seltenen Augenblicken durch die Hülle des persönlichen hindurch erkennen. Das wird nicht von dem individuellen Willen bestimmt, sondern durch Bedingungen, über die wir gar keine Gewalt haben. Darum tun wir wohl so oft Dinge, von denen wir fühlen, wir tun sie aus einem Zwang, der gegen unsere individuelle Natur ist. Das Schicksal hat manche unter uns ausersehen zu Symbolen der Zeit. Wir tragen ihr Brandmal, oder ihre Flammenzunge an der Stirne – wissen nicht, ob das feurige Zeichen Schande oder Ehre bedeutet ... Wer einmal so gezeichnet wurde, der muß sein Los auf sich nehmen und seine letzten Bitterkeiten austrinken. Er wird ahnen, daß nur auf diesem Wege sein Leben reif werden kann, zu einer Frucht am Erntekranz der Zeit. Ich weiß nicht, ob Sie mich verstehen, – so recht kann ich das wohl nur selbst empfinden.«

Die junge Malerin neigte den Kopf. »Meinen Sie damit Gottes Willen tun?« fragte sie zögernd.

»Ich glaube nicht mehr an einen persönlichen Gott,« sagte Cornelie. »Und es war eine Erlösung, als ich diesen Glauben endlich von mir tun konnte. Aber da sind doch unbegreifliche Mächte hinter allem sichtbaren Geschehen. Ahnen wir in seltenen Augenblicken das Gesetz unsres eignen Lebens, müssen wir uns ihm beugen, wenn es auch
 noch so erschreckend droht. Denn es ist doch das Göttliche. – – – Einmal mußte wohl alles dieses von einer Frau gelitten werden, die es nicht nur dumpf quälend fühlt, sondern die es in Erkenntnis umwandeln wird ... jetzt noch nicht – einmal in der Zukunft ... Das geschieht nur, wenn die Zeit dafür gekommen ist. Ich meine, wenn da draußen viele sind, die warten, daß eine letzte Türe zu einer Erkenntnis ihnen geöffnet wird.

Vielleicht sage ich das heute nur zu Ihnen – vielleicht bin ich nur ein verunglückter Versuch der Natur, den sie braucht, um zu einem bestimmten Punkte vorzudringen. Das weiß ich nicht. Am Ende bin ich zu schwach. Aber dann wird ganz gewiß eine Stärkere kommen.«

Die dunklen Augen des jungen Mädchens sahen über der unförmigen Nase bewundernd zu Cornelie empor.

»Nun glaube ich eher, Sie zu begreifen.«

»Überschätzen Sie mich nicht,« sagte Cornelie mit schmerzverzogenem Munde. »Man ist nichts Einzelnes. Man ist das notwendige Glied einer notwendigen Kette. Noch vor einem Jahr habe ich Unendliches gewollt – jetzt warte ich nur, was mit mir geschehen soll.«

Die Begleiterin lachte plötzlich nervös und leidenschaftlich. »Nein – ich verstehe Sie doch nicht. Cornelie Reimann, die geduldig und schwach ist! Es ist körperliche Müdigkeit – oder Sie erniedrigen sich absichtlich! Was könnten Sie tun – welchen Einfluß könnten Sie haben – stolz wie eine Königin sollten Sie mit Ihrer Mütterlichkeit
 unter die Menge treten ... damit man endlich einsieht ...«

»Mütterlichkeit als Propagandamittel?« fragte Cornelie. »Das möcht' ich meinem Kindchen doch nicht antun.«

»Wenn Sie spotten, können Sie grausam werden.«

»Verzeihen Sie mir,« sagte Cornelie einfach. »Ich wollte Sie gewiß nicht verletzen ... Nur – sehen Sie, liebes Kind – Geschrei und Kampf und Wut, das zerstört doch nur. Alles natürlich Werdende wächst still und langsam ... Wenn ich hier abends – wie viele Abende – an dem kleinen Flusse entlang gegangen bin, sah ihn so jung, so durchsichtig, daß man jedes Kieselchen auf seinem Grunde unterscheiden konnte – dann stellte ich mir vor, wie er weiterhin wächst und schwillt, von hundert Bächen und Nebenflüssen genährt – wie er, ein brausender Strom, zum Stolz eines gewaltigen Landes wird – wie unter hoch geschwungenen Brücken der Verkehr einer Kaiserstadt in Schiffen und Dampfern auf seinen mächtigen Wogen schwimmt, wie er, durch ungeheure Felsentore brechend, die Welt des Okzidentes mit dem Orient verbindet ... – das kleine, junge, dumme – spielerische Flüßchen hier unter den Erlenbüschen ...«

Sie blieb stehen, ihre Augen blickten, dem Lauf der Plätscherwellen folgend, in die dunkelnde Ferne. »Ich träume oft, wie dieser Fluß geworden ist – solche Macht und Gewalt könnten die Frauen bekommen, wenn sie sich nicht länger um eines Dogmas willen gegenseitig hassen, verachten und verfolgen würden.

Solche Macht und Gewalt könnte der Gedanke der Liebe gewinnen, wenn er die Frauen zu einer Einheit zusammengießen würde – darin alle für eine und eine für alle stehen in jener Zeit, wo die Frau am meisten Weib, am schutzbedürftigsten ist – und wo der Mann seiner Natur nach versagen muß, wo er dem letzten Weibgeheimnis immer fremd und peinvoll betroffen gegenüber stehen wird. – Gott! Gott –! Zur Zeit ihrer werdenden Mutterschaft wütet gegen die Tochter die Mutter – die Schwester gegen die Schwester ... Vor der ewigen Not und dem ewigen Ruhm des Weibes versinkt nicht in jeder Frauen Gefühl das Tagesgesetz der Gesellschaft wie ein ödes ekles Gespenst! Vor diesem ewig Gewaltigen, das eisern das Weib zum Weibe binden sollte, macht es Gemeinschaft mit dem Manne, um im Verein mit ihm die Schwester im Geschlechte zu morden ...

Die Frauen sind keiner Rechte wert ... keiner bürgerlichen und keiner ideellen – so lange sie dieses ihr heiligstes Recht – ihre gewaltigste Pflicht und Macht nicht erfassen wollen!«

Cornelie strömten die Tränen über das zum Himmel erhobene Gesicht.

Ihre Klage klang laut wie ein Schrei über das nächtliche Feld.

Als der Zug schon daherbrauste, nahm Cornelie noch einmal die Hand der jungen Malerin und drückte sie fest. »In Ihnen ist mir das Zusammengehörigkeitsgefühl zum erstenmal entgegengetreten. Das werde ich nicht vergessen.
 Vielleicht sollen die Töchter Ihres Volkes, die Erinnerung an Schmach und Verfolgung im Blute tragen, auch die ersten sein, in denen die Liebe, die ich meine, sich offenbart!«

»Den Glauben will ich mit hinausnehmen,« flüsterte das Mädchen. »Nun haben Sie mich doch getröstet.«

Ihr Tuch flatterte noch lange, während der Bahnzug sich entfernte.

Cornelie wanderte in der Dunkelheit die Landstraße auf und nieder, immer wieder auf und nieder. Der Wind wogte um sie her, als käme er über ein weites Meer. Sie dachte des Prometheus, der an der Tafel der Götter saß – und dann war er geschmiedet an die Felsen eherner Notwendigkeiten, und der Geier fraß ihm die Leber aus der lebendigen Brust.

Als die Füße sie nicht mehr trugen und das Grauen der Einsamkeit überwältigend wurde, besann sie sich darauf, daß sie versprochen hatte, Toni und Annerle von der Bärbe abzuholen.

»Ja, wie schauen Sie aus, Fräulein Cornelie!« Bärbe nahm ihre im Frostkrampf gekrümmten Finger und rieb sie sacht zwischen ihren guten, mütterlichen Händen. Mit geschlossenen Augen saß sie bei den andern, hörte ihre gedämpften Stimmen und kehrte so ins Leben zurück.
