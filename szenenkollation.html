Da führte ein Zufall, wie ihn niemand hätte voraussehen können, einen völligen Umschwung in der Gesinnung der Frau Uffenbacher gegen Cornelie herbei. Es war ein Regennachmittag zu Anfang des Oktober. Der Birnbaum streute seine braun gewordenen Blätter auf die von Feuchtigkeit dampfende Erde. Das Wasser rauschte aus der Dachtraufe in das darunter aufgestellte Faß. Der Wind klapperte mit den mürben Holzläden, riß ab und zu einen aus den Krampen und warf ihn klirrend gegen die Wand. In hohen Schaftstiefeln arbeitete sich der Briefträger, tropfend vor Nässe, durch Schlamm und Pfützen dem Häuschen entgegen. Wenigstens erwartete er ein gutes Biergeld für den Abend im Sternen, denn er brachte dem langen Fräulein wieder einen Packen Briefe und Zeitungen. Nicht einmal der Graf bekam im ganzen Jahr soviel Postsachen, wie die in einem Monat. Russische Marken waren darauf – amerikanische, norwegische, französische und englische. Cornelie fand ihr Bild in den Blättern der fremden Länder, sie las Wahres und Unwahres über ihr Leben, Phantastisches oder Zutreffendes über ihre Meinungen und Anschauungen. Sie wurde mit begeisterten Worten in den Himmel erhoben, oder scharf angegriffen, und verantwortlich gemacht für Mißstände, deren Änderung niemals in dem Willensbereich eines Menschen gelegen hätte. Sie saß in der niederen, vor Hitze glühenden Bauernstube, an deren Ofen die Windeln des Ziehkindes und der nasse Rock der alten Hebamme trockneten und hörte ihr Geschwätz mit den zwei dürren Fräulein Hottinger und dem Annerle über eine ganz erschreckliche Entbindung, die sie einmal erlebt hatte und nun mit allen grausigen Einzelheiten wollüstig beschrieb. Dazwischen hinein quäkte Annerles Bübchen auf dem Arm der hagern Dorfjungfer, und das dicke Ziehkind gröhlte am Boden, wo es sich auf einem schmutzigen Federbett wälzte und von der blassen Luis vergeblich durch das Schnarren einer Holzknarre beruhigt werden sollte. Die Hanne schälte Kartoffeln und warf sie jedesmal mit einem Plump in die Schüssel mit Wasser neben sich. Cornelie nähte an einem Kissenbezug für ihr Kleines – oben in ihrem Zimmer konnte sie sich nicht mehr aufhalten, weil der Ofen dort zerfallen und nicht zu heizen war. Und dieselbe Cornelie hatte draußen in der Welt eine Macht errungen, um ihren Einfluß tobte der Kampf der Parteien, eine Macht, die da weiter und weiter wirkte. Ihr Name war ein Kriegsruf geworden, den andere nun schon auf ihre Fahne schrieben, mit dem sie, unabhängig von ihr selbst, freie Bahn und Glück und Erfolg suchten . . . Da draußen in einer Welt, die so unendlich ferne lag . . .

Wie von einem Märchen las sie in dem großen, englischen Journal, das heute ihren Ruhm zu ihr in ihre Abgeschiedenheit trug: Von ihren Vorfahren – von ihrer Kindheit – las kleine, luftige Geschichten aus ihren Schultagen und feine, geistvolle Worte eines gescheiten Mannes über das Werk ihres Lebens und von dem, was sie der Zukunft schuldig sei . . . Sie lächelte in Gedanken versunken ihr stilles Mädchenlächeln. Es überfiel sie plötzlich mit jäher Gewalt das Bewußtsein, erreicht zu haben, wonach tausende von kraftvollen Männern vergebens ringen und kämpfen . . .

Es kam wie aus weiter Ferne durch das Rauschen des Regens, vorüber am Stöhnen des Windes ein Ruf zu ihr, wie eine helle Geisterstimme –. Dort draußen lebte sie ja! War denn dies alles um sie her nicht nur ein wirres beängstigendes Traumland? Hinaus – hinaus in das wahre Leben! Zum Kampf – zum Wirken – zu neuen Taten, neuen Siegen! schrie plötzlich jubelnd ihr erwachender Mut. Ungeduldig warf sie das Nähzeug hin, sprang auf und reckte die Arme. Die niederen Balken drückten auf sie, die übelriechende Glut des Raumes beklemmte sie.

„Ja, Fräulein Cornelie, wollen’s denn hinaus bei dem argen Wetter?“ fragte die Uffenbacherin erstaunt.

„Nur an die frische Luft,“ sagte Cornelie zerstreut.

„Der Regen tut mir nichts!“

„Was haben’s denn da als wieder?“ fragte die Hebamme, auf das große grüne Heft deutend, „kann man nit einmal schauen?“

„Sie können’s doch nicht lesen, Frau Uffenbacher,“ sagte Cornelie und trug das Blatt hinauf in ihre Stube. Unterwegs, während sie tapfer mit aufgehobenen Röcken durch die Pfützen der Landstraße tappte, fiel es ihr ein, daß sie das Journal am Ende doch vergessen hatte zu verschließen, wie sie es sonst mit ihren Postsendungen aus dem andern Dasein zu tun pflegte.

Ein spitzbübisches Lächeln flog über ihr Gesicht. Jetzt werden sie alle oben bei mir an dem Englisch herumraten, dachte sie fröhlich. Und Gott mag wissen, was sie davon denken, daß auf derselben Seite, wo mein Konterfei sich befindet, der neue Lordmayor von London abgebildet ist, wie er in seinem Triumphwagen durch die City fährt. – Nun, Annerle wird es mir schon berichten.

Dies geschah auch, sobald sie heimkehrte. Annerle und Toni erstickten beinahe vor unbändigem Gelächter. Fräulein Cornelie hatte das Haus kaum verlassen gehabt, da war auch schon die Alte hinaufgesprungen, um das Bett für die Nacht zu richten. Zwei Minuten später winkte sie Annerle und Toni ins Zimmer, ihnen in dem grünen Heft das Bild des Fräuleins zu zeigen. Vergebens aber hielt sie die Druckschrift bald nah bald weit vor die Brille, sie konnte doch nichts weiter entziffern als den Namen „Cornelie Reimann“, der sowohl unter dem Bilde, als auch auf der folgenden Seite immer wieder zwischen dem sonst so unverständlichen Gedruckten auftauchte. Nun sollte Annerle weiter helfen.

„Das wird ihr Herr sein,“ riet die findige Hebamme und betrachtete kritisch den neugewählten Londoner Bürgermeister, „jung ischt er nit – aber ein feiner Mann!“

Des Annerles Englisch war nicht gar weit her, dennoch buchstabierte sie zuversichtlich an der Unterschrift.

„Lordmajor von London ist er,“ sagte sie oben hin.

„Donnerschlag!“ rief die Hebamme, „machst mir auch nix weiß?“

Sie buchstabierte nun selbst und fand denselben geheimnisvollen und hochtrabenden Titel heraus. Mit offnem Munde starrte sie auf Corneliens Bett – auf ihren Waschtisch, ihren Kleiderschrank und das tabaksduftige Kanapee.

„Lordmajor von London . . . “ wiederholte sie erschüttert, und von plötzlicher Gewissensangst befallen.

„Lordmajor von London“ – und sie hatte dem Fräulein Lunge mit saurer Sauß’ vorgesetzt – zweimal die Woche ...

Ja – wer das hätt’ denken können . . . Auch der Trommelstock von der Gans und andere Sünden fielen ihr bei. Das Annerle aber stachelte der Schelm, der ihr im Nacken saß. Sie kauerte sich auf das Kanapee und studierte eifrig an dem Aufsatz, der von der Cornelie Reimann handelte. Und endlich auf das Flehen und Bitten der Alten, ließ sie sich herbei, ihr dessen Inhalt zu übersetzen, obschon er ein großes Geheimnis enthielt.

Cornelie Reimann war die angetraute Gemahlin des Lordmajor von London, und in der goldnen Kutsche mit den vielen Pferden, die alle nickende Federbüsche auf den Köpfen trugen, war das junge Paar nach der Hochzeit im Triumph durch London gefahren. Aber eine nahe Verwandte der alten Königin hatte sollen den Lordmajor heiraten. Deshalb verbannte die Königin Cornelie von ihrem Hof, sie mußte fliehen und sich unter falschem Namen verbergen, sonst hätte die Prinzessin ihr nach dem Leben getrachtet. Endlich habe der Lordmajor die Verzeihung der Königin erhalten, und wenn das Kind geboren sei, dürfe Cornelie an den Hof von England und in die Arme ihres Gatten zurückkehren.

Alles dieses las Annerle aus dem grünen Heft der andächtig lauschenden Hebamme vor.

„Am End’ gar kommt der Herr Major selbst, seine Frau Gemahlin zu holen . . . “ sagte atemlos die Uffenbacherin.

„Lordmajor,“ verbesserte Annerle, das „ischt was anders Vornehmes, als ein simpler Herr Major.“

Die alte Schwäbin aber sah in ihrer Phantasie bereits die verschnörkelte goldne Kutsche mit den Pferden, die nickende Federbüsche auf den Köpfen trugen, mit den Dienern hinten und vorn, in den wunderlichen Hüten und Kleidern, die Straße vom Bahnhof herabgefahren kommen, vorüber an den Vorgärtchen der Witwen mit den Kinderwagen – sie sah das Gefährt vor ihrer Anstalt stille stehen – und sie sah sich selbst hineinsteigen, in einem schwarzseidenen Kleide mit einer großen Flügelhaube auf dem Kopfe, wie sie sich die Kindsfrauen in vornehmen Häusern vorstellte – das Neugeborene unter weißen Schleiern auf dem Arme tragend . . .

– Das wär ein anderes Pöstle für sie, als hier das Gefrett’ mit den ledigen Mädeles, bei dem man nit sein trocknes Brot herausschlagen könnt’, erklärte sie dem Annerle und der Toni. Sie war ganz bereit mit nach England zu gehen, und eine Vertrauensstellung bei der Frau Lordmajor einzunehmen – der Herr müsse sich doch auch dankbar erweisen, dafür, daß sie die verlassene Frau in ihrer schweren Zeit bei sich aufgenommen und gehegt und gepflegt habe! Es sei nicht zu viel, wenn er in ihren alten Tagen nun für sie sorge!

Cornelie fiel es bei dieser sonderbaren Geschichte ein, wieviel Schönes, Verwunderliches und Tolles die ausbündige schwäbische Phantasie der deutschen Welt schon geschenkt habe – und sie beschloß bei sich selbst, die Hebamme in ihren verworrenen Träumen vorläufig nicht zu stören.

Oh – wie war die zornige, herrschsüchtige und boshafte Alte nun so demütig und dienstbeflissen! Dreierlei Knöpfle gab’s in die Supp’, Zwetschgenkuchen und Zwiebelkuchen wurde abwechselnd gebacken, und es war schier, als wär’s im Tränenhaus mit einemmal Kirmes geworden. Fast kam den Fräuleins eine Furcht an, wie es mit dem guten Leben, das sie jetzt führten, einmal schrecklich enden könne. Doch Annerle, die auch nicht umsonst von der schwäbischen Grenze her gebürtig – und – wer weiß – vielleicht ein unverfälschtes Schwabenblut war, schürte künstlich und verschlagen mit halben Versprechungen und unbestimmten Zusagen, die sie von dem Fräulein Cornelie für die Frau Uffenbacher erhalten zu haben behauptete, das Feuer des Begehrens, Planens und Hoffens in der Brust der alten Hebamme immer wieder zu hellen Flammen auf.

Neunzehntes Kapitel

Unbegreiflich lange verzögerte sich die Stunde der Befreiung für Cornelie. Der Doktor Schwärzle, den sie befragte, versuchte ihre Sorge zu zerstreuen: solche Anomalien kämen hin und wieder vor, erwiesen sich später ohne Schaden für Mutter und Kind, ihr Körper sei so ausnehmend geschaffen für die Mutterschaft, daß sie auch einer erschwerten Entbindung mit Ruhe entgegensehen könne. Sie hatte in keiner Weise damit gerechnet, den Oktober noch bei Frau Uffenbacher verbringen zu müssen. Jeder neue Tag vermehrte die Gefahr, daß ihre Mutter durch ein Gerücht, durch irgendeinen unberufen sich zudrängenden Warner vor der Zeit aufgeklärt werde. Sie schrieb sorgenvoll traurig über ihrer Tochter verlängerte Abwesenheit, ja, sie drohte hin und wieder trotz ihres leidenden Zustandes, sich auf die Reise zu ihr zu begeben, sie eines Tages überraschen zu wollen. Mit stets neuen Listen und Ausflüchten mußte Cornelie sie beschwichtigen – mußte endlich hart und streng die Freiheit der Einsamkeit für sich fordern, um die Arme nur fern zu halten.

Es jährten sich nun die Tage, die sie im letzten Herbst mit Rudi Imgart am Rhein verbracht hatte – da unter grün-goldenem Rebengerank aus der zarten Freundschaft jäh die Liebe emporgeflammt war . . . Erinnerungen drängten sich süß und schwer an ihr Herz – ein von Abendrosengluten überschimmerter Strom breitete sich, – der Wein funkelte in den Gläsern und letzte duftende Teerosen blühten an ihrer Brust. Wie heiß und lebendig Rudi gewesen und wie doch ein Fremdes zwischen ihnen beiden geblieben war – wie sie es in jedem Augenblick gespürt und sich angstvoll gefragt hatte: ob dies der Liebe letzte Erfüllung sein könne?

War das Gefühl leise quälender Enttäuschung auch in ihm verborgen unter aller stürmischen Zärtlichkeit? Vor kurzem hatte er sorgend gefragt, warum er keine Nachricht von ihr erhalte, sie an ihr Versprechen gemahnt, es ihm zu sagen, wenn sein Kind geboren sein werde . . .

Er empfand das Werdende also doch als sein Kind.

Und nun begann auch Cornelie mit einer leisen wunderlichen Erwartung zuweilen die Landstraße hinabzusehen, auf der in diesem Sommer so viele Menschen, beladen mit so vielen Schicksalen gekommen und gegangen waren. Nicht nach einer verschnörkelten, goldenen Kutsche mit Pferden, welche nickende Federbüsche auf den Köpfen trugen, schaute sie aus – nur nach einem kräftigen Wanderer in einer braunen Lodenjoppe, der durch die feuchte Herbstdämmerung auf sie zugeschritten käme . . . Sie hatte Rudi geschrieben, daß sie seine Gegenwart nicht wünsche. Es wäre ihr unerträglich gewesen, seine ästhetisch verwöhnten Augen über ihre entstellte Gestalt gleiten zu sehen. Sie fragte sich zuweilen, welches Wunder einer tiefen Herzensvereinigung – oder welcher Stumpfsinn alltäglicher Gewohnheit dieses Peinliche zwischen Eheleuten vernichte? Einmal – als sie jung war, hatte sie anders darüber empfunden – das wußte sie. Und ihre frische, junge, ungebrochene Empfindung war besser, reiner, natürlicher gewesen, als diese Scheu und Scham, die sie nun vor dem Manne fühlte, dessen Kind sie unter dem Herzen trug.

Wenn nun aber doch das Wunder geschehen sollte?

Wenn sein Herz, dessen Bewegung sie in seinen letzten Briefen zu spüren gemeint hatte, ihn unwiderstehlich zu ihr triebe . . . ?

Konnte die Geburt ihres – seines Kindes auch zu einer Neugeburt, zu einer verklärten Auferstehung ihrer gestorbenen Liebe werden? Das Annerle trat dem Fräulein Cornelie ihr Zimmer ab. Es war größer und besaß einen Ofen, in dem geheizt werden konnte. Aber das Kanapee mußte mit hinüber – Cornelie war sein altfränkisch-muffiger Geruch allmählich lieb und vertraut geworden. In dem zweiten Bett sollte die rote Bärbe schlafen und des Nachts ihr Kindlein hüten. Frau Uffenbacher erbot sich zwar dienstfertig, bei dem Fräulein zu wachen, doch wurde dieser Vorschlag von Cornelie mit dem Hinweis auf ihre nächtlichen Hebammenpflichten im Dorfe freundlichst abgelehnt. Sie hatte auch das Annerle gefragt, ob sie Cornelie nicht besser „gnädige Frau“ tituliere, doch Annerle hatte ihr entschieden erklärt, die Gnädige wünsche jedes Aufsehen zu vermeiden, sie würde es nie verzeihen, wenn durch einen von ihnen ihr Geheimnis vor der Zeit verraten werde.

Annerle selbst freute sich des wiedergewonnenen schlanken Figürchens und der frischen Beweglichkeit der Glieder. Zwar blieben ihre Sachen vorläufig noch bei der Uffenbacherin stehen, aber sie selbst war bald in Stuttgart beim Herrn Geheimrat, bald in Ilferlingen bei der mütterlichen Frau Bubenberg, bald traf sie da und dort mit dem Hans zusammen, der in Geschäften die Gegend bereiste. Ein keckes Blumenhütchen auf dem blonden Schopf, tauchte sie dazwischen wieder in der Villa Uffenbacher auf, um nach ihrem Bübchen zu sehen, und den Fräuleins von der Welt draußen zu berichten. Ergötzlich erzählte sie, wie sie die dicke Bäckin besucht und ihr den Mund wässerig gemacht habe nach den guten Dingen, die es jetzt in der Villa Uffenbacher zu schmecken gäbe.

Einen Abend hatte sie auch mit der wieder genesenen Lucie und ihrem Baron zusammen verbracht. Lucie habe ihr vertraut, sie habe viel Schmerzen aushalten müssen, aber nun könne sie auch ohne jede Sorge sich ihrer Liebe freuen. „Sie ischt und bleibt der Glücksvogel,“ erklärte Annerle, die Brauen ein wenig hochziehend. „Gelb und dürr ischt sie freilich geworden – ich mein’ fast, der Baron mag sie nimmer so arg gern . . . Der Fritz, sein österreichischer Vetter, ist auch dabei gewesen und hat recht schön getan mit ihr – dazu hat der Baron so eigen gelacht – gefallen hat mir die Geschicht’ einmal nit. Ich bin froh, daß ich einen Buben hab’ – die Mädeles sind arme Hascherln, alle miteinand’.“

„Ich wünsche mir nur ein Mädchen,“ sagte Cornelie leise. „Tausendmal besser leiden, als leiden machen. Mir ist’s, als könnt’ ich einen Jungen gar nicht so recht lieb haben.“

Auch die arme Toni mußte Cornelie noch durch ihre schwere Stunde begleiten. Sie ging mit dem ächzenden Mädchen im Zimmer auf und nieder – sie hielt sie in den Armen, wenn die Schmerzen sie überfielen, und sie wimmernd durch das Dunkel nach der Mutter rief – mit der angstvollen, verzweifelten Kinderstimme – nach der Mutter, die ihre junge Tochter allein das Furchtbare tragen ließ. Sie waren beide zufrieden, daß die Uffenbacherin fest schlief und Toni wehrte immer wieder ab, wenn Cornelie sie rufen wollte. Endlich mußte es doch geschehen, Corneliens Kräfte waren plötzlich zu Ende. Taumelnd, an den Wänden sich entlang tastend, versuchte sie im Dunkel ihr Zimmer zu erreichen, da klingelte die Alte schon der Hanne und schrie nach Badewasser.

Cornelie hörte durch die Wand das dünne Quäkstimmchen des Neugeborenen. Toni bat sie am folgenden Morgen ihre Eltern zu benachrichtigen. Corneliens Augen strömten von Tränen, während ihre Feder über das Papier glitt. Man nannte sie eine Meisterin des Wortes, die an der Menschen Herzen zu rühren verstand – nie noch hatte sie so inbrünstig begehrt, mit dem Worte zu wirken, wie in diesem Brief, in dem sie den fernen Eltern sprach von dem tapferen Ausharren, von dem klagelosen Dulden ihrer Tochter – von der Hochachtung, die sie in allen diesen Monaten vor dem stillen Mädchen bekommen habe – und – sie konnte es nicht lassen – sie mußte die Mutter fragen, ob sie nicht im Geiste empfunden, wie das Kind in seinen Schmerzen so unablässig nach ihr gerufen habe?

Am nächsten Sonntag nachmittag bewegte sich ein seltsames Paar die Bahnhofstraße hinauf, dem Häuschen an der Hügelflanke entgegen. Ähnelte die Frau in der Gestalt einem prächtig aufgegangenen Gugelhupf, so besaß der Mann mehr das Aussehen einer endlos langen schlackerigen Nudel, die man vergessen hatte zu einer Brezel zu formen. Es war die Bäckin, die, angezogen von Annerles Erzählung, eilig an dem Götterleben im Tränenhaus teilnehmen wollte. Aus Vorsicht aber hatte sie dieses Mal den Bäck gleich mitgebracht. Die Uffenbacherin empfing die beiden nicht eben freundlich, Türen krachten und zornige Worte flogen gleich bösen Wurfgeschossen zu dem Ehepaar aus der Ulmer Backstube hinüber. Aber das kümmerte die Dicke und den Dünnen wenig. Wie zwei Blutegel saugten sie sich in der Küche fest, aßen und tranken, was sie erreichen konnten und dachten nicht ans Heimgehen.

Die Uffenbacherin mußte gute Miene zum bösen Spiel machen. War sie doch schon seit Monaten den Metzgern, dem Tischler und Bäcker die Rechnung schuldig, so kam’s am Ende nicht darauf an, wenn diese noch ein wenig länger und größer wurde. Zahlen konnte sie einmal nicht, aber was ging sie die Rechnung beim Metzger von Schopfingen an, wenn sie mit dem Lordmajor und seiner Gemahlin nach England fuhr?

Sie machte der Bäckin den Vorschlag, falls diese glänzende Zukunft sich ihr auftun würde, statt barem Gelde die Anstalt zu übernehmen und weiterzuführen. Das Ehepaar aus der Backstube, dem es auf dem Lande bei den gefüllten Kochtöpfen der Uffenbacherin gar wohl gefiel, schien denn auch nicht übel Lust zu haben, dem Vorschlag näher zu treten.

Zwanzigstes Kapitel

Cornelie war früh zu Bett gegangen, nachdem sie mit der Toni weidlich über die Ankunft der dicken Bäckin und ihres schlackerigen Eheherrn gelacht hatte. Es mochte noch nicht Mitternacht sein, als sie aus dem Schlaf emporfuhr, überfallen von einem jähen Schmerzensanfall, der ihr untrüglich kündete, daß ihre Stunde gekommen sei. Sie erhob sich, warf einige Kleider über und wollte zur Alten gehen, sie zu benachrichtigen, aber ehe sie dies noch auszuführen vermochte, überfiel eine neue Wehe sie mit solcher Gewalt, daß sie die Pein erst austoben lassen mußte, ehe sie die kleine Treppe hinabsteigen konnte. Das war nicht wie bei Annerle und Toni, wo alles langsam und normal begonnen hatte – die gleichsam vorbereitend vom Leichten zum Schlimmeren geführt worden waren, Cornelie meinte schon bei dem zweiten Anfall, ärger könnte das Leiden ja kaum werden.

Aber die Uffenbacherin dachte nicht so.

Unwirsch, weil man sie geweckt hatte, murrte sie: „Das kommt noch ganz anders und vor morgen Abend wird’s einmal nix mit Ihne – deshalb hätten’s mich nit im Schlaf zu störe brauche. Halten’s nur aus – das müssen wir Weiber alle.“

Cornelie begab sich in ihr Zimmer zurück. Schlafen konnte sie doch nicht mehr, also entzündete sie die Lampe, kleidete sich vollends an, und wenn die Anfälle kamen, klammerte sie sich an die Seitenlehne des alten tabaksduftigen Kanapees und zerbiß ihr Taschentuch, um die nebenan schlummernde Toni nicht durch ein Stöhnen zu erschrecken.

Eine Weile erholte sie sich etwas, und vermochte das Hemdchen, das Jäckchen und die Windeln für das Erwartete zu richten. In der Nachtstille steckte sie die winzigen Ärmelchen ineinander, wie sie es einst als Kind die Mutter hatte tun sehen und ein Schauer von Seligkeit rann durch ihren gepeinigten Körper. Plötzlich erinnerte sie sich des Schlafzimmers in ihrem Elternhause, wo die kleinen Geschwister zur Welt gekommen waren – in all dem luxuriösen Behagen, mit dem ihr Vater die Frau, die er liebte, sorgend umgab – und sie sah auf das alte schmutzige Kanapee – auf die dürftige, häßliche und zweideutige Umgebung, in der ihr Kind geboren werden sollte. Da nahm sie jedes einzelne Stück der Kleidung, die sie ihm bereitet hatte, und küßte es mit heißen schmerzverzogenen Lippen, als könne sie es dadurch weihen und heiligen. Und dann kam die Angst der Verlassenheit und der Einsamkeit und riß sie nieder, daß sie den Kopf in die Kissen wühlte, daß sie wimmerte wie ein sterbendes Tier, dem auch niemand hilft auf dieser Gotteserde. Sie hörte unten an der Haustür läuten, sie hörte, daß man die Uffenbacherin ins Dort zu ihrem Amte rief. Die Schulzenfrau erwartete ebenfalls diese Nacht.

Cornelie hob den Kopf. War es denn möglich, daß die Alte fort ging und sie so allein ließ? Ja – sie ging – doch – sie kam herauf, steckte den Kopf in die Tür und sagte eilig: „Wie steht’s denn? Haben’s nur keine Angscht – so schnell geht’s das erschte Mal nit – in zwei Stunden bin ich wieder hier.“

Und dann hörte Cornelie sie die Treppe hinunterstapfen, hörte die Haustür schlagen und war wieder allein. Wie sie sich nach dem Annerle – nach irgend einem teilnehmenden Herzen sehnte! Sie ging umher, rang die Hände und fühlte doch zugleich eine von Sekunde zu Sekunde sich steigernde Spannung, eine Begierde, sich in dieses grausame Leiden hineinzustürzen – sich ihm ganz hinzugeben, bis zur Vernichtung leiden zu dürfen . . . Zuweilen empfand sie, daß die Oktobernacht kalt war, daß, während ihr der Schweiß von der Stirne rann, ihre Hände erstarrten. Sie hüllte sich in ihr Tuch, griff nach einem Buche – sie mußte versuchen, sich zu zerstreuen. Sie versuchte einige Seiten zu lesen – von irgend einem Liebespaar, das sich in Florenz an der unsterblichen Kunst ästhetisch ergötzte . . .

Mit solchen feinen geistreichen Unterhaltungen hatte einst auch ihre Liebe begonnen, bis das Leben brutal und gewaltig die Ästhetik zerschlug, und ihr nun die Glieder auseinanderriß, um neues Leben zu gebären . . .

Sie erinnerte sich, wie sie einst ihren Bruder zu ihrer Mutter hatte sagen hören: „Wie kannst du nur wünschen, daß Cornelie heiratet – siehst du nicht, daß sie viel zu zart ist, um je ein Kind haben zu können . . . “

Ob dies der Tod war, der in ihrem armen Leibe wütete – ? Nun – so würde sie ihm widerstehen!

Sie erhob sich, sie stand in der dunklen Nacht ihm Auge in Auge gegenüber, die Hände geballt, jede Muskel gespannt – jede Kraft der Seele und des Willens hell wach – zu äußerstem Kampfe gerichtet . . .

Sie wollte ihr Kind nicht allein lassen! Sie wollte es küssen und an ihrem Herzen halten – sie wollte leben – leben – leben!

Die Stunden der langen Nacht schlichen dahin, als vermöchten sie kein Ende zu nehmen. Die Alte kehrte noch immer nicht zurück. Und wieder sank Cornelie zusammen und war nur noch ein wimmerndes Geschöpf, das mühsam seine Leiden trägt.

Gegen Morgen tappte es vom Boden herunter: im grauen Dämmern des Oktobertages kam die Bäckin an Cornelies Tür vorüber.

Ein leiser jammernder Ruf erreichte ihr Ohr. Sie trat ein: „Ja, Fräulein, ischt denn gar niemand hier?!“

Das Antlitz tränenüberströmt, klammerte das Mädchen hilfesuchend die Arme an den Hals der guten dicken Bäckin, die sie aufs Lager geleitete, ihr die Kleider löste, und die Hanne nach der Hebamme sandte.

Und die Qualen stiegen – stiegen – stiegen – bis alles in ihr und um sie nur noch wie eine wirbelnde Hölle war. Ein fremder Mann erschien neben ihrem Bett, sprach mit dem Dr. Schwärzle und sagte, er werde am Abend wiederkommen. Am Abend – ? würde es da noch nicht vorüber sein? Sie wollte nicht mehr leben – sie flehte nur noch, daß man sie töten möge – daß man doch Barmherzigkeit haben und ein Ende machen möge!

Die Uffenbacherin hatte alle wilden Zukunftswünsche vergessen, fragte nicht mehr nach Mittag- und Veschperbrot, stand wie ein Soldat in der Schlacht, tapfer, geduldig und brav. In einem Augenblicke helleren Bewußtseins sah Cornelie den kleinen Dr. Schwärzle an ihrem Bette und es war ihr als habe sie ihn dort immerfort gesehen, seit der Dämmerung des Morgens, unermüdlich in den Versuchen, ihr Erleichterung zu verschaffen.

„Lieber Doktor, gehen Sie, ruhen Sie, stärken Sie sich,“ flüsterte sie ihm zu.

Er schüttelte den Kopf. „Mein einziges Kind liegt heute auch in den Wehen,“ sagte er und hatte die Augen voll Tränen. „Heut’ früh bekam ich ein Telegramm von ihrem Manne. Sie ist noch so jung . . . “

Cornelie preßte heftig seine Hand.

Und dann waren Stunden, wo sie überhaupt nichts mehr von sich und ihrer Umgebung wußte. Plötzlich hörte sie einen Angstruf, der nicht aus ihrem Munde kam: „Herr Doktor, Erbarmen, sie verliert den Verstand . . . “

Und eine fremde Stimme sagte: „Jetzt ist es Zeit.“

Etwas wurde über ihr Gesicht gelegt, sie atmete einen süßlichen, fremden Duft – murmelte Zahlen – und sank erlöst in ein tiefes Dunkel, wie in die göttliche Ruhe der Vernichtung.

Nach einer langen Weile tauchten aus dem Dunkel Stimmen auf, die klangen wie hinter vielen schwarzen Schleiern, welche den Schall bis zu einem fernen Murmeln dämpften. Sie hatte die Empfindung, daß sie die Augen öffnen möchte und es doch nicht könnte.

Und aus diesem Dunkel, aus diesem Murmeln und Bewegen um sie her, löste sich eine Stimme, die sagte heller und lauter, dicht an ihrem Ohr: „Es ischt ein Mädele! Fräulein Cornelie, ein Mädele ischt’s!“

„Ein Mädele . . . ?“ wiederholte sie lallend, zufrieden. Und die Dunkelheit legte sich aufs neue über sie. Endlich – es mochte eine geraume Zeit vergangen sein, da war es ihr, als spüre sie ein beizendes Brennen an ihren Augenlidern und einen süßen zarten Rosenduft. Sie atmete ein paarmal – er war immer da, der süße zarte Duft. Und nun schlug sie die Augenlider weit auf und blickte um sich. Ihr Geist war hell, klar und ruhig. Sie fühlte keine Schmerzen mehr.

Im Zimmer, an der niedern Decke schwelten graue Rauchwolken, die aus dem Ofen quollen. Eine Lampe brannte. Der fremde Arzt, ein eleganter Herr in einem langen schwarzen Rock, befestigte sich die Manschetten mit goldnen Knöpfen. Der kleine Dr. Schwärzle stand mit hochaufgestreiften Hemdärmeln, eine blaue Schürze der Frau Uffenbacher war sonderbar um seinen Hals gebunden, er wusch sich in der Waschschüssel etwas rotes von den Armen. Und auf den weißen Dielen sah Cornelie einen roten trägen Strom langsam gegen den Ofen zu schleichen. Eine alte Frau mit entzündeten Augen in dem hexenhaften Gesicht tauchte einen Scheuerlappen in den roten Strom und wand ihn dann in einem Eimer aus. Konnte das Blut sein? Ihr eigenes Blut?

Sie blickte an sich nieder, reine Linnentücher umhüllten sie, man hatte sie sauber gebettet, auf ihrer Brust lag eine voll erblühte Rose.

Und nun befiel sie ein jäher, fürchterlicher Schrecken. Dort hinten standen die Uffenbacherin und die Bäckin – und weiter sah sie nichts.

Da – in der abendlichen Stille drang ein Ton zu ihr – der energische Schrei eines neuen Lebens . . .

Man brachte ihr das Kind – in ein weißes Tuch war es gehüllt; kraftvoll, rot, mit derben Fäustchen lag es in ihrem Arm und schrie, daß man das Zünglein in dem Mündchen zittern sah.

„Es lebt – es ist gesund,“ murmelte Cornelie, noch wie in einem unwirklichen Traume befangen.

„Neun Pfund wiegt’s,“ rief die alte Hebamme befriedigt. „Alle Achtung. Das hätt’ dem Fräulein wohl keins zugetraut.“

„Meinen Glückwunsch,“ sagte auch der fremde Arzt.

„Der Doktor Schwärzle hat heut’ sein Meisterstück vollbracht. Eine Leistung, die unseren ersten Professoren zur Ehre gereichen würde.

Die Kollegen schüttelten sich die Hände. „Nun muß ich schauen, ob zuhaus’ eine Nachricht eingetroffen ist,“ sagte der alte Landarzt mit einem zuversichtlichen Lachen. Das rosenrote Kindlein rührte sich in Corneliens Arm, spreizte die Finger, blinzelte mit den Äuglein, machte ein verdrießliches Gesicht und begann zu schlafen. Cornelie lächelte still in sich hinein. Ein unendlicher Friede war in ihrer Seele.

Einundzwanzigstes Kapitel

Immer wenn ein Mensch stirbt, oder wenn ein Mensch geboren wird, gibt es dabei so viel Geschäftigkeit, ein Hin und Her von Sorgen und Unruhe, daß der, dem das Leid oder auch das neue Glück gegeben wurde, nicht alsobald zum Bewußtsein dessen, was ihm geschehen ist, gelangt. So war es auch Cornelien noch wie etwas sonder Fernes, Fremdes, das gleich wieder verschwinden müsse, als sie in der Morgenfrühe aus tiefem, erquickendem Schlaf erwachend, die Bärbe mit hängenden roten Zöpfen leise im Zimmer herumhantieren fand, und diese ihr dann das Kindchen brachte.

„Mein’s – Bärbe – es ist mein’s,“ sagte sie nachdenklich und verwundert sich in dem Anblick des rosenroten Gesichtchens verlierend und die Hand liebkosend um das feste runde Köpfchen legend, – das feste Köpfchen, das die Ursache ihrer großen Schmerzen gewesen war.

Von der heiligen Ruhe, die sonst um das Lager junger Mütter sorglich erhalten wird, sollte Cornelie zunächst so wenig empfinden wie Annerle und Toni.

Zwar trat kein kluger Onkel mit dem Anerbieten vorteilhafter Transaktionen an ihr Bett, noch war sie genötigt, wie die arme Toni, das grausame Leiden einer andern in nächster Nähe mit anzuhören und mit durchzufühlen. Es waren nur Briefe – ein ganzer Stoß Briefe, den Frau Uffenbacher ihr mit der Morgenmilch brachte. Cornelie las sie einen nach dem andern und wandte sich dann zur Bärbe, die sich eben bereit machte, heimzukehren.

„Bärbe, Sie haben mir versprochen, aufzupassen, daß mein Kindle nicht in demselben Wasser gebadet wird mit dem schmutzigen Versuchskind,“ sagte Cornelie. „Und außerdem müssen Sie mir jetzt Papier und Bleistift bringen.“

„Fräulein Cornelie,“ rief die Bärbe und legte vor Schrecken gleich das Kleine der Mutter aufs Deckbett, „Sie wolle doch nit gar schreibe? Das leid’ ich einmal nit . . . “

„Das müssen Sie schon leiden, Bärbe,“ sagte Cornelie und wandte den Kopf mit einem Ausdruck von humoristischer Verzweiflung nach der rotzöpfigen Frau, „es muß geschehen! Alle wollen sie mich plötzlich hier besuchen – meine Mutter und meine Cousine und meine Freundin und der Vater meines Kindes . . . Alle miteinander, die sich hassen, wie Menschen sich hassen können, und vor denen ich mich fürchte, wie sich nur ein Mensch fürchten kann, sie werden jetzt hier an meinem Bette zusammentreffen . . . “

„Jesus, Marie!“ sagte die Bärbe und bekreuzte sich, „das gibt eine Geschicht’!“

„Wenn sie kommen, müssen Sie auf den Bahnhof gehen, Bärbe, und ihnen sagen, die Cornelie Reimann, die sie gekannt hätten, wäre gestorben und schon längst begraben . . . Es ist ja auch die Wahrheit . . . “ fügte sie nachdenklich hinzu. „Aber zuerst will ich versuchen, sie alle fernzuhalten. Richten Sie mich ein wenig auf, denn mir ist, als könnte ich das allein nicht fertig bringen.“

Die Bärbe tat kopfschüttelnd, wie ihr geheißen. Und dann stand sie neben dem Bett und schaute mit einer Art von abergläubischer Furcht, als sei sie Zeuge einer übernatürlichen Handlung, wie Cornelie Bogen auf Bogen mit eilig hingeworfenen Schriftzügen bedeckte.

„Herrschaft,“ sagte sie staunend, „muß das Fräulein einen Kopf haben – ich besinn’ mich acht Tag’, wann ich einen Brief zu schreiben hab’ – und dann ischt’s mir noch das ärgst’ auf der Welt.“

Cornelie war sonderbar hell und frei und leicht zu Sinne – was sie alle diesen verschiedenen Menschen sagen wollte, floß ihr auf das Papier, ohne daß sie auch nur einen Augenblick nachzudenken gehabt hätte – Herz und Geist waren erfüllt von einem Jubel, einem Triumphgefühl ohnegleichen! Ihr war zu Mut, als wäre sie befreit von aller Erdenschwere, einem beschwingten göttlichen Wesen gleich, dessen friedevolle Seligkeit keine irdische Schwierigkeit mehr zu trüben vermag.

Bärbe begab sich zu ihrer Tagesarbeit und das Kleine wurde neben die Mutter aufs Kissen gelegt. Und dann blieb sie ganz allein.

Das Dunkel war nun gewichen und alles Grauen war von ihr genommen. Ein schimmernder Herbstsonnenschein glitt durch das kleine Fenster in das niedere Zimmer und füllte es mit einem milden Licht. Neben ihr duftete die Rose, die Annerle gleich nach ihrem Eintreffen der noch Bewußtlosen auf die Brust gelegt hatte – und dicht, dicht neben ihrem lauschenden Antlitz fühlte sie den leisen Atem des kleinen Wesens, dessen Regung sie noch vor wenigen Stunden unter ihrem Herzen gespürt hatte. Sie berührte seine warme, seidenzarte Wange mit ihren Lippen, sie sog den süßen Duft nach Milch und Blumen ein, der den Neugebornen anhaftet und der einer Mutter Sinne inniger berauscht als die Wohlgerüche aller Sonnenländer.

Sie träumte zurück in ihre frühe Jugend und lebte wieder die Stunde, da sie zum erstenmal ein Patenkind im Arm über die Taufe gehalten und sich nach der heiligen Handlung von den Gästen hinweggeschlichen hatte, als sie durchschüttelt von namenlosem Begehren und von dem Ahnen der wartenden Leiden schluchzend auf ihr Bett gefallen war . . . Zwanzig Jahre hatte die Sehnsucht, immer wach und nimmer müde jede Nacht an ihrem Lager gestanden und mit heißen Händen an ihr Herz gerührt. Zwanzig Jahre hatte dies heilig glühende Herz sich bezwungen im strengen Tempeldienst der Kunst. Und nun kam die Erfüllung . . .

– – Unbegreiflich schien es Cornelie, daß Mädchen und Frauen zu Müttern wurden im gegebenen alltäglichen Verlauf der Dinge. Nein: in Trümmer das bisherige Dasein – zerscheitert alle Vergangenheit – verbrannt alle Schiffe – so war es recht – so mußte es sein! So stieg aus den grauen Salzwogen öder Schmerzen das grüne Eiland ihrer Mutterschaft der Geretteten selig empor.

Zweiundzwanzigstes Kapitel

In der folgenden Nacht erwachte Cornelie mit einem seltsamen Unbehagen aus dem Schlafe. Sie lag eine Weile offenen Auges auf den Kissen, da fühlte sie etwas wie einen kleinen, eiskalten Wassertropfen am Rückgrat niederrieseln. Es wiederholte sich – die Kälte kroch ihr durch alle Glieder – leise begannen ihre Zähne zu knirschen, bis sie unwiderstehlich klappernd aufeinander schlugen – bis die Finger sich krümmten und alle Glieder wie geschüttelt von unheimlicher Gewalt ihr im Froste bebten.

Eine Weile danach löste sich der Krampf, nun kam die Glut des Fiebers – und sie wußte, was ein Fieber jetzt für sie zu bedeuten hatte.

Aus den Schatten der Dunkelheit kroch aufs neue das Entsetzen und hob sein Haupt und kam ihr näher und näher, legte die harte Hand umklammernd auf ihr zuckendes Herz und flüsterte ihr höhnend ins Ohr: „Da siehst du es nun, was es heiß, sich gerettet glauben . . . Ich bleibe bei dir – du verstehst mich so gut – ich will noch manche Stunde an deinem Lager sitzen, bis du die allerletzten Schrecken leiden wirst . . . Mache dich nur gefaßt – was bis jetzt geschah, war nur ein Vorgeschmack gegen alles, was nun kommen wird . . . “

Der Spezialist aus Stuttgart und der kleine Dr. Schwärzle standen wieder an Corneliens Lager und berieten und gaben ihre Verordnungen. Die Wöchnerin tat einige Fragen, welche den Ärzten zeigten, daß hier eine gebildete Frau klar und sicher ihren Zustand überblickte. Sie bat um schonungslose Wahrheit. Man erklärte ihr, daß die Gefahr einer Blutvergiftung allerdings bestehe – ebenso stark aber sei die Aussicht, sie durch die gewissenhafteste Befolgung aller Vorschriften abzuwenden.

Cornelie dachte an den Mangel der notwendigsten Sauberkeit in diesem armen Häuschen, wie im Hirne seiner Eigentümerin, und ein hoffnungslos-schwermütiger Zug flog über ihr Gesicht. Der fremde Arzt beobachtete sie: „Ja – wenn Sie nicht den Willen haben, gesund zu werden . . . Der Wille gehört dazu! Drei Wochen – wie ich Ihnen schon sagte – strenge auf dem Rücken liegen – keine unvorsichtige Bewegung – wenn Sie das aber nicht durchführen wollen . . . “

Cornelies Augen leuchteten zu dem Manne empor.

„Lieber Doktor – und wenn mir befohlen würde, jeden Tag vier Stunden auf einem glühenden Rost zu liegen, ich würde es gehorsam tun, um zu leben und gesund zu werden!“

Er drückte ihr warm die Hand.

Der Dr. Schwärzle und Cornelie wurden gute Freunde in dieser Zeit. Manche halbe Stunde verplauderte er an ihrem Lager. Sie nahm herzlich teil an seinen Großvaterfreuden und ihn fesselte das fremde Leben mit seinen starken Erschütterungen, das sich allmählich vor ihm enthüllte.

„Dagegen kommt einem nun so eine Existenz von einem schwäbischen Landarzt freilich arg schlicht vor,“ sagte er einmal mit seinem guten, humorvollen Lächeln. Cornelie antwortete ernst: „Seien Sie zufrieden, lieber Doktor – in solchem einfachen, arbeitsvollen Leben wie das Ihre, verbirgt sich unseres Volkes sicherste Kraft.“

Das Fieber, das sie noch immer spürte, das aber bald nicht mehr zu heftigen Ausbrüchen kam, störte sie nicht allzu sehr. Sie hatte nun wieder die gewisse Zuversicht, ihr Dasein werde nicht wie eine sinnlose Zufälligkeit enden, sondern seiner Erfüllung entgegen reisen.

Nach Verlauf einer Woche konnte der Stuttgarter Frauenarzt die Versicherung des Dr. Schwärzle wiederholen, daß die Gefahr so gut wie überstanden sei. Cornelie begann heiter zu lächeln, wenn Dr. Schwärzle sie trotzdem fort und fort zur Vorsicht mahnte.

Mit täglich neuem Entzücken genoß sie die Befreiung von dem Drucke hoffnungsloser Schwermut, der viele Monate auf ihrer Seele gelegen hatte. Ihr Denken war klar, bestimmt und sicher – tausend Einfälle strömten auf sie ein – Bilder drängten sich in reicher Fülle in ihrer Phantasie, es war ein Opfer, daß sie jetzt auf geistige Arbeit verzichten mußte. Und dennoch war es freudige Erntezeit. Der Frau Uffenbacher mußten wohl einige Zweifel über die Geschichte in dem grünen Heft aufgestiegen sein – am Ende hatten die Nachbarinnen nicht die genügende Zuversicht in ihre glänzenden Aussichten als Kindsfrau in London bei dem Lordmajor und seiner Gemahlin bewiesen. Auch kränkte es ihr leicht verletztes Ehrgefühl, daß Cornelie, ohne sie im mindesten um Rat zu fragen, ihre weitere Behandlung dem Dr. Schwärzle anvertraut hatte. Sie zog sich grollend zurück, betrat das Zimmer der Wöchnerin nur zu den notwendigsten Obliegenheiten und kümmerte sich wenig darum, ob das Kleine auch die genügende Menge Nahrung erhielt. Aber dafür hatte das rosenrote Fräulein schon in seinen ersten Lebenstagen einen ergebenen Freund gefunden, der sich mit Eifer seinem Dienste widmete. Das war der Bäck – der lange, schlackelige Ehegemahl der dicken Bäckin. Er sorgte, daß die Milch rechtzeitig geholt wurde, und trabte nötigenfalls selbst mit dem Töpfchen auf den Gutshof – er stand am Brunnen mit der Milchflasche und spülte, bis sie blitzte und blinkte. Wenn das in appetitliche weiße Jäckchen und gestickte Kissen gehüllte Dämchen nach dem Bade unten in der Wohnstube in einem Waschkorb zu schlafen pflegte, saß der arme, alte Quartalssäufer neben ihm, murmelte unverständliche Begeisterungsworte und starrte verzaubert in das süße Gesicht und auf die feinen Fingerchen. Cornelie jedoch meinte, sobald das holde Geschöpfchen aus dem Bereich ihrer Augen entschwunden war, das Lager oft wirklich als glühenden Rost zu spüren, auf dem sie selbst sich gelobt hatte, geduldig auszuharren. Nachdem Toni sich wieder regen konnte, schlüpfte sie herüber zu Cornelie, pflegte sie und diente ihr und der Kleinen mit der stillen, treuen Ausdauer, die so charakteristisch für das unhübsche Mädchen war. Strahlend vor Glück hatte sie Cornelie die Sachen vom Schwesterle gezeigt, die die Mama ihr für das Xaverle gesandt hatte. Und der Papa versprach ihr beim letzten Besuch, Weihnachten dürfe sie heim kommen und man wolle ihr verzeihen. Cornelie spürte, wieviel tiefer das junge Geschöpf noch im Boden des Elternhauses wurzelte, als in der neuen Mutterschaft, die ihr kaum andere als unheimliche Gefühle wecken konnte.

Ihr Vater hatte sich nicht überwinden können, das Kind zu sehen. Jeden Abend besuchte Toni es bei der Frau Lebzelter, aber sie war schnell wieder oben bei Cornelien, wo sie dann eilig, wie von einer traurigen Pflicht befreit, das fremde, kleine Mädchen in die Arme nahm, es wiegte und mit ihm schön tat.

Cornelie verstand die arme Toni. Der Xaver war ein unerfreuliches Wesen, grünbleich von Farbe, mit zurückfliehender Stirn, tiefliegenden Augen und großen, abstehenden Ohren – es war, als habe das Verbrechen, das ihn gezeugt, ihm seinen Makel auf die Stirn gedrückt. Die Frau Lebzelter hatte manche Not mit ihm, er vertrug die Kuhmilch nicht und wimmerte fortwährend. Toni, der der strotzende Busen mit der üppigen Nahrung brannte und schmerzte, sagte geduldig: „Der Papa hat veboten, daß ich ihn anlege – damit das mütterliche Gefühl nit kommt.“

Und dennoch kam es dem jungen, gepeinigten Geschöpf – es brach auf wie eine gewaltsam zurückgehaltene Blüte und wendete all seine süße Glut dem anderen, dem fremden Kindlein zu. Cornelie überfiel oft eine tiefe Rührung, wenn sie sah, mit welchen weichen, sicheren Bewegungen der Liebe Toni die kleine Gerda tränkte, wie sie jede Veränderung ihres Äußern, jedes Zeichen der Entwicklung mit ebenso scharfen Augen bemerkte, wie die eigene Mutter. Folgten ihre Blicke dem in der Wochenstube freundlich waltenden Mädchen, dann ging es ihr durch den Sinn: Wie geborgen ein Mann sein möchte, der sie zur Hüterin seines Hauses machen wollte. Eine Gefallene – sie würde es immer den Eltern bleiben, trotz der Verzeihung – sie, welche in Demut und Geduld gereift war zu einem gütigen Begreifen alles Menschlichen . . . Und Cornelie dachte an sich selbst . . . Auch sie würde bis zu einem gewissen Grade den Menschen immer unheimlich sein.

Hatte sich ihr Charakter, ihre Gemütsart irgendwie zum Bösen verändert, dadurch, daß sie ein Kind bekam, ohne eine Ehefrau zu sein?

Ihr Denken war reicher, ihre Erfahrungen tiefer, ihr Empfinden voller und reiner geworden in diesen Monaten der Erwartung, sie empfand es mit dem tiefen Glück, mit dem jeder starke Mensch sich wachsen fühlt. Nun legte das Bewußtsein der gewonnenen Kraft ihr eine Verpflichtung auf, der sie sich nicht mehr zu entziehen dachte. Nicht in die Einsamkeit galt es zu fliehen. Nein – dort, gerade dort, wo man sie früher gekannt, wo sie früher gelebt und gewirkt hatte, dort wollte sie mit ihrem Kinde weiter leben, arbeiten und wirken. Zeugnis mußte sie ablegen für sich und für die anderen, denen sie sich durch unzerreißbare Bande verbunden fühlte. Zwingen mußte sie die Menschen zur Achtung vor dem selbsterwählten Lebenslos, zu einer Anerkennung, die auch ihren verfolgten Schwestern zu gute kommen sollte.

Dreiundzwanzigstes Kapitel

Am nächsten Sonntag saß Frau Dr. Schwärzle, klein und freundlich, wie ihr Mann, an Cornelies Bett. Der Doktor hatte ihren Besuch angekündigt, und sie war nun gekommen, in ihrer schwarzen, mit Perlen benähten Mantille und in dem schwarzen Spitzenhütchen, feierlich, wie sie zur Kommunion ging und zur Visite bei der Frau Gräfin, um Cornelie im Tränenhaus ihren Glückwunsch auszusprechen. Zwischen den beiden Frauen lag rosenrot und prächtig gleich der von Säften und Kräften strotzenden Knospe der hundertblätterigen Sommerrose die kleine Gerda und wurde nach Gebühren geprüft und bewundert. Dann ging es an ein zutrauliches Schwatzen zwischen der Großmutter und der Mutter, die an einem Tage zu ihren neuen Würden und Ehren gelangt waren. Die Herzen öffneten sich weit gegeneinander und einten sich in dem stillen Verstehen, das in solchen Stunden heimlich von Frau zu Frau geht. Jetzt war Cornelie nicht mehr die Ausgeschlossene, die sehnsüchtige Beobachterin – sie war nun aufgenommen als ein Glied in der Kette derer, die zu Hüterinnen der Zukunft berufen sind.

„Ich hatte Sie mir ganz anders vorgestellt,“ sagte die Frau Doktor endlich, und legte ihre harte Arbeitshand auf Cornelies blasse, blutlose Finger. „Mein Mann hat Sie lieb gewonnen und verehrt Sie. Sie haben ihm so viel Geistiges, Schönes gegeben in dieser Zeit – dafür wollte ich Ihnen danken . . . Aber nun habe ich Sie selber lieb! Und ich wünsche, daß es Ihnen noch sehr gut gehen möge im Leben!“

Cornelie blickte ihr bewegt in das klare Gesicht. Der Besuch war ihr wie eine freudige Verheißung für die Zukunft. Über wieviele steinige Wälle von Vorurteilen mußten die Menschen hinfort steigen, um zu ihr zu gelangen. Aber würde sie es nicht gut haben? Die Gleichgültigen und die Feigen, die würden schon draußen bleiben hinter den Wällen – und wer bis zu ihr kam, den durfte sie mit frohem Herzen als einen Freund begrüßen. Die Nachtlampe warf hinter einem Bande von Nietzsches Philosophie, den Bärbe sorgfältig als Schirm davor gebaut hatte, ihren friedlichen gelben Lichtkreis auf die Spiritusmaschine und die Milchfläschchen. Bärbes Atemzüge gemahnten Cornelie an das stille Sausen, mit dem der Sommerwind durch ein Weizenfeld fährt. Und wie im warmen Nest ein junges Vöglein sich rührt, bewegte es sich ab und zu ganz sacht im Innern des Kinderwagens. Cornelie lag wachend und lauschte mit einem Erzittern von Glückseligkeit den süßen Tönen. Sie träumte von dem Wunder, das dort neben ihr in dunkler Nachtstille wuchs und sich bildete – wie schon der kleine, ein wenig unförmige Rosenklos der ersten Tage sich gewandelt hatte zu den feinen Zügen eines schönen Kinderantlitzes – wie schon die Augen eine bestimmtere Farbe erhielten, und einen Blick, der auf die Dinge umher zu schauen begann, wie die selten zart und sicher gezeichneten Brauen über diesen Augen dieselbe Ausdrucksfähigkeit, dasselbe feine Spiel sensitiver Nerven verrieten, wie es dem Vater eigen war. Diese sensiblen Brauen in dem aus absonderlichen Gegensätzen zusammengefügten Männergesicht hatte sie stets am meisten geliebt – sie waren ihr am festesten in der Erinnerung geblieben . . . Nun würde er bald kommen und mit ihr auf das Antlitz des Kindes niedersehen, das ihnen beiden gehörte – das aus ihren beiden Naturen gebildet, Züge aus beider Wesensart verschmolzen zu einem Neuen durchs Leben tragen mußte. Wie würde das Wiedersehen sich gestalten? Wie würde sie gegen ihn empfinden? Würde der Haß neu aufflammen – war er mit dem Blute, das sie für ihr Kind vergossen, wie etwas Totes, Ausgelebtes von ihr abgestoßen und endgültig entfernt? Konnte der Mann ihr ein Fremder – ein Gleichgültiger geworden sein vor dem Antlitz des Kindes, das seine Leidenschaft gezeugt, das ihre Liebe in Zärtlichkeit und Wonne empfangen hatte – ?

Sie wußte nichts – sie kannte sich kaum noch – sie mußte nur warten, wie alles sich gestalten würde. Sie ahnte nur, daß ihr Wille nichts galt in diesem Spiel um ihre und ihres Kindes Zukunft, und gleich unvermögend mochte auch des Mannes Wille sich erweisen . . . Unberechenbare, aus unergründeten Tiefen jäh empordringende Gewalten bestimmten am Ende alles . . . Sie versuchte sich ein Leben an seiner Seite vorzustellen und ihre Phantasie versagte. Auch früher schon hatte ihr das niemals gelingen wollen. Nun hatte sie so lange, schwere Monate allein in der innigsten Gemeinschaft mit dem werdenden Geschöpfchen und ferne von ihm gelebt . . . Nein – er war ihr nur noch eine Schattengestalt – etwas Wesenloses, das an ihres Daseins Grenzen gespenstisch ihren Frieden bedräuete. Nicht mehr . . . War es unklug, daß sie ihm erlaubte, zu kommen und das Kind zu sehen? Ein alter Respekt vor dem Recht das Vaters auf sein Kind, von dem sie sich nicht zu befreien vermochte – vielleicht tiefer noch: eine Achtung der Rechte des Kindes an seinen Vater . . .

Das war nun die erste Stufe hinaus zum neuen Leben, aus dem Zwischenland, darin sie in dämmernden Träumen gefangen gelegen . . . Leicht würde die hohe steile Treppe hinauf zum Licht des Tages ihr nicht werden. Der Atem würde ihr beim Steigen wohl manchesmal ausbleiben. Und ihre Gedanken wandten sich von dem Manne – gingen alle Wege, die gegangen werden mußten, prüften alle Stationen, wo Marterkreuze standen, und alte Freunde mit Steinen in den aufgehobenen Händen . . . Sie wollte sich durch nichts überraschen lassen. Es hatte ihr immer unbegreiflich armselig geschienen, wenn Menschen nicht den Konsequenzen ihrer Handlungen gegenüber zu treten wagten . . .

„Fräulein Cornelie,“ flüsterte die furchtsame Stimme der Bärbe aus den Kissen des Bettes an der gegenüberliegenden Wand, „sind Sie wach?“

„Ja, Bärbe – schon lange . . . “

„Fräulein Cornelie, mich graust es gerad’ . . . “

„Warum graust es Sie denn, Bärbe?“

„Höre Sie nit? Es ischt ein Mäusle im Zimmer!“

„Ja – das ist nichts neues. Schlafen Sie nur weiter. Das Mäusle frißt Sie nicht – Sie große, dicke, furchtsame Bärbe!“

„Fräulein Cornelie – ’s ischt in der Lade vom Kommödle . . . Ich mein’ als gerad’, es knuspert an dem dicke Buch, wo Sie geschriebe habe . . . “

„Bärbe!“ schrie Cornelie, plötzlich hell wach, „springen Sie, und holen mir mein Buch heraus! Es ist die Arbeit eines Jahres, wie konnte ich sie nur so ganz vergessen!“

„Ha, Fräulein Cornelie,“ stöhnte die Bärbe, „das tu’ ich einmal nit! Ich kann kei Mäusle sehen, seit mich als Kind eins bissen hat!“

Die starkknochige Frau kam langsam unter dem Federbett hervor. Unschlüssig stand sie im Hemd mit den hängenden roten Zöpfen im unsichern Licht des Nachtlämpchens. Cornelie sah, wie sie vor Angst zu zittern begann und sich am Bettpfosten hielt. Das Mäuslein knasperte und raschelte mit den Papierblättern. „Der Seelenzustand des modernen Kulturweibes“ schien ihm gerad’ recht zu einem Nest für seine junge Brut.

Cornelie fühlte das wilde Klopfen ihres Herzens.

Plötzlich wußte sie wieder, was dieses Werk ihr bedeutete. Die Bärbe aber barmte: „Fräulein Cornelie, ich kann’s nit über mich bringe . . . Ich mein’ gerad’, mich müßt’ der Schlag treffen oder ich krieget die Krämpf’ . . . “

Da war Cornelie aus ihrem Bett heraus, und mit ein paar Sätzen an ihrer Kommode. Sie riß die Lade auf, riß ihr Manuskript heraus – die Maus entfloh mit einem sonderbaren Pfiff – und Cornelie lag wieder in ihren Decken, die Arbeit unter dem Kopfkissen geborgen.

„Ja – Fräulein Cornelie, könne Sie aber springe . . . der Herr Dr. Schwärzle hat doch gesagt, Sie dürfet sich nit rühre . . . “ rief die Bärbe bewundernd.

„Das hat er freilich gesagt,“ antwortete Cornelie lachend. „Aber wenn doch meinem Kind Gefahr droht! Das Buch ist auch so eine Art von Kind, Bärbe.“

Die Bärbe kam zögernd und noch immer furchtsam nach dem Kommödle schielend, an Corneliens Bett.

„Ja, sein Sie mir nur nit bös’, Fräulein Cornelie,“ bat sie treuherzig. „Schau’n Sie – es hat ein jedes etwas, wovor’s ihm halt graust!“

„Meine gute Bärbe,“ sagte Cornelie, „ich bin auch nicht böse. Es hat ein jedes etwas, wovor’s ihm halt graust.“

Sie streckte die Glieder und dachte lächelnd im Einschlafen: „Nur eine Maus . . . “

Vierundzwanzigstes Kapitel

Annerle, die einmal wieder für einige Tage bei der Frau Uffenbacher eingekehrt war, weil sie nicht so recht wußte, wo sie sich sonst aufhalten sollte, war im Verein mit der Toni beschäftigt, das Zimmer des Fräulein Cornelie wohnlich herzurichten. Die Mädchen wußten: heute erwartete das Fräulein Cornelie Besuch und konnten sich nicht genug tun im Putzen, Abstäuben und Ordnen. Über das tabakduftige Kanapee ergoß das Annerle ihr ganzes Veilchenparfüm, so daß eine neue Nuance in der Geruchssymphonie entstand, welche seine zerschlissenen Polster umspielte. Auf Tisch und Kommode prangten rot und blau und gelb die letzten Herbstblumen aus den bunten Vorgärtchen der Witwen in der unteren Dorfstraße. Die kleinen Fenster waren weit geöffnet, als sei es mit einem Male wieder Frühling geworden – so linde floß der Sonnenschein ins Zimmer, so warm spielten die Luftwellen um Cornelies Stirne. Noch immer war sie durch den strengen Befehl des Dr. Schwärzle ans Lager gebannt – sie wußte selbst nicht so recht, warum, denn sie fühlte sich frisch und wohl.

Und sie hatte sich auch geschmückt, in einem wunderlichen Stolz und Selbstbewußtsein – sie wollte keinen mitleiderweckenden Eindruck hervorrufen.

„Ha,“ rief das Annerle, „jetzt hol’ ich aber einen Spiegel, jetzt müssen Sie schauen, Fräulein Cornelie, ’s ischt gerad’ zum Staunen!“

Cornelie blickte in das Glas und war verblüfft über das in den zartesten Farben schimmernde Gesicht mit den dunkel leuchtenden Augen, das, umrahmt von einem feinen, alten, spitzenbesetzten Schleiertuch, wie ein ihr fremdes, unbegreifliches Bild auf den weißen Kissen ruhte.

Die Mädchen gaben ihr die kleine Gerda in die Arme, Annerle küßte sie hingerissen und flüsterte ihr ins Ohr: „Am End’ gibt’s doch noch eine Hochzeit!“

Cornelie schüttelte lächelnd den Kopf. Sie war über sich selbst verwundert – wie froh und leicht ihr zu Sinne war. Das schöne Kind an ihrer Brust war ihre Rechtfertigung – ihre Mutterschaft war wie ein goldenes Gitter um sie her.

Rudi Imgart kniete vor ihrem Bett, sein Kopf lag an ihrer Schulter, sie hatte den Arm um seinen Hals gelegt und küßte ihn auf das kurze blonde Haar. Ein Strom von mütterlicher Liebe ergoß sich aus ihrem Herzen, überflutete den Mann, löschte alle Vergangenheit, erlöste sie von jedem Haß, von jeder Kälte . . .

Sie tauschten leise zarte Worte, wie Menschen tun, die sich hüten müssen, Wunden zu berühren. Aber Cornelie wurde fröhlich und sicher, während sie ihm das Kind zeigte und von ihm zu sprechen begann. Um sie her war es wie draußen in der Natur: ein linder, fast unheimlich süßer, warmer Sonnenschein, eine milde Frühlingsluft – in der man doch den Hauch von welkenden Blumen, von moderndem Laube spürt – den herben Duft des Herbstes . . . Es war ein sanftes Staunen zwischen ihnen, daß es so schön war, wieder beisammen zu sein, und ein zitterndes Bangen, daß es ja doch nicht bleiben könne und inneres Danken, weil sie sich diese friedvoll goldene Stunde gegenseitig schenken durften. Und dann wollte er Abschied nehmen.

Da stieg es wie ein letzter Schrei der Sehnsucht aus ihrem Herzen: „Bleibe noch bei mir – gehe noch nicht!“

Aber ihre Lippen flüsterten es nur leise und scheu und sie sah auch gleich, daß ein Schatten, eine Unruhe über sein Gesicht flog.

„Sieh’ – was soll ich bei dir – du bist noch krank – du kannst mir jetzt nichts sein . . . “

Ihre Augenlider schlossen sich für die Dauer einer Sekunde.

„Gewiß – du mußt wohl gehen,“ sagte sie freundlich.

„Ich werde auch erwartet, du weißt . . . “

„Ja-ja . . . “

Er küßte sie sacht. „Du bist mir nicht böse? Später – nicht wahr?“

Sie antwortete nicht, der Blick ihrer Augen ging an ihm vorüber und senkte sich auf das Kind an ihrer Seite. Cornelie wußte nun, daß sie allein bleiben mußte. Und es war gut so.

Der Frau Uffenbacher zerrann ein lockender Zukunftstraum, als sie den Mann in der Lodenjoppe, den zerbeulten Filz auf dem kurz geschorenen Kopf, mit dem rüstigen Schritte des Wanderers, der nach fernen Zielen strebt, die Straße zum Bahnhof hinabgehen sah. Das war nun und nimmer der Lordmajor von London und niemals würde sie in der goldenen Kutsche durch die jubelnde Menge fahren. Aus Rache über die Enttäuschung steckte sie am nächsten Morgen die kleine Gerda mit dem dicken Ziehkind und dem Säugling der Luis in ein Badewasser. Nach einer Woche rüstete sich Cornelie zur Abreise. Das Annerle gestand ihr, daß der Hans am Tage von Corneliens Entbindung im Tränenhaus gewesen und ihr Stöhnen gehört habe. Nun sei er mit einem Male bereit, dem Annerle eine Filiale einzurichten.

„Und für den Buben macht er’s notariell – wenn einmal sein Vater gestorben ist,“ fügte sie hinzu. Cornelie fragte, ob Annerle nicht ihre Kinder zu sich nehmen könne, wenn sie einmal selbständig geworden sei. Aber das Annerle meinte, das dürfe sie den Alten nicht antun.

„Wenn der Kommerzienrat nit wüßt’, daß ich mehr vom Geschäft versteh’ als die andern Mädles miteinand’, würd’ er’s eh’ nit erlauben, daß ich eine Filial’ krieg’. Jetzt kann ich doch für meine Kinder schaffen und bring’ auch dem Hansel einen Nutzen.“

So sah Cornelie die beiden guten Kinder, die ihr zumeist lieb geworden waren, auf dem Wege zu sicherem, tüchtigen Leben. Cornelie umarmte sie innig und mit heißen Tränen hingen die Mädchen ihr am Hals, als es zum Scheiden ging.

Einsam war sie gekommen, nun gab eine Schar seltsamer Freunde ihr das Geleit. Die Uffenbacherin, das kleine Fräulein würdevoll auf den Armen tragend, ging mit manchem guten Ratschlag und schier gerührt über die Feierlichkeit dieses Abschiedes an ihrer Seite. Es fehlte nicht der Bäck und seine Bäckin; die Hanne mit dem Versuchskind, das Annerle, die Toni und die Luis, die rote Bärbe, die Cornelie heim begleiten sollte und ihre Freundin, die Fischerin. – Es traten auch der kleine Dr. Schwärzle und seine freundliche Frau mit Blumen und Abschiedsgrüßen vor ihre Haustür. Fast wie ein Taufzug anzuschauen wandelte die lange Reihe Leut’ die Landstraße zum Bahnhof hinab – die Landstraße, auf der Cornelie im Laufe dieses Sommers so viele Menschen mit so vielen Schicksalen beladen, hatte kommen und gehen sehen; vorüber an den Häuschen der Witwen mit den Vorgärten, darin im blassen Novembersonnenschein die Kinderwagen standen. Hinter ihr blieb das Tränenhaus, das sich seines sommerlichen Blütenschmuckes entkleidet, als die armselige, baufällige Hütte, die es in Wirklichkeit war, unter dem knorrigen Gerippte des alten Birnbaumes an die Hügelflanke schmiegte. Cornelie schaute zurück und umfaßte es mit einem langen, zärtlichen Blick.

Hier hatte ihr Glück die Augen zum Lichte geöffnet – hier hatte ihr Kind zum ersten Male gelächelt.

Vor dem Bahnzug stehend, nahm sie das kleine Mädchen aus den Armen der Uffenbacherin entgegen und drückte es mutvoll und freudig an ihr Herz. Wieder umfaßte ihre Hand liebkosend sein festes, rundes Köpfchen, das ihr fast das Leben gekostet hatte, und dabei dachte die Mutter: Gott erhalte dir deinen harten Schädel und einen harten Willen geb’ er dir dazu, denn beides kann ein Weib gebrauchen.

<script id="nf-text" type="text/plain">Erstes Kapitel

Das kleine Haus lag in einer freundlichen Wiesengegend Württembergs. Oben auf dem höchsten Punkt des lang hingestreckten Hügels hob ein graues Grafenschloß seine Dächer über das Grün der Parkbäume, die Dorfstraße mit den Bauernhöfen zog sich über den Rücken der Erdhebung. Unten, wo der helle junge Fluß durch Weidengebüsch und über weiße Kiesel plätscherte, gab es noch eine zweite Straße. Hier wohnten nur arme Weiblein in bescheidenen Hütten, mit winzigen, blumenreichen Vorgärten.

Das kleine Haus aber lag ganz allein und abseits von den beiden Dorfstraßen, am linken Abhang des Hügels, in seine Flanke gleichsam verschüchtert hineingedrückt. Der Weg, der vom Dorf zu ihm hinunter führte, war steil und steinicht, voller Löcher und Pfützen. Rechts und links neben den Schlehdornhecken wuchs ein Gestrüpp von Brennnesseln. Alles zeigte, daß niemand ein Interesse daran nahm, den Pfad in gangbarem Zustande zu erhalten. Er führte ja auch nur zu einem Gehöft notorisch verkommener armer Leute, und weiter zu dem kleinen Häuschen, von dem die Frauen im Dorf mit einem gewissen halblauten Ton der Scheu redeten, und die Männer mit einem zweideutigen Grinsen.

Freundlich genug schaute es aus unter dem großen blühenden Birnbaum, durch den die Bienen summten. Helle Gardinen hingen vor allen Fenstern, und seine stattliche Eigentümerin stand meistens würdevoll vor ihrer Türe, irgend etwas Gutes zwischen ihren großen weißen Zähnen behaglich kauend, während die kleine Schar ihrer Gäste um sie her auf der Schwelle oder auf der Bank an der Hauswand zu hocken pflegte, gähnend, träumend oder schwatzend, wie es sich eben fügen mochte.

Die Gäste waren das Bedenkliche in diesem kleinen Hause, von dessen Türe man unendlich weit ins Land schauen konnte, über das heitere Flüßchen hinweg, bis zu den duftigen Umrissen der Schweizeralpen fern am wolkigen Horizont, und das doch trotz dieser weiten und freien Aussicht so schüchtern sich hinter der Hügelflanke versteckte.

Scheue und stille Gäste waren es, die das kleine Häuschen beherbergte. Meistens trafen sie in der Dämmerung bei der stattlichen Frau Uffenbacher ein. Ein trübes Geheimnis umgab sie, die blassen Mädchen mit unförmigen Gestalten, die zu zweien und dreien in den einsamen Feldwegen spazieren gingen, bis sie eines Tages wieder verschwunden waren. Nach solchem Verschwinden tauchte in der unteren Straße bei den armen Witwen in einem der bunten Vorgärtchen ein neuer Kinderwagen auf, und der scheue Gast ließ dem Dorf einen munter krähenden Erdenbürger als Pfand seines Besuches zurück.

Frau Uffenbacher aber zählte zufrieden einige Goldstücke
 und schloß sie in ihre Kommode. Sie hatte kürzlich, um mit der Neuzeit fortzuschreiten und ihrer Anstalt einen höheren Aufschwung zu verleihen, Inserate in verschiedenen großen Blättern erscheinen lassen. Es waren auch Prospekte gedruckt worden. Gebildeten Damen höherer Stände, welche sich für eine Zeitlang von der Welt zurückzuziehen wünschten, waren darin alle Vorteile, die ein mehrmonatlicher Aufenthalt in dem gastlichen Hause von Frau Uffenbacher bot, mit unwiderstehlicher Liebenswürdigkeit auseinandergesetzt worden.

Frau Uffenbacher suchte einen dieser Prospekte aus der Schublade ihres Wohnzimmertisches hervor, wo sich zwischen Brotrinden und Wurstschalen, Haarnadeln und sehr fettigen Spielkarten ein Fläschchen Tinte, ein Löschblatt und ein Federhalter befanden. Sie setzte ihre gewichtige Brille auf, und rief die zur Zeit bei ihr weilenden jungen Mädchen, das Annerle von Pfaffenhofen, die Schweizer-Mari und die bayerische Toni herbei, sowie ihre Magd, die Hanne, die ein dickes rotes Ziehkind auf ihren dicken roten Armen schaukelte. Ohne diese Hilfe wäre es Frau Ursula Uffenbacher nicht möglich gewesen, einen so bedeutungsvollen Brief zu schreiben, wie es jetzt geschehen mußte. Sie legte sich feierlich einen Papierbogen auf dem Löschblatt zurecht, rückte ihn rechts und rückte ihn links, leckte die Feder, putzte die Brille, schaute darüber hinweg auf das Annerle von Pfaffenhofen, ein molliges blondes Fräulein, das schmunzelnd in dem Prospekte las, und fragte etwas unsicher: »Sag', Annerle, meinscht, die
 Anfrag' ischt von einem Herrn? Ja, soll ich da adressieren: Sehr geehrter Herr oder sehr geehrtes Fräulein? Eine bessere Herrschaft ischt's jedenfalls – da müßt ihr euch schon zusammennehme, das sag' ich euch, ihr Baggasch!«

»Zeigen Sie den Brief her, Frau Uffenbacher!«

Cornelies Anfrage, die sie auf das in der Zeitung gefundene Inserat hin an Frau Uffenbacher gerichtet hatte, ging von Hand zu Hand und erregte eine lebhafte Meinungsverschiedenheit.

»So sachgemäß fragt nur ein Herr – und zwar ein Geschäftsmann,« erklärte Annerle, »ich kenn' mich da aus! Und die Handschrift – ja – und doch, wenn ich's recht bedenk' ...«

Die Schweizer-Mari meinte bedächtig: »Das hat gewiß einen lieben Herrn, der sich um sie kümmert ...«

»Am End' ihr Vater!« überlegte Annerle. »Wisset's – so nach allem fragen – nach dem Bad und so – das tut schon kein Liebhaber – macht mir nix weiß ...«

»Am End' die Mutter!«

»Ach geh' – kennst die Mütter! – Was tun denn die, als weine und schimpfe! Die kümmern sich doch den Teifi drum, was ihre Kinder gut täte in dere Zeit ... Ja, die verheirateten Töchter – die werde gepflegt und gehegt – aber mir arme Luder ... Ha!«

Das Annerle schwang sich auf die Tischkante, baumelte mit ihren Füßen, die in grauen Filzpantoffeln steckten, und las den Brief noch einmal aufmerksam von Anfang
 bis zu Ende durch. Ihre hellen und klugen, etwas hervorstehenden Augen bekamen dabei einen gesammelten Ausdruck von Nachdenklichkeit. »Ich mein' doch, es ischt eine Frau,« sagte sie dann bestimmt. »Vielleicht eine Verheiratete. Eine Dame. Mädeles paßt auf! Das wird interessant!«

»Die macht doch kehrt, wann's die Räuberhöhlen hier sieht!« bemerkte die bayerische Toni. Hanne puffte sie sofort in die Seite und murrte: »Ihr tut auch gerad', als wär't ihr anders gewöhnt!«

»Sind wir auch!« entgegnete Annerle scharf, während die Toni den Kopf wandte und schwieg.

»Für eure sechzig Mark, dafür ischt's lange gut,« schimpfte Frau Uffenbacher. »Soll ich euch Schneegäns' eine extra Wurscht brate? Ich möcht' mir mehr bezahlen lassen von der hier!«

»Ja, Frau Uffenbacher, da müßten Sie aber auch mehr geben ...«

»Mehr gebe – mein' ich geb' mehr als genug! Ein Brot und ein Backsteinkäs – anders gibt's Sommer und Winter nit bei der Frau Wurzler in Ulm, und die hatte die feinschten Fräuleins. Was wird dann die Neue viel sein? Wird auch nur ...«

Sie brauchte einen sehr derben und volkstümlichen Ausdruck, die gute Frau Uffenbacher. Die Mädchen quiekten ein bißchen aus Schadenfreude und vor Vergnügen an der Unanständigkeit.

Und dann wurde unter der energischen Beihilfe des
 klugen Annerle, die von Beruf Buchhalterin in einem Warenhause war, die Antwort an die rätselhafte und aufregende Persönlichkeit verfaßt.

»Vergesse Sie nit ›Diskretion Ehrensache‹. Das verlange die Leut'!« rief Annerle zum Schluß, »Ehrensach' mit einem ›H‹«. Sie baumelte vergnügt mit den grauen Filzpantoffeln. Hier unter all den Frauenspersonen – warum sollte man sich's nicht bequem machen?

»Ich werd' als wissen, wie ›Ehrensach‹ geschrieben wird,« sagte Frau Uffenbacher würdig, zeichnete ihren Namen und schob die Antwort, nebst einem der verheißungsvollen Prospekte in den Umschlag. Drauf lehnte sie sich im Stuhl zurück, strich befriedigt mit beiden Händen über ihre gestärkte weiße Schürze, und blickte triumphierend im Kreise umher. »Nu wolle wir veschpern.« Sie nahm Cornelies Brief aus Tonis Hand und legte ihn in die Tischlade, wo ihre diskrete Korrespondenz bei Brotresten und Wurstschalen, Bindfaden, Haarnadeln und den sehr fettigen Spielkarten ihren Platz fand.

Einige Tage später traf Cornelie Reimann in Schopfingen ein. Der verheißungsvolle Prospekt hatte seine Wirkung getan. Sie ging in ihrem langen, sandfarbenen Mantel den Weg vom Bahnhof, vorüber an den kleinen Häuschen der Witwen, in deren Vorgärten je ein bis zwei Kinderwagen standen. Wo die Hütten zu Ende waren, fragte sie eine knochige rothaarige Frau mit einem freundlichen Gesicht nach der Besitzung von Frau Uffenbacher.
 Ihre Stimme war leise und tonlos. Die Frau blickte sie erstaunt an und sah dann schüchtern zur Seite, während sie Auskunft gab. Eine zweite Frau gesellte sich zu ihr. »Ja – will denn die zur Uffenbacherin – das ischt doch eine Dam'?« fragte die andere, und die Rothaarige schüttelte bestürzt den Kopf.

»Am End' für ein Verwandtes?« »Nein, schau – sie ist in der Hoffnung.«

»Ja, ja – schon – – Das sind Geschichte! Da wird die Uffenbacherin sich arg wichtig tun! Gel' sie kommt schon und verzählt! Sie kann doch nichts bei sich behalte! Wirst schon alles höre, Fischerin!«

»Da schau ich heut' abend noch bei dir ein!« flüsterte die Freundin, und die Rothaarige lachte über den Eifer der anderen.

»Komm, Lisle, geh' her, hole ein Brot zur Veschper. Und bring' ein Bier mit!«

Das zierliche Kind hüpfte mit dem Krug davon und hatte die langsam schreitende Cornelie bald überholt. Cornelie sah die reizend gebildeten nackten Füßchen der Kleinen mit den feinen Gelenken vor sich her über den Staub der Dorfstraße tanzen und freute sich der Schönheit ihres leichten Ganges.

»War das deine Mutter?« fragte sie freundlich das Kind. Es schüttelte den Kopf. »Meine Ziehmutter,« sagte es verlegen, am Schürzenzipfel drehend.

»So – deine Ziehmutter,« wiederholte Cornelie. Sie
 sprach nicht weiter, die Kleine lief davon. Corneliens Schritte wurden müder und müder.

Nur Ruhe finden ...

Nur einen Winkel, der außerhalb, ganz außerhalb ihrer eigenen Welt lag – zu dem gar keine Fäden mehr hinüberführten. Wie dieser Winkel beschaffen sein mochte, war gleichgültig.

Ein warmer Nachmittagssonnenschein wob um die windschiefe Hütte der Uffenbacherin einen feinen Märchenduft, und Tausende von Bienen, die durch die Zweige des blühenden Birnbaumes aus- und einschwärmten, summten friedlich sommerliche Melodien. Eine »Anstalt« in irgendeinem Sinne von modern hygienischem Komfort war dies nun freilich nicht, aber Cornelie war es lieber so. Die Uffenbacherin in ihrer breiten mütterlichen Würde einer »weisen Frau« des Dorfes mißfiel ihr nicht, das Bett des kleinen Zimmers war gut und sauber. So wurde sie schnell mit ihr handelseinig und beschloß, den Sommer über zu bleiben und ihre Stunde hier zu erwarten. Die Mahlzeiten wollte sie auf ihrem Zimmer nehmen. Ein oder das andere Fräulein, das vielleicht im Laufe der Zeit noch einkehren würde oder jetzt schon hier war, – o nur bessere Damen, dafür garantierte Frau Uffenbacher – ja, von denen würde die gnädige Frau nicht das mindeste zu sehen bekommen. Denn ...

Gewiß – das machte Cornelie zur Hauptbedingung, sie durfte in keinerlei Beziehung zu diesen anderen Damen
 gebracht werden, sie mußte ganz einsam für sich leben können.

»Aber das ischt ja selbstverständlich,« beteuerte die Uffenbacherin treuherzig. »Sehen Sie, gnädige Frau, die Damen sind ja alle auf Dischkretion angewiese, wie sollte denn eine solche Anstalt bestehe, wenn sie nicht auf Dischkretion gebaut wäre – und überhaupt mein Beruf – eine Hebamm' – da könnte ich ja Geschichte erzähle – da erfährt man ja die Geheimnisse von ganze Familie! Schau'n Sie, da ischt jetzt so ein junges Fräulein bei mir« – sie hob die Hand an den Mund, ihr breites Gesicht erglänzte vor Wichtigkeit, sie senkte die Stimme: »Der Vater besucht sie jeden Sonntag – niemand darf ihn sehen! Der Mann verliert seine Stellung, wenn was verlautet! – Das Ding war siebzehn Jahr – gnädige Frau – da geschehen Verbrechen, wenn man davon reden dürfte ...«

»Also, dann lassen Sie meinen Koffer holen,« sagte Cornelie ungeduldig.

»Darf ich Ihnen auch die Laube zeige? Der Schloßpark steht den Damen gleichfalls zur Verfügung, die Herrschafte sind nie anwesend.«

Frau Uffenbacher schritt Cornelie voran, das Treppchen hinunter über den kleinen Flur, rechts aus der Tür guckten blonde und braune neugierige Köpfe. Cornelie ging abgewendeten Hauptes vorüber. Sie fragte sich, ob sie dies werde ertragen können? Aber war nicht schließlich alles gleich unerträglich?

Einige Augenblicke später sah sie vor sich ein Bild, das
 sie seltsam bewegte. Die Laube auf dem Hügel, eine Bretterhütte mit schrägem Dach, von jener einfachen Form, wie altdeutsche Darstellungen aus der Heiligen Schrift sie zeigen, war erfüllt von goldenem Abendlicht. Auf der Wiese, die sie umgab, standen blaue und weiße Blumen auf schlanken Stengeln, die von den schrägfallenden Sonnenstrahlen zu einer unirdischen, gläsernen Schönheit verklärt wurden. In dem goldenen Duft saß ein junges Weib von einer holden Lieblichkeit der Erscheinung. Ihre schmalen und bleichen Hände lagen ihr müde im Schoß, ihre braunen, durchsichtigen Augen blickten durch Tränen über die frühlingsblühende Weite in ein Tal von Schmerzen, das nur ihrem Blicke sichtbar wurde. Und über ihr, am blauen Himmel, unter den schneeglänzenden, goldumsäumten Sommerwölkchen flog gemächlichen Flügelschlages ein großer schwarz-weißer Storch.

»Der hält sich immer hier in der Näh',« sagte Frau Uffenbacher mit einem fröhlichen Stolz. »Die Freilen füttern ihn. Er gehört ja auch zu uns.«

»Wer ist das Mädchen?« fragte Cornelie leise.

»Das ischt die Rose von Ulm. Hat letzte Woche entbunden. Morgen geht sie heim. Das Kind ischt vor einer Stunde geholt.«

Cornelie stürzten die Tränen aus den Augen.

»Ja freilich,« sprach Frau Uffenbacherin in einem strengen Ton. »'s ischt so – ich sag's alleweil: Ein Wochenbett ischt kein Brautbett! Das bedenkt so ein Mädle nit vorher. Ei – Rösle, muscht nit heule! Kanscht
 doch jede Woche herüber und das Kleine sehen! Gut hat's das Ding bei der Frau Lebzelter – sauber – da ischt nichts zu sage! Der Herr Papa wird ja doch einmal nachschauen! Na ja ... Denket Sie an die Freilein Toni – das ischt ein Elend ... Ihne wollte doch die Eltern von Eurem Herrn was gebe fürs Kindle ...«

»Ja, Frau Uffenbacher,« sagte die Rose von Ulm in einem gereizten Ton, »ich weiß schon – aber ich will ihr Geld nicht – ich will einen Vater für mein Kind!«

Ihr feines Mädchengesicht zog sich zusammen zu der krampfhaften Energie eines Entschlusses, der mit der Wucht einer fixen Idee ihre Zukunft regieren würde: Ich will einen Vater für mein Kind!

Die Rose von Ulm ... Wie sie dort saß im goldenen Licht, im holden Blühen ihrer unschuldsvollen Schönheit, hätte man der jungen Madonna gern den Göttersohn geglaubt – den Jupiter, der aus Himmelshöhen sich zu ihr niedergesenkt hatte. Doch Frau Uffenbacher flüsterte Cornelie ins Ohr: »'s ischt ein Leutenant – die Eltern wollen's nit leide – er soll eine reiche Baas freien, eine Tuchfabrikantenstochter aus Reutlingen.«
