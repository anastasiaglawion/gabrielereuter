Sie nahm sich zusammen, stammelte Entschuldigungen und Versprechungen und fragte schließlich demütig, das Fräulein werde doch ihre Worte nicht wahr machen, sie sei ein armes Weib, und müsse auch hart um ihren Verdienst arbeiten, und neun Kinder habe sie gehabt, die seien ihr alle gestorben, bis auf die paar, die in die Welt gegangen seien und sich nicht mehr um sie kümmerten. Cornelie hörte wenig mehr auf ihr Geschwätz, sondern starrte stumm zusammengefaßt vor sich nieder und wunderte sich, wie sie zu dem Mut gekommen sei, den Kampf mit diesem fürchterlichen Weibe aufzunehmen. Es war ihr unheimlich, daß sie so schnell die erste Schlacht gewonnen hatte. Doch war es wohl nur die erste Schlacht gewesen und weitere mußten folgen.

„Wünschen das gnädige Fräulein, daß ich den Tee herauf bringe?“ fragte die Uffenbacherin. „Der Bäck’ im Dorf hat frischen Zwiebelkuchen, der ischt als sehr gut – die Hanne könnt’ springe und hole.“

Cornelie schüttelte schweigend den Kopf. Aber als Frau Uffenbacher, die sich entlassen sah, die Tür schon erreicht hatte, rief sie ihr nach: „Ich werde von jetzt ab meine Mahlzeiten mit den übrigen jungen Mädchen nehmen.“

Allein geblieben, fiel sie von aller Kraft verlassen auf das Kanapee nieder und lag dort einige Minuten mit dem Gefühl, es sei ihr unmöglich, auch nur die Hand zu ihrer Verteidigung zu heben, wenn jetzt jemand käme und sie schlagen würde. Aber sie wollte nun bleiben und sie wollte den Kampf durchführen.

Cornelie trank in der Laube mit den jungen Mädchen Tee und nahm von den kleinen Kuchen, die Annerle anbot. Dann ging sie in Begleitung der breithüftigen Mari, der armen Toni und des molligen Annerle an Frau Uffenbacher vorüber zur Besichtigung des gräflichen Parkes. Und dies war das einzige Mal, während ihres Aufenthaltes in Schopfingen, daß ihr Fuß die heißumstrittene grüne Schattenwildnis betrat.

Achtes Kapitel

Es kam nun eine stille Zeit. Ein Friede, der dem Annerle schier unheimlich dünkte, herrschte zwischen der Uffenbacherin und ihren Fräuleins. Die Alte bezeigte ihnen demütige Unterwürfigkeit und nur die Hanne erfuhr, wenn Türen und Fenster geschlossen waren, in der Küche die wahre Meinung der Gekränkten.

Die Schweizer-Mari übte sich auf der Wiese im Spiel mit dem dicken Ziehkind des Hauses, das die Fräuleins das Versuchskind nannten, in mütterlichen Handgriffen. Die Toni räumte ihre Kommodenschubladen auf, kaute an einem Landjäger, untersuchte die Gurken im dreieckigen Gärtchen, ob sie noch nicht bald einen Salat geben könnten und erhielt an den Sonntagen den Besuch ihres Vaters, eines protestantischen Lehrers an der Volksschule einer kleinen bayerischen Stadt, den keines der anderen Mädchen jemals erblicken durfte. Das Essen wurde der Toni dann aufs Zimmer gebracht und man hörte ab und zu ein leises Gemurmel. Die Toni schrieb unter der Aufsicht ihres Vaters Postkarten an ihre Freundinnen, die er mitnahm, und auf der Rückreise in Augsburg in den Postkasten warf. Dort in Augsburg lernte Toni offiziell die Wirtschaft. Nach der Abreise ihres Vaters, die jedesmal um fünf Uhr nachmittags erfolgte, hatte Toni rote Augen und ein vom Weinen aufgeschwollenes Gesicht.

Am Sonntag kam auch gewöhnlich die Rose von Ulm, um ihr Kleines bei der Frau Lebzelter in der unteren Dorfstraße zu besuchen. Zuweilen wurde sie von dem Leutnant in Zivil begleitet, dann frühstückten sie beide warm oben im Wirtshaus und die Rose bezahlte. Aber auch an solchen Tagen ließ sie es sich nicht nehmen, bei der Frau Uffenbacher einzuschauen. Eine sonderbare Anhänglichkeit fesselte alle die früheren Gäste an das kleine Tränenhaus, daß sie immer wiederkamen und mit Seufzen und Stöhnen sich in den niederen Stuben umschauten, wo sie ihres jungen Lebens bitterste Schmerzen gelitten hatten. Nur die Mutter des Agathle, das bei der rothaarigen Bärbe in der Pflege war, ließ sich niemals blicken, sondern fragte zuweilen brieflich an, ob die Kleine immer noch lebe, andere Kinder stürben doch, wenn man sie zu einer Ziehmutter gebe. Die Bärbe hatte nun erst recht einen Trotz darauf, das Agathle groß zu bringen, und lief die Nächte durch mit dem Kind auf den Armen im Stübchen auf und nieder, weil es zahnte und unruhig war. Am Tage saß sie an der Maschine und nähte für die Bäuerinnen Kinderwäsche – denn das Kostgeld für die Agath’ hatte die Mutter aus lauter Ärger über den Eigensinn der Bärbe schon lange zu schicken vergessen.

Das Annerle war immer geschäftig, sie führte eine ausgebreitete Korrespondenz, packte und verschnürte zahllose Pakete und empfing andere aus allen Windrichtungen. Es war immer mit ihr ein eifriges und geheimnisvolles Treiben, als sei man acht Tage vor Weihnachten.

Cornelie hatte sich eine Tagesordnung aus Arbeit, Ruhe und Umherschlendern gemacht, die eine angenehme Gleichförmigkeit und dadurch so etwas wie Häuslichkeitsgefühl mit sich brachte. In ihrem Zimmer lagen große Stöße von Büchern; die Empfindung zu haben, jeden Augenblick sich der Gesellschaft auserlesener Geister erfreuen zu können, sollte sie vor der trivialen Melancholie schützen, die ringsumher in der Luft verborgen lauerte. Sie hatte bei den Bestellungen in den Bibliotheken auch ein wenig an ihre Hausgenossinnen gedacht, doch fand sie nur bei Annerle Dank und Begeisterung für geliehene Bücher. Der Toni war von Mutter und Großmutter der Genuß eines Buches höchstens im Verein mit dem Strickstrumpf gestattet worden.

Annerle dagegen stopfte sich mit Liebesgeschichten voll wie mit Kuchen und Zuckerwerk. Der mythische Hans wie der unwahrscheinliche Geheimrat versorgten sie schon reichlich mit solcher Art von Druckerschwärze, die leidenschaftlich Liebende nach schauerlichen Abenteuern endlich zum ersehnten Ziele führt. Rote, grüne und gelbe Bändchen türmten sich auf ihrer Kommode zu fast ebenso hohen Stößen, wie in Corneliens Zimmer kulturhistorische und philosophische Werke. Und das war noch nicht alles, was Annerle an Lektüre verschlang – unter den blau und rosenrot behäkelten Windeln in der Lade verbarg sich noch manches Heftchen, das allerlei wissenswerte Dinge enthielt, die verliebten Mädeln zu gewissen Stunden recht zugute kamen – von denen man aber besser nicht sprach . . .

Am wenigsten zu dem Fräulein Cornelie. Freilich war es auch wieder interessant zu erfahren, was denn so gebildete und ernste Damen von der Liebe lasen . . . Man mußte ja viel überschlagen, weil die Schriftsteller in den Büchern von Fräulein Cornelie so ein langes Wesen von Dingen machten, die gar nicht zur Sache gehörten. Aber manchmal war es doch auch richtig nett unanständig, und dann wieder so schön, daß einem die Tränen kamen. Das Annerle fühlte sich in ihrer Würde mächtig gehoben, wenn sie mit dem Fräulein Cornelie literarische Gespräche führen durfte. Das Fräulein sagte zwar nicht viel, doch lächelte sie zuweilen. Das war jedesmal für Annerle ein Triumph. Sie kramte aus ihren mancherlei Lebenserfahrungen so viel aus, als ihre Erinnerung und ihre Phantasie nur irgend hergab. Und so erreichte sie es mehr als einmal, daß Cornelie nach dem Abendessen eine Weile mit ihr auf dem schmalen Rain über den Haferfeldern, bis zu dem Wäldchen alter Apfelbäume hin- und herwanderte. Cornelie begann gefesselt zu werden von den Erzählungen aus dieser Zwischenwelt, wo das scheinbar Unzusammengehörigste durch ein Gewirr mannigfachster Fäden verbunden wurde. Wie Annerles Sprache eine Mischung aus schwäbischem und bayerischem Dialekt bildete, so war sie auch unaufhörlich unterwegs zwischen Württemberg, Bayern und Baden. Durch ihr langjähriges Verhältnis zu dem Sohn ihres Chefs hatte sie eine sonderbare Art von Vertrauensstellung auch bei dessen Eltern und wurde zu allerlei diplomatischen Missionen unter dem Personal der Filialen des großen Warenhauses verwendet. Sie gehörte gewissermaßen zur Familie und gehörte auch wieder nicht dazu, es war einfach eine Taktfrage, die sie, wie es schien, richtig zu stellen und geschmeidig zu beantworten wußte. Sie zeigte Geschenke von der Mutter ihres Gefährten und seine Brüder schrieben ihr neckische Postkarten. Wo sie nur einige Wochen geweilt hatte, besaß sie gleich eine Unzahl von Freundinnen und Verehrern, wußte sich überall nützlich zu machen und war alsbald durch ein kunstvolles Gewebe von hin- und hergehenden Gefälligkeiten mit den verschiedensten Gesellschaftsschichten verknüpft. „Mei Hansel“ wurde beständig in Atem gehalten durch Besorgungen und Vermittelungen, von denen die wenigsten ihr selbst zugute kamen. Denn so gern sie Geschenke entgegennahm, gleich überlegte sie auch, wem sie mit der eben erhaltenen Gabe nun wieder eine Freude machen könne.

Zum erstenmal lernte Cornelie in der kleinen Buchhalterin eine jener munteren Lebenskünstlerinnen kennen, die ihr in der Historie wohl unter klingenderen Namen, in der Literaturgeschichte zuweilen durch die Schilderung eines verliebten Autors, in ihrer bürgerlichen Mädchenexistenz aber noch nie entgegengetreten waren. Die jungen Fräuleins saßen bei dem schönen warmen Sonnenschein in der Laube und warteten auf das Mittagessen. Annerles Häkelnadel fuhr eilig zwischen grauen Wollmaschen hin und wider. Sie verfertigte ein warmes Tuch für die Mutter ihrer Freundin Lucie, die Frau Fabrikbesitzer Bubenberg in Ilferlingen, die so arg das Reißen in der Schulter hatte. Dabei erzählte sie vom Hansel.

„O Jesses – mei Mädeles, was so ein Mann alles von einem verlangt! Hat sich mei Hansel an einem luschtigen Abend mit einer Kellnerin verscharmiert – betrunken ist er gewesen, – das hat er mir geschwore, und ich glaub’s ihm schon – aber nun denkt’s euch, das Ding kommt in die Hoffnung und mei Hansel weiß sich kein Rat – und das End’ von der Geschicht ischt, ich muß zu dem Mädele hin und muß es tröste und ihm ein Unterkommen schaffe. – Ich hab’ mir die Augen fast aus dem Kopf geheult, dazumal – und der Hansel sagt noch ganz getrost: das tut doch unserer Lieb’ keinen Abbruch . . . Gar schon . . . ! ’s hat ihr auf die letzt’ auch keinen getan, aber ich war halt kreuzunglücklich zu dere Zeit. Seine Ruh’ hat man keine Stund’ mit so ein’m Leichtfuß – ! Aber wie der Herr Tirektor“ – Annerle sagte vor lauter Hochachtung und Wichtigkeit stets „Tirektor“ statt Direktor – „der Herr Tirektor Häberle von Pforzheim, der als die Tapetenfabrik hat, und wann er in Geschäften nach Stuggert kommt, tut er immer in der Konditorei sitzen, wo ich mit meiner Freundin bedient hab’ – als nur so aus Gefälligkeit – wie der mir einen Heiratsantrag gemacht hat – da hab’ ich in mich hineingelacht und hab’ gedacht: Mei Hansel ist doch ein anders goldiger Kerl. Der Herr Tirektor ist ja kein Unebner; nur ein bissel arg dürr!“

„Weischt, Annerle, da muß ich dich gerad’ bewundern, daß du zu dem andern Maidli gange bischt,“ rief die Mari, „nimmer hätt’ ich das gekonnt und wenn ich hätt’ sollen sterben . . . Du bischt halt gar gut!“ . . .

„Die Frau Bubenberg von Ilferlingen hat auch gesagt, es wär’ gegen mei’ Würd’ gewesen,“ sagte das Annerle und reckte sich und ihr Näschen in die Höh’. „Ich hab’ ihr als geantwortet: Mei Würd’ trag’ ich in mir selbst und eine Ehefrau, die ihre Würd’ zu wahre hätt’, die bin ich nit, und will ich auch gar nit sein. Das wär’ mir schon viel zu fad, wenn ich nur als jeden Tag an mei Würd’ zu denken hätt’. – Die Ehefrauen, die habbe gut rede, die wisset nix. Unsereins fühlt’s, wie’s so einem arm’ Ding zu Mut ischt . . . Jesses – und mei Hansel, der hätt’ mich bald auffressen vor Lieb’ und Reumütigkeit . . . Er ist nun schon so, denkt nit weiter als an sein Vergnügen, wenn er luschtig ist, ich mag ihn auch nit anders . . . Ja . . . gnädige Frau – so geht’s zu in dere Welt!“

„Nennen Sie mich nicht immer gnädige Frau,“ sagte Cornelie, „ich bin keine ‚gnädige Frau‘. Ich bin nichts anderes als Sie alle. Nennen Sie mich ruhig Fräulein Cornelie.“

„Cornelie ist ein arg schöner Name und wie geschaffen für die gnä . . . – für das Fräulein.“ Annerle sprach das Fräulein pointiert hochdeutsch aus. „Wir wisset’s doch, daß Sie aus einem andern Holz geschnitten sind als mir, mir haben auch Augen im Kopf . . . “

Cornelie zog die Brauen zusammen. „Bitte nicht . . . “ sagte sie nervös und hob, um die Aufmerksamkeit abzulenken, den Deckel von der Schüssel, die Hanne soeben mit einem Krach auf den Tisch gestellt hatte.

„Ach du lieber Gott, wieder Lunge!“

„Der Satan!“ schimpft Mari, „mir steigt der Ekel schon im Hals herauf.“

Lunge mit saurer Sauß’ war ein Gericht, das, wie Frau Uffenbacher den Damen erklärt hatte, besonders bekömmlich für ihren Zustand sei. Sie erhielt die Lunge, welche die Bauern nicht essen wollten, für ein paar Pfennige vom Metzger, und so setzte sie sie den Fräuleins jede Woche zweimal vor, denn es gab zwei Metzger in Schopfingen. Und hätten diese zwei Metzger jede Woche mehr als zweimal geschlachtet, so hätten sie sie eben viermal vorgesetzt bekommen. Seit Cornelie erklärt hatte, sie wolle mit den andern Mädchen essen, war es zu Ende mit den Koteletts und Beefsteaks. Cornelie fühlte, daß es unmöglich sei, unter diesen Verhältnissen auf eine besondere Kost zu dringen.

So versuchte sie denn, von den großen Würfeln des weichlichen porösen Gewebes in der dicken graulichen Mehltunke einige Bissen herunterzuwürgen. Aber so lange sie lebte, befiel sie hinfort ein unnatürlich heftiger Schauder und Ekel, sobald sie nur irgendwo das Wort Lunge aussprechen hörte. Toni und Mari halfen sich mit Kartoffeln, die sie in Mengen und mit anscheinendem Genuß verzehrten. Die Kartoffeln verursachten Cornelie Magendruck. So verzichtete sie denn an den „Lungentagen“ lieber auf das Mittagsmahl und kaufte sich unten bei der Fischerin ein frischgelegtes Hühnerei. Mehr als eines am Tage bekam sie dort nicht, weil die Gastwirtin die andern nahm, und eine solche Frau nicht verletzt werden durfte.

Der Nachmittagstee war das beste vom Tag. Die Sonne schien auf die hohen dunkelblau blühenden Salbeistauden, auf die rosigen Esparsetteträubchen und die Sternblumen der schönen Wiese. Vom Tal herauf glitzerte zwischen dem grauen Erlengebüsch das muntere Flüßchen und in der Ferne glänzten am Horizont, aus feinem Duft der Ferne tauchend, die Umrisse der Schneealpen. Annerle sorgte, daß der Tee gut und stark war. Sie bezog eine vorzügliche Sorte aus der „Konditorei“, und die unter den Süßigkeiten dort waltende Freundin, wie auch die mütterliche Frau Bubenberg aus Ilferlingen sandten abwechselnd gutes schwäbisches Gebäck. Als die SchweizerMari nach Stuttgart zu Einkäufen fuhr, beauftragte Cornelie sie, auch für ihre Rechnung einen Kuchen zu besorgen, und sie selbst brachte die ersten Kirschen. So lieferte schwesterlich ein jedes, was es eben erreichen konnte, zur Verschönerung der gemeinsamen Feierstunde. Nur die arme Toni vermochte nichts beizusteuern, denn sie besaß weder Geld noch Leckereien in ihrer Schatzkammer. Die Landjäger wurden von den andern verschmäht. Darum lehnte sie auch mit schweigsam-trotziger Zurückhaltung ab, an dem Kuchenmahl teilzunehmen. Cornelie wußte nicht, ob sie gut daran täte, den ein wenig beschränkten doch sicheren bürgerlichen Ehrbegriff, der hier waltete, durch Zureden zu erschüttern. Endlich traf nach einem Besuch des Vaters, dem Toni wohl ihre Pein, sich nicht revanchieren zu könnten, gebeichtet hatte, ein Napfkuchen von der Großmutter ein. Da griff auch Toni wacker zu, und man sah nun an ihrem gierigen Einbeißen, wie viel ihr die Enthaltsamkeit gekostet haben mochte. Als die Mari aus Stuttgart von ihren Einkäufen heimkehrte, trat das breitschulterige Schweizer-Mädel, dunkelrot vor Aufregung, mit einem in Seidenpapier gehüllten Päckchen vor Cornelie. Sie lächelte schüchtern und wurde dabei von Annerle aufmunternd in die Seite gepufft.

„Ich hab’ Ihne auch was mitgebracht, Freile Cornelie,“ kam’s unbeholfen kindlich in den harten Kehllauten ihres kaum verständlichen Schwizerdütsch. „Nehmen Sie’s nicht für ungut – seien’s mir nicht bös – ich dacht’ nur, weil, wenn mein Stündle kommt und ich bald fortgeh, wollt’ ich einer jeden ein klein’s Andenken . . . “

Die Tränen quollen ihr, in der Angst, das Fräulein könne beleidigt sein. Cornelie aber lächelte liebenswürdig und nahm aus ihren Händen eine Mundtasse mit dem Buchstaben „C“ groß und deutlich in blauer Farbe darauf gemalt, entgegen. Sie dankte herzlich, und bewunderte die Tasse nach Gebühr. Annerle rief triumphierend: „Siehscht, die Fräulein Cornelie ischt nit so kleinlich, ich hab’ dir’s gleich gesagt, daß sie sich freuen wird.“

„Gewiß freu’ ich mich,“ rief Cornelie, „und ich werde täglich aus der Tasse trinken, die von der Frau Uffenbacher ist so schwer und grob.“

„Es ischt nur,“ stotterte die erglühende Mari, „weil ich’s nicht mit anschauen konnt’, daß das Freile aus der Tass’ trinken mußt, wo die Frau Uffenbacher des Nachts ihre Zähn’ drin aufbewahrt!“

„O Gott im Himmel!“ rief Cornelie, die Hände vors Gesicht schlagend und Annerle schrie: „Mari, du Schneegans, das hatte’ wir ihr doch nit sage wolle!“

„Ja, mein Heiland, ’s ischt mir so heraus gewutscht,“ beteuerte die Mari und sah so lieb und verstört aus, daß Cornelie über dem Trösten und der Freude an dem prächtigen, treuherzigen Geschöpf den Ekel überwand.

Neuntes Kapitel

Cornelie saß in ihrem Zimmer an dem etwas wackeligen Tisch, den sie ans offene Fenster gerückt hatte, und schrieb: „Modelt die Frau sich nach der Kunst, oder ist die Kunst nur ein sichtbares Symbol für Umwandlungen im Wesen des Weibes?

Ruhevoll unschuldig blühten die heiligen Jungfrauen und die jungfräulichen Mütter der Primitiven, unbewußt der eigenen Lieblichkeit, gleich den Lilien auf dem Felde. Das Weib der Renaissance aber wurde das Weib-Siegerin. Königlich thronte sie auf dem Sessel ihrer Macht und ihre Macht ruhte auf der Begierde des Mannes. Das Wissen hatten die Jahrhunderte ihr verliehen, und es gab ihrem Lächeln einen satten Stolz, ihren Händen die sichere Haltung der Besitzenden. In den Frauen des Rokoko zeigt sich schon der leise Zynismus, der alle Reize seiner Reichtümer durchforscht hat, dem die eigene Macht kein heiliges Geheimnis mehr ist, der leichtfertig zu spötteln beginnt über die Grenzen der königlichen Herrschaft – über ihre Allgewalt und ihre Unzulänglichkeit.

Das kokette Lächeln der gepuderten Reifrockdamen, die ihre wollüstigen Busen zur Schau tragen, wie die Insignien ihres fleischlichen und galanten Königreichs, birgt schon ein wenig Verachtung des Besiegten. In ihren lüstern blickenden Augen dämmert der noch in Scherz verhüllte Schmerz über eine Herrschaft, die ihrem Ende naht, weil das Weib ihrer überdrüssig zu werden beginnt. Welche geheimnisvollen Gesetze treiben sie, den Gebieten ihrer unumschränkten Gewalt so entschlossen den Rücken zu kehren?

Die Frau von heute, wie die Kunst sie in ihrer typischen Wesensart zu erfassen sucht, ist eine Gestalt der Sehnsucht geworden. Sie trauert weder, noch genießt sie – ihre ranken, schlanken Glieder dehnen sich nach etwas Unendlichem; die Linien ihres Profils bedeuten ein Lechzen nach dem Unaussprechlichen, ihre Augen suchen das Übersinnliche hinter den Dingen dieses Staubes . . . Ihre Hände – müde und doch verlangend geöffnet – tasten unsicher nach Kostbarkeiten und Früchten des Wissens, die nur ihren Träumen sichtbar, über ihnen in blauen Lüften zu schweben scheinen – ihre Füße berühren nur noch flüchtig diesen Boden und streben nach unbekannten Fernen, wo in dunklen Tiefen die Erkenntnisse des Lebens ruhen, zu denen bisher nur der Mann den Schlüssel besaß. Genügt der stolzen unzufriedenen Frau unserer Gegenwart noch eine Herrschaft über die Sinne des Mannes, den sie liebt? Einer mystischen Vereinigung der Seelen und der Geister strebt sie, von dunklem Drange getrieben, entgegen. Und doch ahnt sie – eine neue Eva – schon, daß das Kosten von jener lockenden Frucht der Erkenntnis sie für ewig aus dem Paradiese ihrer Jugend und alles selig blinden Glückes vertreiben wird.“

Nachdem Cornelie diese Sätze beendet hatte, hielt sie inne und ruhte ein wenig. Resignierte Wehmut im Erfassen der auch für ihr eigenes Dasein so verhängnisvollen Wahrheit mischte sich mit dem Vergnügen an der Formel, die sie dafür gefunden.

Jetzt hörte sie, zum ersten Male wieder seit manchem Tage, vom Flur herauf ein Geheul und Gekreisch böser Weiberstimmen tönen. In der nächsten Minute wurde ihre Türe aufgerissen, das Annerle stürzte herein, durch Zorn und Weinen zerzaust, rot, geschwollen und fürchterlich entstellt.

„Die Sau!“ schrie sie gellend, „das Weib – das Aas von einem Weib! Die Augen wenn ich ihr auskratzen könnt, dem Satansbraten!“

„Um Gottes willen – Annerle – was ist geschehen – ? Beruhigen Sie sich doch!“

„Beruhigen?“ heulte Annerle, „ob, mei Freile Cornelie, was das Weib mir antan hat, die böse, böse Hex . . . Hab’ ich Ihnen nit gesagt – anonyme Brief’ schreibt’s, das Vieh . . . An meine Leut’ daheim! Und nun wissen’s alle, wie’s um mich steht – und daß ich zum zweitenmal in der Hoffnung bin . . . Oh, mei Jesus . . . Mei Mutter möcht gerad ins Wasser geh’n vor Scham!“

Cornelie starrte sie an, eiskalt vor Schrecken.

„Das hat die Uffenbacher getan . . . “

Annerle trocknete sich mit dem bereits völlig durchweichten Taschentuch das tränentropfende Gesicht.

„In der Konditorei wissets sie’s auch allbereits,“ schluchzte sie. „Oh, mei Fräulein Cornelie, was hat unsereins zu leide.“

„Annerle – sind Sie ganz sicher, daß die Uffenbacher – ? Haben Sie Beweise?“

„Beweise? Ja, wenn doch mei Mutter einen Brief bekommen hat . . . ‚Eine die ’s gut mit Ihne meint‘ hat drunter gestanden – ja – gut meine – das Lügenmensch das! Und die Kellnerin – das Mädele, das eine Bas’ ist von der Uffenbacher ihrer Schwägerin, das hat ’s in Stuggert ’rumbracht, schreibt mei Freundin!“

„Das klingt freilich verdächtig.“

„Fräulein Cornelie, das Weib hat sich rächen wollt’, weil Sie so freundlich mit uns verkehrn, und mit ihr nur so sprechen, wie halt zu ’ner Untergebnen, das bost sie arg – das müssen mir alle Tag’ hören . . . Ich habe dran glaube müssen, ich arm’s Hascherle, an Sie und die Fräulein Toni da wagt sie sich nit! Da hat sie Angscht! O je, o je! Mei arm’s Mutterle, die kann ihre Augen ja nimmer aufschlagen, die kann ja in Pfaffenhofen nimmer auf die Straß’ unter die Leut gehn!“

„Aber Annerle, Ihre Mutter wußte doch vom Ersten, und daß sie das Verhältnis mit Ihrem Hansel haben, da kann sie doch nicht so überrascht worden sein!“

„Ja – aber daß wir halt so saudumm sein würden, das hat sie doch nit denkt,“ gestand das Annerle kleinlaut.

„Wenn sie nur nit in der erschten Rag’ gleich den Brief hätt’ verbrannt! Ich hätt’ kei Ruh’ geben – das Weib hätt’ ich ins Zuchthaus bracht! Das hätt’ ich getan! Bei allem was mir heilig ischt, das hätt’ ich getan,“ schrie Annerle und ihre blauen Augen blitzten rachgierig. „Wenn’s doch wenigschtens nit noch so ausverschämt lügen wollt’ – und von Beleidigung reden – und ich müßt noch heut’ aus dem Haus . . . Auf der Stell’ pack’ ich mei Sach’ und fahr’ zum Herrn Geheimrat nach Stuggert. Der soll die Geschicht wissen, der soll jetzt wissen, wie’s hier steht.“

Sie stürzte, voll dieses neuen Entschlusses, zur Tür hinaus. Cornelie begriff vollständig, daß das Mädchen keine Stunde länger mit Frau Uffenbacher unter einem Dache sein wollte. Es tat ihr leid, sie fühlte einen Schmerz in der Brust, den sie vor zwei Wochen noch nicht für möglich gehalten haben würde. Der Verlust dieses munteren und originellen Mädchens, die ihr so manche öde Stunde vergnüglich verplaudert hatte, kam sie hart an. Doch auch hierin hatte man sich eben zu fügen.

Es war ihr fast unheimlich gewesen, daß sie auf einen Schlag sollte über die Hebamme gesiegt haben. Nun nahm diese ihre Revanche – und sie würde noch manche nehmen für die Stunde der Demütigung, die sie hier vor dem tabaksduftigen Kanapee erlitten hatte . . . Sie waren Feinde, und würden es bleiben, bis die Zeit in diesem Hause durchlitten war – ja vielleicht – wer konnte in die Zukunft sehen – für länger noch – für viel länger . . . Cornelie senkte ihren Kopf tief in der Erkenntnis, daß mit dem Augenblick, da sie zum erstenmal menschliches Glück genossen hatte, sie eingetreten war in den Kreis der Gehetzten, Verfolgten, Verfehmten – preisgegeben jeder Gemeinheit – nichts anderes mehr als eines jener armen, kleinen, mißhandelten Mädchen um sie her. Und vor ihr gähnte ihr Leben als eine von finsteren Dingen erfüllte Tiefe.

Nach einer Weile ging sie hinüber um zu sehen, ob sie Annerle mit Trost und Hilfe beistehen könne. Sie fand das Mädchen nicht, und hörte von Toni, Annerle sei ins Dorf gelaufen, um sich mit der Fischerin und der roten Bärbe zu beraten.

Toni sprach ruhig und verständig zugunsten einer Versöhnung der Streitenden. Die Uffenbacherin versichere, nichts von der Angelegenheit zu wissen. Sie behauptete, daß Annerle das Geschwätz selbst veranlaßte, indem sie vor kurzem erst, wo doch ihr Zustand schon deutlich sichtbar gewesen sei, in Stuttgart mit eben jener Bas der Schwägerin geschwatzt habe. Und woher der Brief komme, das könne doch kein Mensch wissen, wo das Annerle jedwedem auf der Gasse ihre Geheimnisse anzuvertrauen pflege!

Dies war alles richtig. Cornelie wurde wieder ein wenig unsicher, ob man ihrer Hauswirtin mit dem Verdacht nicht am Ende Unrecht tue.

Übrigens deutete die Toni auch noch an, die Frau Uffenbacher habe gesagt, sie könne das Annerle gar nicht fortlasse, denn sie habe „Garantie für sie übernommen“ beim Herrn Geheimrat, der im Auftrage des Herrn Dekans, Annerles Onkel, für ihren Unterhalt bezahle. Der geistliche Herr aber gebe das Geld nur unter der Bedingung, daß Annerle sich still bei der Uffenbacher, und strenge von der Welt zurückgezogen halte! Darum müsse man dem Annerle, wenn man es gut mit ihr meine, auch zureden, ihren Zorn herunter zu schlucken, sonst käme sie in arge Ungelegenheit.

So geschah es denn auch. Annerle packte ihre Sachen nicht, sondern blieb im Tränenhaus. Sie hatte nur zuweilen Weinanfälle oder schleuderte der Uffenbacherin im Vorübergehen vergiftete Bemerkungen zu über Personen, die wegen Absendung anonymer Schmähbriefe zu vielen Jahren Zuchthaus verurteilt waren. Eines Abends fand die Hebamme einen Zeitungsartikel, der sich mit einem solchen Falle beschäftigte, durch Stecknadeln auf dem karrierten Kopfkissen ihres Bettes befestigt. Diese Tat gewährte Annerle eine entschiedene Erleichterung. Seitdem wurde sie ruhiger.

Auch ihre Mutter in Pfaffenhofen schien sich, nachdem sie durch heftige Vorwürfe ihr moralisches Gewissen befriedigt hatte, mit den Tatsachen abzufinden. Schon der nächste Brief beschäftigte sich mit der Frage der Unterbringung des zu erwartenden Enkels. Der Vater habe erklärt, ins Haus nehme er nicht noch ein zweites, aber eine Bas auf dem Lande wollte gern das Kopfgeld verdienen. Und der Bruder, der geistliche Herr, habe gemeint, es sei immer noch besser, die Kinder würden in einer christlich-katholischen Familie erzogen, als seine Nichte heirate einen ungetauften Juden. Seine Schwester möge in Geduld ihr Kreuz tragen. Das wolle sie denn auch, nur möge Annerle dafür sorgen, daß der Hans den Kleinen auch ein Stück Geld verschreibe – haben tue er’s ja dazu! Als Annerle diesen Passus am Teetisch in der Laube vorlas, lächelte sie befriedigt in sich hinein und erklärte: „Ist schon längst geschehen. Vierzigtausend läßt er auf die Kinder schreiben, und wenn’s ein Bub’ ist, macht er’s notariell. Mei Hansel laßt sich nit lumpen!“

Am bittersten blieb ihr die Vorstellung, welchen Eindruck die Nachricht in der ‚Konditorei‘ gemacht haben möge, und daß die Herren, die dort verkehrten, sie nun nicht mehr für ein „braves Mädele“ halten würden! Und sie hatte doch nie von ihnen Trinkgeld genommen, hatte sich mit ihrer Freundin ’s Wort drauf geben . . . Sogar als der Türke, der auf der technischen Hochschul’ studierte, ihr ein Zwanzigmarkstückel in die Hand drücken wollt’, habe sie es abgelehnt: „Mein Herr – eine Kellnerin, die Trinkgeld nimmt, bin ich nicht . . . “

Und nun war ihr guter Ruf doch verloren! Wie würde das den Herrn Tirektor Häberle kränken – arg nah gehen würd’s ihm – er habe gar viel von ihr gehalten und stets gesagt: Da kann man sehen, wie eins luschtig sein kann und doch seine Bravheit bewahren . . . O Jesus Marie!

„Mein gutes Annerle,“ versuchte Cornelie zu trösten, „Sie leben doch schon lange mit Ihrem Hans und wissen, was Sie dafür aufgegeben haben, und daß er es Ihnen auch dankt . . . “

Annerle sah das Fräulein mit großen Augen an. Dann blickte sie nachdenklich und sehnsüchtig seufzend ins Weite. „Schon – schon,“ sagte sie trübselig, „aber man hat doch immer das Verlangen und möcht’ von die Leut’ für ein anständiges Mädele gehalten sein! Mei Freile Cornelie, wenn ich jetzt als nur erfahre möcht’, was der Herr Tirektor Häberle von mir denkt!“

Sie sollte es erfahren und das wurde ein glorreicher Tag für das Annerle von Paffenhofen. Aus der Konditorei kam durch die Post eine runde Schachtel an ihre Adresse, die enthielt eine köstliche, mit bunten Früchten belegte Nußtorte. In weißen Zuckerperlen stand in ihrer Mitte zu lesen: Dem Fräulein Anna in unveränderter Verehrung und Hochschätzung ein entsagender Freund.

Die zwischen den Kuchen waltende Freundin aber schrieb als Kommentar: „Der Herr Tirektor Häberle läßt Dir herzlich Glück wünschen. Er fragte mich, womit er Dir eine Freud’ machen könnt’, da hab’ ich gesagt, in Dei’m Zustand wär’ man als arg auf Süßes. ‚So nehmen wir eine Nußtorte, die hat sie immer am liebsten gegessen,‘ hat er gesagt – ‚aber mit viel Früchten drauf – Sie wissen schon, Fräulein!‘ Und dazu hat er einen tiefen Seufzer getan, und ganz blaß ist er gewesen und hat kein Wort geredt den ganzen Abend.“

Annerle strahlte. „Ein sehr anständiger Mann, der Herr Tirektor Häberle,“ sagte sie in tadellosem Hochdeutsch, was bei ihr stets das höchste Maß der Anerkennung ausdrücken sollte. Sie lud alle Fräuleins zu der Torte ein. Aber der Mari mußte ihr Teil ans Bett gebracht werden, denn aus lauter Aufregung und Teilnahme war sie vier Wochen zu früh niedergekommen und das Kleine war Gott sei Dank gleich gestorben. Sie war dem Annerle recht dankbar für diese Guttat. Annerle selbst war in der Freude, den treuen Verehrer nicht verloren zu haben, so versöhnlich gestimmt, daß sie selbst ihre Feindin, Frau Uffenbacher, zu der kleinen Feier holte und sie reichlich mit Kuchen versorgte. Nur das Mittelstück, das die Widmung trug, behielt sie für sich selbst und knabberte gerührt, mit Tränen in den Augen, an den Zuckerperlen, die so viel Güte und Liebe verrieten.

Cornelie hob ihre Teetasse und rief lachend, mit einem übermütigen Glänzen in ihren grauen Augen: „Der Herr Tirektor soll leben, hoch – hoch und dreimal hoch – !“ Alle stimmten begeistert ein.

Frau Uffenbacher wollte sich erkenntlich erweisen, zog einen Brief aus der Tasche und sagte geheimnisvoll: sie habe eine gute Nachricht für die Damen, vielleicht könne noch eine von ihnen ihr Glück machen. Darauf hakte sie ihre Brille an den Ohren fest und las ein in sonderbar verschnörkeltem Kanzleideutsch abgefaßtes Schreiben, in dem ein Schneidermeister aus Ulm ihr freundlich zu wissen gab, er suche eine Frau und habe keine weiteren Vorurteile, er könne einem Mädchen mit Kind eine gute Versorgung bieten, weil er mit der Absicht umgehe, sein Geschäft auf feinere Tuche auszudehnen und einiger tausend Taler dazu benötige.

Die Frau Uffenbacher schaute sich triumphierend unter ihren Damen um, und sprach: „Das wär’ als eine Gelegenheit, die ich mir nit würd’ entgehen lasse. S’ ischt doch immer besser, so ein Würmle hat sei Vater, wann’s auch ein Sümm’le koschtet – der Schneider ischt ein rechtschaffner Mann – da ischt nix gegen zu sagen . . . “ Sie hielt verwundert inne – Cornelie, die ernsthafte Cornelie, hatte sich gegen die Holzwand der Laube gelehnt, lachte laut und schallend und konnte sich aus ihrer Heiterkeit gar nicht wieder zurechtfinden.

„Ja – die Freile Cornelie ischt als wohl zu vornehm,“ sagte die Uffenbacherin beleidigt. „Aber für die andere Freile wär’s doch vielleicht was! – Nun, ich hab’ als mei Pflicht getan, und mei Auftrag ausgericht! Und so lache wie die Schneegäns’ brauchtet ihr als auch nit, wenn ein rechtschaffner Mann euch ehelichen will.“

„Nein, Frau Uffenbacher, da haben Sie ganz recht,“ sagte Cornelie mit verdächtiger Sanftmut. „Manch’ eine würde Ihnen gewiß herzlich dankbar sein! – Nur – ich glaube – wir drei eignen uns nicht gerade zur Vergrößerung des Tuchgeschäftes mit feinerer Ware!“

„Wenn’s ein Kaufmann wär’, aber ein Schneider . . . “ sagte die arme Toni leise und nachdenklich.

Cornelie wurde hinausgerufen, der Briefträger habe Geld für sie. Und sie trat, die Hand voll Goldstücke, wieder ein. Es war das Honorar für ihren Essay über die Sehnsucht des modernen Weibes. Die andern schielten neidisch und neugierig nach dem Schatz in ihrer Hand. „Dafür könnt’ man gewiß zehn Pfund Kirschen kaufen,“ sagte die arme Toni.

Zehntes Kapitel

Auf den grünen Weiten jauchzte und jubelte die laute Luft der Heuernte. In Schwaden sank die Blumenpracht, die das hügelige Gelände in tausend bunte, zarte Farben gehüllt hatte, unter den ruhigen, gleichförmigen Hieben der Sensen, deren Dengeln seit vielen Abenden die Stille mit kurzen, scharfen, einförmige Klängen erfüllte. Die Luft war schwül von den betäubenden Düften der sterbenden Blüten, des dorrenden Grases – müde und schwer schritten im Dämmern der Nacht die schweißtriefenden, braungebrannten Schnitter heim, die Sensen wie blitzende Todeswaffen aufgeschultert, den Wetzstein im Lederbeutel am Gürtel hängend. Aber auf den hochgetürmten Wagen, die mit Gerassel und Geklirr ins Dorf einfuhren, kreischten und lachten die rotglühenden Mädchen unter ihren weißen Kopftüchern, wenn die Fäuste der Burschen durchs Heu faßten und sie in die Waden kniffen.

Cornelie kam vom Kirchhof, der von einer grauen Feldsteinmauer umgeben, auf windverwehter Höhe jenseits des Dorfes lag. Ihr hatte sehr davor gebangt, die Geburt eines Menschen zum ersten Male in dichtester Nähe mitzuerleben – mit zu durchfühlen . . . Während sie einige Einkäufe in Stuttgart machte, war dann alles schon abgetan gewesen, sie hatte die Mari friedlich und erlöst im Bett gefunden und das Kleine war ohne weitere Zeremonien auf der Grenzscheide zwischen geweihter Erde und ordinärem Feldrain, wo die aus dem Hause Uffenbach zur Ruhe kamen, dem Staube übergeben worden. Heute hatte sie sein Gräblein besucht, auf dem ein paar dünne Halme wilden Hafers und einige blasse Skabiosen sproßten. Cornelie hatte ein Kränzlein aus Wiesenblumen dazu gelegt und ging nun langsam heim, durch den schwülen Duft und die laute Fröhlichkeit der Heuernte. Sie war todestraurig und verzagt. Wenn Mari, das prachtvolle Schweizermädel mit den breiten Schultern, den üppig geschwungenen Hüften, kein lebendiges Kind zur Welt bringen konnte, wie würde es ihr dann ergehen – deren Jugendkraft verbrannt war unter allzu langem Sehnen, unter den Feuern allzu harter geistiger Arbeit. Vor drei Wochen noch, als die Mari mit dem dicken Versuchskind unter dem Birnbaum spielte, hatte sie ein Bild köstlichster mütterlicher Fruchtbarkeit gegeben. Jetzt war sie glücklich, weil das Würmchen, das sie geboren hatte, unter wildem Hafer und Skabiosen still vermodern durfte. Cornelie erzitterte vor Angst, daß auch sie nach ein paar Monaten vielleicht – als wäre nichts geschehen – in die Lüge ihres bisherigen Mädchenlebens zurückkehren könne. Sie sah sich wieder in ihrem alten Mädchenbette ausstrecken, hörte die Stimme ihrer Mutter neben sich, ihr dieselben Ermahnungen gebend, die Schuhe vor die Tür zu stellen und sich nicht zu erkälten, welche sie einmal dem kleinen Ding an ihrer Seite gegeben . . . Sie fühlte wieder den Überdruß der fliehenden Tage, die von dem unsicheren Schimmern einer vorsichtigen männlichen Galanterie, von den unfruchtbaren Schwärmereien erregter Freundinnen blaß vergoldet wurden . . .

Eine Sehnsucht nach Tod und Vergehen schwoll wie eine gewaltige Welle aus Meerestiefen aus ihres Wesens innerstem Verlangen empor – überflutete alle Dämme, die Vernunft und Wille errichtet hatten – gierte – lechzte nach Vernichtung wie nach letztem Glück.

Mit dem Kind im Arm an der Kirchhofsecke auf dem öden windumwehten Hügel zu schlafen, schien ihr so süß und friedlich.

Nach dem anreizenden Stachel, den das neue unbekannte Leben anfangs für sie gehabt, war sie in der letzten Zeit völlig zurückgesunken in eine unermeßliche Gleichgültigkeit. Nichts, was die Zukunft ihr noch bringen konnte, und kein Mensch, von dem sie wußte, dünkte ihr wert, um seinetwillen auch nur eine Stunde länger zu leben. Die Liebe und jedes Band zwischen ihr und allen, die ihr einmal nahe gestanden, war in ihr abgestorben, und mit dem letzten Rest von Haß gegen den Mann, der sich unter der falschen Flagge einer inneren Gemeinschaft, die niemals bestanden, in die wohlverwahrte Festung ihres Herzens eingeschlichen hatte – der sich den Vater ihres Kindes nennen durfte – schwand auch der letzte Rest von Gefühl für ihn aus ihrer Brust. Zwischen ihrer Mutter und ihr hatte schon ihre Leidenschaft zu diesem Fremden das Band zerrissen, das so wie es früher gewesen war niemals wieder geknüpft werden konnte. Was auch geschehen würde – wie wenig oder wieviel die Mutter erfahren mochte, daß sie nicht die erste und einzige in Corneliens Leben geblieben war, würde sie ihr nie verzeihen. Die Tochter wußte es gut genug.

Und das Kind? Das Kind? Würde sie es lieben – ?

Würde sie es hassen? Würde es ihr ebenso gleichgültig bleiben, wie alles andere auf dieser Welt, weil ihr Gefühl überhaupt gestorben war, an der fürchterlichen Enttäuschung, die sie erlitten hatte? Sie fragte und fragte . . . Niemand gab ihr Antwort und sie wußte selbst keine Antwort. Aber sie erinnerte sich der Zeit, da sie ihren Vater verlor. Sie war damals dreizehn Jahre alt gewesen, und hatte sich in unermeßlicher Verzweiflung in ihren Gebeten an den Thron Gottes gleichsam angeklammert – hatte mit Fäusten der Wut und Empörung an die Pforten gehämmert, die das Wunder vor ihr verschlossen – Gott war unerschütterlich geblieben, die Pforten des Wunders hatten sich nicht geöffnet – sie hatte ihn verlieren müssen. Und dann waren die Jahre gekommen, an die sie nun so oft denken mußte, die man die schönsten der Jugend nennt und die gleichgültig und leer für sie gewesen waren, weil sie selbst innerlich tot war, abgestumpft für jedes Gefühl, unfähig jeder wirklichen Anteilnahme. Endlich hatte die erste starke Liebe zu einem Manne sie aus jenem Zustande von Erstarrung geweckt – eine Liebe, die niemals erwidert wurde. Doch was sollte sie nun wohl wecken?

Wie sollte sie denn aus Eis und Schlacken so viel Wärme zusammensuchen, wie ein kleines Kindchen zum Leben braucht. Wie sollte sie, erzitternd unter der Qual dieser inneren Kälte die Glut und Kraft zu einer Mutterschaft hernehmen, die täglich neu gegen eine Welt von Hohn und Mißbilligung verteidigt werden mußte.

Cornelie blieb stehen auf der einsamen Straße und rang die Hände und blickte mit vor Angst weit aufgerissenen Augen umher.

„Mein Gott, mein Gott, laß mich doch sterben – gönne mir, daß ich sterben kann,“ murmelte sie, wie eine Kranke in unerträglichen Schmerzen, und wußte dabei doch, daß der Glaube an einen waltenden Gott, der solches Gebet erhören kann, längst in ihr ausgetilgt war. Plötzlich befiel sie das Bewußtsein, den Tod regieren und mit eigener Hand sich zu Willen zwingen zu können, wie eine wundervolle, tröstende Erlösung. Nein – sie brauchte nicht zu leben, wenn sie nicht leben wollte, und ihr Kind brauchte nicht zu leben, wenn sie es nicht wollte! Kein Gott war im Himmel, kein Gesetz auf Erden, von dem sie gezwungen werden konnte, weiter zu gehen, wenn sie zu müde war – kämpfen zu sollen, wenn sie nur noch zu schlafen begehrte.

Eine listige, heimliche Freude dämmerte in ihrer Seele – als betröge sie irgend jemand um einen seltsamen Triumph, wenn sie sich und das Kleine allen Bitterkeiten, die man ihnen zu trinken geben wollte, still und sicher entzöge.

Und die Angst vor dem Leben löste sich auf in der Begier nach dem Tode . . . Wenn sie wieder kommen und sie überwältigen wollte, so brauchte Cornelie nur unterzutauchen in das ewige Meer des Vergehens, wo es so gut und friedlich zu ruhen war.

Ihre Phantasie begann spielend und versucherisch die Wege zu gehen, die dorthin führten – begann allen Möglichkeiten nachzuträumen, berauschte sich an den Schrecken des Todes, wie an Opiumdüften des Vergessens. Sie sah ihr Kind nicht mehr lebendig, rosig, mit Blumen bekränzt, wie damals, an jenem Sonnenmittag – sie sah es schlaff in ihrem Schoße liegen, die Gliederchen steif, das Mündchen in dem grünweißen Gesicht mit einem süß-wehen Ausdruck ein wenig schief gezogen, sie fühlte die Kälte der kleinen Leiche erstarrend in ihr eigenes Herz dringen, empfand mit einer grausigen Beruhigung, wie das Leben auch aus ihrem Körper wich und er sich in der letzten Todesnot zusammenkrampfte . . . Sie vermochte schon längst nicht mehr zu arbeiten, der Degout auch vor diesem Werk war zu übermächtig geworden. Sie hielt sich viel auf ihrem Zimmer, lag auf dem Kanapee und grübelte – sie konnte gar nicht wieder los von den Gedanken und Phantasien, die ihr zuflüsterten, wie alles am besten auszuführen sein würde . . . Oh – sie wußte ja, der Tod hatte wartend hinter ihr gestanden, alle diese Monate schon – und sie hatte sich erschöpft, hatte übermächtig gerungen, im Kampf mit der Versuchung, sich nach ihm umzuwenden. Er hatte nur immer still gestanden und gewartet und gelächelt. Er wußte ja, daß sie die Sehnsucht verzehrte, von ihm geküßt – von ihm in den Arm genommen zu werden. Er wußte ja, daß es damit enden mußte, daß sie von selbst zu ihm kam.

Der Sonnenschein reizte ihre Nerven, erbitterte sie förmlich mit seinem Glanz, sie ertrug das „Draußen“ nur, wenn die Dämmerung wie ein zarter silberner Nebel milde über alle Gegenstände niedersank. Begegnete sie dann einem heimkehrenden Schnitter, der gebeugt und schwer oder aufrecht und stark die Sense über der Schulter, an ihr vorüberschritt, so grüßte sie ihn still in ihrem Herzen als das uralte Abbild und Symbol des Freundes, nach dem sie verlangte.

Es ist ein Schnitter, der heißt Tod – Er hat Gewalt vom höchsten Gott, Hüte dich, schön’s Blümelein . . .

Sie spürte im Vorübergehen den Dunst von Schweiß und Kraft, der von dem Sensenmann ausging und er erregte ihre überfeinerten Geruchssinne mit einem Gemisch von Widerwillen und Erinnerungszauber. Und so wurde ihr der Mann schlechthin zu einem Bilde des Todes: Leben zeugend, um doppelt Leben zu vernichten, nur von einem blinden Drang getrieben, den er selbst nicht zu deuten gewußt hätte. War das ruhelose Sehnen und Gieren nach Liebe, das sie verzehrt hatte, all die Jahre ihrer Jugend hindurch, im Grunde nicht auch nur ein Verlangen nach Vernichtung, als nach der Erfüllung alles Seins? . . . Auf einem Bänkchen vor einer der Hütten in der unteren Dorfstraße saßen die rote Bärbe und die Fischerin beisammen. Sie genossen die Abendkühle und die Düfte der Wiesen, die sich mit dem Geruch der roten Rosen in dem kleinen Gärtchen vermählten. Die beiden stattlichen Schwäbinnen hatten sich um die Taillen gefaßt und sangen mit schönen vollen Stimmen in der behaglichen Feierabendstimmung, so daß ihr Lied weithin die Dämmerung durchdrang. Es handelt von einem Mann, der seine Sense wetzt und zu dem die junge Bäuerin tritt. Cornelie blieb in ihrer Nähe stehen und lauschte mit einem Gefühl bangen Neides. So viel einfache, gesunde Lebensfreude sprach sich in dem Gesang der beiden tüchtigen Frauen aus. Mit einemmal wurde Cornelie rot vor plötzlicher Scham, obwohl sie doch ganz allein in der Sommernacht dastand und die Worte des Gesanges verstand. Sie waren von einer unglaublichen – von einer haarsträubenden Obszönität. Aber das genierte die Sängerinnen keineswegs. Im Gegenteil. Sie lehnten die Köpfe mit dem roten und braunen Gelock, das üppig aus den dicken Flechten hervorsprang, gegen einander und lachten laut und herzlich über das unanständige Ende. Und dann fingen sie mit rechtem Genuß die Melodie noch einmal von vorne an, und sagen fröhlich und kräftig alle Verse durch.

Cornelie ging leise weiter, gesenkten Kopfes und schnellen Schrittes, um sie in ihrem Vergnügen nicht zu stören. Es war etwas in diesem Erlebnis, das sie im Tiefsten erschütterte. Als habe die zeugende und gebärende Natur selbst sie mit ihrem Fittich gestreift.

Elftes Kapitel

Die letzten Fuhren waren in den Scheunen geborgen. Hoch stand das Korn zwischen den nun flachen, leeren Wiesen, auf denen der Storch gravitätisch nach Futter für die junge Brut suchte, die auf der Pfarrscheune schon mächtig die Schnäbel aufsperrte und für die er gar nicht genug herbeischleppen konnte. Jetzt mochten die Gewitter, die seit mehr als einem Tage drohend am Himmel standen, sich entladen, nun mochte der Regen strömen. Tier und Mensch ersehnte Abkühlung und Frische.

Der Sonntag kam. Die Paare drehten sich in dem vor Hitze und Menschendunst dampfenden Saal des „Sternen“. Fiedeln und Brummbässe kreischten, das Bier strömte aus den Fässern in die durstigen Bauernkehlen. Draußen schlang die Nacht dunkle warme Schleier um das Dorf. Es regte sich kein Windchen, ohrbetäubend schrillten die Grillen, ein banges Warten lag in der Luft. Die Hanne hatte auch mit im „Sternen“ tanzen wollen. Das war eine, die ihre Röcke zu schwenken verstand, ihre Schätze wechselten mit jedem neuen Mond. Aber heut’ erwartete die Uffenbacherin für die Nacht den Ruf zu einer Bäuerin, deshalb sollte ihre Magd daheim bleiben, sehr zu deren Verdruß. Sie war schon den ganzen Tag vor sich hinbrummend und schimpfend im Hause umhergeschlurft. Abends versuchte sie noch einmal, ihre Herrin umzustimmen. Die Alte war schlechter Laune, wie immer, wenn sie ihre Nachtruhe drangeben sollte, und verweigerte der Hanne die Erlaubnis zum Tanz. Es gab eine wilde Auseinandersetzung zwischen beiden – wenige Zeit darauf verließ die Hanne, mit tückischem, dumpfsinnlichen Ausdruck in den plumpen Zügen das Haus und blieb eine lange Weile verschwunden. Die Fräuleins mutmaßten, sie werde ohne Erlaubnis die Nacht fortbleiben, wie dies schon öfter geschehen war. Die Uffenbacherin erklärte zornig, dann werde sie nicht wieder eingelassen und die Kündigung sei ihr gewiß. Doch gegen neun Uhr stellte sich Hanne wieder ein, redete mit niemand ein Wort und ging auf ihre Kammer.

Mitternacht mochte bereits vorüber sein, als Cornelie durch ein Schlagen an der Haustür und die Rufe roher Männerstimmen erwachte. Sie glaubte, man benachrichtige die Frau zu ihrem Wehenmutterdienst, aber so war es nicht. Ein Fenster klirrte, die Uffenbacherin schimpfte in den saftigsten Ausdrücken hinunter. Gebrüll und wieherndes Gelächter antwortete. Fäuste und Steine hieben gegen die Türe, das Schloß im morschen Holze krachte unter dem Gerüttel der trunkenen Burschen, die mit den unflätigsten Worten Einlaß verlangten und drohten, Türen und Fenster einzuschlagen, wenn die H . . . ihnen nicht gutwillig öffneten.

Cornelie war in Schweiß gebadet und doch von eisiger Kälte durchschüttelt unter ihren Decken. Vom Rückenmark kroch ihr eine Lähmung durch alle Glieder. Vor Entsetzen lag sie wie im Starrkrampf, die Finger und Zehen gekrümmt, die Zähne knirschend gegeneinanderschlagend. Jeden Augenblick konnte sie gewärtig sein, daß die Hölle, die unten an der gebrechlichen Tür rüttelte, die rostigen Bänder sprengen und zu ihr eindringen werde – daß das Fürchterliche, Grauenvolle sie wehrlos preisgegeben finden würde. Schon flogen Steine in die geöffneten Fenster, ein Irrsinn des Vernichtens hatte die Trunkenen ergriffen. Sie brüllten und johlten die wüstesten Lieder und dazwischen krächzte und schimpfte die Alte . . . Das Dorf lag weit, jede Hilfe war fern . . . Der nackte, rohe, unbändige Trieb des Geschlechtes tobte in unflätiger Begierde nach dem Fleisch des Weibes. Cornelie fühlte den Wirbel der finstern, tierhaften Urmächte des Lebens um sich kreisen – er griff nach ihr empor, riß sie in seinen Schlund – sie sah rote Fäuste durch die Dunkelheit nach ihr langen, branntweindunstiger Atem umfing sie. – Mit einer wilden Energie reckte sie sich empor, die Betäubung von sich abzuschütteln, da wurde ihre Tür geöffnet, Annerle und Toni im Hemd mit bloßen Füßen kamen zitternd und weinend vor Furcht, sich zu ihr zu flüchten.

„O mein Jesus, Fräulein Cornelie, hören Sie, die Viecher . . . Hören Sie nit hin, die wüschte Worte – o mei – wann die eindringe, da Gnade uns Gott!“

„Das hat die Hanne anstift . . . ganz sicher die Hanne . . . “

Die jungen Geschöpfe klammerten sich an Cornelie und sie hatte ihre Arme um beide geschlungen. Auch die Mari kam, wankend vor Schwäche aus ihrem Kindbett. Nun faßten sie wieder Mut und schoben mit vereinten Kräften den Waschtisch vor die Tür, die längst keinen Riegel mehr besaß.

Draußen schüttete die Uffenbacherin Hafen nach Hafen mit Wasser über die Köpfe der wüsten Gesellen. Sie drohte mit Polizei und Gefängnis. Das schien die Burschen doch allmählich zu ernüchtern. Lachend forderten sie jetzt nur noch die Herausgabe der Hanne, die sich still in ihrer Kammer hielt. Es brauste ein Sturm durch den Birnbaum, die halbreifen, harten Früchte prasselten auf die Köpfe der Hitzigen, Staub und Strohhalme in Wirbeln emporgeweht, blendeten ihnen die Augen. Blitze zuckten, der Donner krachte. Da zogen sie schimpfend und johlend ab, um dem Regen zu entgehen, der nun mit Macht herniederbrach.

Man hätte meinen sollen, Frau Uffenbacher würde die offensichtliche Urheberin des Ärgernisses in der Frühe des nächsten Tages aus dem Hause jagen – aber dies geschah durchaus nicht. Das Annerle bekam den Grund der Milde bald heraus: Die Uffenbacherin war ihrer Magd noch den Lohn der letzten Monate schuldig, ja die Hanne hatte von ihrem Sparkassenbuch abgehoben um der Uffenbacherin auszuhelfen. Nun vertröstete die sie auf den Ersten, wenn die Fräuleins ihre Pension zahlen würden. Die Hanne ließ sich nichts abgehen – arbeiten tat sie gern, das war ihrer kraftstrotzenden Natur Bedürfnis, und die besten Bissen wurden ihr von der Uffenbacherin zugestreckt. Auch ging sie von nun an unbehelligt jede Nacht ihren Liebesfreuden nach – alle Heuschober boten duftende, weiche Lagerstätten. Im übrigen war sie mit ihrer Herrin auch nach dem kleinen Zwischenfall auf dem besten Freundschaftsfuß.

„Das Miestvieh,“ schimpfte Annerle, „schauen’s Fräulein Cornelie, wann einer der Uffenbacherin Geld geboten hätt’, wir wären kein Stund’ sicher in unsre Betten gewesen – die, wann’s kuppeln könnt’, tät’s schon arg gern.“

So ganz gegenteiliger Ansicht war Cornelie nicht, und auch die Mari stimmte zu.

„Wann wir nit zusammenhielte, die machte einen Saustall aus der Villa Uffenbacher – und wann’s nit Angscht vorm Herrn Geheimrat hätt’! Schulde hat sie mehr als Haar unter ihrer Haub’. Mir könne von Glück sagen, wann uns der Gerichtsvollzieher nit, wenn wir in die Wochen komme, die Betten unter dem Leibe fortzieht!“

„Ich bin froh, daß ich’s hinter mir hab’,“ sagte die Mari, „ich hab’ genug von dem Sommeraufenthalt! Nächsten Samstag erwartet mich mein Schatz in Rohrschach.“

„Ja – du hascht’s gut,“ seufzte das Annerle.

„Jetzt schon,“ gab die Mari zu, „wenn freili das Kindle gelebt hätt’, das wär’ arg geworden. Bis er eine Stell’ hätt’, auf die wir heiraten können, hätten’s die Eltern von ihm doch heraus bekommen, und das sind ehrbare Leut’, die hätten nicht zugegeben, daß er ihnen ‚so Eine‘ zur Tochter bringt!“

„Wir müsse noch drei Monate hier aushalte!“

„Mein Papa schreibt, ich soll den ganzen Winter bei der Frau Uffenbacher bleiben,“ sagte Toni ergeben.

„Wenn mei Mutterle wüßt’, wie’s hier zugeht . . . “

„So sag’s deinem Vater!“

Toni schüttelte resigniert den Kopf. „Mir glaubt er doch nimmer.“

Nach einer Weile kam tonlos ihre Stimme: „Wenn die Kerle ’nein kommen wär’n und hätten mich umbracht – am besten wär’s schon gewesen!“

„Na gar – umbringen wollten sie uns doch nit,“ rief Annerle mit einem kleinen wollüstigen Lachen.

Cornelie war durch das Grauen jener Nacht mit einem Schlage ihrer Todessehnsucht entrissen. Es war eine Härte in ihr erwacht, daß sie sich ohne Freudigkeit, aber gleichsam aufgereckt und mit zusammengebissenen Zähnen dem Ungeheuer Leben gegenüber stellte. Als sei sie in Drachenblut gebadet, harrte ihr Herz still unter dem hörnenen Panzer.

Zwölftes Kapitel

Für alle gab es eine angenehme Zerstreuung, als bald darauf ein heiterer Besuch an die Tür des Häusleins unter dem großen Birnbaum klopfte. Das Fräulein Lucie Bubenberg aus Ilferlingen wollte sich nach ihrer Freundin Annerle umschauen und füllte gleich Treppe, Flur und Zimmerchen mit dem fröhlichen Geklapper ihrer Stöckelschuhe, dem Rauschen ihrer seidenen Röckchen und Blusen, den perlenden Kadenzen ihres hellen Gekichers. Annerle, die mit wildem Neide die Augen an der schlanken Taille der Freundin weidete, sonnte sich im Glanze ihres eleganten Auftretens und konnte sie nicht oft genug mit „Matame la baronne“ anreden. Die französische Titulatur sollte Welten von pikanten Geheimnissen andeuten. In ihrem bürgerlichen Alltagsleben war aber Fräulein Lucie Bubenberg aus Ilferlingen keineswegs eine romantische oder gar eine zweifelhafte pikante Dame. Sie stammte nicht nur aus gutem Hause, sondern sie gehörte ihm noch heut’ als wohlgelittenes und vollberechtigtes Mitglied an. Vater Bubenberg, der kluge, tätige Industrielle, war nicht wenig stolz auf seine hübschen Töchter, die wie eine Schar bunter girrender Vögel ihn umgaukelten. In der Villa Bubenberg gab’s ein fortwährendes Aus- und Einfliegen zu Landpartien, Bällen, Fastnachtsbelustigungen. Um die gastfreien Tische und die reizenden Mädchen schwirrte ein ganzes Heer von Anbetern: Musiker, Studenten, Schauspieler, junge Offiziere und Beamte. Wer konnte in dem Tumult von Gelächter, Scherzen und Neckereien ergründen, welcher der Gäste bei dieser oder jener der jungen Damen der bevorzugte Ritter war? Und wer hätte sich unterstehen mögen, zu erraten, wie weit die Bevorzugung sich erstreckte?

Annerle hatte Cornelie oft die gute, etwas rheumatische Mama Bubenberg geschildert, wie sie in ihren soliden, grauen Wolltüchern mit ihrem duldsamen Lächeln als beruhigender ehrbarer Mittelpunkt in dem lauten Getriebe saß. Freilich redete man auch ihr eine lustige Jugend nach. Freunde und Freundinnen aus den älteren Jahrgängen zogen zuweilen bedenkliche Vergleiche zwischen den schlanken Gelenken, den feinen Rasseprofilen der Bubenbergs Mädel und dem plumpen schwäbischen Gliederbau ihres geldverdienenden Vaters. Vielleicht hatte die Mama aus solcher vergnüglichen Jugendzeit gelernt, daß auch strengere Aufsicht bei gewissen Anlagen nicht viel hindern kann, und daß es schließlich für eine Mutter weit bequemer ist, beide Augen zuzudrücken und mit zu lachen statt die säuerliche Warnerin zu spielen. Um eines guten Spaßes willen war in der Villa Bubenberg gar viel gestattet, die Parole hieß: Lustig sein und einen guten Humor haben. Nach der untadeligen Gesellschaftszugehörigkeit wurde weniger gefragt. So war auch das Annerle, die das Studentenfest, bei dem sie Lucie kennen lernte, in Begleitung des Herrn Geheimrats besuchte, durch diesen alten Freund der Familie Bubenberg gleich aufs beste eingeführt.

„Es gibt halt gar sonderbare Verwandtschafte in dere Welt,“ flüsterte das Annerle dem Fräulein Cornelie ins Ohr. Mit solcher Erklärung konnte diese ihre Phantasie walten lassen. Sie konnte ebensowohl annehmen, daß der Gönner Geheimrat Annerle zuerst in den Garten der Liebe eingeführt habe, als auch – was ihr wahrscheinlicher schien – daß er ihr illegitimer Herr Papa sei und deshalb einen gewissen ritterlichen Schutz über sie ausübe. Cornelie Reimann konnte sich nicht verhehlen: sie begann neugierig auf den seltsamen, sich so mannigfaltig betätigenden Herrn zu werden.

Als in den nächsten Tagen wieder einmal der Willkommengruß: „Ja schau – der Herr Geheimrat!“ erscholl, zog sie sich nicht, wie sonst, eilig in ihr Zimmer zurück, sondern blieb vor der Laube auf ihrem Leinwandstuhl sitzen. Es kam ihr kleinlich vor, der Lucie Bubenberg durch ihre Flucht etwas wie Furcht vor den Menschen zu verraten. Mit einem weiten Schwung seines weichen, grauen Filzhutes grüßte der kleine, freundlich blickende alte Herr die Damen. Ihre Anzahl wurde durch die Rose von Ulm vermehrt, welche ihr Bübchen unten im Dorf besucht hatte. Vor Cornelie verbeugte sich der Herr Geheimrat zeremoniös und bat sie, sich nicht stören zu lassen, worauf die Lucie kategorisch erklärte: I, das Fräulein sei gar nit „so“ und warum sollt’ sie sich denn auch vorm Herrn Geheimrat geniere . . .

Ersichtlich war ihm unter der ihn fröhlich umdrängenden Mädchenschar ihre Gegenwart nicht ganz behaglich, doch fügte er sich mit guter Manier. Später konnte er es auch nicht unterlassen, verstohlene Blicke nach der in ihren Stuhl zurückgelehnten und etwas fremd und gleichgültig dreinschauenden Dame zu senden. Bald war das gemütliche Geplausch mit seinen jungen Freundinnen in vollem Gange. Die Lucie hatte tausenderlei von „Daheim“ zu berichten und erzählte mit viel hellem Gelächter allerlei Schnurren. Den Papa der Toni hatte er kürzlich auch gesprochen – als dieser zu der allgemeinen deutschen Lehrerversammlung in Stuttgart gewesen war. Die Rose von Ulm mußte ihm berichten, wie weit ihre Heiratsaussichten gediehen seien und das Annerle klagte ihm seufzend, daß sie sich „gar nit so recht extra fühle!“ Darauf erinnerte er sich eines Päckchens, das er in der Brusttasche trug und ihr mit verschmitztem Lächeln in die Hand drückte. „Es ischt dasselbe, was ich der Fräulein Toni schon einmal mitgebracht habe,“ und damit zog er das Annerle ein wenig näher und flüsterte ihr das übrige ins Ohr. Aus einer anderen Rocktasche entwickelte sich ein rotgebundener Novellenband, für die Toni war eine Tüte Bonbons nicht vergessen. Die Uffenbacherin stand mit triumphierender Miene in der Laubentür. So gefiel es ihr. – Sie strahlte nicht nur in einer reinen weißen Schürze, sondern auch im Glanze von Zufriedenheit und Würde, indem sie dem Herrn Geheimrat schilderte, wie sich der Herr Kreisphysikus und der Herr Polizeiinspektor, als sie letzthin zur Besichtigung dagewesen seien, lobend über ihre „Anstalt“ ausgesprochen hätten.

„‚So findet man’s selten‘, habe der Kreisphysikus gesagt, ‚in dem Zimmer möchte man ja gleich selbst – Sommerfrische halten‘. Die Fräulein Cornelie habe als immer so schöne Bukettle auf ihrem Tisch und so arg viele Bücher. Und der Herr Kreisphysikus habe eins von dene große Bücher vom Tisch genomme und ’neingeschaut und ganz reschpektvoll gerufe: ‚Alle Wetter – ! Gratulier’ zu der Lektür’!‘ Und so gemütlich säßen die Dam’ jeden Nachmittag in der Laub’ und es wär’ ein Fried’ und ein’ Freundschaft unter ihne’, daß mer sich’s nit besser wünsche könnt’.“

Sie triefte vor Anerkennung und Wohlwollen und machte ganz verliebte Augen zu dem Gaste hin, denn sie hatte durchaus nicht die Absicht, dem Herrn Geheimrat den Zins zu zahlen, wenn er etwa deshalb schon so bald wiedergekommen wär’!

Cornelie fühlte sich enttäuscht. Ihre Phantasie hatte sich unter dem „Herrn Geheimrat“ einen ernsten Menschenfreund oder einen überlegenen Cyniker, einen alten Feinschmecker des Lebens vorzustellen beliebt. Nun sah sie einen gutmütigen Papa, der mit friedevollem Behagen Curellasches Brustpulver austeilte und wohl nur ein ganz klein wenig perverse Lüste inmitten der dickbauchigen jungen Dinger empfand. Oder wirkte das Schwäbische so harmlos?

Hier war alles nicht so, wie es zu sein schien, und nahm man das Gegenteil von dem, was Dinge, Beziehungen und Menschen zu bedeuten schienen, so wußte auch man wieder nicht, ob man sich nicht auf falscher Fährte befand. Cornelie kam es wie ein grotesker Humor des Schicksals vor, daß auch sie selbst, die bisher nur im Klaren, Einfachen gelebt hatte, hinfort zu dieser verwirrten, schillernden zweideutigen Welt gehören sollte.

Lucie Bubenberg hinwiederum betrachtete Cornelie als ein ganz verwunderlich-fremdes norddeutsches Gewächs, mit unverhohlener Neugier, heimlichem Spott und einer guten Dosis von Mitgefühl – woher aber das Mitgefühl stammte, wußte die kleine lustige Person nur ganz allein.

Sie war gezwungen, nicht, wie sie beabsichtigt hatte, einen Tag, sondern ganze drei Tage bei ihrer Freundin Annerle in dem unerfreulichen Tränenhause auszuharren. Sie hatte sich auf der nächsten Bahnstation mit ihrem Baron treffen wollen, um in seiner Gesellschaft eine kleine Spritztour in die Schweiz zu unternehmen. Der Herr wurde durch irgendwelche gesellschaftliche oder berufliche Pflichten am rechtzeitigen Erscheinen verhindert. Ein Schauer von Telegrammen flatterte zwischen den Liebenden hin und her, konnte aber die Sachlage auch nicht ändern. Platz für Lucie war genügend vorhanden, denn die Schweizer-Mari hatte vor einiger Zeit Abschied genommen und war durch ein junges Dienstmädchen ersetzt worden, die nur eine schlechte Bodenkamer erhielt und bei Frau Uffenbacher und der Hanne in der Küche aß.

Lucie benutzte die Zeit, um sich genau über alle Verhältnisse der Villa Uffenbacher zu informieren. Vor kurzem war eine dicke Bäckersfrau aus Ulm erschienen und hatte einen heftigen Zank mit der Alten gehabt. Die Toni wollte gehört haben, es handle sich um Schulden. Die fette Bäckin, wie man in Schwaben sage, habe der dicken Hebamme schließlich mit dem Gericht gedroht, wenn sie ihr Geld nicht kriege. Während die Lucie noch zum Besuch war, erschien die Bäckin aufs neue. Es gab wieder einen heftigen Auftritt. Doch dann folgte bei Kaffee und Gugelhupf, den die Bäckin mitgebracht hatte, eine Versöhnung; darauf wickelte die Ulmerin aus einem Zeitungspapier eine blaugewürfelte Barchentnachtjacke, einen Kamm und ein Paar Pantoffeln und richtete sich im Schlafzimmer der Uffenbacherin häuslich ein. Sie teilte den Damen zutraulich mit, dies geschehe, um das zähe Weib durch ihre stete Gegenwart zur Herausgabe des ihr in früheren Zeiten geborgtes Geldes zu veranlassen, oder, wenn das nicht möglich sei, doch wenigstens eine Zeitlang auf ihre Kosten zu essen und zu trinken und sich’s auf dem Lande wohl sein zu lassen. Da die beiden ungeheuern Weiber, welche die niedrige Küche mit ihrem Leibesumfang so ziemlich ausfüllten, die gleiche Leidenschaft für ausgiebige „Veschperbrote“ mit etwas „Gebratenem und Gesottenem“ und manchem Gläsle Bier hatten, und die Hebamme die gefährliche Bäckin, deren Mann schon einmal beim Advokaten gewesen war, beileibe nicht erzürnen mochte, so machte sie gute Miene zum bösen Spiel. Die Mittags- und Abendrationen der „Fräuleins“ wurden dabei freilich immer dürftiger und es stand zu befürchten, daß ihre gesamte Pension im „Veschperbrot“ der versöhnten Feindinnen verschwand.

Die Bäckin verriet den Fräuleins: eine ganze Reihe von Bürgersfrauen habe der Uffenbacherin früher geborgt – sie habe arg gut gelebt und schließlich die Stadt verlassen müssen, weil ihr der Boden unter den Füßen gebrannt habe. Wenn es erst einmal herauskomme, wo die Uffenbacherin geblieben sei, und daß sie nun Besitzerin einer „Anstalt“ geworden – dann würde sie es wohl auch nicht allzu lange mehr bleiben. Die Fräuleins könnten sich nur beizeiten nach einer andern Unterkunft umschauen, damit ihnen nicht auch noch die eignen Sachen mit verkauft würden! Alle diese bedrohlichen Auskünfte gab die dicke Bäckin mit Seufzen und Geschluchze von sich, und klagte in dem jammervollen Gewimmer die Uffenbacherin als die teuflische Verderberin ihrer Existenz an. Sie habe sich verleiten lassen, dem bösen Weibe nach und nach alle ihre Ersparnisse auszuliefern, weil die Hexe ihr vorgespiegelt, das Geld zu höheren Zinsen anlegen zu können. Aber niemals habe sie die Zinsen zu sehen bekommen. Als ihr Mann, der Bäck, das erfahren, habe er sich aus Gram und Groll aufs Trinken gelegt und das Geschäft arg vernachlässigt, so seien sie arme Leut’ geworden und mit ihren Kindern sei sie auch darüber zerfallen. Die setzten ihr nun arg zu – sie müsse ein Teil des Geldes wiederschaffen, sonst getraue sie sich nicht wieder heim. – Der Schwiegersohn und der Mann würden sie gemeinsam totschlagen.

Bestürzt blickten sich die Fräuleins nach diesen Eröffnungen an, als von unten die Uffenbacherin die Bäckin rief, scharf und befehlend, denn es mochte sie unheimlich anmuten, daß sie gar so lange in Annerles Zimmer verweilte. Das fette Weib, dem die Tränen über das aufgequollene blasse Teiggesicht niedertropften, schlurfte ängstlich und gehorsam die Treppe hinab. Lucie Bubenberg drückte ihr niedliches Frätzchen in ihr Spitzentüchlein und prustete in hellem Lachen heraus.

„Was die Dicke eine Angscht hat vor der Schuldnerin – wie ein Hündle wedelt sie um sie her! Die Weiber mögen ihre Geheimnisse haben – da mag manches nit koscher sein. Die andern Bürgersfrauen – die werden sich auch als hüten die Hebamm’ vor die Polizei zu bringen!“

„O mei,“ stimmte Annerle zu, „so mag’s schon sein – aber was fanget wir arme Hascherle an, und wo halte mir unsre Kindbett’ wenn die dicke Weiber aus Ulm unsre Pfühl mit Beschlag belege?“

„Wann’s zum Schlimmsten kommt,“ sagte die Toni, „da geh’ ich zu der Lebzelter unten in der Dorfstraß’, die mei Kindle nehmen soll, der Papa hat’s schon mit ihr ausgemacht.“ Annerle erklärte, sie werde zu den Fräulein Hottinger ziehen, zwei dürren alten Jungfern, denen sie ihr Kleines versprochen habe.

Nur Cornelie blickte unschlüssig zum Fenster hinaus. Ihre Lippen zuckten und preßten sich fest aufeinander. Lucie beobachtete sie mit Aufmerksamkeit.

So war das – so – so . . . Nein – so armselig sollte es ihr nie ergehen! Nie!

„Ich weiß einen Rat, ich weiß einen Rat,“ rief sie, hob ihre seidenrauschenden Röckchen und drehte sich auf den Hacken ihrer Stöckelschuhe, daß Spitzen und Volants um sie her in buntem Wirbel flogen.

„Ich sag’s meinem Egon und wir laden das Fräulein Cornelie auf eines seiner Schlösser – zu Gast – ! Ha – er kommt ja nie auf das kleine nette Jagdhaus in Tirol – außer wenn ich da bin – und ich bin als oft schon wochenlang da gewesen! Die alte Schließerin und ihr Mann, die sind verschwiegen – die sind Verschwiegenheit gewöhnt bei dem Nixnutz – ! Da ist das Fräulein Cornelie ganz ungestört und die alte Cenzi, die kocht! Da kann man sich die Finger lecke! Dreierlei Knöpfle in die Supp’! Und Wein hat’s im Keller! Französischen Schampus! Herben!“

Sie schnalzte mit dem Zünglein. „Das tut mein Baron, wenn ich ihn bitte – er tut mir jeden Gefallen, der verliebte Nick! Wir machen der alten Cenz’ weiß, Sie seien eine ‚Regierende‘, die der Baron im Auftrag eines hohen Herrn verbergen muß. Ei – das gibt eine ‚Hetz‘, wie meinem Baron sein österreichischer Vetter, der Fritzi als sagt! Nur mein Egon darf mir nit hin, so lang Sie auf Schloß Lucienluft sind – so nennt er’s, weil wir da so arg luftig war’n, letztes Jahr im September – ! Nein – das leid’ ich nit! Der Egon spricht als oft, wenn ich ihn geärgert hab’, ich sei so nicht sein Geschmack – sein Geschmack seien die Hohen, Schlanken, Vornehmen! –“ Sie kicherte im Triumph ihrer jungen Reize und Cornelie lächelte ein wenig über das romanhaft-naive Plänegespinst.

Aber Lucie Bubenberg streckte ihr mit einer treuherzigen Gebärde die Hand entgegen. „Gelt, Fräulein Cornelie, so ist’s recht? Ich will schon sorgen, daß Sie’s gut bei uns haben, und wenn’s not tut, komm’ ich und pfleg’ Sie! Ja, das tu ich, weil ich Sie so arg gern hab’.“ Sie beugte sich mit einer schnellen Bewegung nieder, Cornelie die Hand zu küssen, die ihr das Mädchen hastig entzog. Sie war vor Schrecken und Scham über die jähe Schwärmerei dunkelrot geworden, und doch tat ihr die Bewunderung und Fürsorge der hübschen Lucie wohl.

Alle aufrichtig gemeinte Schwärmerei hinderte die kleine Bubenberg indessen nicht, wenige Minuten später dem Annerle ins Ohr zu flüstern: „Das Fräulein Cornelie ist mir als ein Rätsel – wie kann man nur so klug ausschauen und so blitzdumm sein, sich hier in die Spelunk’ zu setzen! Da gibt’s doch andere Mittel und Weg.“

Über diese anderen „Mittel und Weg“ wurde in den Tagen von Lucie Bubenbergs Besuch oft und viel, und mit zutraulicher Offenheit geredet. Irgendwie kam das Gespräch immer wieder auf das heikle Thema, mochte es auch mit der harmlosen Geschichte begonnen haben, wie Lucie Bubenberg und ihre Schwester in einem Hotel in Stuttgart einmal frühmorgens hinausgeschlichen waren und sämtliche Stiefel und Schuhe in den Gängen vertauscht hatten, und der Schilderung von dem Geklingel, dem Geschelt und Gerufe, das infolgedessen entstanden sei, oder mit der andern Geschichte, wie sie sich das Haar bei einem berühmten Friseur habe rot färben lassen wollen, und statt dessen sei es grün geworden und sie habe vier Wochen lang im Zimmer sitzen müssen, und mit tausend widerlichen Dingen waschen und scheuern und putzen, bis die ursprüngliche braune Farb’ wieder gekommen sei.

„Ich probier’ als alles, ich hab’ vor nix Furcht,“ prahlte die kleine Schwätzerin und gab den übrigen Mädchen die besten und weisesten Ratschläge, die nur leider für alle ein wenig zu spät kamen.

„Wann du nur nicht auch noch reinfalle tuscht mit deiner Probiererei,“ antwortete dann das Annerle geärgert.

„Auf die Mittel pfeifet i gerad. Kennscht nit den Aktuarius Niederhöfer in Ilferlingen in der Weingass’? Der mit den sechs Mädeln? Dem sei Frau hat mir erzählt, die täte die Kinder unter sich als jedes nach ’nem anderen ‚Mittel‘ nenne, wo gar nix geholfen hat – ’s Kind war halt’s Resultat! Ich sag’ – das isch Glückssach! Wo als Pechvögel sind, die krieget die Kind – und die wo Glücksvögel sind, die krieget und krieget sie nit, sie möge noch so leichtsinnig sein!“

Sie häkelte wütend an ihrem grauen Tuch für die mütterliche Frau Bubenberg, die angebetet von Mann und Kindern ein so friedliches Leben führte.

„I bin halt a Glücksvögerl – Glücksvögerl Holdrio – o – o – !“ trällerte ihre Lucie zu einer Operettenmelodie. Die blasse Luis’, das neu eingetroffene Dienstmädchen, schleppte das schwere Versuchskind, das an einem Stück geselchten Schweinsknochen herumschmatzte, draußen im Sonnenschien umher. Cornelie dachte mit schwerer Traurigkeit, wie keinem der schwangeren Mädchen die Ahnung aufgegangen war, daß Mutterschaft auch ohne den Trauring am Finger etwas Heiliges und eine schmerzlich-selige Verantwortung sein könne. So verdorben und verdreht waren ihre Instinkte durch die Gewöhnung konventioneller Anschauungsweise, der auch diese freien Vögel der Liebe, und wie sehr noch, unterworfen waren!

Lucie fragte unterdessen die bayerische Toni, die mit glänzenden Augen ihren Erzählungen von einer ihr so fremden Welt des Vergnügens lauschte, und den ganzen Tag willenlos hingerissen sich an die Seite des seidenrauschenden Glücksvögeleins drängte: „Nun sagen Sie mir nur, mein liebes Fräulein Toni, wo wir uns hier alle unsre Geheimnisse ausplauschen – wie ist’s nur als ‚so weit‘ mit Ihnen gekommen? Sie schauen doch so brav und solid aus, ich kann mir das als gar nit erklären . . . “

„I weiß auch nimmer recht, wie’s kumme ist,“ sagte die Toni leise mit gesenkten Augen. „Wir sind halt Schlittschuh gelaufen und er ist recht lieb gewesen – aber gefallen hat er mir gar net so besunders – und dann hat er mich immer heimbegleitet, und da sind wir halt jedesmal an seiner Tür vorüber gekommen – und er hat mir erzählt, er hat einen Papagei, der könnt’ singen ‚Freut euch des Lebens‘ – und da hab’ ich halt so arg Lust kriegt, den Papagei zu hören – und da bin ich halt einmal mit ’nauf . . . “

„Hat’s Ihnen denn wenigstens ein bissel Pläsier macht – nachher?“ erkundigte sich Lucie mit eingehender Teilnahme. Toni schüttelte finster den Kopf.

„I hab’ mich halt so entsetzt – er war halt so arg wüscht . . . Aber i bin doch noch zweimal bei ihm gewesen – i dacht’, i müßt’ – weil ich doch nun sein Schatz war – er hat mir auch gedroht, er würd’ mir sonst auflauern und mich totschießen . . . “

„Der Schuft!“ knirschte Annerle. Lucie aber fragte leise, trotzdem ihre Stimme unsicher geworden war: „Hat’s denn wenigstens einen Papagei drin gehabt?“

„Den hat’s schon gehabt,“ sagte Toni ergeben, „aber singen hat er net können.“

„Warum hat denn Ihr Vater nachher nicht mit einem vernünftigen Arzt gesprochen?“ erkundigte sich Lucie weiter.

„Der Papa hat zur Mama gesagt, so was tät er nimmer, was gegen das Gesetz wär’ – und was der Herrgott ihm als Prüfung schicken tät, das wollt’ er in Demut tragen!“

„Er ist wohl arg fromm?“

Toni nickte. „Wir sind halt Protestanten zwischen all den Katholischen – da müssen wir ein Beispiel geben, meint der Papa. Drum hat’s ihn so schwer getroffen.“

Cornelie seufzte.

„Es ist doch auch Mord,“ sagte sie mit einer Stimme, die dunkel war von den Schatten schwerer Stunden.

„Ah, gehen Sie, Fräulein Cornelie, machen Sie nit so arg große Worte,“ zwitscherte Lucie.

„Ich kann’s nicht anders sehen,“ wiederholte Cornelie. „Mir scheint es Mord. Und gerade an dem einen Geschöpf, das uns vielleicht noch das Glück geben kann, das für uns aufgehoben ist. Darüber wär’ ich nie hinweg gekommen . . . “

„Mord . . . Wenn Sie’s so fühlen . . . “ flüsterte Lucie. Sie war während des Gespräches ein wenig blaß geworden. Ihre braunen Augen tauchten mit einem hungrig forschenden Blick in Corneliens graue.

„Freuen Sie sich denn wahrhaftig auf den Wurm?“

„Nein,“ antwortete Cornelie ehrlich.

„Da schauen Sie . . . “

„Ich warte auf die Zeit, in der ich mich freuen werde,“ sagte Cornelie leise . . . „Ich denke, der Sieg muß einmal kommen.“

Nach diesem wurden die Mädchen schweigsam und man ging in der Abenddämmerung den gewohnten Wiesenpfad an der Höhe entlang, über dem der Ernte entgegenbleichenden Haferfelde. Die Ferne lag in schwerem trüben Sommerdunst, aus dem bewölkten Himmel fielen warme Tropfen. Zur Seite der schmalen Wegspur wuchs auf hartem Gestengel wilde Zichorie mit hellblauen, duftlosen Blumen, die letzten des bunten Gewimmels, das im Frühling den Rain überschäumte. Gewohnheitsmäßig schritten die Mädchen dort auf und nieder, eine hinter der anderen, die Köpfe gesenkt, die unförmig werdenden Gestalten mit müden Schritten vorwärts geschoben. Corneliens Phantasie sah diese Reihe ins Unermeßliche ausgedehnt – die Köpfe gesenkt – die unförmigen Gestalten müde vorwärts geschoben – so wanderten sie geduldig, aus Dämmerung und Nebel tauchend, im trüben, schweren Sommerdunst der verhüllten Ferne entgegen . . .

„Ah – geht – ihr seid’s fad!“ rief Lucie überlaut und begann zu singen: „Morgen fahr’ i mit meinem Schatzerl in die Berge hinein – juvivallera – juvivallera – ein Glücksvögerl bin i, ein Glücksvögerl bleib’ i, holdrio – o – o!“

Dreizehntes Kapitel

Aus Zürich traf noch eine lustige Ansichtskarte von der Lucie ein. Auch ihr Baron hatte unterschrieben. Dann hörte man geraume Zeit nichts mehr von dem kleinen Persönchen.

„Die hat genug mit sich selbst zu tun,“ flüsterte Annerle und setzte ihre wichtige Geheimnismiene auf. „Die ischt nit umsonst nach der Schweiz!“

Cornelie fragte nicht weiter. Sie hatte, um ihren quälenden Phantasien zu entfliehen, die Gesellschaft der jungen Mädchen viel aufgesucht. Und solange die Lucie anwesend war, hatte sie sich dem Zauber ihres Wesens nicht entziehen können. Zuweilen war ein Neid in ihr aufgestiegen, vor dieser Fähigkeit, gedankenlos lachend zu genießen. Doch, was ging sie im Grunde das leichtsinnige Mädel an? Sie wurde nun aufs Neue von Widerwillen erfaßt gegen das verzerrte, verrenkte Abbild der Heiligtümer ihrer eignen Tempel, das sie in ihren Hausgenossinnen beständig vor Augen sah. Sie fühlte sich in der letzten Zeit körperlich kräftiger, streifte viel in der Gegend umher, schrieb und studierte. Sie lauschte, in traurige Träume versunken, dem mit heftiger Ungeduld sich regenden jungen Leben unter ihrem Herzen. Dieses Seltsame, einen fremden Willen in sich zu tragen, der da mit bestimmter Energie seinen Zielen entgegen strebt . . . Sehr früh hatte sie ihn in sich gespürt – hatte an ihm zuerst erkannt, sie sei zur Mutterschaft erkoren . . . Dieses Schauerlich-Heilige, sich nur als ein Gefäß zu fühlen, in dem sich eine neue Zukunft mit tausend neuen Möglichkeiten und Hoffnungen vorbereitet, ergriff sie oft mit staunendem Ahnen über die unergründlichen Quellen alles Werdens. Und sie begann mit einem leisen Bedauern des Mannes zu denken, der sich all dieses heimlich-tiefen Erlebens, das er hätte mit ihr teilen sollen, beraubte, weil er einen unbestimmten Begriff der Freiheit als ein Schild vor die Bürde der Verantwortung hielt, die seinen geschonten ästhetischen Sinnen allzuschwer und niedrig zu tragen dünkte. In diesem Bedauern zerrann allmählich der krankhafte Abscheu, der sie bisher jedes Erinnern hatte meiden lassen.

Das Ungestüm, mit dem das kleine Geschöpf in ihr sich seiner engen Haft zu erwehren schien, mußte sie schon an den einst so sehr Geliebten, an seine heftige, stürmische Natur gemahnen. Solche Art fühlte sie als etwas dem eignen Wesen völlig Fremdes. Ihre schwersten Kämpfe waren allzeit schweigend und ohne viel äußere Bewegung durchgerungen worden. Zäh und still war sie ihren Weg gegangen, und als der laute Ruhm ihr begegnete, hatte sie anfangs nur erschrocken versucht, ihm zu entweichen. Er hatte sie erobert, nicht sie ihn – so war es wohl gewesen.

Und auch der Mann hatte sie erobert, jäh, ungestüm, mit der Lebenswärme und Jugendkraft, die so strahlend von ihm ausging, daß sie sich ihr in schneller Bezauberung unterwarf.

Schon als ein Mädchen von fünfzehn Jahren dünkte es sie ein wunderliches Rätsel, wie eine Verbindung zwischen zwei Menschen heiliger, reiner und fester werden könne durch die Erfüllung einer äußeren Form, durch Worte, die ein vom Staat oder von der Kirche Bevollmächtigter spricht. Wie so vielen Rätseln, mochten auch diesem praktische Ursachen zugrunde liegen. Was kümmerten diese praktischen Ursachen sie und ihren Geliebten? Ihnen beiden kam es doch nur darauf an, zum Inhalt und Kern der wahrhaftigen Liebesvereinigung durchzudringen. So wenigstens hatte Cornelie gemeint. Allmählich – in diesen Monaten inneren Schauens – erkannte sie immer tiefer, daß das Wesen der Ehe, mochte sie durch eine Trauung bürgerlich sanktioniert sein oder nicht, wohl im letzten Grunde immer die Herrschaft und Tyrannei der Frau über den Mann bedeutet. Und hier – auf diesem Punkte hatte ihr die Kraft versagt. So war es immer schon gewesen. Wenn immer ein Mann ihr huldigte, war ein Augenblick gekommen, wo sie hätte um seinen Besitz kämpfen müssen, wo er es gewissermaßen als Liebesbeweis erwartete, daß sie mit listiger oder stürmischer Tyrannei ihr Recht auf ihn geltend machen müsse. Und dann war es, als ob der weibliche Instinkt ihr versagte – lässig, vornehm, degoutiert öffnete sie die Hände, und entließ ihn zurück in die Unabhängigkeit, in die Gleichgültigkeit. So hatte sie früher manchen Bewerber von sich gescheucht.

So hatte sie zuletzt auch auf Rudi Imgart verzichtet. War sie also doch wohl, trotz aller Liebes- und Hingebungsfähigkeit, zur Ehe unbrauchbar? Gerade der hohe Begriff von menschlicher Freiheit und Selbstverantwortung, den sie in sich entwickelt hatte, und auf den sie stolz war, weil sie fühlte, daß er sie über die Mehrzahl der Frauen stellte, machte es ihr nun unmöglich, ihr ganzes Wesen in der Herrschbegier der Liebe zu konzentrieren.
