Freude an der gegenseitigen Freiheit hatte sie zueinander geführt, ein frohes Schenken und Nehmen hatte ihnen beiden die Liebe bedeutet. – Cornelie war es nur natürlich, als die Stunde der Gefahr kam, von dem Manne, den sie liebte, die feinste Treue, die ritterlichste Hingebung zu erwarten. Er hatte versagt. – Einen Mann, den sie hätte beherrschen und unter ihren Willen zwingen müssen, der wäre ihr widerlich geworden. Sie hätte ihn nicht haben mögen zum Vater ihres Kindes. Aber noch weniger hätte sie ihn an ihr heiligstes Gefühl für Recht und Unrecht rühren lassen. Jetzt sah sie um sich her in dem Reden, Denken und Handeln all dieser Mädchen das typische Frauenwesen sich enthüllen – nicht mehr versteckt unter mannigfachen gesellschaftlichen und konventionellen Masken. Sie sah es sich in seiner ungeschminkten Wahrheit enthüllen, sie sah die schrankenlose Nachsicht und geduldige Güte der Mädchen gegen ihre Liebhaber, die sich doch alle mehr oder weniger feige und erbärmlich benahmen, sie sah aber auch ihr verzweifeltes Hängen an dem bißchen Freude, was sie durch den Mann bekamen, sah, wie alle, mit Ausnahme der armen Toni, deren Geschick in sich selbst eine Ausnahme bildete, sich unaufhörlich demütig, emsig bemühten, die Gunst ihrer Gebieter auf jede nur mögliche Weise, und sei es um den Preis der letzten Selbstachtung, zu bewahren, die Männer festzuhalten, mit zäher, entschlossener, gieriger Kraft, und in ihrem kleinen Reiche, dessen Grenzen ja eng genug gesteckt sein mochten, unbedingt das Zepter zu führen. Keine von ihnen ließ sich die Kosten ihres Aufenthaltes bei der Uffenbacher von ihrem Liebhaber zahlen – durch Erniedrigungen der bittersten Art, durch Schluchzen und Jammern vor Basen und Onkels, hatten es sie alle erreicht, die jungen Männer von dieser Steuer zu befreien, um nur ja nicht darüber ihrer Neigung verlustig zu gehen. Selbst das arme Dienstmädel, das keine Base und keinen Onkel besaß, war erst vier Wochen vor ihrer Zeit gekommen und half bei der Uffenbacher in Küche und Garten, um nur halbes Kostgeld zu zahlen, und ihrem Dienstherrn, einem wohlhabenden und verheirateten Manne, der sie verführt hatte, keine Ungelegenheiten zu machen.

Von der Rose von Ulm aber wurde erzählt, sie habe die ganze Woche kein Obst und kein Süßes gegessen, damit sie dem Herrn Leutnant, wenn er sie Sonntags besuchte, im Gasthof ein warmes Frühstück vorsetzen konnte. Sie waren es sich gar nicht einmal bewußt, daß sie Opfer brachten – es wäre ihnen nicht eingefallen, daß Männer auch anders sein und handeln könnten. Cornelie würde nicht gewagt haben, sie darüber aufzuklären. Folgten sie doch, unbeirrt von Bildung und Idealen, einfach den Urinstinkten des Weibes, waren also in ihrem Recht. Cornelie kam sich zwischen ihnen als eine Absonderlichkeit – beinahe als eine Anomalie vor. Sie hatte nie geahnt, daß ihre innere Kultur sie so weit von der allgemeinen Spezies „Weib“ entfernte, weil ihre Umgebung ja bisher mehr oder minder auch aus solchen Abweichungen bestanden hatte. Zuweilen war sie sich fast unheimlich. Unter diesen sie fortwährend umgebenden Einflüssen begann sie langsam – nach und nach – den Vater ihres Kindes milder, gerechter zu beurteilen. Wahrscheinlich hatte sie Zartheiten der Empfindung und des Handelns von ihm erwartet, zu denen er seiner Mannesnatur nach einfach nicht fähig war – zu denen die Art des Mannes sich nur unter dem Drucke bürgerlichen Pflichtenzwanges nötigen läßt. Gleich einem siebzehnjährigen Backfisch hatte sie gläubig auf „das Wunderbare“ geharrt: Seinen frischen Frohsinn hatte sie als Ergänzung ihrer schwerblütigen Grüblernatur mit innerem Jubel geliebt – hatte geträumt, aus einem freudigen Genießer könne ein freudiger Entsager, ein Mann der Tat und des Kampfes hervorgehen. Aber Zeichen und Wunder geschehen nur unter dem Feuerfuß der Leidenschaft –. Auch er wäre wohl im Rausch der Sinne über seine eigne, im Grunde zaghafte Natur hinauszuheben gewesen – immer doch nur für die Augenblicke der Leidenschaft . . . Als sie seine schützende Liebe am notwendigsten gebraucht hätte, war ihr versagt, seine Glut zu reizen – sie hätte solches wie eine Entweihung ihrer keimenden Mutterschaft empfunden. Da hätten andere Mächte reden müssen . . . Und er wurde blind und taub gegen ihre sanften Stimmen aus Angst vor dem Leben. War möglicherweise die Furcht ein sicherer Instinkt, daß seine Kräfte wirklich nicht ausgereicht hätten . . . ? Vielleicht glich seine Begabung jenen Traubensorten, die nur in der Sonne gedeihen, sich zartbehaucht am Rebgelände schaukeln und auch im Sonnenschein genossen werden müssen, wenn sie nicht dürr und trocken werden sollen. Und hatte Cornelie in manchen stolzen Augenblicken die Gewißheit in sich empfunden, daß ihre Schaffenskraft durch Qual und Leiden wie durch eine notwendige Folter gehen mußte, um ihre letzte beste Süßigkeit und Würze herzugeben – durfte sie ihm grollen, weil er so verschieden von ihr selbst, aus dem unbegreiflich reichen Schoß der Mutter Natur hervorgegangen war? Täglich wurde Cornelie ruhiger, in der Sicherheit, recht gehandelt zu haben, als sie eine Lebensgemeinschaft ablehnte, die dem Manne zum täglichen Opfer geworden wäre. Mit stillem Lächeln nahm der Haß von ihr Abschied. Sie konnte wieder der Stunden denken, da sie beide fröhlich durch Herbstgold und Winterschimmer gewandert waren, an alle traulichen Zwiegespräche über feine, köstliche Dinge, von denen nur sie beide wußten. Sie stellte sich nun gerne vor, daß das Böse, Grausame, welches in der letzten schweren Zeit an ihm hervorgetreten war, wieder verschwinden mußte. Sie hatte ihm sein besseres Teil gerettet und er blieb die heitere, etwas phantastische Gestalt, der fahrende Geselle, mit den leichten Versen auf den Lippen, dem schnell lodernden Zorn gegen alle dumpfe Alltäglichkeit – mit der glühenden Andacht vor der Schönheit der Welt. Sie meinte, wenn sie sich recht intensiv der lieben und schönen Seiten seines Wesens erinnere, könne sie ihrem Kinde als ein Erbe alles, was sie an seinem Vater geliebt hatte, übermitteln. Auf diese Weise kam sie dazu, wenn auch nicht mit Sehnsucht oder hingebender Wärme, so doch mit einer Freundlichkeit und einer Art von mütterlicher Nachsicht seiner zu denken. Das würde sie noch vor wenigen Wochen nicht für möglich gehalten haben.

Und gerade in dieser Zeit geschah es, daß ein Brief von Rudi Imgart sie auf mancherlei Umwegen erreichte. Er fragte bescheiden, aber inständig nach ihrem Ergehen und bat sie, ihm ihren Aufenthaltsort und die Zeit, da sie ihr Kind erwarte, mitzuteilen. Es war ein Ton in den wenigen Worten, wie in der schüchternen Bitte eines Knaben an seine Mutter, ihm zu verzeihen und ihm wieder gut zu sein. Das stand wohl nicht ausgesprochen dort auf dem Blatte, aber Cornelie las es zwischen den Zeilen, wie sie immer in seine Seele zu lesen vermocht hatte. Sie weinte über den Brief und fühlte dabei, wie hoffnungslos kalt es in ihr geworden war. Wäre sie nun in der Gesinnung den kleinen Bewohnerinnen des Tränenhauses ähnlicher gewesen – am Ende hätte sie ihrem Kinde den Vater zu retten vermocht . . .

War es nicht noch möglich, wenn sie auch auf ihr letztes Besitztum, ihren letzten Weibesstolz verzichtete? Forderte die Mutterschaft auch dieses härteste Opfer von ihr? Einmal hatte sie geglaubt, für ihr Kind stolz sein zu müssen – hatte in den ersten Regungen seines jungen Lebens seine Antwort zu spüren gemeint. Vielleicht hatte sie geirrt? Es überkam sie nun eine abergläubische Furcht, wenn sie sich nicht bis zum äußersten demütige, könne das Schicksal, oder Gott, oder welche geheimnisvolle Macht über den Menschen walte, und Zerknirschung, Selbstentäußerung, Demut erwarte, ihre Schuld an ihrem Kinde strafen. Der Gedanke verließ sie nicht wieder.

Nach einigen Tagen antwortete sie Rudi Imgart kurz und freundlich, nannte ihren Aufenthaltsort, bat ihn jedoch, ihre Zurückgezogenheit zu achten und nicht weiter nach ihr zu fragen.

Und wieder nach einer kurzen Zeit schleppten Toni und Annerle mit geschäftiger Wichtigkeit einen Korb, den der Postbote gebracht hatte, in Corneliens Zimmer. Sie begannen sofort an Schnüren und Siegeln zu reißen und sahen dabei neugierig zu Cornelien auf, die zusammengefaßt neben ihnen stand und keine Miene machte, ihre teilnehmende Wißbegier zu befriedigen.

Da erhob sich denn Toni zuerst, warf Annerle einen mahnenden Blick zu und nachdem sie den Korb bis zum bequemen Öffnen fertig aus seinen Hüllen gelöst hatten, verließen sie beide das Zimmer.

Cornelie wandte sich ab, ging zum Fenster, starrte in die Nesselwildnis, die darunter mit sommerlicher Üppigkeit dunkelgrün emporgeschossen war und dachte, wie weh es tun müsse, wenn man dort mit den Händen hineingreife. Sie verfolgte den Storch, der schwerfällig die großen Flügel schlagend, in der Luft sichtbar wurde, wie er seiner abendlichen Wiesenjagd zusteuerte.

Vom Herzen aus lief ihr ein ziehender Schmerz, den sie lange nicht mehr gespürt hatte, durch die Brust und an den Armen hinunter bis in die Fingerspitzen.

Sie erschrak. So wund war alles noch in ihr?

Dann ging sie und öffnete den Korb. Er war gefüllt mit weißem feinem Linnenzeug, wie ein Kindlein es braucht, wenn es zum Leben kommt. Gleich Flaumgewölk entquoll es ihm, als Cornelie hineingriff und die Gegenstände aus der weichsten Wolle, dem zartesten Gewebe, durch ihre kalten Finger gleiten ließ. Sie saß auf den Boden, legte den Kopf an das Weidengeflecht und ihre Tränen fielen auf die Hemdchen und Jäckchen, wie Nachttau aus den Tiefen der Erde quillt. Und so weinte sie ihren letzten Stolz in Schlaf und Traum. Als sie sich endlich erhob und die kleinen Dinge zu denen, die sie selbst genäht hatte, ordnete, war ihr Gesicht noch von Tränen feucht, doch rosenrot und wie ein nadelfeines grünes Grasspitzchen streckte eine kleine, wunderlich junge Freude ein Fühlfädchen durch erstorbene Trümmer.

Sie dankte Rudi und bat ihn, ihr Kind lieb zu haben, wenn sie sterben sollte. Aber sie glaubte jetzt nicht mehr so sicher, daß sie sterben würde.

An demselben Abend erhielt Annerle die Nachricht, sie solle ihre mütterliche Freundin, die Frau Bubenberg aus Ilferlingen auf dem Bahnsteig treffen. Frau Bubenberg fuhr zu ihrer Tochter nach Zürich. Und schluchzend erzählte Annerle, als sie heimkam: Ein Telegramm habe sie dorthin gerufen, die Ärzte gäben wenig Hoffnung für das Leben der reizenden Lucie, welche dort in einer Frauenklinik sich einer schweren Operation habe unterziehen müssen. Im besten Fall war eine lange Leidenszeit dem armen Glücksvogel gewiß.

„Der Baron hat’s halt gewollt,“ murmelte Annerle. Schweigsam saßen die Mädchen beisammen. Wie Nebelschatten zogen die Erinnerungen der Versuchung durch ihre fröstelnden Herzen.

Vierzehntes Kapitel

Frau Uffenbacher hatte ihr Haus nun richtig gefüllt. Von der Dachkammer bis zur Gartenstaffel war jedes Räumchen ausgenützt. Weil der Toni ihr Papa gesagt hatte, seine Tochter habe sich in alles zu fügen, mußte sie ihr nettes Zimmerchen hergeben und in das ein wenig feuchte, dunkle, welches die Mari bewohnt hatte, übersiedeln. Für die „Neue“ war ihr Herr selbst gekommen, um zu mieten. Ein ernster, stiller Mann – aber er hatte die Matratzen untersucht, und wollte nur ein Zimmer mit der Aussicht nach den Schweizerbergen. Noch ehe die „Neue“ eintraf, kam ein Liegestuhl mit weichen Kissen, eine Kiste mit Trauben und Pfirsichen, eine zweite mit Weinflaschen und Kognak. Sie war eine große, blonde Person, wie aus dem Rubenssaal des Münchener Museums herabgestiegen. Die schwere Masse von weißem und rosigem Weiberfleisch wälzte sich verdrossen im Liegestuhl, schaute wenig nach den Schweizerbergen und hatte den Kognak schneller als Trauben und Pfirsiche vertilgt. Umgeben von kalten Hühnern, deren ausgenagte Knochen sie auf die Zimmerdielen spuckte, von Gänseleberpasteten, deren ausgeleerte Büchsen sich auf dem Scherbenhaufen hinter dem Hause türmten und von unzählbaren Flaschen verschiedener anregender Getränke, führte sie ein verdrießlich-gefräßiges Dasein. Nur zuweilen hörte man ein breites Lachen, mit dem sie die Geschichten zu würzen pflegte, die sie der Uffenbacherin aus ihrer Kellnerinnen-Vergangenheit zu berichten pflegte. Die alte Hebamme hielt sich gern in dem Zimmer auf, wo es so viel gute Tröpflein zu kosten, so viel gute Bissen zwischen den falschen Zähnen zu zermalmen gab. Nachdem der neue Gast die übrigen Bewohnerinnen des kleinen Hauses mit einem verächtlichen Aufwerfen der üppigen Lippen gemustert, schienen diese ihr nicht mehr der Mühe wert, sich weiter mit ihnen abzugeben. Die drei Mädchen, die nun so manche Woche in friedlichschwesterlicher Eintracht ihres nahenden Zieles gewartet hatten, begehrten auch wenig danach, ihren Kreis zu erweitern. An einem kühlen, windigen Regenabend, der im August die erste Ahnung des nahenden Herbstes brachte, kehrten dann noch zwei Mädchen in Reformkleidern im Tränenhause ein. Die eine mußte sich sofort zu Bett legen – man bekam sie überhaupt nicht mehr zu sehen. Die Uffenbacherin schlurfte brummend im Haus umher und schimpfte: Man habe sie betrogen, das sei eine ganz böse Geschicht’.

Und wieder durchbebte nächtliches Weinen, Stöhnen und Wimmern die baufälligen Mauern und Dielen der alten, windschiefen Hütte. Obwohl die Hebamme eine heillose Antipathie gegen alle Ärzte besaß, mußte schon in der zweiten Nacht der Dr. Schwärzle geholt werden. Es wurde ihr unheimlich bei dem fortgesetzten Ächzen des halb besinnungslos auf ihrem Lager sich windenden Mädchens.

„Das Herz ischt’s. Die hält’s nit durch – das Herz ist nit gesund,“ sagte die Uffenbacherin bekümmert am anderen Morgen zu Cornelie. Ihre gewaltigen Backentaschen waren ihr ganz bleich und welk geworden vor Angst. „Gott soll mich bewahren – hätt’ ich das gewußt, hätt’ ich sie gar nit erst eingelasse . . . Die Schererei mit der Polizei . . . Uff . . . “

Sie wollte sie wieder ausquartieren, sie wollte sie nach München zurück schicken, woher sie gekommen waren, die beiden jungen Geschöpfe in Reformkleidern, mit tiefen Künstlerscheiteln, von denen die eine nun so grausam leiden mußte, während die andere Schlanke, Zarte, zuweilen in der Wohnstube unten erschien und nach der Hebamme rief. Bei einer solchen Gelegenheit blieb sie einen Augenblick am Kachelofen stehen, wo man bei dem rauhen Wetter ein Feuer angezündet hatte. Sie versuchte, sich die kalten, vor Angst klappernden Glieder zu wärmen.

„Wie schwer ist es doch, einen Menschen, den man lieb hat, leiden zu sehen und nicht helfen zu können,“ sagte Cornelie, die auch durch das Feuer hier gehalten wurde, und blickte das verstörte Mädchen teilnehmend an.

„Schauerlich – schauerlich!“ murmelte diese. „Die Frau will uns wieder fort haben – ich soll weiter mit der Unglücklichen,“ brach sie laut schreiend aus. „Oh – oh – sieht sie denn nicht, daß das Mädchen stirbt – sie soll sie doch sterben lassen . . . ruhig sterben lassen . . . Es ist ja doch das beste – das einzige für sie!“

Plötzlich starrte sie zwischen ihren Schmerzensschreien auf Cornelie . . . in ihre glühenden dunklen Augen kam ein Erkennen, ihr verweintes Gesicht zuckte, sie hielt die Hände vor sich, als sähe sie eine Erscheinung. Cornelie wurde rot und biß sich die Lippen. Hier war jemand, der von ihr wußte . . .

Das hagere Gesicht lächelte und mit einem Male dem Schmerz entrückt flüsterte das Mädchen in großer Erschütterung: „Mein Gott – mein Gott – Sie sind doch . . . Sie sind . . . Cornelie Reimann?“

Cornelie antwortete ihr nur mit den Augen.

„Bitte – bitte nicht . . . “ stammelte sie abwehrend und zog ihre Hände an sich, weil die andere sie ihr zu küssen versuchte.

„Verzeihen Sie,“ schluchzte das bebende Mädchen dazwischen, „es ist zu viel –. Ich bin so aufgewühlt . . . Ich bin ja keine Exaltierte . . . nur . . . Sie . . . Sie . . . ! Wie wir Sie liebten – liebten! meine Freundin und ich – was Sie uns Jungen sind . . . ahnen Sie es auch nur? Wie Sie uns alle führen . . . “

„Führen – ? Hierher?“ Cornelie wandte gequält das finstere Gesicht ab.

„Verzeihen Sie mir,“ sagte das junge Mädchen sehr sanft, „ich bin taktlos – aber Sie wissen ja alles – auch daß man jeden Takt vergessen kann? Nicht wahr? Und daß von allen Taktlosigkeiten doch diese grenzenlose Verehrung nicht berührt wird . . . ?“

„Sie lieben Ihre eigene Sehnsucht,“ sagte Cornelie mit leiser Ablehnung.

„Wir fühlen in Ihnen die Kraft, nach der wir ringen,“ antwortete das Mädchen nun einfacher und klarer. Sie strebte sichtlich vor Corneliens beherrschter Haltung der eigenen überreizten Bewegung Herr zu werden, bis eine neue Erschütterung sich auf ihren nervösen Zügen spiegelte.

„Es ist so unfaßbar, daß Sie hier sind – und eigentlich – wenn man Sie recht begreifen will . . . es ist wie ein Wunder und doch so natürlich! – Vielleicht ist es die Rettung! Es könnte meiner armen Freundin ein solcher Trost, eine solche Stärkung sein . . . Sie müssen zu ihr . . . der Doktor sagt: Das Herz – aber es ist doch nur die Qual dieser Wochen, die das Herz nicht tragen konnte . . . “

Cornelies Blick verdunkelte sich, ihr Gesicht wurde kalt, ihre Haltung hochmütig vor innerem Entsetzen.

„Nein – nein – nicht das – Ich kann nicht die Verantwortung für anderer Schicksal tragen . . . Ich will nicht.“

„Sie tragen keine Verantwortung. In diesem Falle gewiß nicht . . . Meine Freundin liebte ihren Lehrer . . . Ich will ihn nicht nennen. Er ist – Sie kennen ihn gewiß – er ist einer von den Größten in der Kunst. Es ist die ganz alltägliche Geschichte – es wäre so gekommen, auch wenn sie niemals ein Wort von Ihnen gelesen hätte. Er war ja doch das Höchste auf Erden, zu dem sie betete – mehr noch als zu Ihnen – wie sollte sie ihm denn da widerstehen? Nur glaubte sie stärker zu sein, als sie es in Wahrheit ist. Sie wollte ihr Kind haben, und konnte es doch nicht durchführen – sie gestand ihren Eltern alles – die haben sie verstoßen – alle ihre Briefe, alle Telegramme zurückgesandt. Prediger ist ihr Vater – Prediger der christlichen Liebe . . . “ Sie schüttelte wütend die mageren Hände. In ihren glühenden Augen brannte der Haß der jüdischen Rasse. „Ach – wenn ich den Leuten etwas antun könnte . . . “

Cornelie schwieg und senkte den Kopf, als träfe ein Teil dieses Hasses sie selbst.

„Und der Mann?“ fragte sie dann leise, hoffnungslos. Das Mädchen zuckte die Schultern, sie machte eine Bewegung mit der Hand, als schiebe sie etwas hinweg.

„Er war ja viel zu groß – viel zu berühmt, um eine kleine Malschülerin zu seiner Frau zu machen. Sie hat es auch immer gewußt. Mit ihm wäre sie wohl fertig geworden –. Sie war ein stolzes Mädchen. An den Beschimpfungen, mit denen man sie zu Haus zerschlagen hat – daran zerbricht sie . . . Gehen Sie zu ihr, Fräulein Reimann . . . wenn jemand noch helfen kann, sind Sie es.“

Die Freundin begann wieder zu weinen. „Bereiten Sie sie vor,“ sagte Cornelie leise. „Und rufen Sie mich dann.“

Das Mädchen ging. Über der unförmigen Nase die glühenden Augen richteten sich von der Tür noch einmal beschwörend auf Cornelie. Diese saß auf der schmalen Holzbank, welche nach schwäbischer Bauernsitte rings um die Wand lief; die Hände hatte sie fest gefaltet, so starrte sie wehevoll auf die gescheuerten Dielen. Die Kuckucksuhr schlug eine Viertelstunde nach der andern. Annerle schaute herein und zog sich nach einem Blick auf Corneliens gedankenversunkene Gestalt wieder zurück. Die Bäckin kam herein, ließ sich stöhnend auf eine andere Seite der Bank nieder und aß ein Brot mit Wurst.

„Das wird eine schwere Nacht,“ begann sie. Cornelie nickte nur mit dem Kopf. Auch die Bäckin schwieg. Man hörte ihr Kauen und Schmatzen und das Krachen der Holzscheite im Ofen, das Rieseln des Regens an den kleinen Fensterscheiben.

Dann kam die Freundin, blickte Cornelie liebevoll an und winkte ihr hinaus.

„Es war so schwer, das Weib zu entfernen,“ seufzte sie.

„Ich glaube, sie hat jetzt weniger Schmerzen. Wäre sie nur nicht so apathisch. Mich ängstigt ihre Gleichgültigkeit.“

Cornelie trat lautlos ein, wandte sich mit leisen, stillen Bewegungen zu dem Bett.

Gleichmäßig kam und ging das röchelnde Ächzen aus der Kranken bläulichen Lippen. Bei jedem Ächzen hoben sich die Hände und Arme wie von einer Maschine bewegt, fielen auf die Decke nieder und hoben sich wieder. Das Antlitz trug eine seltsam silberweiße Farbe mit bläulichen Schatten um die Augen – aber diese Augen sahen niemand mehr. Cornelie stand eine Weile neben der Sterbenden. Einmal nahm sie ein Tuch, das dort lag, und wischte ihr zart die von kaltem Schweiß beperlte Stirn, flößte ihr mit Hilfe der Freundin einige Tropfen Flüssigkeit zwischen die zersprungenen Lippen.

„Sie hat doch noch Kraft,“ flüsterte die Getreue. „Sehen Sie nur die Hände . . . Ich glaube sie lächelte, als ich Ihren Namen nannte . . . Du, Annelies, Liebe – hörst du mich,“ versuchte sie aufs neue, „denke nur, Cornelie Reimann ist hier.“

Cornelie fuhr es wie ein Schlag durchs Herz, als sie ihren Namen so nennen hörte.

„Lassen Sie sie ruhen,“ flüsterte sie der Unerfahrenen warnend zu. Das Antlitz der Kranken schrumpfte in diesem Augenblick zusammen wie ein dürres Blatt, der bläuliche Mund öffnete sich, der Körper bäumte hoch auf, die Hände rangen in der Luft – Cornelie hielt sie aufrecht, während die Uffenbacherin zur Hilfe herbeigeeilt kam. In der Nacht, nach einem erneuten furchtbaren Schmerzensanfall, wurde sie erlöst, noch ehe das Kind von ihrer zerstörten Kraft geboren werden konnte.

Die Freundin der jungen Toten benachrichtigte telegraphisch die Eltern und den berühmten Meister von ihrem Ableben. Annerle, Toni und auch die blasse bescheidene Luis hatten das Lager ihrer erlösten Schwester mit allen Rosen und Reseden, die sie in der unteren Dorfstraße bei den armen Ziehmüttern zusammen betteln konnten, umkränzt. So lag die Tote, Rosen auf der Brust und Rosen in den Händen, mit dem schmalen verschlossenen norddeutschen Gesichtchen zwischen den hellbraunen Scheiteln, die der Farbe einer jungen Hindin glichen, als am nächsten Morgen ihr Bruder eintraf, die Leiche heimzuholen. Ein junger Assessor mit korrekt gestutztem blonden Bärtchen, im korrekten schwarzen Rock, mit demselben verschlossenen Gesichtsausdruck, den die Leiche auf ihrem weißen Lager trug. Die Uffenbacherin führte ihn hinein, wo die Getreue still neben der Toten saß. Er blieb nur wenige Minuten, gab im Flur der Uffenbacherin einige kurze Anweisungen über die Beförderung des Sarges zur Bahnstation und verließ mit demselben festen korrekten Schritt, mit dem er eingetreten war, das Tränenhaus. Einige Minuten später erschien die Freundin bei Cornelie. Ihre Hände zitterten, ihre Gesichtszüge zuckten im Nervenkrampf.

„Ich kann nicht allein sein,“ stieß sie hervor, und die glühenden schwarzen Augen hingen mit einem wunderbaren Blick an Cornelie.

„War es sehr qualvoll?“ fragte diese. „Ich sah ihn vom Fenster. Er sah aus wie ein Mensch, der sich beherrschen kann.“

„Ob er das konnte . . . “ Plötzlich begann das Mädchen hysterisch zu lachen. „Wissen Sie was er sagte, als er die Rosen in Annelies’ Händen sah: Von wem sind denn die? Und als ich antwortete: Von uns – da sah er mich an – o ich weiß, er dachte: Dies exaltierte Judenmädel . . . Aber er sagte nur: Welche Sentimentalität . . . Und dann so ganz geschäftsmäßig: ‚Meine Schwester ist bei einem Ausflug in den Bergen abgestürzt. Die Zeitungen werden eine diesbezügliche Nachricht bringen. Wir erwarten von Ihrer Diskretion, daß Sie die Version auch Ihren Bekannten gegenüber aufrecht halten‘ . . . – Daß ich ihn nicht ins Gesicht geschlagen habe!“

Cornelie schauderte. Leise nahm sie die Hände des zerwühlten Mädchens, streichelte und liebkoste sie, und diese fiel endlich vor ihr auf die Knie, drückte den glühenden schwarzen Krauskopf in ihren Schoß und schluchzte sich Erleichterung.

Der Sarg war auf einem bäuerlichen Leiterwagen zur Station geschafft worden.

Annerle, die mit der Luis und der Toni seinem Verladen in einen Packwagen beigewohnt hatte, war bei der roten Bärbe eingekehrt und stärkte sich dort durch ein Kirschwasser, das sie selbst besorgt und geschenkt hatte. Die Uffenbacherin und die Bäckin „veschperten“ mit der dicken Blonden in der Küche und probierten eine neue Sorte Wein.

Cornelie hatte die Freundin, die aufgeregt und fiebernd durch unnütze Geschäftigkeit die traurigen Dinge noch trauriger machte, endlich am Arm genommen und sie dem letzen unwürdigen Eindruck des auf den Brettern des leeren Erntewagens dahinschaukelnden Sarges entzogen, indem sie sie in ihr Zimmer führte und sie sich aussprechen ließ. Erinnerungen an die Tote – an die gemeinsame Studienzeit in München, Geständnisse eines brennenden Neides, als der angebetete Lehrer sich der Freundin zugeneigt habe – Freundschafts-Aufopferung, welche die eigne Leidenschaft zu betäuben suchte . . . Dazwischen Deklamationen über Welt- und Gesellschaftsordnung, junge rasende Empörung über die Eiswände der Konvention, an denen die beiden Sturmgeister sich die heißen Köpfe wund gestoßen hatten . . . Begeisterungsausbrüche über neue Rechte des Weibes, Rechte des Menschen, sein Leben zu leben, nicht das der andern . . . Cornelie ließ das Mädchen geduldig all den Jammer ihres in den letzten Tagen so grausam mißhandelten Herzens in blutrünstigen Worten austoben. Sie neidete der jungen Jüdin das konvulsivische Entrüstungs-Pathos – diesen sinnlichen Fanatismus der Wut. Sie selbst fühlte nur immer wieder: Grausame, grausame Natur . . . Sie fühlte nur: Weibesschicksal, das durch keine Gesetze, keine Rechte abzuwenden war. Das immer wieder vernichten mußte, so lange Mädchen leben und lieben – so lange Männer Männer bleiben . . .

Wie schal, klein und nichtig schienen diesem Ewigen gegenüber alle die phantastischen oder ausgeklügelten Umwälzungsvorschläge, von denen sie in den letzten Wochen gelesen hatte. Sandkörner – in einen Abgrund geblasen –.

Aber es mußte ja schön sein, den Glauben daran zu haben . . .

Und es war hart, ohne einen solchen Glauben an ein leuchtendes Ziel einen neuen unbekannten Weg zu gehen. Aber sie konnte sich nicht betrügen mit funkelnden Gedanken und schäumenden Worten, die in sich selbst versanken, wenn die Sonne der Wirklichkeit heiß über ihnen brannte. Später half sie die wenigen Sachen, welche die Verstorbene im Handköfferchen mit sich geführt hatte, und ihr phantastisches Reformfähnchen zusammen zu packen und an die Eltern zu adressieren. Die Freundin vermochte die Feder nicht in den von einem Nervenzittern befallenen Händen zu führen, als sie Namen und Titel des gehaßten Predigers niederzuschreiben versuchte.

Das Köfferchen hatte auf seinem Grunde auch ein schmales Päckchen Briefe enthalten. Die lagen nun noch auf dem Tische. Die Freundin wurde plötzlich rot, als sie sie zögernd mit der Hand berührte.

„Ins Feuer!“ sagte Cornelie bestimmt.

„Ich gönnte es ihm, daß er sie noch einmal lesen müßte – jetzt . . . “ flüsterte die Jüdin. Ihre Augen funkelten.

„Ins Feuer,“ wiederholte Cornelie. Sie nahm die mit blutrotem Seidenband umwundenen weißen Zettel aus den heißen Fingern der anderen, öffnete die Ofentür und hielt ein Zündholz an die Blätter. In wenigen Augenblicken waren sie aus einer hellen Flamme zu einem Häuflein verkohlten Staubes geworden. Cornelie streifte mit dem Blicke das Gesicht des Mädchens, das gierig atmend, mit dunkel glühenden Augen dem Vorgang gefolgt war.

. . . Begehrte er dich morgen, der große Meister – du würdest ihm doch nicht widerstehen, ging es ihr durch den Sinn.

Zum Abendzug brachte sie die Malerin zur Bahn.

Der Fluß rauschte kühl unter den Erlen, ein feuchter Wind wehte stark über das Land, das nach der Ernte leer und weit in der Dämmerung lag. Zarte Nebel zogen Schleiertücher über die kahlen Äcker, auf denen Cornelie das Korn hatte wogen, reifen und fallen sehen. Von den letzten Regentagen war ein herbstlich-herber Hauch in der Luft zurück geblieben.

Wie lange noch? Wie lange – ? Würde sie im kommenden Winter den Schnee vor den Fenstern wirbeln sehen . . . ? Tot sein . . . Wie seltsam, daß man sich vom Nichtsein keine Vorstellung machen kann, solange man sich lebend fühlt . . .

Cornelies Hand wurde ergriffen, mit einem leisen Mißbehagen duldete sie die Küsse des fiebernden Mädchenmundes auf ihrer Haut.

„Lassen Sie mich bei Ihnen – lassen Sie mich Sie pflegen, Sie lieben . . . “

„Kind, das ist unmöglich,“ antwortete Cornelie ein wenig hart und nüchtern.

„Es würde mich so beglücken. – Ich kann – ich kann es nicht ertragen, Sie mir hier unter diesen Menschen zu denken.“

Cornelie wandte den Kopf zur Seite. Sie war gerührt und empfand doch das Anerbieten als ein unberufenes Eindringen in ihren Lebenskreis, den sie nicht öffnen mochte, am wenigstens für dieses in schwülen Schmerzen aufgelöste Mitgefühl.

„Sorgen Sie nicht um mich: Ich weiß, weshalb ich hier bin und an keinem anderen Orte. Mißverstehen Sie mich nicht – es ist nicht etwa aus Buße oder aus Lust am Martyrium. Nein – ich fühle einfach, daß ich hierher gehöre . . . “

Sie schwieg eine Weile, denn sie sprach ungern von sich, doch fühlte sie, wie grausam es gewesen sein würde, sich ganz zu verschließen, vor dem so sehr nach Trost lechzenden Geschöpf an ihrer Seite. Und so begann sie wieder, schwer, langsam: „Anfangs wußte ich wohl selbst nicht, was ich hier sollte . . . Wir glauben alle, unser ganz persönliches Leben nach unserm Wollen zu führen, und dabei leben wir doch zugleich mit dem persönlichen noch ein typisches Leben der Zeit, das wir aber nur in seltenen Augenblicken durch die Hülle des persönlichen hindurch erkennen. Das wird nicht von dem individuellen Willen bestimmt, sondern durch Bedingungen, über die wir gar keine Gewalt haben. Darum tun wir wohl so oft Dinge, von denen wir fühlen, wir tun sie aus einem Zwang, der gegen unsere individuelle Natur ist. Das Schicksal hat manche unter uns ausersehen zu Symbolen der Zeit. Wir tragen ihr Brandmal oder ihre Flammenzunge an der Stirne – wissen nicht, ob das feurige Zeichen Schande oder Ehre bedeutet . . . Wer einmal so gezeichnet wurde, der muß sein Los auf sich nehmen und seine letzten Bitterkeiten austrinken. Er wird ahnen, daß nur auf diesem Wege sein Leben reif werden kann, zu einer Frucht am Erntekranz der Zeit. Ich weiß nicht, ob Sie mich verstehen, – so recht kann ich das wohl nur selbst empfinden.“

Die junge Malerin neigte den Kopf. „Meinen Sie damit Gottes Willen tun?“ fragte sie zögernd.

„Ich glaube nicht mehr an einen persönlichen Gott,“ sagte Cornelie. „Und es war eine Erlösung, als ich diesen Glauben endlich von mir tun konnte. Aber da sind doch unbegreifliche Mächte hinter allem sichtbaren Geschehen. Ahnen wir in seltenen Augenblicken das Gesetz unsres eignen Lebens, müssen wir uns ihm beugen, wenn es auch noch so erschreckend droht. Denn es ist doch das Göttliche. – – Einmal mußte wohl alles dieses von einer Frau gelitten werden, die es nicht nur dumpf quälend fühlt, sondern die es in Erkenntnis umwandeln wird . . . jetzt noch nicht – einmal in der Zukunft . . . Das geschieht nur, wenn die Zeit dafür gekommen ist. Ich meine, wenn da draußen viele sind, die warten, daß eine letzte Türe zu einer Erkenntnis ihnen geöffnet wird.

Vielleicht sage ich das heute nur zu Ihnen – vielleicht bin ich auch nur ein verunglückter Versuch der Natur, den sie braucht, um zu einem bestimmten Punkte vorzudringen. Das weiß ich ja nicht. Am Ende bin ich auch zu schwach. Aber dann wird ganz gewiß eine Stärkere kommen.“

Die dunklen Augen des jungen Mädchens sahen über der unförmigen Nase bewundernd zu Cornelie empor.

„Nun glaube ich eher, Sie zu begreifen.“

„Überschätzen Sie mich nur nicht,“ sagte Cornelie mit schmerzverzogenem Munde. Man ist ja nichts einzelnes. Man ist das notwendige Glied einer notwendigen Kette. Noch vor einem Jahr habe ich Unendliches gewollt – jetzt warte ich nur, was mit mir geschehen soll.“

Die Begleiterin lachte plötzlich nervös und leidenschaftlich. „Nein – ich verstehe Sie doch nicht. Cornelie Reimann, die geduldig und schwach ist! Es ist körperliche Müdigkeit – oder Sie erniedrigen sich absichtlich! Was könnten Sie tun – welchen Einfluß könnten Sie haben – stolz wie eine Königin sollten Sie mit Ihrer Mütterlichkeit unter die Menge treten . . . damit man endlich einsieht . . . “

„Mütterlichkeit als Propagandamittel?“ fragte Cornelie. „Das möcht’ ich meinem Kindchen doch nicht antun.“

„Wenn Sie spotten, können Sie grausam werden.“

„Verzeihen Sie mir,“ sagte Cornelie einfach. „Ich wollte Sie gewiß nicht verletzen . . . Nur – sehen Sie, liebes Kind – Geschrei und Kampf und Wut, das zerstört doch nur. Alles natürlich Werdende wächst still und langsam . . . Wenn ich hier abends – wie viele Abende – an dem kleinen Flusse entlang gegangen bin, sah ihn so jung, so durchsichtig, daß man jedes Kieselchen auf seinem Grunde unterscheiden konnte – dann stellte ich mir vor, wie er weiterhin wächst und schwillt, von hundert Bächen und Nebenflüssen genährt – wie er, ein brausender Strom, zum Stolz eines gewaltigen Landes wird – wie unter hoch geschwungenen Brücken der Verkehr einer Kaiserstadt in Schiffen und Dampfern auf seinen mächtigen Wogen schwimmt, wie er durch ungeheure Felsentore brechend, die Welt des Okzidentes mit dem Orient verbindet . . . – das kleine, junge, dumme – spielerische Flüßchen hier unter den Erlenbüschen . . . “

Sie blieb stehen, ihre Augen blickten, dem Lauf der Plätscherwellen folgend, in die dunkelnde Ferne. „Ich träume oft, wie dieser Fluß geworden ist – solche Macht und Gewalt könnten die Frauen bekommen, wenn sie sich nicht länger um eines Dogmas willen gegenseitig hassen, verachten und verfolgen würden.

Solche Macht und Gewalt könnte der Gedanke der Liebe gewinnen, wenn er die Frauen zu einer Einheit zusammengießen würde – darin alle für eine und eine für alle stehen in jener Zeit, wo die Frau am meisten Weib, am schutzbedürftigsten ist – und wo der Mann seiner Natur nach versagen muß, wo er dem letzten Weibgeheimnis immer fremd und peinvoll betroffen gegenüber stehen wird. – Gott! Gott – ! Zur Zeit ihrer werdenden Mutterschaft wütet gegen die Tochter die Mutter – die Schwester gegen die Schwester . . . Vor der ewigen Not und dem ewigen Ruhm des Weibes versinkt nicht in jeder Frauen Gefühl das Tagesgesetz der Gesellschaft wie ein ödes ekles Gespenst! Vor diesem ewig Gewaltigen, das eisern das Weib zum Weibe binden sollte, macht es Gemeinschaft mit dem Manne, um im Verein mit ihm die Schwester im Geschlechte zu morden . . .

Die Frauen sind keiner Rechte wert . . . keiner bürgerlichen und keiner ideellen – so lange sie dieses ihr heiligstes Recht – ihre gewaltigste Pflicht und Macht nicht erfassen wollen!“

Cornelie strömten die Tränen über das zum Himmel erhobene Gesicht. „Tag und Nacht sehe ich ihn vor mir, den langen Zug der verirrten, verlassenen jungen Kinder. – Wo sind die Mütter, die sie geboren haben – ? Wo sind die Mütter im Gefühl, die ihre Arme weit ausbreiten, den Gequälten, Mißhandelten entgegen: Kommt zu mir, ihr Armen, ihr Enttäuschten, ihr werdenden Mütter, daß ihr meine Töchter seid und aus meinem glühenden Herzen aufs neue das süße Wiegenlied der Mutterliebe lernt!“

Ihre Klage klang laut wie ein Schrei über das nächtliche Feld. Als der Zug schon daherbrauste, nahm Cornelie noch einmal die Hand der jungen Malerin und drückte sie fest.

„In Ihnen ist mir das Zusammengehörigkeitsgefühl zum erstenmal entgegengetreten. Das werde ich nicht vergessen. Vielleicht sollen die Töchter Ihres Volkes, die Erinnerung an Schmach und Verfolgung im Blute tragen, auch die ersten sein, in denen die Liebe, die ich meine, sich offenbart!“

„Den Glauben will ich mit hinausnehmen,“ flüsterte das Mädchen. „Nun haben Sie mich doch getröstet.“

Ihr Tuch flatterte noch lange, während der Bahnzug sich entfernte.

Cornelie wanderte in der Dunkelheit der Landstraße auf und nieder, immer wieder auf und nieder. Der Wind wogte um sie her, als käme er über ein weites Meer. Sie dachte des Prometheus, der an der Tafel der Götter saß – und dann war er geschmiedet an die Felsen eherner Notwendigkeiten, und der Geier fraß ihm die Leber aus der lebendigen Brust.

Als die Füße sie nicht mehr trugen und das Grauen der Einsamkeit überwältigend wurde, besann sie sich darauf, daß sie versprochen hatte, Toni und Annerle von der Bärbe abzuholen.

„Ja, wie schauen Sie aus, Fräulein Cornelie!“

Bärbe nahm ihre im Frostkrampf gekrümmten Finger und rieb sie sacht zwischen ihren guten, mütterlichen Händen. Mit geschlossenen Augen saß sie bei den andern, hörte ihre gedämpften Stimmen und kehrte so ins Leben zurück.

Fünfzehntes Kapitel

Die arme Toni kauerte auf der Ofenbank in der Wohnstube und aß aus ihrer Schürze unreife Birnen. Sie hatte so sehnsüchtig über den Zaun nach einem früchtebeladenen Baum gestarrt, daß die Bäuerin zu ihrem Mann gesagt hatte: „Schau das Mädle, gib ihr halt ein paar Birn’ . . . wann die Mutter ihr Gelüst nit stillen kann, wird’s Kindle ohne Kopf geboren.“

Annerle und die Bäckin nahmen an dem glücklich erbeuteten Schatz teil, aber die Bäckin behielt dabei den Wachstuchtisch im Auge, wo Cornelie der Uffenbacherin ihre Pension auszahlte. Sie schlurfte langsam näher, blickte auf die Goldstücke, seufzte tief und wischte mit dem Handrücken über die Augen.

Cornelie nickte dem Weibe aufmunternd zu und winkte ihr, während die Hebamme die gelben Stücke einzeln zwischen den Fingerspitzen prüfte. Die Bäckin seufzte wieder, noch inbrünstiger, noch hoffnungsloser als zuvor. Fräulein Cornelie hatte ihr gesagt: „Wenn ich meine Pension zahle, müssen Sie auf frischer Tat von der Uffenbacherin das Geld fordern. Es ist Ihr Recht, vor uns allen kann sie es Ihnen doch nicht weigern.“

Das war die Bäckin denn auch entschlossen zu tun und die Toni nebst dem Annerle schauten, auf die grünen Birnen beißend, wie die Sache sich entwickeln werde. Die Bäckin stand neben ihrer Feindin, blickte auf das Geld und auf Cornelien, ihre weißen, teigartigen Hände fingerten an ihrer Schürze. Die Uffenbacherin lächelte zufrieden. Sie bemerkte das Gieren und Kämpfen der Bäckin nicht einmal. Sie nahm die Geldstücke ihr vor den Augen fort, stand schwerfällig vom Stuhle auf und schloß sie in ihre Lade, deren Schlüssel sie in die Tasche ihres blau und weiß gemusterten Rockes steckte, die Bäckin beobachtete jede ihrer Bewegungen wie ein hungriges Tier ein anderes sich satt essen sieht. Sie schluckte und wischte sich die feuchten Mundwinkel, aber vergebens warteten die Fräuleins, daß ein Wort der Forderung sich diesem weinerlichen Munde entringen werde. Als der Schlüssel in der Tasche der Hebamme verschwunden war, ächzte sie noch einmal, schüttelte den Kopf, wackelte mit den breiten Hüften und setzte sich ergeben auf die Bank.

„Ein schönes Geld, ein schönes Geld,“ klagte sie. Die Uffenbacherin nahm ihre Karten zur Hand und legte sie auf dem Tisch auseinander, um zu sehen, was die nächste Zukunft ihr an weiteren freudigen Ereignissen aufgespart habe.

„Zum nächsten Sonntag schlachten wir zwei Gäns’,“ erklärte sie vergnügt. „Man muß sich was gönne auf alle die Geschichte . . . “ Sie meinte den Tod der jungen Fremden im Reformkleid. Auch Annerle, Toni und die Bäckin waren der Ansicht, daß man sich was gönnen müsse.

„Ein Weinkraut tät’s zum Gansbraten,“ murmelte die Bäckin und bewegte die Lippen, als schmecke sie schon die Herrlichkeit. Ihre runden Backen hingen noch wehmütig um den zu kleinen Mund.

„Aufs Leberle freue ich mich arg,“ rief Annerle. „Frau Uffenbacher, das ist gescheit, daß Sie uns mal was gutes vorsetzen wollen . . . “

Frau Uffenbacher antwortete nicht. Die Karten nahmen ihre ganze Aufmerksamkeit in Anspruch.

„Ja, das ischt doch – das ischt doch arg –“ Auch die Bäckin begann sich jetzt für die Geheimnisse zu interessieren, die Pique-Bube und die Treff-Sieben zu enthüllen im Begriff standen.

Sie rückte mit einem letzten Seufzer der Enttäuschung über ihre eigene Schwäche näher zu der Freundin.

„Was siehscht?“

„Ich hab’ sie für dich gelegt,“ sagte die Uffenbacherin in einem bedenklichen Ton.

„Für mich?“ Die Bäckin wurde ganz rot. „Ja, schau’ – ich wüßt’ selber gern . . . Siehscht nit ein Geld?“

„Nein, von Geld seh’ ich nix,“ erklärte die Hebamme energisch. „Krankheit ischt in der Näh’ – aber wieder nit im Haus . . . “

„Wird doch nicht,“ jammerte die Bäckin erschrocken, „geh’, du willscht mir nur Furcht mache!“

„Ich les’ nur, was die Karten sagen. Eins ist in Not und Gefahr. Du bischt’s nit. Aber eins, das dich nahe angeht. Das Unglück steht hinter der Tür’ . . . Weiter kann ich nit sehen! Schau her – zwei Karten liegen dazwischen, ganz nahe bei der Hand ischt’s nit . . . “

„Doch nit etwa mit der Eisenbahn?“ fragte Annerle, die harte Birne knirschte dabei zwischen ihren Zähnen.

„Ja mei – wenn’s gar der Bäck wär’?“ fragte die geängstigte Ehefrau.

„Mag schon sein, ’s ischt der Bäck, genau kann ich’s nit sage,“ antwortete die Uffenbacherin mit der feierlichen Stimme, die sie allemal annahm, wenn sie die Karten legte.

„Jemand hat Sehnsucht nach dir – jemand, der in Not ischt . . . Ja, Bäckin, ich glaub’ als selbst, es ischt der Mann, dem ein Unheil droht.“

Der Bäckin ihre Hängewangen begannen zu zittern, ihr Mund war wie der eines Säuglings, der sich zum Weinen schief zieht.

„Mein Heiland, der Bäck!“ stammelte sie. „Er wird als wieder zu viel gesoffe habe, das kann der Mann nicht vertrage, das schlagt ihm allemal auf den Magen.“

„Du warst auch arg lang von daheim fort,“ bemerkte die Uffenbacherin tadelnd. „Da geschieht als manches, was man nit denkt. Ein Weib ist auch in der Näh’ . . . “

„Jesus, mein Heiland, wenn das so ist,“ stotterte die Bäckin, ein Bild der Bestürzung, „ha, wenn das wirklich jetzt in die Karten steht . . . “

„Kannscht selbst lesen,“ sagte die Uffenbacherin kalt, „die Treff-Sieben beim Pique-Buben . . . “

„Da muß ich heim,“ erklärte die Bäckin plötzlich.

„Wenn der Mann krank ischt, da muß ich heim – sonst versaut er mir die ganze Wohnung . . . Ischt’s gefährlich – ? Schau’ doch nach, Urschel, ob’s ans Leben geht?“

Die Uffenbacherin veränderte mit großem Ernst die Lage mehrerer Karten.

„Ungefährlich ischt’s einmal nit,“ sagte sie teilnahmsvoll und blickte über ihre Brille hinweg die Bäckin trauernd an.

„Da muß ich heim, da muß ich heim. Da fahr’ ich noch heut’ Nacht nach Ulm!“ Schon wieder liefen dicke Tränen aus den farblosen Augen über die großen Backen.

„Ich mein’ als auch, Bäckin, Ihr müßtet einmal nach dem Rechten schauen. Geb’s Gott, kommt Ihr noch zur Zeit und trefft ihn noch lebend!“

„Geb’s Gott, geb’s Gott,“ stöhnte die Bäckin, in ihrem armen Kopf schon halb verblödet vor Angst.

„Wenn mehr halt – und ischt so lang bei Fremden, ißt und trinkt und läßt sich’s wohl sein – da kommt nix gutes dabei heraus,“ orakelte die weise Frau. Ihre dunklen Augen richteten sich wieder eindrucksvoll auf ihr Opfer.

„Gelt, Bäckin – geht heim – nachher habt Ihr die Gewissensnot fürs Leben . . . “

„Ja-ja – noch heut’ abend geh’ ich – leid ist mir’s um die Gäns’ . . . Aber wenn er vielleicht gar stirbt . . . “

„Das Unglück steht hinter der Tür’,“ murmelte die Hebamme, „die Beerdigung kostet auch . . . “

Die Bäckin wiegte sich hin und her vor unerträglicher Gewissenspein. Sie hatte hier gut gegessen und getrunken, hatte sich’s wohl sein lassen – was mochte der Mann inzwischen, wenn er nicht bei Sinnen war, alles angestellt haben . . .

Die Nachtjacke und die Pantoffeln wurden in Zeitungspapier gewickelt. Die Uffenbacherin packte großherzig noch zwei Gurken und ein Gericht Kohlräble aus dem Garten dazu. Dann kam die Bäckin, schwankend wie ein gewaltiges Schiff bei hohem Seegang, die Treppe hinauf, den jungen Damen Lebewohl zu sagen. Die Hebamme brachte die geängstigte Frau zur Bahn. Manches Trostwort schenkte sie ihr noch auf den Weg, welches aber immer so wirkte, daß es die Gute nur besorgter machte, was sie an „Unglück hinter der Tür“ in der Ulmer Bäckerei und bei ihrem Ehemann vorfinden werde.

Noch am selbigen Abend begab sich die Uffenbacherin zufrieden an das Schlachten ihrer Gänse. Das wackelige Tränenhaus war am Sonntag vom Boden bis zum Keller durchzogen von den appetitlichen Düften der knusperigen Braten.

Die Fette, Blonde wurde von der Hebamme eingeladen, an dem Festschmaus in der Küche teilzunehmen. Sie spendierte dafür ein Fläschchen Aßmannshäuser Roten. Davon schenkte die Uffenbacherin auch der Hanne ein, denn sie hatte einmal wieder keinen Monatslohn bekommen. Die saftigen braunen Vögel verschwanden unter anregenden Gesprächen über Mißgeburten und schauerlichen Entbindungsvorfällen zwischen den Kinnbacken der drei kraftvoll kauenden Weiber. Das Fett lief ihnen vor Behagen an den Mundwinkeln herab. Den Fräuleins waren drei Trommelstöcke in Annerles Zimmer hinaufgeschickt worden. Annerle hielt mit ihrer sittlichen Entrüstung über eine so ungerechte Verteilung nicht zurück. Aber das verhalf ihr nicht einmal zu dem vierten Trommelstock. Die arme Toni nagte geduldig und hungrig an dem ihren, obgleich er schon längst kein Fäserchen Fleisch mehr enthielt.

„Meine Mutter schnitt mir zu Haus’ das zarteste Bruststückchen heraus,“ sagte Cornelie melancholisch.

„Die Köchin bekam den Trommelstock. Es muß nicht schön sein, eine Gans zu braten und dann nur den Trommelstock zu essen. Komme ich heim, soll sie ihn nicht wieder haben.“

Der Gänseschmaus war für die fette, blonde Senta doch schließlich verhängnisvoll geworden. Sie wälzte sich einige Tage stöhnend und schimpfend im Bett, lehnte aber den Besuch des Dr. Schwärzle mit Entschiedenheit ab und brachte am Ende einen kräftigen Knaben zur Welt. Es war ihr nur ein Kinderspiel gewesen. Dieser üppige Frauenkörper oberbayerischer Zucht, der jeder Hygiene gespottet, und in eisernen Miederpanzer gezwängt Nacht für Nacht bei nikotinvergifteter Kellerathmosphäre seines Amtes als Erreger der Sinne junger Studenten und alter Bierphilister gewaltet, tat seine Pflicht wie eine gehorsame Kuh. Aber seine Eigentümerin war weit davon entfernt, ihm dankbar zu sein. Selbst die durch manchen guten Tropfen getränkte Freundschaft der Frau Uffenbacher mußte an der grausam schlechten Laune der Wöchnerin Schaden leiden. Die Hebamme hätte wohl schwerlich ihre Geduld bewahrt, wenn der Freund nicht mit gewichtigem Händedruck sie freundlich dazu ermahnt hätte. Der ernste, stille Mann im braunen Rock war sofort eingetroffen und hatte das Kind beim Schulzen, der die Standesamtsregister führte, als seinen Sohn legitimiert. Aber auch diese erfreuliche Tatsache schien keineswegs beschwichtigend auf Sentas Zorn zu wirken.

„Mei Herrgöttl von Stuggert, ischt das eine Hex –“ rief die Uffenbacherin, die sich vor ihrem Keifen zu den Fräuleins geflüchtet hatte – „jetzt schimpft als das Weibstück wie eine Wüschte, weil er vom Aufgebot spricht . . . Eine andere wär’ dankbar, wenn der Mann sagen tät’, das Kind dürft’ nit erscht erfahren, daß seine Eltern keine Eheleut’ waren, als er auf die Welt kommen ischt. Gered’t hat er mit ihr, daß mir grad’ ’s Wasser aus den Augen gelaufen ischt! Und wie sie mault und schimpft, kommt er zu mir und sagt’: ‚Frau Uffenbacher, es wird halt die Milch sein, die ihr zu Kopf gestiegen ist, daß sie so wüscht tut.‘ Ha – die Milch ischt der nit zu Kopf gestiegen – die Bosheit ischt der zu Kopf gestiegen! Das sag’ ich! Wenn der brave Mann wüßt’, an was für eine der geraten ischt! Was die mir für Ansinnen gestellt hat . . . Geschlagen hat sie nach mir mit der Faust, weil ich’s Kind nit mit der Nabelschnur erwürgt hab’ – so ein Tier . . . da hätt’ ich können ein schönes Geld verdienen, wenn ich so was tät’ . . . Da braucht’ ich mich nit zu plage mit solche Viecher . . . Das kann der Frau Uffenbacher niemand nachsagen . . . Mein Amt hab’ ich immer in Ehren verwaltet!“

In der Tat stand die große, umfangreiche Frau vor dem Tisch, hinter dem Cornelie saß, wie eine zürnende Göttin der Ehrbarkeit. Sie besaß in solchen Augenblicken etwas schlechthin Überzeugendes.

Annerle bot ihr einen Stuhl, damit sie sich weiter auslasse und zeigte derweilen dem Fräulein Cornelie das Häkelmuster für die Windeln.

„Ich hab’ noch kein Kind mit der Nabelschnur erwürgt,“ wiederholte die Hebamme, wie in einem biblischen Triumphgesang ihrer eigenen Tugenden. „Ich kann nit begreife, wie andre so etwas tun könne – so ein arm’s unschuldig’s Würmle – da würd’ einem ja Gott strafen an der ewigen Seligkeit. Das tät’ ich nit – und wenn sie mir eine ganze Kiste Wein schicken tät’!“

Die Fräuleins stimmten ihr zu und sie war sichtlich befriedigt.

„Sagen Sie nur, Frau Uffenbacher, er ischt doch ein vermöglicher Mann, warum will ihn denn die Senta nicht heiraten?“

„S’ischt ihr zu ‚fad‘, hinter dem Ladentisch zu stehen und Hering und Salz abzuwiegen, sagt sie, und in so einer kleinen Stadt könnt’ sie nit leben und wenn er’s durchaus wollt’, nachher würd’ sie ihm schon Hörner aufsetzen . . . so wahr Gott mir helf’, das hat das Weib gesagt! Und sie wüßt’ gar nit einmal, ob das Kind von ihm wär’!“

Die Uffenbacherin war ganz erschüttert von einer Gesinnung, welche an Gemeinheit die ihrige noch übertraf.

„Der arme Mann,“ sagte Annerle, ein wunderlicher Gefühlston war in ihrer Stimme. „Ob er denn nit zur Einsicht kommt?“

„Der nit – der einmal nit,“ versicherte die Uffenbacherin. „Der ischt wie behext – und wenn’s ihm schon aufging, tät er noch sei Pflicht! Wenn ich die erscht aus dem Haus hätt’, da schlaget ich drei Kreuz!“

„Wir mit Ihnen, Frau Uffenbacher,“ versicherte Cornelie. Die Hebamme stampfte ärgerlich zur Tür. Cornelie öffnete das kleine Fenster, als sei eine giftige Luft im Zimmer und blickte trübe in die Ferne, wo von schieferblauen Wolkenzügen umwoben das Abendrot kupfern glühte.

„Wär’ es einem von uns so gut geworden,“ sagte leise die arme Toni.

„Es tut doch wohl, zu sehen, daß es noch Ehrenmänner gibt,“ murmelte Cornelie, „wenn sie auch nicht für uns geschaffen waren. Darauf kommt es ja schließlich nicht an.“

„Fräulein Cornelie – es ischt aber traurig, wenn man erst so denken muß,“ rief Annerle.

Cornelie senkte den Kopf.

„Sie haben recht, Annerle – vielleicht ist es traurig.“

Die Geschichte der fetten Münchener Kellnerin nahm eine überraschende Wendung. Das Aufgebot war beim Schulzen und beim Pfarrer bestellt.

Am zehnten Tage nach seiner Geburt sollte das Büblein getauft werden. Die Hebamme in ihrem besten Staat trug es hinauf zur Kirche, die Wöchnerin neben dem zukünftigen Gatten ging verdrossen hinterdrein. Der Pfarrer nahm die heilige Handlung, um kein unliebsames Aufsehen zu erregen, in der Sakristei vor, er richtete dann einige mahnende Worte an die Brautleute. Und zwar belobte er den Bräutigam, daß er sich endlich zur Ehe entschließe, da doch nun schon das zweite Kindlein dem Bunde entsprossen sei. Der stille, ernste Mann machte ihn auf seinen Irrtum aufmerksam, der Pfarrer aber blickte die Braut noch einmal forschend an und sagte: „Ich kannte Sie gleich wieder als Sie herein traten – Sie haben schon ein Kind an dieser Stelle taufen lassen – die Vorgängerin der Frau Uffenbacher trug es. Wir können ja im Kirchenbuch nachschlagen, in welchem Jahr es gewesen ist. – Lebt denn das Kind nicht mehr, daß Sie es so gänzlich vergessen haben?“

Die Braut stand schweigend mit trotzig aufgeworfenen Lippen. Der stille, ernste Freund aber ließ sie samt der Hebamme allein ins Wirtshaus gehen, wo ein Frühstück bereit stand. Er begleitete den Pfarrer in seine Wohnung, um sich selbst im Kirchenbuche die Bestätigung zu holen. Der weiße Zettel im schwarzen Kasten wurde entfernt. Der Bub kam bei der Fischerin in Pflege. „Später nehm’ ich ihn zu mir, ins Geschäft,“ sagte der fragliche Vater wehmütig. Er zeigte sich nur noch, um die Rechnung für die Taufe zu begleichen. Es war anzunehmen, daß die Uffenbacherin ihn bei dieser Gelegenheit noch weiter aufklärte. Dann verschwand der stille Mann aus Schopfingen. Cornelie sah ihn die Landstraße hinab zum Bahnhof gehen, eine gestickte Reisetasche trug er in der Hand. Sie blickte lange hinter ihm her, auf den gebeugten traurigen Rücken in dem braunen Rock.

Die fette Blonde kehrte rosenrot blühend mit einem bösen Hohnlachen zu ihrem nächtlichen Schenkinnenamte zurück.

Sechzehntes Kapitel

Nach diesem wurde es wieder still und friedlich im Häuschen an der Hügelflanke. Die Birnen vom großen Baum waren geerntet. Über die Stoppelfelder flogen im goldnen Herbstsonnenschein die Fäden des Altweibersommers. Der Storchenvater lehrte seine Brut. Rings um den Kirchturm sah man das unbeholfene Flügelschlagen der jungen Störchlein, die für die Winterreise gewaltig üben mußten.

Wenn Cornelie die schwermütigen und hoffnungslosen Gedanken allzu sehr bedrängen wollten, ging sie die untere Dorfstraße hinab und saß ein Weilchen bei der roten Bärbe, auf der hölzernen Bank, die um die Wand der kleinen Stube lief, wo die Bärbe mit ihrer Mutter und ihren Ziehkinderchen hauste. Zwar trug die Bärbe den Trauring am Finger, aber eine „Verlassene“ war sie auch und von Ehe und Mutterschaft war ihr nichts geblieben als ein leerer Kinderwagen mit himmelblauen Gardinen, den der Mann ihr in einer großartigen Laune geschenkt hatte, ehe er eines Tages mit andern italienischen Bahnarbeitern von dannen zog und nicht mehr wiederkehrte. Die Bärbe sprach nie von diesen Traurigkeiten. Sie tat alles, was eine Mutter nur tun kann für ihre Pfleglinge – nur den Wagen, unter dessen blauen Gardinen ihr eigenes totes Kindchen geschlummert hatte, den durfte keines von ihnen benutzen. Er stand, sorglich in ein weißes Laken gehüllt, auf dem Speicher des kleinen Hauses. Das Stübchen unten war immer voll Sonne, das Liesl mit den schönen Füßchen spielte und lachte, und das Agathle, dessen Mutter so bitter gekränkt war, daß es immer noch lebte, krähte jauchzend auf dem Arm der alten Frau mit dem lieben Großmutterlächeln, als warte ein Dasein voll Wonne und Herrlichkeit auf das ausgestoßene, arme, überflüssige Geschöpfchen. Die Nähmaschine klapperte unter den großen kräftigen Händen der Bärbe, die ab und zu gesäumte Stücke Leinenzeug in den Korb neben sich warf, und dabei mit ihrem guten schwäbischen Humor etwas Drolliges zu erzählen wußte.

Hatte Cornelie die stille, gesunde Friedensluft geatmet, die das Heim der zwei Frauen erfüllte, so kehrte sie immer ein wenig froher ins Tränenhaus zurück.

Dem Annerle war meistens „nit recht extra zu Mut“. Das letzte Ereignis hatte einen Stachel in ihrer Seele zurückgelassen. Sie hatte es bisher für ganz selbstverständlich gehalten, die Zeit, da sie dem Hansel nicht gefiel, in der langweiligen Abgeschiedenheit zu verbringen. Nachdem sie die zarte Fürsorge des Mannes im braunen Rocke beobachtet hatte, nagte das Bedürfnis an ihr, sich selbst und dem Fräulein Cornelie zu beweisen, daß der Hansel hinter jenem nicht zurückstehe. Als der Herr Geheimrat einmal wieder die Villa Uffenbacher mit seinem Besuche beehrte, weinte das Annerle und erklärte ihm, die Sehnsucht müsse dem Kindle schaden, wenn der Herr Geheimrat es nicht zuwege bringe, daß der Hans sie einmal besuche. Sie wisse wohl, da sei ein reiches Judenmädle, das er längst hätte heiraten sollen, und es käme ihr arg verdächtig vor, daß er sich gar nicht einmal nach ihr umschauen wolle. Versprochen habe er’s ihr längst – aber wer niemals Wort hielte, das sei der Hans. Jeden Sonntag schaue sie vergebens nach ihm aus. Sie müsse sich gerad’ schämen vor der Frau Uffenbacher und den Fräuleins. Der Herr Geheimrat tröstete sie nach besten Kräften und versprach, sein Möglichstes zu tun. Das Annerle hatte eine feine seidene Geldbörse für ihn gehäkelt, die ihn sichtlich erfreute. Sie wußte, daß er noch diese altfränkischen Börsen statt des Portemonnaies zu tragen liebte. – Das Annerle erriet in einer beinahe unbegreiflichen Weise stets, welchem Bedürfnisse sie bei ihren Freunden durch eine Handarbeit abhelfen konnte.

Am folgenden Sonntag kam der Hans. Der Bub vom Weichensteller trug einen Korb mit zwei Flaschen Sekt hinter ihm drein.

Annerle hatte die grauen Filzpantoffeln gegen ein paar allerliebste Schühchen mit hohen Hacken vertauscht, die spitzenumflatterte Matinee, ein Geschenk der Lucie Bubenberg, verhüllte ihre umfängliche kleine Gestalt. Die Stirnlöckchen waren zierlich gekräuselt.

Frau Uffenbacher band die weiße Schürze vor, die sie anzulegen pflegte, wenn ein „Herr“ ihrer Anstalt die Ehre seines Besuches verschaffte. Sogar die arme Toni putzte sich ein wenig heraus und erwähnte ihre Genugtuung, daß der Besuch des Hans auf den Sonntag falle, an dem der Papa mit dem seinen aussetzte.

Cornelie ließ sich das Essen auf ihr Zimmer bringen und lud die Toni dazu ein. Gegen Abend, während sie, die jetzt oft an großer Schwäche litt, auf dem von den kombiniertesten Düften durchzogenen Kanapee ruhte, kam Annerle zu ihr herüber. Heiß und rot war das kleine mollige Mädchen, mit zerzaustem Haar und glänzenden Augen. Sie wollte das Fräulein Cornelie recht schön bitten, ob sie nicht nach dem Nachtmahl ein wenig herüberkommen möchte und ein Glas Sekt trinken. Es sei französischer und der Hans sei so begierig sie kennen zu lernen und so dankbar für die Freundschaft, die das Fräulein Cornelie seinem Mädle bewiesen habe. Und mit dem reichen Judenmädle, daran denke er jetzt gar nimmer. – „Aber wissens,“ gestand sie zuletzt kleinlaut zu Corneliens Ohr hinabgeneigt, „im Kopf rumgangen ist ihm die Partie doch – sonst wär’ er längst schon einmal hier gewesen! Ach, Fräulein Cornelie – die Mannsleut’! . . . wenn man sie nur nit so arg gern hätt’.“

Cornelie ging hinüber in Annerles Zimmer und sie tranken französischen Sekt aus den Waschtischgläsern, der Hansel und sein Schatz, die dabei Hand in Hand auf dem Sofa saßen, die Toni, welche gleich einen Schwips bekam und fortwährend kicherte, und Cornelie, für die der Hansel die besten seiner salonfähigen Anekdoten hervorsuchte. Die gesunde Lebensfreude, die von dem hübschen blonden Manne, von seinen blauen Augen, seinem kräftigen Munde mit den starken Zähnen, seiner ganzen, das Jüdische nur leicht verratenden Erscheinung ausging, zwang die traurigen Frauen für einige Stunden unwiderstehlich in den Bann eines fröhlichen Genießens. Cornelie konnte begreifen, wie Annerle den guten Tirektor Häberle mit seinen zehntausend Mark Einnahmen verschmäht hatte, und so treu in der heikeligen Situation des „kleinen Verhältnisses“ aushielt. Auch daß sie alles vergab, was immerfort vergeben werden mußte.

Ihr kluges, durch ihren Zustand ein wenig verschwollenes Gesicht strahlte befriedigt zu Cornelien hinüber, als sie bemerkte, daß ihr Geliebter den Beifall der heimlich Vergötterten fand. Hin und wieder blickte sie den Schatz von der Seite forschend an. Zwischen Cornelie und ihm hatte sich aus aller Munterkeit heraus ein Gespräch angesponnen, das leicht an den Gegenständen hinglitt, sie kaum berührend und zu andern überspringend, die mit derselben Selbstverständlichkeit behandelt und wieder verlassen wurden . . . Annerle sah plötzlich mit einigem Erstaunen den ihr so Vertrauten in einer Sprache reden, die ihn ihr in einen andern Gesellschaftskreis entführte, zu dem sie keinen Zutritt hatte – in den sie bisher auch niemals begehrte. Cornelie spürte schnell das Unbehagen der kleinen Freundin und lenkte in die augenblicklich gegebene Situation zurück, indem sie von Annerle selbst und ihren mancherlei Kämpfen mit der Uffenbacherin zu erzählen begann. Da waren denn die beiden andern Mädchen gleich in ihrem Element und was im Erleben fatal genug gewesen, wurde nun mit fröhlichem Humor zu den possierlichsten Szenen ausgestaltet. Als der Hansel Abschied nahm, denn Frau Uffenbacher hielt auf ihre Reputation im Hause, übernachten durfte niemals ein Herr, und sei er auch Vater oder Bruder zu einem der Fräuleins – da mußte Cornelie es sich gestehen, daß sie sich heiter angeregt fühlte und einen fröhlichen Abend verbracht hatte – unbeschadet der Tatsache, daß der Sekt nur aus Waschtischgläsern getrunken worden war. Oder vielleicht gerade deshalb. Am andern Morgen kam der Hans noch einmal Lebewohl zu sagen. Cornelie hörte ihn auf der Staffel vor der Haustür mit der Hebamme und dem Annerle schäkern, dabei entschädigte er sich denn für die am vergangenen Abend eingehaltene Reserve durch die saftigsten Späße.

„Geh’ Hansel,“ flüsterte Annerle zum erstenmal ein wenig beleidigt, „bei der Fräulein Cornelie stehts Fenster auf . . . Gestern hab’ ich dich schier nit wieder kennt – aber du bist schon der Alte geblieben. Vor mir hascht halt gar kei’ Ehrfurcht!“

„Ehrfurcht!“ Der Hansel lachte laut heraus. „Vor meinem dicken Frauchen werd’ ich Ehrfurcht haben! Da fühl’ ich ganz was anderes!“

Das Geräusch eines Kusses klang herauf und unter Annerles befriedigtem Gekicher, mit dem Refrain eines herausgeschmetterten Coupletverses schied mei Hansel aus dem Tränenhaus.

Als Annerle endlich ihre Mutterschmerzen leiden mußte, kannte ihr Zorn über eine solche Ungehörigkeit der Natur keine Grenzen. Sie bekamen es alle zu hören, die Natur, das Schicksal – der liebe Gott auch. – Gar dem abwesenden Hansel, dem unmittelbarsten Anstifter dieser Ängste, wurden Kosenamen zuteil, wie er sie sonst nicht von den liebevollen Lippen seines Mädchens zu hören bekam. Auch mit der Frau Uffenbacher zankte Annerle zwischen Stöhnen und Wimmern wie ein schwäbischer Rohrspatz. Aber wenn die sonst so zornwütige Hebamme im Dienst war, hatte sie sich ganz zur weisen Frau umgewandelt. Mit unerschütterlicher Sanftmut waltete sie ihres Amtes und nahm die seltsamsten Beleidigungen von ihren Fräuleins hin, während sie versicherte: Schimpfen täte den Kindbetterinnen gut und wär’ gesünder als Schreien. Zuhörer mußte das Annerle haben, sonst wäre ja die ganze Geschichte nur der halbe Spaß gewesen. Sie war nicht zufrieden, bis sie nicht abwechselnd alles, was sie in Schopfingen kannte, um ihr Bett versammelt sah. Cornelie und Toni ließ sie schon gar nicht von ihrer Seite, auch die Bärbe und die Fischerin sprachen am späten Abend noch vor und gaben Ratschläge und Meinungen. Daß der Herr Geheimrat kurz ehe die Wehen begannen abgefahren war, wurde von Annerle mit heuchlerischem Bedauern als Glücksfall gepriesen. Die Hanne erschien ab und zu in der Türe und blickte mit wollüstiger Neugier auf das schmerzverzogene, dunkelrote Gesicht unter dem zerzausten Blondhaar. Die arme Toni saß wie hypnotisiert vor Grauen und verfiel dazwischen in ein unwiderstehliches Gelächter über Annerles drastische Art, sich gegen die unabänderlichen Schmerzen zu empören.

Als die Nacht vorrückte, versuchte Cornelie das junge Geschöpf zu entfernen – sie selbst fühlte, daß sie es ihrem Kindchen schuldig sei, diese Eindrücke nicht länger auf sich wirken zu lassen. Mit sanfter Gewalt brachte sie Toni zu Bett und legte sich ebenfalls nieder. Die Uffenbacherin hatte versichert, es könne Morgen werden, ehe das Ereignis stattfinden möchte. Cornelie versank in Schlaf, die Ohren noch erfüllt mit den Rufen Annerles: „Das ischt ja eine mordsmäßige Sauerei für uns arme Weibsleut’ – und ich will nit, ich will einmal nit.“ Da wurde sie am Arm gefaßt, Toni stand, ein Licht in der zitternden Hand, vor ihrem Bett . . .

„Sie hat noch eben geschimpft: Kreuzsakra, jetzt ischt’s mir aber zu arg – da war der Bub’ da! Kommen Sie nur – er ist herzig – Annerle sagt, Sie müssen ihn gleich anschauen! –“

Cornelie lief hinüber. Annerle lachte über das ganze von Schweiß betaute Gesicht.

„Einen Buben, gebt mir meinen Buben!“ rief sie übermütig wie ein Kind, das glücklich aus dem Dunkel in die helle Stube kommt. „Jetzt bin ich aber stolz! Der Hansel hat mich immer geuzt, ich könnt’ nie einen Buben zur Welt bringen – jetzt hat er die Bescherung, der Fratz!“

„Wenn du so weiter fortschwätzt, nachher hascht morgen ein braves Milchfieber,“ sagte die Uffenbacherin unter fürchterlichem Gähnen. „Hier ischt die Klingel – den Buben nehm’ ich mit in mei Bett – nun geht schlafen, alle miteinand’.“

Siebzehntes Kapitel

Cornelie legte müde und zerschlagen von den Folgen dieser Nacht ihr Manuskript in die Lade ihrer Kommode. Sie sah nun deutlich, daß sie es nicht würde beenden können, wie sie es doch so inbrünstig gehofft hatte. Mitten unter den wilden Schmerzen ihrer sterbenden Leidenschaft hatte sie zu arbeiten vermocht – vor den hier von allen Seiten auf sie einströmenden Erfahrungen floh jede Konzentrationsmöglichkeit. Die größte Gefahr für den Schaffenden bedrohte sie zu dieser Zeit. Sie empfand ihr Werk als unwesentlich für sich und andere – als eine gekünstelte geistige Spielerei. Nicht nur die eigene Produktion verlor ihre Wirkung auf sie – Bücher überhaupt schienen ihr unwichtig, belanglos – ein schaler Nachguß auf den Lebensextrakt. Ein neuer Reichtum quoll in ihrer Brust, er war in der alten Form nicht mehr zu meistern.

Draußen blies der Herbst frostige Winde über das Land – das ungestörte Sitzen, das Träumen und Grübeln in der Laube, im Hain der alten Apfelbäume verbot sich von selbst. Im Häuschen atmete zart das neue junge Leben und verursachte den zukünftigen Müttern eine unerträglich gesteigerte Spannung des Erwartens, der Begierde auf das Eigene, Werdende, das noch in der dunklen Verhüllung sich stürmischer regte und bewegte, ungeduldig mit heftigen Stößen dem Lichte des Daseins entgegendrängend. Jeder Tag konnte nun Cornelien die Erfüllung ihres Geschickes bringen.

In banger Vorfreude war sie am frühen Morgen schon auf und bei dem in der Nacht geborenen Kindchen, das in ein Federbett gewickelt unten im Wohnzimmer ganz allein und still auf der Wandbank schlief. Man hatte den braunen Kachelofen geheizt, es war schön warm und behaglich unter den niederen Deckenbalken. Behutsam nahm Cornelie das schlummernde Kleine in ihre Arme, es zuckte nur ein weniges in dem netten Gesichtchen, dann schlief es weiter. Sie konnte die rosigen Fingerchen küssen, sie atmete entzückt den feinen Duft, der dem winzigen Körper entströmte. Und während sie dort saß, mit dem fremden Kinde im Arm und ihr Kleid sich ab und zu leise bewegte unter dem Regen der kleinen Glieder des noch Unsichtbaren, überfiel sie eine Sehnsucht, aus den tiefsten Tiefen ihres Seins emporgerungen und wurde zur Ahnung eines kommenden großen Glückes. Das Kind stieß ein quäkendes Tönchen aus. Cornelie hüllte es in ihr Tuch und ging die Frau Uffenbacher zu rufen. Die schlurfte kauend herein, sie hatte bei ihrem zweiten Frühstück gesessen. Dem Kleinen wurde ein Löffelchen Tee eingeflößt und dann kam es wieder auf die Ofenbank.

„Schläft Annerle?“ fragte Cornelie.

Die Hebamme sah an Cornelie vorüber. Es war etwas Beunruhigtes in ihrem Gesicht.

„’s ischt ein Herr bei ihr,“ flüsterte sie.

„Ein Herr? Der Hans?“

„Nein – ein fremder Herr – schon bald eine Stund’. Mich graust’s grad – eine Wöchnerin braucht doch Schlaf!“

„Aber, Frau Uffenbacher,“ rief Cornelie vorwurfsvoll, „wie konnten Sie ihn denn hineinlassen? Was will er vom Annerle?“

„Was gutes will er allemal nit! Er ischt grad’ so herein – hat gesagt: ‚Wo ist das Fräulein Anna von Pfaffenhofen – ich weiß, daß sie hier ischt – machen Sie mir nichts weiß – ich muß sie sprechen.‘ Ich hab’ mich vor die Tür gestellt und hab’ gesagt: ‚Das könne Sie nit, das Fräulein hat in der Nacht geboren.‘ Da hat er nur so gelacht und hat gesagt: ‚Ich werd’ sie nit lang’ stören – es ischt eine Geschäftssach’‘ – und hat mich beim Arm genomme und fortgezoge und eh’ ich mich noch hab’ wehren könne, ischt er zur Tür’ ’nein!“

Cornelie machte eine ungeduldige Bewegung. „Sie hätten ihm nachgehen und ihn wieder herausholen sollen!“ rief sie heftig. „Um Gottes willen – Frau Uffenbacher – haben Sie denn nicht genug an dem einen Todesfall . . . Eine Stunde ist er drin? Nach dieser Nacht! Das darf man doch nicht leiden! Hat denn der Mann kein Einsehen – kein Erbarmen! Holen Sie ihn wieder heraus – das ist doch Ihre Pflicht.“

Die Uffenbacherin machte ein schlaffes Gesicht.

„Wenn er doch sagt, er sei ein Verwandter!“

„Vor Verwandten sollte man die Mädchen hier am meisten schützen. Wenn Sie nicht den Mut finden, ihn hinauszuwerfen, so tue ich’s.“

Sie war schon auf der Treppe und lief schnell die schmalen Stufen hinauf. In ihr brannte ein ehrlicher Zorn über die Gefühllosigkeit dieses Unbekannten.

Sie klopfte kurz und trat ein.

Annerle saß aufrecht im Bett, fieberrote Flecke auf den Wangen, ihre Augen glänzten kriegerisch. Vor ihr hatte ein schwerer, älterer Herr mit großer Glatze, in einem eleganten Anzug, Platz genommen und sprach mit leiser Stimme eindringlich zu ihr. Auf dem Tisch lagen Papiere, er hielt einen goldnen Bleistift in der Hand.

„Machen Sie doch keine Weitläufigkeiten,“ hörte Cornelie ihn sagen, „unterzeichnen Sie – und alles ist erledigt.“

Er wandte sich bei dem Geräusch, das ihr Eintritt verursachte, nach der Tür und maß Cornelies schwarze hohe Erscheinung vom Kopf bis zu den Füßen mit einem einzigen erstaunten Blick. Sie stand vor ihm und sah auf ihn nieder. Ihr Gesicht war ernst. „Mein Herr – ich muß Sie bitten, dieses Zimmer zu verlassen. Fräulein Anna ist jetzt nicht in dem Zustand, eine so lange Unterhaltung zu führen.“

„Es liegt nur in dem Willen des Fräuleins, die Unterhaltung sofort zu beenden,“ sagte der Herr verbindlich, eine plötzliche Verwirrung unter einer höhnischen Selbstsicherheit verbergend. Annerle lachte hell. „Ich habe Ihnen schon dreimal gesagt, daß ich Ihnen keine Rechenschaft über den Vater meines Kindes schuldig bin! Das sind meine Privatangelegenheiten. Das hat mit meiner Stellung in Ihrem Geschäft nicht das mindeste zu tun!“

Cornelie zog die Brauen zusammen und legte die Hand auf den Tisch. Ihre Augen wurden gebieterisch, sie richtete sie fest auf den Mann vor sich.

„Ich habe leider kein Recht, Sie mit Gewalt entfernen zu lassen,“ sagte sie höflich, aber bestimmt. „Ich erinnere Sie nur daran, daß Sie in diesem Augenblick die Verantwortung für zwei Menschenleben tragen! Fräulein Anna hat vor wenigen Stunden ein Kind geboren . . . Ich weiß nicht, ob Sie Vater und Gatte sind – aber alt genug sind Sie, um zu wissen, was eine Frau in diesen Stunden zu leiden hat! Sie danach im ersten Schlaf zu stören – sie über eine Stunde lang mit verantwortlichen Geschäften zu peinigen, ist mehr als unüberlegt – es ist eine Roheit – eine raffinierte Grausamkeit.“

Der ältere Herr hörte Cornelie aufmerksam zu. Das unverschämte Lächeln verschwand dabei von seinem Gesicht, es verkroch sich gleichsam unter dem Bart und machte einem demütigen und wollüstigen Dulden Platz. Es war fast, als empfände er die harten Worte der Frau, die so unbegreiflich wenig in diese zweideutige Umgebung gehörte, wie Peitschenhiebe, die ihn entflammten. Cornelie ahnte plötzlich die unerwartete Wirkung ihrer Worte. Ihr Mund verzog sich im Ekel. Sie wendete den Kopf, trat zu Annerle, glättete ihr das Kissen und bat sie leise, sich niederzulegen.

„Ich wußte in der Tat nicht, daß unsere Unterredung schon so lange dauerte,“ sagte der Mann sanft, beinahe schmachtend, „glauben Sie mir – ich habe nur das eigne Beste der jungen Dame im Auge – es war mir unbekannt, daß ich zu so ungelegener Stunde komme.“

„Es ist Ihnen gesagt worden,“ rief Cornelie hart.

„Nun – ich will Ihnen versprechen, das Fräulein sehr zu schonen. Nur noch wenige Minuten. Es hängt, wie gesagt, nur von des Fräuleins Willen ab . . . Wir sind gleich fertig.“

„In einer Viertelstunde bin ich wieder hier,“ sagte Cornelie kalt und entfernte sich.

Der Besucher wartete ihren wiederholten Eintritt nicht ab. Er entfernte sich noch vorher. Cornelie begab sich dann zum Annerle.

„Jesses –,“ rief die ihr lachend und zornig entgegen, „war das eine Geschicht’! Die Uffenbacherin soll der Teufel holen, daß sie mir den herein läßt! Ich denk’ mich rührt der Schlag wie ich aufwach’ und er steht an meinem Bett!“

„Annerle, um Gottes willen, Sie fiebern vor Aufregung! Reden Sie nicht . . . “

„Ach – jetzt ist’s schon alles eins! Der Onkel vom Hans war’s! Hat der mich sekkiert! Aber seinen Willen hat er doch nit erreicht!“

„Was wollte er nur?“

„Die Familie hat ihn geschickt. Die Alten! Wegen der reichen Partie. Das hab’ ich gleich ’raus gehabt. Geld wollt’ er mir bieten – vierzigtausend Mark hat er hier in Wertpapieren vor mich auf den Tisch gelegt – wenn ich schriftlich allen Ansprüchen auf den Hans entsagen wollt. Der hat gewußt, wie’s um mich steht – oh, der ist so klug – der hat schon auf der Lauer gelegen, und hat gemeint, heut kriegt er mich am ehesten mürb! Ja – Pfefferkuchen!“

„Annerle – Sie haben widerstanden?“

Annerle lachte pfiffig. „Ich bin nit umsonst in dem seiner Schul’ gewesen – all’ die Jahr’ her im Geschäft! Wissen’s, was ich ihm geantwort’ hab’? ‚Ihr Anerbieten ischt sehr großmütig, Herr Kommerzienrat‘, hab’ ich gesagt – ‚aber ich wüßt’ nit, wie ich dazu käm’, es anzunehmen. Ihr Herr Neffe ist immer sehr gütig zu mir gewesen, und ich bin ihm dankbar, daß er mir den Urlaub verschafft hat – aber dafür verdien’ ich doch nit vierzigtausend Mark – ! Ansprüche habe ich überhaupt nit an ihn. Ich weiß halt gar nit, wie Sie darauf kommen, daß er der Vater zu meinem Kind sein soll? Er ist mein Herr Chef und ich würd’ mich so etwas nie unterstanden haben!“

„Annerle, Sie sind kostbar,“ rief Cornelie lachend.

„Hat er sich denn mit dieser Versicherung begnügt?“

„Er mußte schon – ich bin halt dabei blieben, trotz allem seinem Gerede. Wie beim Gericht hat er mich geplagt. Wissen’s – mei Hansel sagt alleweil: nur sich nichts beweisen lassen! Wenn ich ihn verraten hätt’ – das würd’ er mir nimmer verziehen haben.“

Cornelie wurde nachdenklich. „Sind Sie sicher, daß der Hans nichts wußte, von diesem – Anerbieten?“ Sie fragte es leise, Annerle lachte froh.

„Ach gehen’s, Fräulein Cornelie – wenn man mit einem Mann sechs Jahr in einer guten Ehe gelebt hat – da weiß man wie man miteinander steht! Aber jetzt hätt’ ich schon gern eine Bouillon!“

Und Cornelie lief eilig, der Siegerin die wohlverdiente Stärkung zu holen.

Achtzehntes Kapitel

Annerles zierliches Bübchen fesselte die Sympathien von Cornelie und Toni weit mehr als das dicke Versuchskind, das, stets mit den Überresten von Zwetschgen und Birnen, von Schmalzbroten und Schweinsbraten beschmiert, trotz dieser aller Wissenschaft Hohn sprechenden Säuglingsernährung an Kraft der Knochen und strotzendem Leibesumfang dem väterlichen Metzgermeister immer ähnlicher wurde. Toni beschäftigte sich viel mit Annerles Bübchen, doch des Nachts hatte die Uffenbacherin es in ihrer Schlafkammer, das war einmal so Brauch in der Anstalt und an solchen eingeführten Bräuchen durfte nicht gerüttelt werden. Das Kleine war musterhaft brav, es schlief den ganzen Tag und die ganze Nacht. Kaum daß man des Morgens nach dem Bade sein Quäkstimmchen vernahm.

„Ich finde seine Äugelchen sind eigentümlich matt geworden,“ sagte Cornelie zu Toni. „Ich hatte selten ein Neugebornes mit solchen blauen Sternenaugen gesehen. Das Kind gefällt mir nicht.“

Toni sah zu Fräulein Cornelie hinüber. Die Resignation für das Schreckliche, die über das junge Gesicht gebreitet lag, lüftete in diesem Blick für einen Augenblick ihren Schleier.

„Toni –“

„Sie gibt ihm etwas,“ flüsterte Toni. „Alle Kinder bekommen es hier – damit die Alte des Nachts schlafen kann.“

Cornelie klopfte das Herz mit heftigen Stößen in der Brust.

„Die Fischerin hat es mir schon gesagt,“ fuhr Toni fort. „Der Bub’ von der Senta hat die ersten Tage auch geschlafen, als wollt er net wieder aufwachen. Es ist immer dasselbe. Sehen Sie nur.“

Cornelie blickte scharf auf das Kleine in Tonis Schoß. Ein leises Zittern bewegte das Mündchen in dem grau gewordenen Gesichtchen, die Pupille verschwand unter dem halb niedergezogenen Lid, man sah nur das Weiße des Augapfels.

„Mein Kind bleibt keine Nacht hier im Haus, die Frau Lebzelter holt’s gleich,“ sagte dumpf die Siebzehnjährige.

„Hat’s kein Vater und Mutter, soll’s zum wenigsten seine Gesundheit behalten.“

Ein betäubender Schmerz zog Cornelie vom Herzen in die Arme – schwarze Schleier glitten über ihre Augen. Sie griff nach dem Tischrand und setzte sich auf die Bank neben Toni, den Schwindel vorübergehen zu lassen.

„Es ist Ihnen net gut,“ sagte Toni traurig. „Ich hätt’ nichts sagen sollen.“

„Doch – doch, Toni,“ murmelte Cornelie. „Es ist doch notwendig, daß wir es rechtzeitig erfahren. Was mag es nur für ein Höllengebräu sein?“

„Kommen Sie – ich zeig’s Ihnen,“ flüsterte Toni. „Sie ist im Dorf, sie merkt nichts.“ Beide Mädchen, mit dem Kind auf Tonis Arm, schlichen sich in die Kammer der Alten. Dort auf der Kommode vor dem zerbrochenen Spiegel stand das Fläschchen mit dem braunen Schlafsaft. Cornelie öffnete den Pfropfen und roch daran.

„Opium,“ sagte sie leise und ging, ohne sich zu besinnen, mit dem Fläschchen zum Fenster. Kräftig warf sie das Gift in die Steine und Nesseln hinunter.

„Ach, Fräulein Cornelie,“ rief Toni erschrocken, „jetzt wird die Uffenbacherin mir bös sein! Das hätten Sie nicht tun sollen! Es nutzt auch nichts. Sie hat ja das Rezept. Zwei hat sie – die läßt sie abwechselnd in Ulm und Stuttgart machen – weil der Apotheker in Ulm ihr den Saft nicht so oft geben will. Schauen Sie her . . . “

Cornelie seufzte stöhnend bei dem Blick auf die geleerten Fläschchen hinter dem Spiegel.

„Ich muß mit der Uffenbacherin über die Sache reden,“ murmelte sie gequält. „Vielleicht hat sie keine Ahnung von dem Schaden, den sie anrichtet.“

„Ich glaub’, das hat sie net einmal,“ sagte Toni. „Dem Annerle hat sie gesagt, der Arzt in Ulm hätt’ ihr selbst ’s Rezept geschrieben.“

Cornelie schüttelte verzweifelt den Kopf.

„Das Annerle weiß also?“

„Ja –“ sagte Toni zögernd, „Fräulein Cornelie – ich mein’ halt immer, sie ist nicht so recht wie eine Mutter – sie hat zuviel andere Gedanken – der Hans – und die Filiale, die sie haben möcht’ – sie schaut net genug aufs Kindle – ich will gewiß nicht Schlechtes von ihr sagen – lieb hat sie’s schon – nur . . . “

„Ich verstehe, was Sie meinen, Toni,“ sagte Cornelie sinnend. „Es sind nicht alle zu Müttern geschaffen. Annerle wird immer mehr die Gefährtin und Geliebte ihres Hansel sein. Das ist ja keine Schuld – es ist Naturanlage.“

Dankbar und vertrauend blickten Tonis braune Augen aus dem unhübschen Gesicht zu Cornelie auf. Diese faßte plötzlich ein warmes Gefühl für das Mädchen. Als sei ein geheimes Band zwischen ihnen, ein Verständnis, das sie nicht mit den anderen teilen konnten.

„Wir müssen gut aufpassen, Toni,“ sagte Cornelie und versuchte eine große Herzlichkeit in ihre Stimme zu legen. „Wir müßten uns doch schämen, wenn wir unsere Kinder nicht vor dem verfluchten Weibe schützen könnten.“ Den Arm um Tonis Schulter gelegt, beugte sie sich nieder und küßte die Stirn des kleinen Opfers, das schon längst wieder in seinen schweren Opiumschlaf verfallen war. Und dann küßte sie leise und sanft auch die runde Wange der armen Toni.

Cornelie versuchte ohne Zorn und Leidenschaft der Hebamme die Gefährlichkeit des nächtlichen Ruhebringers klar zu machen. Aber das Weib war erbittert, gekränkt und nichts weniger als überzeugt. Als Beispiel für die Schadlosigkeit der Tropfen führte sie immer wieder die eigenen Kinder – die auf dem Kirchhof lagen – und das dicke Ziehkind an, dessen starke animalische Natur allerdings das Unmögliche spielend überwand. Cornelie mußte endlich drohen, den Mißbrauch, falls er noch einmal vorfalle, beim Dr. Schwärzle und beim Kreisphysikus anzuzeigen. Annerle hielt, als man sie belehrt hatte, auch nicht mit ihrer Mißbiligung zurück, selbst der Herr Geheimrat, der in diesen Tagen kam, um die Bekanntschaft des Bübleins zu machen, wurde energisch aufgefordert, der Uffenbacherin die Wahrheit zu sagen. Allzu kräftig mochte der Versuch nicht ausgefallen sein – man hörte während der vermeintlichen Strafpredigt das joviale Lachen des alten, gutmütigen Herrn hinter der Küchentür. Das einzige, was man erreichte, war die Erklärung der erbitterten Hebamme: Wenn man Zweifel in ihre Fähigkeiten zur Kinderpflege setze, dulde sie den Buben keine Stunde länger im Haus. Die Fräulein Hottinger mußten ihn in der Tat abholen. Cornelie fühlte, wie der Ingrimm in der Brust der selbstbewußten Frau gegen sie kochte – in ihrer schrecklichsten Stunde würde sie einer tückischen Feindin preisgegeben sein.
