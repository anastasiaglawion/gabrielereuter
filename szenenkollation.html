<script id="ea-text" type="text/plain">Erstes Kapitel

Hatte Cornelie geschlafen und hatte sie geträumt? Es geschah ihr in der letzten Zeit öfter, daß sie aus wachem Sinnen in einen Zustand halben Schlummers hinüberglitt, in dem dann seltsam deutliche Bilder von Dingen, die waren und von solchen, deren Zusammenhang sie nicht zu enträtseln wagte, vor ihrem inneren Auge sich formten und oft schon, während sie sich bildeten, wieder zerrannen. Und so mochte es wohl auch jetzt gewesen sein. Sie ruhte unter einem großen alten Lärchenbaum, dessen hellgrüne Nadelbüschel an den graurissigen Zweigen bewegungslos über ihr hingen. Die Luft des südlichen Frühlingsmittages war still und warm. Ihre Augen blickten zwischen erzitternden Wimpern, geblendet von der sonnenflimmernden Helle auf die üppige Farbenschönheit der Blumenwiese. Ein feines Surren und Sirren, ein Flirren und Säuseln schwebte über dem Gräsergewoge. Es war als spielten über all den bräunlichen Rispen, den bunten Kelchen die Geister der Sonnenstrahlen eine auf- und abschwellende Melodie auf den Saiten der Luft. Und dieses leichte Klingen war der einzige Ton in Nähe und Weite. Die Felsen standen totenstill, die Häuser der Menschen in dem schönen Tal lagen weit von hier, der Himmel spannte sich in einer blassen milchartigen Helle über die Welt, lautlos stiegen die Wellen schweren Würzduftes aus Orchisblüten und Thymian.

Und alle Schmerzen schliefen. Sie waren betäubt von den Düften und der Wärme und der stillen Einsamkeit. Cornelie lächelte entrückt. Sie sah es doch wieder . . . wie war das nur? Sie sah das Bild in zauberisch dünnen und doch deutlichen Umrissen inmitten der zitternden Luft über der Blumenwiese schweben.

Es war etwas wie ein hölzernes Gartengitter, mit einem Pförtchen . . . In dem geöffneten Pförtchen, die Hand am Schlosse, stand das Kind. Es war ein Mädchen. Sein Haar, von einer feinen Goldfarbe, in der ein silbernes Schimmern webte, schmiegte sich eng an das schmale Gesicht. Die roten Lippen waren geöffnet, aus Scheu und Schelmerei – so als wollten sie gern ein lustiges Wort sagen und getrauten es sich doch nicht. Am deutlichsten aber war der Blick der hellgrauen und sehr großen Augen, denen Vertrauen und Schüchternheit und das Glück des Spiels eine wunderlich holde Bedeutung gaben.

Um den Ausschnitt seines Kleides hatte das Kind kleine Büschel rosiger Blumen gesteckt, so daß das Köpfchen sich wie aus einem zarten Kranze erhob, aber als Cornelie mit den Augen blinzelte, um die Art der kleinen Blumen deutlicher zu sehen, da war das Bild zerronnen. Sie schloß die Lider und streckte sich in dem sonnenwarmen Grase aus, den Kopf auf den Arm gelegt. Das Lächeln war noch immer um ihren Mund, der in den letzten Wochen gramvoll und blaß geworden war, wie der Mund einer alten Frau. Sie genoß das eben Geschaute – mochte es nun Traum oder Vision gewesen sein – in tief beseligter Erinnerung. So schön würde ihr Kind werden, so hold und lieb würde es sie einmal anschauen. – Sie tat einen tiefen Seufzer, der nicht nur ein müdes Stöhnen dumpfen Leides, der ein Verlangen war nach Stärke und Zuversicht.

Eine Weile später raffte sie sich auf, suchte das kleine Nähzeug, an dem sie nur wenige Stiche getan hatte, zusammen und erhob sich um heimzukehren, denn es war Mittagszeit. In dem ländlichen Wirtshaus neben dem kleinen Bahngebäude wohnte sie. Während sie eintrat, begann sie zu denken, daß sie hier bleiben möchte, wo niemand sich um sie kümmerte, wo die Natur ihr lieb war, und so traumverlorene Morgenstunden vor ihr lagen, wie die heute genossenen, die auch dem kleinen Leben unter ihrem Herzen wohl tun mußten. Das war doch nun das einzige, worauf für sie noch etwas ankam.

Es schien ihr zum erstenmal, daß auf diese Weise das Unmögliche möglich, das Unerträgliche erträglich werden könne – zum erstenmal seit sie – halb irrsinnig vor rasenden Schmerzen – geflohen war aus ihrem bisherigen Leben, geflohen, wie man mit Todesangst, mit wilder Hast aus einem Hause flieht, dessen Grundfesten in jähen Erdstößen erbeben, wo Mauern und Decken in erstickenden Staubwirbeln zu Trümmern um uns her zusammenstürzen. Schon jetzt wußte Cornelie nicht mehr, wie sie auf den Bahnhof gekommen war, sie erinnerte sich nicht mehr, welcher Art der Abschied von ihrer Mutter gewesen und welche Worte dabei gesprochen wurden. Ihre Reise hatte kein Ziel gehabt. Man hatte ihr Adressen von Pensionen und Kurorten mitgegeben, aber sie sah sie nicht einmal an. Als der Abend dunkelte, erblickte sie, während der Schnellzug einige Minuten hielt, die einsame Station, neben der ein kleines Wirtshaus lag. Da stieg sie aus, man reichte ihr das Köfferchen aus dem Wagen, sie trat in das Haus und fragte, ob sie ein Zimmer haben könne. Ja, man hätte ein Zimmer für Touristen. Ob sonst noch Fremde hier seien? Nein, man wäre eigentlich nicht für Herrschaften eingerichtet.

Das war ihr genehm. So blieb sie. Nun schon drei Wochen. Niemand achtete auf ihr Kommen und Gehen. In der Gaststube wurde es nur abends lärmend, wenn die Bahnarbeiter dort ihren Schoppen tranken und die heißblütigen Südtiroler mit ihren italienischen Grenznachbarn in Streit gerieten. Desto stiller war’s im Herrenstüble. Dort wurde ihr das Gedeck am anderen Ende des Tisches gelegt, an dessen oberer Ecke der Stationsvorsteher seinen Platz einzunehmen pflegte. Ein alter schweigsamer Junggeselle, der seit fünfzehn Jahren die Strecke beaufsichtigte. Neben ihm saß stets ein stiller junger Mann, der, gleichfalls im Eisenbahndienste, die Strecke für die nächsten fünf Jahre zu besichtigen verpflichtet war. Einmal wollte sie den Jüngeren fragen, wie er solche Zukunftsaussicht ertragen könne. Aber schließlich war sie doch zu gleichgültig, um die Frage zu tun. Übrigens interessierte er sich für Botanik. Die beiden Männer rauchten schweigend nach den Mahlzeiten ihre Zigarren, dann gingen sie mit verdrossener Pünktlichkeit an ihre, Cornelien völlig rätselhaften Obliegenheiten.

Sie lag die Nächte meist wachend, hörte die Schnellzüge, die zwei Welten miteinander verbanden, durch das dunkle weite Tal brausen und litt noch einmal in jeder qualvollen Einzelheit alles schon unzählige Nächte Durchlittene. Am Tage überfiel sie oft eine unbezwingliche Schlafsucht. Wenn sie bei ihrer begonnen Arbeit saß, sank ihr mitten im Satz der Kopf auf das Manuskript und sie wußte später kaum, wie lange sie in so unbequemer Lage geschlummert hatte. Auch wenn sie langsamen Schrittes in dem blühenden Lande, dessen Lieblichkeit sie sah, ohne sie zu empfinden, ziellos umherwandelte, mußte sie sich oft niedersetzen. Eine Gleichgültigkeit kam über sie, die einem Entschwinden jeder geistigen Fähigkeit glich. Es war ihr schwer, danach den Weg zum Wirtshaus zurückzufinden, sie wußte auch am nächsten Tage nicht mehr, welche Straße sie eigentlich gegangen war. Nur dem Umstande, daß die Station so weithin sichtbar im breiten Talgrunde lag, hatte sie es zu danken, daß sie sich nicht öfter peinvoll verirrte. Sie machte deshalb auch keinen der Ausflüge, die ihr die Wirtin zuweilen empfahl, denn sie konnte sich nicht zum geringsten Interesse für die berühmten Punkte der Gegend ermuntern. Sie wollte ja nur auf irgend eine Weise so viel Kräfte sammeln, um ihre Arbeit, ihr neues Werk zu fördern und in den nächsten Monaten zu beenden. Hatte sie um das Leben des kleinen Geschöpfes, das unter ihrem Herzen wuchs, so hart kämpfen müssen, hatte sie alles dafür hingegeben, was ihr bisher wertvoll geschienen, alle Reinheit und Ehre und Frauenwürde, und zuletzt auch alles Liebesglück, so durfte es nicht verhungern, wenn es auf die Welt kam. Sollte sie selbst bei seiner Geburt sterben, was sie erwartete, und so weit sie noch etwas zu wünschen vermochte, auch wünschte, so mußte sie doch für ihr Kind sorgen. Ihr neues Werk sollte ihr die Mittel geben, um dem unaussprechlich verlassenen Wesen Freunde zu erwerben, die sich, wenn auch nicht aus Liebe, so doch um des Verdienstes willen seiner annahmen, es pflegten und groß zogen.

So stark war dieser Instinkt, der den Vogel sein Nest bauen und die Füchsin für ihre Jungen ihre Höhle graben läßt, in Cornelie lebendig, daß ihre Arbeit, wenn auch langsam, doch stetig fortschritt. Freilich hatte sie sie in einer früheren Zeit komponiert, hatte sie seit Jahren energisch und oft durchdacht. Sie brauchte nun nur in das aufgespeicherte Material zu greifen, um es zu formen. Doch kam sie oft bis zu einem müden Verwundern, daß Worte und Sätze, die sie in einem Traumzustande niederschrieb, dennoch Zusammenhang und Farbe und Leben bekamen. Und sie irrte sich nicht – das Werk besaß ein blutwarmes Leben, für welches sie sich kaum noch verantwortlich fühlte. Es wuchs und wurde fein und stark, gleichsam aus sich selbst voraus genährt von einer Zeugung, welche weit zurück lag. Aber war nicht alles in diesem Dasein voll ungeheurer, verworrener Rätsel, warum sollte denn die geistige Produktion davon ausgenommen sein? Sie verstand nichts mehr davon. Es war eine vermessene Torheit gewesen, daß sie sich einmal für eine von den Auserwählten gehalten hatte, die den Menschen etwas von diesen Rätseln zu deuten vermochten. Nein, wenn sie ehrlich sein wollte, sie selbst hatte sich nie dafür gehalten. Man hatte sie, wie es ihr schien, mit allzu wenig Berechtigung zu dieser Ausnahmestellung unter den Frauen erhoben. Unter den Blinden ist der Einäugige König, hatte sie oft denken müssen, als die ersten Zeichen zu ihr gedrungen waren, daß ihr Buch „Beiträge zur Psychologie der Frau“, welches vor einigen Monaten erschienen war, ein ungewöhnliches Aufsehen, nicht nur unter den Frauen, sondern fast mehr noch unter den Männern erregte. Und dies geschah, trotzdem sie sicher war, nur ihr Selbstverständliches geschrieben zu haben und trotzdem sie versucht hatte, ihrer ganzen Natur entsprechend, in der Art der Darstellung jede sensationelle Note zu vermeiden. Dachten die Menschen wirklich so wenig über sich selbst und ihre Beziehungen zueinander nach, daß schon die einfachen, zutage liegenden Beobachtungen, die Cornelie hier zusammengestellt hatte, hinreichten, sie in Erstaunen und Erschütterung zu versetzen? Es mußte wohl so sein.

Hatte sie doch selbst erlebt, daß ein kluger Mann und einer, mit dem sie aufs Innigste vertraut zu sein glaubte, dem sie ihr Wesen stets rückhaltlos erschlossen hatte, als der Augenblick kam, wo ein höheres Verstehn zur Notwendigkeit wurde, hilflos und töricht versagte. Hatte er sie nicht damit am zerstörendsten beleidigt, daß er alle Grundbedingungen ihrer Persönlichkeit, ihrer Naturanlage mißachten zu können meinte? War es ein absichtliches Nichtverstehenwollen, aus hartem Egoismus – ? War es ein Unvermögen an Seelendelikatesse? Und worin lag die größere Hoffnungslosigkeit für sie?

Aber sie wollte den Mann jetzt gar nicht mehr erkennen oder beurteilen. Sie konnte es einfach nicht mehr in dem rasenden Haß, der wie eine scheußliche Krankheit ihr Inneres zerwühlte, ihre Nächte peinigte mit dem unerträglichen Verlangen, ihn mit ihren Händen zu martern, seine Not in Blut und Todesgrauen mit ihren eigenen Augen zu sehen, in der eklen Gier nach Rache, wie nach einem letzten Besitzen . . . Heut zum erstenmal war es ihr gewesen, als schaue sie das Flimmern eines goldenen Fadens, an dem sie sich festhalten, sich hinauszutasten vermöchte aus dem unaufhörlichen Kreisen um denselben Jammer, aus demselben dumpfen Umherirren in den dunklen Gängen tausendfacher Qualen, mit dem sie ihre letzten Seelenkräfte erschöpfte. Es gab doch irgendwo noch hellere, reinere Lüfte . . . Wenn sie nur dort hingelangen könnte. Wenn sie nur einmal fertig werden und vergessen könnte . . . Vergessen, soweit das Hirn sich zum Vergessen zwingen läßt . . . Sie hatte eine so große Sehnsucht nach dem Vergessen. Die erste Bedingung dazu war wohl, daß sie nicht wieder in die alten Lebensverhältnisse zurückkehrte. Das einfachste war schon, sie blieb, wo sie sich befand. Doch gab es ein Bedenken – eine sehr reale dumme Schwierigkeit. So einfach das Wirtshaus, so bescheiden der Preis für Zimmer und Mahlzeit auch sein mochte, es ging doch wahrscheinlich über ihre Mittel, für viele Monate hier zu wohnen. Sie mußte alles klar und kühl überlegen. Ihre Selbständigkeit und damit der letzte Halt für ihre Selbstachtung ließ sich nur festhalten, wenn sie sich aufs Äußerste einschränkte. Sie mußte scharf rechnen. Aber schon bei dem auftauchenden Willen, ihre Lage ganz klar und nüchtern zu bedenken, verwirrten sich ihre Sinne bis zur halben Ohnmacht. Wollte sie einen Plan machen, einen Entschluß fassen, so sank sie in hilfloser Schwäche zusammen. Dann begann sie zu weinen, bis sie nichts mehr von sich selbst und allem, was sie quälte, wußte, und ihre Seele, losgelöst von Schmerz und Leid, sich nur noch in der Wollust der Tränen badete.

Zweites Kapitel

Cornelie wanderte einen staubigen Pfad an einer hohen Mauer entlang. Das Grün von Bäumen ragte über das weiße Steinwerk, Glyzinien rankten das feine Gefieder ihrer graugrünen Blätter und die blauen Blütentrauben über den oberen Rand. Aus einem Pförtchen traten zwei Priester und schritten, leise Gespräche führend, vor Cornelie her. Eine Frau in schwarzem Kleide mit mildem ergebenen Gesicht kam ihnen entgegen und neigte sich demütig über ihre Hände. Cornelie dachte, es müsse doch eine Erleichterung sein, Not und Reue so an eine bestimmte Stelle tragen zu können, um sie gleichsam auf diese Weise abzutun, statt allein einen Weg hindurchwühlen zu müssen. Es war gegen Abend, als sie den Marktplatz erreichte. Die Schatten lagen schon kühl in den Lauben. Kleine Lädchen gab es hier unter den Steinbögen, mit bunten Tüchern, mit Bindfäden und Äpfeln, andere mit Kirchengeräten und vielen großen und kleinen Muttergottesstatuen von Porzellan, alle mit dem blauen Mantel und der vergoldeten Krone. Ein Hohn glitt Cornelien um den Mund. „Ja du – du – wie hast du dir deine Krone erschlichen?“ dachte sie voll Ingrimm. Und dann stand sie und sah lange auf die von Staub bedeckte Auslage einer Buchhandlung: „Thomas a Kempis, Nachfolge Christi“, las sie, und „Das wundertätige Wasser von Lourdes“, „Die Flora von Südtirol“, „Fahrten durch das Pustertal“. Wunderlich genug schauten zwischen den andern zwei Bändchen mit grellen Bildern heraus. „Militärhumoresken“. Sie trugen einen Schriftstellernamen, den Cornelie hatte nennen hören, als sie ein Kind war. Fremde Welt – fremde vermodernde Welt . . .

Neben dem Brunnen hielt ein Wägelchen, in dem ein Priester und eine alte Frau saßen. An dem breiten grauen Steinbecken lehnten ein paar Kaiserjäger und schwatzten. Ein Offizier ging, die schlanken Beine in sehr engen Hosen, das Spazierstöckchen lässig in der Hand schwingend, über den stillen Platz und verschwand im Postgebäude. Es schien Cornelien, als ob in dem unter weißem Staub versinkenden Städtchen nur Priester und Soldaten hausten. Die Frauen und Mädchen trugen alle schwarze Kleidung, man begegnete auf ihren Gesichtern immer wieder demselben Ausdruck verschüchterter Demut. Kaum zwei Stunden von hier lag ein großer Fremdensammelplatz. Dort zog sich das bunte Leben zusammen, und wie es denn oft im weiteren Umkreis solcher Brennpunkte doppelt öde zu sein pflegt, so fristete das alte Nest im schönen Tal sein Dasein nur durch die Residenz des Bischofs, durch ein Priesterseminar und eine stattliche Garnison, deren Offiziere und Mannschaften sich untereinander so gut vergnügten, als sie es eben vermochten, und, wenn es anging, zu den belebteren Orten hinüberfuhren. Nach dem heitern Winterkurort hatte Cornelie ihre Hochzeitsreise richten wollen. Aber nun hingen die Kleider, die sie dazu vorbereitet hatte, daheim bei ihrer Mutter im Schrank und würden niemals getragen werden.

Plötzlich fiel es ihr ein, daß sie auch, wie vorhin der Offizier, über den Platz gehen und in dem Postgebäude nach Briefen fragen müsse. Sie hatte sich mehrere Tage lang nicht dazu aufraffen können. Aber nun wußte sie, daß sie doch wohl deshalb den Weg zur Stadt eingeschlagen hatte. Sie nannte am Schalter mit einer heiseren, bedrückten Stimme ihren Namen, von dem sie vor drei Wochen geglaubt hatte, sie würde ihn nicht wieder nennen, sondern ihn für immer gegen einen anderen vertauschen. Der Beamte händigte ihre ein Paket Briefe und Drucksachen aus. Obenauf lag ein Schreiben in einem viereckigen grauen Hanfkuvert, von einer wunderlich-eigensinnigen Handschrift adressiert. Sie trat einige Schritte beiseite und hielt sich an dem Rand des Schreibpultes fest. Ihr Herzschlag flatterte in ihrer Brust wie der Flügel eines gefangenen Vogels. Sie sah die kleine skurrile Handschrift mit dem großen Schwung der Anfangsbuchstaben, gegen die sie eine leise Abneigung nie hatte überwinden können, auch damals nicht, als sie die Briefumschläge, welche sie trugen, an die Lippen gedrückt und innig geküßt hatte. Was hatten sie sich nach jenen letzten Abschiedsworten noch zu sagen? Cornelie blickte zum Schalter zurück, wo der Offizier mit dem Beamten unterhandelte.

Die Annahme des Briefes verweigern – und dann nichts mehr . . . Sie tat einen Schritt vorwärts – ein Schwindel befiel sie . . . Der Angststrom einer jähen Hoffnung durchrauschte ihr Blut. Sie ging schnell auf den stillen Marktplatz hinaus und dort, im Gehen, mit zusammengebissenen Zähnen, öffnete sie den Umschlag und las. Es waren nur wenige Worte.

Er versicherte sie seiner Freundschaft und bot ihr seine Hilfe an für den Fall, daß sie dieselbe bedürfen sollte . . . Ein Almosen . . .

Sie knirschte mit den Zähnen, zerknitterte das Blatt in der Hand – eine Welle blinden Hasses schlug über sie hin und sie spie aus vor erstickendem, würgendem Ekel. Dann zerriß sie den Brief in kleine Stücke und streute sie in die Luft und ging schnell weiter, atemlos, doch immer schneller und schneller. Vor ihren Augen drehten sich schwarze, rote und gelbe Ringe, zerflossen, wurden größer, kleiner, sausten durcheinander und lösten sich wieder, rote Fliegen, schwarze Punkte flogen durch die Kreise, haschten sich, vereinigten sich, trennten sich wieder. Ihre Glieder zitterten in nervösem Frost, trotz der schnellen Bewegung in der lauen Luft und trotzdem von ihrer Stirne Schweißtropfen sich lösten und an den Schläfen niederrannen. In ihrem Zimmer angelangt, riß sie den Hut vom Kopf, fiel auf den Diwan und lag dort lange totenstill. Im Kopf hatte sie ein Gefühl, als schlage sie jemand in regelmäßigen Pausen mit einem stumpfen, schweren Instrument auf den Schädel. Endlich fühlte sie Hunger, den unbezwinglichen Heißhunger der schwangeren Frau. Ein bitterliches Lächeln der Selbstverachtung kroch über ihre erstarrten Züge. Schwer und widerwillig stand sie auf. Die Beine hingen ihr gleich Bleisäcken am Körper. Wie eine ganz alte Frau schlich sie zum Spiegel, ihre Kleidung zu ordnen. Sie fror noch immer so entsetzlich. Wild starrte das Haar um das ergraute, wie zu Asche gewordene Antlitz, ihre Augen sahen ihr aus dem Glase mit erloschenem Blick entgegen. Sie kämmte sich, setzte einen Hut auf und zog den Schleier hinunter. So ging sie in die Gaststube und ließ sich eine Omelette bereiten. Sie aß ein paar Bissen, versuchte etwas Brot und einige Schlucke Wein zu genießen und erhob sich dann wieder.

Langsam, ohne irgend etwas um sich her zu sehen, kehrte sie in ihr stilles Zimmer, wo niemand sie stören durfte, zurück. Sie war nun ganz ruhig geworden und sehr müde. Sie war fast gewiß, daß sie in der Nacht schlafen würde.

Der Brief hatte ja kommen müssen.

Sie wußte jetzt, daß sie ihn erwartet hatte, alle Tage und alle Nächte. Auch dieses war nun erlitten und konnte so nicht noch einmal gelitten werden.

Sie sah es erst an diesem Abend ganz deutlich, wie etwas in ihr noch immer geglaubt hatte, unter allen Irrungen und Krämpfen der Liebe müsse ein Unzerstörbares sie ewig verbinden . . .

Und wie sie immerwährend darauf gewartet hatte, daß es sich gerade jetzt in seiner Kraft offenbaren müsse. Ja – wirklich – sie hatte noch immer geglaubt, daß er sie nach dem letzten Kampf und Abschied dennoch rufen werde, ihm schwesterlich beizustehen in der Wirrnis, durch die sie beide sich tasten mußten . . . Und sie hatte tief geschaudert vor allem, was ihr in solchem leidvollen Verkehr an heimlichen Qualen bevorstand und hatte doch gewußt, sie werde seinem Rufe folgen müssen, getrieben von dem Haß und der Liebe, die eins geworden waren in ihr.

Am offenen Fenster stand sie im Dunkel, streckte die Arme und sog die duftenden Lüfte der Frühlingsnacht in die von Schmerzen verbrannte, wunde Brust. Und sie wurde stiller und stiller. Sie hob die Hände, strich über Haar und Schläfen.

Vorbei – vorbei – vorüber . . .

Nun durfte sie den Namen des Mannes aus ihrer und ihres Kindes Zukunft löschen.

Nun lag das Zukünftige vor ihr als ein weißes leeres Blatt, mit frischen, noch nie versuchten Schriftzügen, noch unbekannten Figuren zu bedecken.

Ein neu Beginnen.

Cornelie atmete tief und befreit. Jetzt wollte sie das Dasein wieder leben. Wollte es mit ganzem Willen leben! Sie zündete die Lampe an, um die übrigen Postsachen durchzusehen. Ein Briefchen ihrer Mutter handelte von kleinen häuslichen Dingen und fragte, wann Cornelie heimkehren werde. Ihre Mutter ahnte noch nicht, was vor ihr lag. Die Arme. Mein gutes, altes, liebes Kind, dachte Cornelie sorgend, wie kann ich dich am besten schonen – wie kann ich dich an allen Schrecken, die deiner warten, linde vorüberführen?

Während sie ihre Kleider abzulegen begann, versuchte sie sich das neue Leben vorzustellen.

War ihr Kleines erst geboren, so konnte sie in einem der Seitentäler dieses Berglandes ein bescheidenes Besitztum mietweise oder vielleicht auch zu eigen erwerben. Hier, wo keiner von ihnen wußte, wo sie sicher sein konnten vor Demütigung und Schande, waren ihnen friedenvolle Tage doch wahrscheinlich. Der Winter war hier zeitig vorüber, wurde schnell abgelöst von einem üppig blühenden Frühling. Die alte Frau konnte im Garten sitzen, sich an Sonne und Blumen laben. Das Kind würde in schöner Freiheit erwachsen und die Menschen, vor denen Cornelien graute, blieben ihnen fern. Ihr schwebte etwas von einem Namenswechsel vor. Nur auslöschen alles Vergangene. Die täglichen Bedürfnisse aufs äußerste einschränken, um unabhängig und einsam bleiben zu dürfen.

Eine tägliche Arbeit, mit der sie Brot und Kleider verdienen konnte, würde sich finden lassen – davor war ihr nicht bange. Sie sah sich in ländlichem Schaffen, das ihr aus einer frühen harten Jugendzeit her nicht fremd war, sah sich im Garten und im Weingelände wirken, sah das kleine Mädchen im kurzen Röckchen und barfuß neben ihr traben, hörte sein Lachen . . . Cornelie Reimann, die eine kurze Weile von der Mode auf ihren bunten, üppigen Thron gehoben worden, war nur noch eine halb vergessene Erinnerung. Wie schön, befreit zu sein – wiederholte sie einige Male, wie man eine Zauberformel murmelt oder einen Segensspruch.

Als sie sich niedergelegt hatte, nahm sie den Brief ihrer Mutter noch einmal zur Hand. Da traf sie auf eine Bemerkung, die quer über den Rand geschrieben, vorhin von ihr übersehen worden war und welche lautete: „Weißt Du auch, daß Frau von Völkerling Dich in den nächsten Tagen aufsuchen wird. Sie hat sich in Deiner Nachbarschaft für einige Monate eingemietet, sie sucht doch immer etwas Besonderes! Ich fürchte, es wird Dir nicht lieb sein, daß ich ihr Deine Adresse gab, aber es war nicht möglich, sie ihr zu verschweigen, da ihr ja gute Freundinnen seid. Es ist auch wohl nicht recht, daß Du Dich so sehr in die Einsamkeit vergräbst.“

Cornelie legte mit kalten Fingern das Blatt auf den Nachttisch zurück und löschte die Lampe.

Nach einer Weile war ihr Gesicht naß von Tränen.

Angst und Hilflosigkeit überwältigten sie nun wieder vollständig. Ein neues Versteck suchen? Sie weinte, bis Tuch und Kissen durchtränkt waren und sie mit einem salzigen Geschmack auf den Lippen plötzlich in die Bewußtlosigkeit eines schweren Schlafes sank.

Drittes Kapitel

Das kleine Haus lag in einer freundlichen Wiesengegend Württembergs. Oben auf dem höchsten Punkt des lang hingestreckten Hügels hob ein graues Grafenschloß seine Dächer über das Grün der Parkbäume, die Dorfstraße mit den Bauernhöfen zog sich über den Rücken der Erdhebung entlang. Unten, wo der helle junge Fluß durch Weidengebüsch und über weiße Kiesel plätscherte, gab es freilich noch eine zweite Straße. Hier wohnten nur arme Weiblein in bescheidenen Hütten, mit winzigen, blumenreichen Vorgärten. Das kleine Haus aber lag ganz allein und abseits von den beiden Dorfstraßen, am linken Abhang des Hügels, in seine Flanke gleichsam verschüchtert hineingedrückt. Der Weg, der vom Dorf zu ihm hinunter führte, war steil und steinicht, voller Löcher und Pfützen. Rechts und links neben den Schlehdornhecken wuchs ein Gestrüpp von Brennesseln. Alles zeigte, daß niemand ein Interesse daran nahm, den Pfad in gangbarem Zustand zu erhalten. Er führte ja auch nur zu einem Gehöft notorisch verkommener armer Leute, und weiter zu dem kleinen Häuschen, von dem die Frauen im Dorf mit einem gewissen halblauten Ton der Scheu redeten, und die Männer mit einem zweideutigen Grinsen.

Freundlich genug schaute es aus unter dem großen blühenden Birnbaum, durch den die Bienen summten. Helle Gardinen hingen vor allen Fenstern, und seine stattliche Eigentümerin stand meistens würdevoll vor ihrer Türe, irgend etwas Gutes zwischen ihren großen weißen Zähnen behaglich kauend, während die kleine Schar ihrer Gäste um sie her auf der Schwelle oder auf der Bank an der Hauswand zu hocken pflegte, gähnend, träumend oder schwatzend, wie es sich eben fügen mochte.

Die Gäste waren das Bedenkliche in diesem kleinen Hause, von dessen Türe man unendlich weit ins Land schauen konnte, über das heitere Flüßchen hinweg, bis zu den duftigen Umrissen der Schweizeralpen fern am wolkigen Horizont, und das doch trotz dieser weiten und freien Aussicht so schüchtern sich hinter der Hügelflanke versteckte. Scheue und stille Gäste waren es, die das kleine Häuschen beherbergte. Meistens trafen sie in der Dämmerung bei der stattlichen Frau Uffenbacher ein. Sie trieben dann eine Weile in dem Hüttchen ihr geheimnisvolles Wesen, – blasse Mädchen mit unförmigen Gestalten, die zu zweien und dreien in den einsamen Feldwegen spazieren gingen, bis sie eines Tages wieder verschwunden waren. Gewöhnlich tauchte nach solchem Verschwinden in der unteren Straße bei den armen Witwen in einem der bunten Vorgärtchen ein neuer Kinderwagen auf, und der scheue Gast ließ dem Dorf einen munter krähenden Erdenbürger als Pfand seines Besuches zurück.

Frau Uffenbacher aber zählte zufrieden einige Goldstücke und schloß sie in ihre Kommode und harrte einem anderen Gast entgegen. Sie hatte kürzlich, um mit der Neuzeit fortzuschreiten und ihrer Anstalt einen Aufschwung zu verleihen, Inserate in verschiedenen großen Blättern erscheinen lassen. Es waren auch Prospekte gedruckt worden. Gebildeten Damen höherer Stände, welche sich für eine Zeitlang von der Welt zurückzuziehen wünschten, waren darin alle Vorteile, die ein mehrmonatlicher Aufenthalt in dem gastlichen Hause von Frau Uffenbacher bot, mit unwiderstehlicher Liebenswürdigkeit auseinandergesetzt worden.

Das verfallene und von der ärmsten Dorfmagd verachtete Hüttchen an der Hügelflanke nahm in diesen Darlegungen den Charakter eines heiteren buen retiro an, in dessen Lauben und Ruheplätzen ein weltabgeschiedener Friede herrschte, während alle Bequemlichkeiten an Fluß- und Wannenbädern, an vorzüglicher Kost, an fachgemäßer ärztlicher Pflege mit einer Art von fachmännischer Selbstverständlichkeit zugesichert wurden, ebenso wie den Damen die allerstrengste Diskretion und eine gewissermaßen über die allerstrengste Diskretion noch hinausgehende Geheimhaltung ihrer Lebensumstände treuherzig und zugleich mit geschäftlichem Ernste zugesichert wurde.

Frau Uffenbacher suchte einen dieser meisterhaften Prospekte aus der Schublade ihres Wohnzimmertisches hervor, wo sich außerdem zwischen Brotrinden und Wurstschalen, Haarnadeln und sehr fettigen Spielkarten ein Fläschchen Tinte, ein Löschblatt und ein Federhalter befanden. Sie setzte ihre gewichtige Brille auf, und rief die zur Zeit bei ihr weilenden jungen Mädchen, das Annerle von Pfaffenhofen, die Schweizer-Mari und die bayerische Toni herbei, sowie ihre Magd, die Hanne, die ein dickes rotes Ziehkind auf ihren dicken roten Armen schaukelte. Ohne diese Hilfe wäre es Frau Ursula Uffenbacher nicht möglich gewesen, einen so bedeutungsvollen Brief zu schreiben, wie es jetzt geschehen mußte. Sie legte sich feierlich einen Papierbogen auf dem Löschblatt zurecht, rückte ihn rechts und rückte ihn links, leckte die Feder, putzte die Brille, schaute darüber hinweg auf das Annerle von Pfaffenhofen, ein molliges blondes Fräulein, das schmunzelnd in dem Prospekte las, und fragte etwas unsicher: „Sag’, Annerle, meinscht, die Anfrag’ ischt von einem Herrn? Ja, soll ich da adressieren: Sehr geehrter Herr oder Sehr geehrtes Fräulein? Eine bessere Herrschaft ischt’s jedenfalls – da müßt ihr euch schon zusammennehme, das sag’ ich euch, ihr Baggasch!“

„Zeigen Sie den Brief her, Frau Uffenbacher!“

Cornelies Anfrage, die sie auf das in der Zeitung gefundene Inserat hin an Frau Uffenbacher gerichtet hatte, ging von Hand zu Hand und erregte eine lebhafte Meinungsverschiedenheit.

„So sachgemäß fragt nur ein Herr – und zwar ein Geschäftsmann,“ erklärte Annerle, „ich kenn’ mich da aus! Und die Handschrift – ja – und doch, wenn ich’s recht bedenk’ . . . “

„Sie werden doch nicht glauben, daß so eine Frau schreibt,“ rief die Schweizer-Mari, das ischt doch alleweil sicher, daß das ein Mann geschrieben hat! Das Maidli hat gewiß einen lieben Herrn, der sich um sie kümmern tut . . . “

„Am End’ ihr Vater!“ überlegte Annerle. „Wisset’s – so das nach allem fragen – nach dem Bad und so – das tut schon so leicht kein Liebhaber – macht mir nix weiß . . . “

„Am End’ die Mutter!“

„Ach geh’ – kennst die Mütter! – Was tun denn die, als weine und schimpfe! Die kümmern sich doch den Teifi drum, was ihre Kinder gut täte in dere Zeit . . . Ja, die verheirateten Töchter – die werde gepflegt und gehegt – aber mir arme Luder . . . Ha!“

Das Annerle schwang sich auf die Tischkante, baumelte mit ihren Füßen, die in grauen Filzpantoffeln steckten, und las den Brief noch einmal aufmerksam von Anfang bis zu Ende durch. Ihre hellen und klugen, etwas hervorstehenden Augen bekamen dabei einen gesammelten Ausdruck von Nachdenklichkeit. „Ich mein’ doch, es ischt eine Frau,“ sagte sie dann bestimmt. „Vielleicht eine Verheiratete. Eine Dame. Mädels paßt auf! Das wird interessant!“

„Die macht doch kehrt, wann’s die Räuberhöhlen hier sieht!“ bemerkte die bayerische Toni. Hanne puffte sie sofort in die Seite und murrte: „Ihr tut auch gerad’, als wär’t ihr anders gewöhnt!“

„Sind wir auch!“ entgegnete Annerle scharf, während die Toni den Kopf wandte und schwieg.

„Für eure sechzig Mark, dafür ischt’s lange gut,“ schimpfte Frau Uffenbacher. „Soll ich euch Schneegäns’ eine extra Wurscht brate? Ich möchte’ mehr nehmen von der hier!“

„Ja, Frau Uffenbacher, da müßten Sie aber auch mehr geben . . . “

„Mehr gebe – mein’ ich geb’ mehr als genug! Ein Brot und ein Backsteinkäs’ – mehr gibt’s Sommer und Winter nit bei der Frau Wurzler in Ulm, und die hatte die feinschten Fräuleins. Was wird dann die Neue viel sein? Wird auch nur . . . !“

Sie brauchte einen sehr derben und volkstümlichen Ausdruck, die gute Frau Uffenbacher. Die Mädchen quiekten ein bißchen aus Schadenfreude und vor Vergnügen an der Unanständigkeit. Und dann wurde unter der energischen Beihilfe des klugen Annerle, die von Beruf Buchhalterin in einem Warenhause war, die Antwort an die rätselhafte und aufregende Persönlichkeit verfaßt.

„Vergesse Sie nit ‚Dischkretion Ehrensache‘. Das verlange die Leut!“ rief Annerle zum Schluß, „Ehrensach’“ mit einem ‚H‘“. Sie baumelte vergnügt mit den grauen Filzpantoffeln. Hier unter all den Frauenspersonen – warum sollte man sich’s nicht bequem machen?

„Ich werd’ als wissen, wie ‚Ehrensach‘ geschrieben wird,“ sagte Frau Uffenbacher würdig, zeichnete ihren Namen und schob die Antwort, nebst einem der verheißungsvollen Prospekte in den Umschlag. Drauf lehnte sie sich im Stuhl zurück, strich befriedigt mit beiden Händen über ihre gestärkte weiße Schürze, und blickte triumphierend im Kreise umher. „Nu wolle wir veschpern.“ Sie nahm Cornelies Brief aus Tonis Hand und legte ihn in die Tischlade, wo ihre diskrete Korrespondenz bei Brotresten und Wurstschalen, Bindfaden, Haarnadeln und den sehr fettigen Spielkarten ihren Platz fand.

Einige Tage später traf Cornelie Reimann in Schopfingen ein. Der verheißungsvolle Prospekt hatte seine Wirkung getan. Sie ging in ihrem langen, sandfarbenen Mantel den Weg vom Bahnhof, vorüber an den kleinen Häuschen der Witwen, in deren Vorgärten je ein bis zwei Kinderwagen standen. Wo die Hütten zu Ende waren, fragte sie eine knochige rothaarige Frau mit einem freundlichen Gesicht nach der Besitzung von Frau Uffenbacher. Ihre Stimme war leise und tonlos. Die Frau blickte sie erstaunt an und sah dann schüchtern zur Seite, während sie Auskunft gab. Eine zweite Frau gesellte sich zu ihr.

„Ja – will denn die zur Uffenbacherin – das isch doch eine Dam’?“ fragte die andere und die Rothaarige schüttelte bestürzt den Kopf.

„Am End’ für ein Verwandtes?“ „Nein, schau – sie ist doch in der Hoffnung.“

„Ja, ja – schon – Das sind Geschichte! Da wird die Uffenbacherin sich arg wichtig tun! Gel’ sie kommt schon und verzählt! Sie kann doch nichts bei sich behalte! Wirst schon alles höre, Fischerin!“

„Da schau ich heut’ abend noch bei dir ein!“ flüsterte die Freundin und die Rothaarige lachte über den Eifer der anderen.

„Komm, Lisle, geh’ her, hole ein Brot zur Veschper. Und bring’ ein Bier mit!“

Das zierliche Kind hüpfte mit dem Krug davon und hatte die langsam schreitende Cornelie bald überholt. Cornelie sah die reizend gebildeten nackten Füßchen der Kleinen mit den feinen Gelenken vor sich her über den Staub der Dorfstraße tanzen und freute sich der Schönheit seines leichten Ganges.

„War das deine Mutter?“ fragte sie freundlich das Kind. Es schüttelte den Kopf. „Meine Ziehmutter,“ sagte es verlegen, am Schürzenzipfel drehend.

„So – deine Ziehmutter,“ wiederholte Cornelie. Sie sprach nicht weiter, die Kleine lief davon. Corneliens Schritte wurden müder und müder.

Nur Ruhe finden . . .

Nur einen Winkel, der außerhalb, ganz außerhalb ihrer eigenen Welt lag – zu dem gar keine Fäden mehr hinüberführten. Wie dieser Winkel beschaffen sein mochte, war gleichgültig.

Ein warmer Nachmittagssonnenschein wob um die windschiefe Hütte der Uffenbacherin einen feinen Märchenduft, und tausende von Bienen, die durch die Zweige des blühenden Birnbaumes aus- und einschwärmten, summten friedlich sommerliche Melodien dazu. Eine „Anstalt“ in irgend einem Sinne von modern hygienischem Komfort war dies nun freilich nicht, aber Cornelie war es lieber so. Die Uffenbacherin in ihrer breiten mütterlichen Würde einer „weisen Frau“ des Dorfes mißfiel ihr nicht, das Bett des kleinen Zimmers war gut und sauber. So wurde sie schnell mit ihr handelseinig und beschloß, den Sommer über zu bleiben und ihre Stunde hier zu erwarten. Die Mahlzeiten wollte sie auf ihrem Zimmer nehmen. Ein oder das andere Fräulein, das vielleicht im Laufe der Zeit noch einkehren würde oder jetzt schon hier war, – o nur bessere Damen, dafür garantierte Frau Uffenbacher – ja, von denen würde die gnädige Frau nicht das mindeste zu sehen bekommen. Denn . . .

Gewiß – das machte Cornelie zur Hauptbedingung, sie durfte in keinerlei Beziehung zu diesen anderen Damen gebracht werden, sie mußte ganz einsam für sich leben können.

„Aber das ischt ja selbstverständlich,“ beteuerte die Uffenbacherin treuherzig. „Sehen Sie, gnädige Frau, die Damen sind ja alle auf Dischkretion angewiese, wie sollte denn eine solche Anstalt bestehe, wenn sie nicht auf Dischkretion gebaut wäre – und überhaupt mein Beruf – eine Hebamm’ – da könnte ich ja Geschichte erzähle – da erfährt man ja die Geheimnisse von ganze Familie! Schau’n Sie, da ischt jetzt so ein junges Fräulein bei mir“ – sie hob die Hand an den Mund, ihr breites Gesicht erglänzte vor Wichtigkeit, sie senkte die Stimme: „Der Vater besucht sie jeden Sonntag – niemand darf ihn sehen! Der Mann verliert seine Stellung, wenn was verlautet! – Das Ding war siebzehn Jahr – gnädige Frau – da geschehen Verbrechen, wenn man davon reden dürfte . . . “

„Also, dann lassen Sie meinen Koffer holen,“ sagte Cornelie ungeduldig.

„Darf ich Ihnen auch die Laube zeige? Der Schloßpark steht den Damen gleichfalls zur Verfügung, die Herrschafte sind nie anwesend.“

Frau Uffenbacher schritt Cornelie voran, das Treppchen hinunter über den kleinen Flur, rechts aus der Tür guckten blonde und braune neugierige Köpfe. Cornelie ging abgewendeten Hauptes vorüber. Sie fragte sich, ob sie dies werde ertragen können? Aber war nicht schließlich alles gleich unerträglich? Einige Augenblicke später sah sie vor sich ein Bild, das sie seltsam bewegte. Die Laube auf dem Hügel, eine Bretterhütte mit schrägem Dach, von jener einfachen Form, wie altdeutsche Darstellungen aus der heiligen Schrift sie zeigen, war erfüllt von goldenem Abendlicht. Auf der Wiese, die sie umgab, standen blaue und weiße Blumen mit schlanken Stengeln, die von den schrägfallenden Sonnenstrahlen beleuchtet, in einer unirdischen, gläsernen Schönheit erglänzten. In der offenen Holzlaube, mitten in dem goldenen Duft saß ein junges Weib von einer holden, süßen, leidenden Lieblichkeit der Erscheinung. Ihre schmalen und bleichen Hände lagen ihr müde im Schoß, ihre braunen durchsichtigen Augen blickten durch Tränen über die frühlingsblühende Weite in ein Tal von Schmerzen, das nur ihrem Blicke sichtbar wurde. Und über ihr, am blauen Himmel, unter den schneeglänzenden, goldumsäumten Sommerwölkchen flog gemächlichen Flügelschlages ein großer schwarz-weißer Storch.

„Der hält sich immer hier in der Näh’,“ sagte Frau Uffenbacher mit einem fröhlichen Stolz. „Die Freilen füttern ihn. Er gehört ja auch zu uns.“

„Wer ist das Mädchen?“ fragte Cornelie leise.

„Das ischt die Rose von Ulm. Hat letzte Woche entbunden. Morgen geht sie heim. Das Kind ischt vor einer Stunde geholt.“

Cornelie stürzten die Tränen aus den Augen.

„Ja freilich,“ sprach Frau Uffenbacherin in einem strengen Ton. „’s ischt so – ich sag’s alleweil: Ein Wochenbett ischt kein Brautbett! Das bedenkt so ein Mädle nit vorher. Ei – Rösle, muscht nit heule! Kanscht doch jede Woche herüber und das Kleine sehen! Gut hat’s das Ding bei der Frau Lebzelter – sauber – da ischt nichts zu sage! Der Herr Papa wird ja doch einmal nachschauen! Na ja . . . Denket Sie an die Freilein Toni – das ischt ein Elend . . . Ihne wollte doch die Eltern von Eurem Herrn was gebe fürs Kindle . . . “

„Ja, Frau Uffenbacher,“ sagte die Rose von Ulm in einem gereizten Ton, „ich weiß schon – aber ich will ihr Geld nicht – ich will einen Vater für mein Kind!“

Ihr feines Mädchengesicht zog sich zusammen zu der krampfhaften Energie eines Entschlusses, der mit der Wucht einer fixen Idee ihre Zukunft regieren würde: Ich will einen Vater für mein Kind!

Die Rose von Ulm . . . Wie sie dort saß im goldenen Licht, im holden Blühen ihrer unschuldsvollen Schönheit hätte man der jungen Madonna gern den Göttersohn geglaubt – den Jupiter, der aus Himmelshöhen sich zu ihr niedergesenkt hatte. Doch Frau Uffenbacher flüsterte Cornelie ins Ohr: „’s ischt ein Leutenant – die Eltern wollen’s nit leide – er soll eine reiche Baas freien, eine Tuchfabrikantenstochter aus Reutlingen.“

Viertes Kapitel

Auch eine Welt – auch eine Welt – dachte Cornelie, als sie wachend auf ihrem Bette lag. Und sie hatte geglaubt, etwas vom Leben zu wissen – hatte sich vermessen, Urteile zu fällen, Rätsel zu lösen, Vergleiche zu ziehen. In die Einsamkeit hatte sie zu flüchten gemeint und war, wie in alten Märchen, gleichsam in Schlaf und Traum in ein anderes Leben hinabgesunken, das unter dem hellen Tagesschein, in dem sie bisher gewohnt hatte, sich regte und bewegte, erfüllt war von Gestalten und Schicksalen, von denen sie vorher nicht das mindeste ahnte. Sie war sich ein Einzelfall bisher gewesen – ein Unerhörtes, Niedagewesenes, nie wieder Seiendes, durch keinen noch so dünnen Faden mehr mit allen Lebenden verknüpft – gleichsam ausgestoßen aus der Gemeinschaft alles Menschlichen, von dem sie wußte, und das ihr bis heut allein als Menschliches gegolten hatte. Wie weit dahinten lagen nun alle bekannten Begriffe – Wie unsicher schienen die Umrisse ihrer Existenz geworden, wie matt und zerflossen, elend gleichgültig die Farben ihres bisherigen Seins – selbst ihrer Liebe, die kaum noch zu ihr zu gehören schien, die ihr über den Rand des dunklen Brunnens, in dem sie versunken war, mit toten, leeren Gespensteraugen nachblickte.

Aber um sie her aus dem Dämmer drang es auf sie ein von neuen Dingen, neuen Erscheinungen, die schattenhaft sich durcheinander bewegten und regten und leise raunten von unerhörten Geheimnissen und schweren Gefühlen und von tiefem Wissen, das in dieser Unterwelt verborgen, seiner Auferstehung, seiner Erhebung zum Lichte der Erkenntnis harrte . . .

Und doch schien die Sonne auch hier und die gleichen Blumen blühten wie im Tageslicht – und am Himmel schwebte der gleiche, vertraute Sagenvogel, von dem einst in der eigenen warmen Kinderstube die Mutter Liedchen gesungen und Märchen erzählt hatte. Mit ungeschickten Kinderfingern hatte sie ihm Brosämlein und Kuchenbrocken auf die Fensterbank gestreut, damit er ihr ein Brüderlein oder Schwesterlein bringe. Die schöne Mama hatte daneben gestanden und geheimnisvoll gelächelt . . . Und die ersten Schauer des Unbegreiflichen, des großen Wunders des eigenen Daseins hatten an ihr kleines Mädchenherz gerührt, bei jenem befangenen, glücklichbangen Lächeln der Mutter . . . Die Luft in dem niederen Raume, dessen Decke Cornelie von ihrem Lager aus fast mit der ausgestreckten Hand berühren konnte, war schwül und dumpfig. Sie hatte am Abend das Fenster öffnen wollen und dabei gesehen, daß die weißen Gardinen, die es so sauber umhüllten, in der Mitte zugenäht waren, gleichsam um jedem Versuch einer Lüftung von vornherein vorzubeugen. Als Cornelie ihre Schere nahm und diese seltsame Naht auftrennte, welche ihr die etwas übertriebene Ordnungsliebe der Frau Uffenbacher angenehm zu bestätigen schien, entdeckte sie den tieferen Grund dieser Maßregel. Das Holz der Fensterumrahmung war so vermorscht, die Haften und Riegel so vom Rost verfressen, daß die Flügel, sobald sie sie aufzustoßen versuchte, auf der Stelle in die Nesseln, die unter dem Fenster blühten, hinabzustürzen drohten und nur mit einer energischen Anstrengung ihrer Arme noch an diesem Unglücksfall verhindert werden konnten. Augenscheinlich wurde die Tür zur Durchlüftung des Raumes für ausreichend erachtet, und dies war wohl der Grund, daß sich aus der Küche emporsteigend, ein fettiger Schmalzgeruch der Zimmerluft eindringlich mitgeteilt hatte. Trotzdem der Dunst von Speisen Cornelie unerträgliche Übelkeit verursachte, mochte sie doch die Tür nicht offen stehen lassen – sie empfand allzu unbehaglich die Neugier, die draußen lauerte. Immerhin, eine Nachte konnte man bei geschlossenen Türen und Fenstern verbringen. Morgen, in der Frühe, würde sie zu einem Tischler senden und die Sache auf eigene Kosten richten lassen.

Aber nun wurden nach und nach alle die Gerüche lebendig, die in dem eingeschlossenen kleinen Zimmer schon so lange Zeit gefangen gehalten worden waren. Aus dem vorsündflutlichen Kanapee krochen uralte Düfte von Menschenschweiß, von dörflichem Knaster und Pfeifenrauch, aus dem wurmstichigen Holzwerk des Waschtisches und der Bettlade, ja aus Kissen und Decken wand sich ein fader, süßlich-ekler Brodem gemischt aus Moschus, Kamillen, Ammoniak und Karbol. Cornelies geschärfte Sinne vermeinten den Dunst von Blut und Wunden zu spüren – von Blut, das über das Lager geflossen, auf dem sie ruhte – von Wunden, die hier erlitten waren in einsamer Not . . . Angst und Ekel beklemmten sie bis zur Atemlosigkeit. Sie warf die Decken von sich und wollte aufspringen – da hielt sie zitternd inne und lauschte . . . der Schweiß brach ihr aus, lief ihr in kalten Tröpfchen das Rückgrat hinab. Ein Wimmern drang zu ihr, ein leises, ersticktes Winseln und Weinen, so, als werde es erstickt in den Kissen eines Bettes. Und doch wurde es stärker und stärker, schwoll auf zu jähem Schluchzen, sank zusammen zu ergebenem Weinen, wurde wieder lauter, wurde zum verzweifelten Jammern eines verlassenen, der dunklen Nacht und den dunklen Schicksalsmächten sein Elend klagenden Geschöpfes.

Cornelie starrte mit weitaufgerissenen Augen in die Finsternis. So grauenvolles Weinen hatte sie noch nie vernommen . . . Doch, doch – sie kannte jeden Laut – es war ihr allmählich, als hörte sie sich selbst, losgelöst vom eigenen Körper, dort drinnen schluchzen . . . War es nur eine Stimme? Eine zweite gesellte sich aus größerer Entfernung hinzu – es war nicht mehr ein einzelnes Mädchenweinen – die Klagelaute drangen vom Boden herauf und aus den Mauern hervor – es schien Cornelien, als wimmere das ganze kleine dürftige Haus, als vereinten sich alle Tränen, die in seinem Innern schon geflossen sein mochten, zu einem Regen, der mit geisterhaftem Gewinsel aus den Poren des Mauerwerkes, aus den Ritzen der Dielen, aus den Kissen der Lagerstätten empordrang und hilflos, hoffnungslos, doch unerschöpflich der Nacht und dem Dunkel die Schmerzen klagte, die dem harten Tageslicht verborgen werden mußten.

So viele heiße, liebevolle Herzen hatten hier der Liebe fluchen gelernt, hatten hier in wilden Angstkrämpfen das Muttergefühl in der Brust ersticken und morden müssen. Was Wunder, wenn der fühllose Mörtel der Wände erbebte, wenn das Holz der Dielen, das alle die zahllosen Tränen aufgesogen hatte, ächzte unter dem Brand der salzigen Tropfen . . . Die Stunden vergingen und Cornelie saß aufrecht in ihrem Bette, lauschend auf die geisterhaften Stimmen ihrer eigenen Schmerzen, und sie wurden ihr zu einem Klagestöhnen, das nicht mehr ihr eigenes blieb, das aus fernen, fernen Zeiten durch die Jahrhunderte scholl, gleich einem ewigen unstillbaren Gesang der Zertretenen, Verlassenen, Besiegten.

Fünftes Kapitel

Der trübe, laue Frühlingstag lockte unter den knorrigen, von rosenroten Blüten bedeckten Apfelbäumen auf den Landstraßen weiter und weiter zu wandern und dem Tirilieren der Lerchen über den hellgrünen Feldern zuzuhören. Als Cornelie heim kam, war die Sonne schon eine Weile untergegangen. Sie sah in der Dämmerung Frau Uffenbacher breit und wuchtig in ihrer kleinen Haustür stehen. Die Hanne war bei ihr und drei der Fräuleins; die Rose von Ulm war am Morgen abgereist. Cornelie hörte lautes, heftiges Schwatzen und zögerte, um einen Augenblick abzupassen, in dem sie unbemerkt die Treppe hinaufschlüpfen konnte. Seit man ihren Zustand offen anerkannte, war ihr zumute, als gehe sie nackend zwischen den Menschen hindurch. Sie fühlte deren Blick wie die Stiche böser Insekten auf ihrer empfindlichen Haut, und bis tief in ihre Brust hinein.

Während sie in der Dämmerung am Himbeergebüsch des Gartens stehen blieb, hörte sie Annerles helle Stimme: „Jesses, da kommt sie ja schon, Frau Uffenbacher! Hab’ ich’s nit gesagt, sie wird halt spazieren gegangen sein!“

Cornelie überwand sich und trat in ihrem langen, sandfarbenen Regenmantel langsam näher.

„Ist es schon Essenszeit? Es tut mir leid, wenn ich habe warten lassen,“ sagte sie obenhin. Mit einem leichten Neigen des Kopfes wollte sie an der Gruppe vorüber.

„Das geschieht mir aber nit wieder,“ schrie Frau Uffenbacher sie an, der Zorn der vollblütigen Frau brach zuweilen ganz unvermittelt aus ihr hervor.

„Was geschieht nicht wieder?“ fragte Cornelie befremdet.

„Daß Sie hier fort gehe, ohne mir auch nur ein Wörtle zu sagen, und stundelang fort bleibe und mir wisse nit, wo Sie sich aufhalte! Das gibt’s nit – die Angscht will ich nit noch einmal habbe!“

„Aber – Frau Uffenbacher,“ sagte Cornelie irritiert, „warum hatten Sie denn Angst? Ich bin doch ein erwachsener Mensch! Was soll mir denn hier zustoßen? Sind die Landstraßen in der Gegend so unsicher?“

„Ja, was meine Sie denn,“ schrie die Uffenbacherin laut und drohend, „in dem Zustand, wo Sie sich befinde, da rennt man doch nit stundenlang auf die Landstraß’! Wenn Ihne da was zustößt und Sie komme im Straßengrabe nieder? . . . Nachher hab’ ich mit der Polizei zu schaffe! Das könnt’ mir passe! Oder Sie krieget’s in den Kopf und tun sich ein Leid an! Gar noch! ’s wär’ nit das erschte Mal!“

Cornelie stand mit gesenktem Kopf und ließ die Scheltworte der wütenden Frau auf sich niederprasseln. Sie trafen wie brennende Splitter aus einer Explosion, von denen jeder eine Brandwunde schlägt.

„Morgen früh reise ich wieder,“ dachte sie mutlos, leidend. „Es muß doch einen Ort geben, wo ich mich unbehelligt verkriechen kann.“

„Wir meinten, gnädige Frau hätten sich vielleicht verirrt;“ mit dieser Unterbrechung stürzte sich Annerle kühn in den Wortschwall der Uffenbacherin. Damit die Zornwellen nicht wieder auftoben möchten, sprach sie eilig weiter mit der liebenswürdigen Verbindlichkeit, die sie besseren Kunden gegenüber anwendete, und die sie ihren Chefs so schätzenswert machte. „Gnädige Frau wissen die Wege hier nit und es wurde schon dämmerig. Da hat sich Frau Uffenbacher um gnädige Frau gesorgt – wir alle haben’s ein bissel mit der Angst kriegt.“

„Das war unnötig,“ antwortete Cornelie abweisend.

„Ich bin es gewöhnt, allein spazieren zu gehen und kann diese Gewohnheit nicht ändern.“

„Da muß ich doch halt sehr bitten . . . “ fuhr die Uffenbacherin aufs neue los. Cornelie ging schnell an ihr vorüber, die zwei ausgetretenen Steinstufen hinauf in den Flur. Von dort aus wendete sie sich noch einmal zurück und sagte mit ihrer leisen, klaren und höflichen Stimme: „Sie senden mir das Abendessen wohl auf mein Zimmer.“

Dann stieg sie, ohne sich umzusehen, langsam und ein wenig schwer die schmale Holztreppe hinauf.

„Was ist denn die – was will denn die!“ keifte die Uffenbacherin mit hochrotem Gesicht und schaute sich wütend unter ihren Damen um. Die Schweizer-Mari und die bayerische Toni lachten schadenfroh. Sie gönnten der großen dicken Tyrannin die Niederlage.

Annerle häkelte aufgeregt weiter am Saum der wollnen Windel, die sie mit einer rosenroten Kante auszierte. Sie sagte dabei scharf pointiert, wie das Annerle ihre Weisheitssprüche von sich zu geben pflegte: „Die will gar nix! Die ischt nur eine vornehme Dame! – Ja, Frau Uffenbacher, die läßt sich nicht behandeln, wie wir armen Hascherle – !“

„No – wie behandele ich euch denn?“ schrie die Uffenbacherin. Die Arme in die Seiten gestemmt, pflanzte sie sich drohend vors Annerle, so daß sie fast erschrecklich anzusehen war, die gewaltige Frau, in dem aus ihr kochenden und polternden Jähzorn. „Für das lumpig Lausegeld, was ihr zahlt, ihr Sauband’, da werdet ihr als viel zu gut behandelt. Gemeines Pack, ihr alle miteinand. Die Lange da oben ischt auch nit um ein Haar besser wie ihr. Trägt die etwa einen Trauring . . . ? Ha, da brauch’ ich mich, weisch Gott, nit zu scheniere.“

Ihre weiteren Ausführungen über die Stellung der neuen Langen gingen unter in einem wilden Empörungsschrei, in dem das Annerle den Ton angab und die andern besseren Damen ihr wacker zur Seite standen. Es wurde ein wüster, kreischender, tobender Weiberzank, der den lauen Frühlingsabend mißtönend durchhallte, und in dem keines mehr wußte, um was es sich noch handelte. Ein paar Nachbarinnen von den Witwen aus der unteren Straße gesellten sich dazu, keiften aus vollem Herzen und voller Lungenkraft mit hinein, bald der Uffenbacherin, bald den Fräuleins recht gebend, beide gegeneinander aufhetzend, und so ihr Vergnügen an der Dischkussion behaglich genießend.

Cornelie lag oben auf dem tabaksduftigen Kanapee. Die zugenähten Gardinen vor den Fenstern konnten den Schall der Schimpfworte, die hin und wider flogen, nur wenig dämpfen. Ihre geringe Kenntnis von den volkstümlichen Ausdrücken für die zarten Dinge der Liebe wurde an diesem Abend um eine tüchtige Anzahl saftiger Kernworte vermehrt. Beunruhigt lauschte sie. Handelte sich der Streit eigentlich um ihre Person, oder um was denn sonst? Sollte sie eingreifen oder besser fern bleiben?

Mein Gott, dachte sie erschrocken, sie werden sich noch prügeln! Warum bin ich überhaupt hierher gekommen? Was ist dies für ein Haus? Sie beschloß, am frühen Morgen ihren Koffer zu packen, die für den Monat vorausbezahlte Pension fahren zu lassen und weiter zu ziehen. Denn konnte sie wohl bei dem Geschrei und Geheul, das hier an der Tagesordnung zu sein schien, ihre Arbeit über das Seelenleben des modernen Kulturweibes mit einiger Wahrscheinlichkeit auf Erfolg zu einem guten Ende bringen?

Und doch schien es ihr beinahe unmöglich, weiter zu suchen und sich all diesen fragenden, verwunderten, mißtrauischen Blicken aufs neue auszusetzen. Eine Angst ergriff sie, in der sie aufsprang und mit flatterndem Herzschlag mühsam und bange atmete. Sie trat an das winzige Fenster, hob die Gardine und blickte hinab. Da sah die vornehme Philosophin Cornelie Reimann etwas, das sie noch niemals gesehen hatte: Frau Uffenbacher wendete sich mit einem jähen Schwung ihrer stattlichen Hüften, hob ihre Röcke hoch auf und streckte ihren Pensionärinnen, den gesamten besseren Damen als Zeichen ihrer äußersten Verachtung ihr weißleuchtendes, breites und mächtiges Hinterteil entgegen. Dann verschwand sie unter dem gellenden Entrüstungsschrei der von solchem Schimpf Betroffenen in dem Flur ihrer „Anstalt“, und dröhnend schlug die Küchentür hinter ihr zu.

Der schwarz und weiße Sagenvogel, der, einen zappelnden Frosch im roten Schnabel, von blauer Höhe herab zugeschaut hatte, schlug gelassen seine schweren Flügel auf und nieder und enteilte zu seinem friedlichen Nest auf der Pfarrscheune.

Cornelie verschloß ihre Tür zweimal und verzichtete an diesem Abend auf die Nahrung, die ihr Frau Uffenbacher drei Viertelstunden später durch die Hanne heraufschickte. In den Nebenstuben hörte sie noch lange aufgeregtes Schluchzen und Hin- und Herreden der Mädchen.

Sechstes Kapitel

Das blonde Annerle grüßte mit Ehrerbietung, als sie der neuen Langen am nächsten Morgen auf dem Flur in den Weg trat. Bescheiden fragte sie, wie die gnädige Frau geschlafen habe. Auf das kühle kurze Dankwort Corneliens flüsterte sie errötend: „Man schläft nit extra gut hier im Tränenhaus – so heißen wir als die verfluchte Hütte . . . Was müssen gnädige Frau nur gestern gedacht haben . . . Ach – gnädige Frau passen gar nicht hierher . . . “

Cornelie zuckte ungeduldig die Achseln. „Ich werde wieder abreisen,“ sagte sie, und wollte in ihr Zimmer zurücktreten, fügte jedoch im nächsten Augenblick lebhafter hinzu: „Ich verstehe nicht, warum Sie sich die Unverschämtheit dieser schauerlichen Person gefallen lassen. Ich habe mich in ihr geirrt. Sie schien mir anfangs eine verständige und wohlwollende Frau.“

„Ja,“ rief Annerle, „so scheint sie, und damit lockte sie uns alle hierher – damit umgarnt sie auch den Geheimrat! Der hält arg große Stücke auf sie und will mir nit glauben, wenn ich ihm sage: ‚Herr Geheimrat, Sie sollten die Frau Uffenbacher kennen, wie wir sie kennen! Da würden Sie Augen machen! ‘“

„Der Geheimrat?“ fragte Cornelie befremdet. Was würde sie noch ferner für Erfahrungen machen in diesem kleinen Häuschen, das in ländlichem Frieden unter dem blühenden Birnbaum ruhte, umschwärmt von den summenden Bienen.

„Der Herr Geheimrat hat auch dem Vater der Toni die Frau Uffenbacher empfohlen, und darum will er nun nicht die Wahrheit hören – so sind die Mannsbilder,“ berichtete Annerle, verständig unter ihren blonden Flatterlöckchen mit den etwas vorstehenden Augen Cornelie anblickend. Sie lächelte ein wenig über die Mannsbilder und Cornelie lächelte auch, aus Höflichkeit.

Plötzlich ging ein Erschrecken über ihre Züge.

„Wohnt dieser – dieser Geheimrat hier im Haus?“ fragte sie beklommen. „Frau Uffenbacher hatte mir versichert, es kämen niemals Herren ins Haus, außer dem Vater von Fräulein Toni, der sie Sonntags besucht . . . ?“

Jetzt war Annerles ganzes rundes Gesicht eine fröhliche Heiterkeit. „O – Jesses! Der Herr Geheimrat – hier wohnen! Das muß ich ihm erzählen! Der wird lachen. Nein – der schaut nur zuweilen von Stuttgart herüber, ob hier alles in Ordnung hergeht! O – da kann die Uffenbacherin aber schmeicheln und schön tun! Und eine Würdigkeit! Da sollt’ man meinen, es könnt’ gar nit sein, daß sie sich so schweinisch beträgt, wie gestern abend. Wir haben uns alle für Sie geschämt.“

Cornelie wendete den Kopf ab und errötete. Annerle sah ein, daß es besser war, das Thema zu wechseln. Die kleine mollige Person in der losen karrierten Morgenjacke, darunter sich kugelrund das Bäuchlein hob, richtete sich ein wenig auf den Zehen zu Cornelies Ohr und flüsterte geheimnisvoll: „Der Herr Geheimrat hat der Uffenbacherin das Geld gegeben, um die Anstalt zu übernehmen, nachdem ihre letzte Besitzerin verstorben ist, und das Häusle zum Verkauf stand.“

„Woher wissen Sie denn das alles?“ fragte Cornelie verwundert und wider Willen interessiert.

Annerle schlug die Augen nieder.

„Ich war schon einmal hier,“ sagte sie mit einer künstlich gespielten Verlegenheit. „S’ischt schon mein Zweites . . . “

„Ah so . . . “

„Ja – das Liesel ist bei meinen Eltern . . . Aber gnädige Frau müssen deshalb nicht schlecht von mir denken –“

Annerle hatte diese Redensart häufig in Romanen gelesen, die von verführten Mädchen handelten, und fand sie jetzt entschieden angebracht. „Ich und mei Hansel, wir leben wie brave Eheleut’ zusammen – nur heiraten können wir uns halt nit – seine Eltern sind jüdisch und mein Onkel ist doch der Dekan.“

Sie machte eine Pause und war zufrieden mit der Wirkung des zuletzt ausgespielten Trumpfes auf die Fremde.

„Bitt’ schön, gnädige Frau – ich vertrau’ auf Ihre Dischkretion . . . es wäre arg für mich, wenn’s daheim auskäm, daß ich schon wieder in der Hoffnung bin . . . Ja – geltens – so ein verliebter Mann . . . ! Und mei Hansel hat immer gesagt: ‚Annerle, nur nichts gegen ’s Gesetz . . . Da steht Zuchthaus drauf . . . ‘ Wisse Sie – sein Alter ist als noch so ganz im Alten Testament.“

„Wie merkwürdig ist das alles,“ flüsterte Cornelie.

„Aber kann Ihnen der – der – Ihr Freund nicht eine andere Unterkunft verschaffen?“

„Ha – mei Hansel – und mir was verschaffen. Jesses, der sagt: Laß mich zufrieden – ’s ist schon arg genug, daß d’ so garstig ausschaust. Ich wüßt’ schon noch andere Orte – aber, das ischt’s ja – wir könne hier nit fort – wir habe uns dem Satan in die Händ’ geliefert – ! Wenn die Männer wüßten, was so ein arm’s Mädele auszustehen hat . . . Gnädige Frau, das ist ein bitterböses Weib – die Uffenbacherin – die hat ihre Freud’ d’ran, ihr Gift und ihre Bosheit an uns auszulassen . . . Sie weiß von uns allen die Adressen – die läßt sie sich gleich zu Anfang geben . . . Für einen Sterbensfall sagt sie – ja – ja . . . damit sie uns in der Hand hat, und wir nit’s Maul auftun dürfen, wenn sie uns einen Fraß vorsetzt, wie für die Säue. Gnädige Frau haben doch nicht etwa Ihre richtige Adresse angegeben, von Ihrem zu Haus?“

„Ja – das habe ich,“ sagte Cornelie geängstigt.

„Das hätten gnädige Frau nicht tun dürfen,“ bemerkte Annerle und hob ihr in die Luft strebendes Näschen mit weiser Überlegenheit noch höher. „Hätt’ ich gnädige Frau nur raten dürfen! Von meinen Leuten weiß sie ja – denn ich bin’s doch gewesen, die ’s beim Herrn Geheimrat vermittelt hat, daß er ihr das Geld gab! Dafür dacht’ ich, ich könnt’ auf eine menschenwürdige Behandlung rechnen. – Prost Mahlzeit! Nun hat man zu kuschen! Und gar das arme Tonerle – der ihr Vater verliert seine Stellung, wenn’s auskommt, wer die Verwandten sind, wo seine Tochter den Sommer zubringt. Wenn das Mädele wagt, sich zu beklagen, da heißt’s: Du hascht’s nit anders habe wolle – jetzt schweig’ und leid’!“

Cornelie neigte den Kopf und bewegte nervös die Finger, die kalt und feucht geworden waren.

„Ach, gnädige Frau . . . “ begann das kleine runde Mädchen elegisch – sie besaß einen regen Schönheitssinn, darum hatte es ihr diese Lange, Schlanke, Vornehme gleich angetan. „Wenn ich Ihnen in irgend etwas behilflich sein könnt’, gnädige Frau?“ Eine bewundernde Andacht war in der Stimme, „ich kenne die Verhältnisse hier gründlich.“

„Ich danke Ihnen,“ sagte Cornelie. Das müde und traurige Lächeln, das Annerle bis zu Tränen rührte, kam wieder über das schmale Gesicht mit der kühnen Nase.

„Wir müssen uns wohl am besten auch sagen: Du hast’s haben wollen – jetzt schweig’ und leid’.“

Annerle nickte. Irgend etwas wie Scheu band ihr plötzlich das behende Zünglein. Sie seufzte.

„Wenn ich nur wüßte,“ begann Cornelie wieder, „wodurch ich gestern diese Frau so gereizt haben kann? . . . “

„Gnädigste“ – Annerle lächelte fein, „Ihr ganzes Wesen reizt sie! Das Weib fühlt, daß sie Ihnen das nit bieten kann, was sie uns bietet – das wurmt sie – da schimpft sie halt hinter Ihrem Rücken, um sich Luft zu machen. Gestern konnt’ ich’s nit mehr leiden – den ganzen Tag war’s schon so in der Küche hergegangen – da hab’ ich ihr halt einmal die Wahrheit gesteckt!“

„O – um meinetwillen . . . ?“

„Es war schon alles eins! Ich wär’ sonst dran erstickt.“

„So – nun dann . . . Ich bin gewöhnt, sehr unabhängig zu leben,“ Cornelie sagte es entschuldigend und etwas förmlich. „Falls Frau Uffenbacher es wünscht, kann ich ihr ja aber sagen, wenn ich ausgehe!“ Ein kleiner Zug von Ironie zeigte sich um ihren Mund.

„Wir sollen uns am Tag überhaupt nicht unter die Leut’ sehen lassen, als wenn wir die Pescht hätten . . . “ grollte Annerle.

Cornelie hob die Hand und strich sich über die Stirn.

„Verzeihen Sie,“ sagte sie leise und höflich, „ich bin etwas müde vom Stehen – ich möchte mich niederlegen.“

Annerle sprang dienstfertig, ihr die Tür zu öffnen, sie war recht behende trotz ihrer Leibesfülle. „Vielleicht möchten gnädige Frau lieber in der Laube sitzen. Die Uffenbacher ischt im Dorf und von uns würde Sie keines stören . . . “

„Vielleicht später,“ sagte Cornelie ausweichend. Annerle fühlte, es war genug mit den Annäherungsversuchen. So grüßte sie denn hochachtungsvoll und bescheiden und begab sich zu Toni, um dieser ihre Erfahrungen mit der neuen Vornehmen freundschaftlich zu berichten. Die bayerische Toni hatte es sich bequem gemacht und räumte, in eine rosageblümte Nachtjacke und einen braunen Moireerock gekleidet, ihre Kommodenschubladen auf. Sie war daheim, in dem kinderreichen Haushalt eines Volksschullehrers an hundertelei wechselnde Arbeiten gewöhnt. Hier schlichen die langen Tage in trüber Einförmigkeit den kurzen Sommernächten entgegen. Darum traf man Toni meist bei der Aufräumung ihrer Kommode, oder mit dem Stopfen ihrer Strümpfe, Hemden und sonstigen Bekleidungsgegenstände beschäftigt. Alles war von äußerster Einfachheit und durch langen Gebrauch abgenutzt, aber mit Sorgsamkeit erhalten. Toni zählte nicht mehr als siebzehn Lenze. Von einem Liebesfrühling aber, dessen Freuden sie hier bei Frau Uffenbacher abzubüßen gezwungen wurde, hätte sie kaum sprechen können. Ihre Erfahrungen in der Liebe waren kurz, dunkel und verworren. Sie beschränkten sich auf wenige Stunden, die ihr in der Erinnerung nur Angst und Schrecken zu enthalten schienen. Toni war ein knochiges Mädchen von unreinem Teint und breitem, gewöhnlichen Gesicht, dem nur die treuherzigen Augen ein freundliches Licht verliehen. Aber sie hatte sich darüber klar werden müssen, daß es nicht einmal dieser spärliche Reiz gewesen war, der ihren Verführer lockte. Ach nein – es waren nur die paar tausend Mark, die sie vor kurzem von einer Tante geerbt hatte, und die die geschäftige Phantasie guter Freunde sofort zu einigen Hunderttausenden umschuf, mit denen ein verschuldeter Abenteurer sich hatte vor dem Ruin retten wollen. Zwei von Tonis Freundinnen waren zur gleichen Zeit dem Schurken zur Beute gefallen. Er wollte die Wahl haben. Von den Eltern konnte ihm unter so zwingenden Umständen doch keiner die Tochter weigern, hatte er wohl gemeint. Aber dieses Rechenexempel wurde ruchbar und Toni wurde von allem in Kenntnis gesetzt. Nun zeigte sie sich demütig einverstanden mit ihrem Vater, als er dem Verführer die Tochter weigerte. Sie sollte ihn niemals wiedersehen und sie verlangte auch nicht danach. Aber sie mußte neun Monate lang sein Kind unter dem Herzen tragen. Das blasse, gedunsene Gesicht der Siebzehnjährigen hatte in dieser Zeit einen Ausdruck von geistiger Stumpfheit angenommen, von ungeheuerer Gleichgültigkeit, die fast wie Dummheit wirkte und die doch nur ein Schild war, die verzweifelte Selbsthilfe eines noch sehr jungen und gesunden Organismus gegen das tötende Entsetzen.

Und auch gegen das Heimweh. Das fürchterliche Heimweh, das Toni ergriff, wenn sie ihre Kommodenschubladen aufräumte – das Heimweh nach der Mama, nach der Großmutter und den kleinen Geschwistern, von denen sie noch niemals entfernt gewesen war. Dabei quälte sie fortwährend ein unerträglicher Hunger. Wo sie ging und stand, sah man Toni an einem Landjäger kauen – an einer dieser steinharten, geräucherten, flachgepreßten bayerischen Würste, welche die einzigen Liebesgaben bildeten, die Tonis Familie ihr ab und zu in die Verbannung zukommen ließ.

Siebtes Kapitel

Auf halber Höhe des langgedehnten Hügelgeländes, das auf seinem Gipfel die Dorfstraße trug, führte zwischen Haferfeldern ein schmaler, blumenumwachsener Weg zu einem Hain alter zottiger Apfelbäume. Weiße und rosige Blättchen wehten bei jedem Luftzug über Cornelie hin, die auf ihrem Tuch im Grase saß und zu arbeiten versuchte. Dabei mußte sie aber fortwährend über all die Zustände nachdenken, die Annerle ihr vorhin enthüllt hatte. Wenn es so stand, besaß sie ja gar nicht mehr die Freiheit, fortzugehen! Und auch wenn sie blieb, setzte sie ihre Mutter bei jeder Meinungsverschiedenheit mit diesem unheimlichen Weibe der Gefahr eines anonymen Anklagebriefes aus. Wie ein unbedachtes Kind hatte sie sich benommen. Sollte nun ihre Mutter Unsicherheit und Erwartung dieser Monate mit ihr leiden, nur weil sie sich zu schwach fühlte, zu ertragen, was alle die kleinen Mädchen doch ertrugen? Wie sie sich für ihre Willenlosigkeit verachtete!

Ein Bauer, der nach seinen Feldern gesehen hatte, war an Cornelie vorübergegangen, war zurückgekommen, um sie genau zu betrachten, und hatte sie dann in einer gewissen Entfernung umkreist, sie beobachtend, wie man ein fremdes Tier in seinen verwunderlichen Beschäftigungen beobachtet. Das hatte Cornelie maßlos gereizt – sie war geneigt, ihre ganze Verstimmung lediglich jener Störung zuzuschreiben. Der von hohen Mauern umhegte gräfliche Park erschien ihr plötzlich als ein Zufluchtsort, wo der Druck von ihr genommen werden könne. Dort gab es sicher Bänke und Tische. Man konnte seine Blätter behaglich ausbreiten. Das Schreiben auf den Knien, eine Stellung, bei der einem alle Glieder schmerzten, war der geistigen Sammlung und Freudigkeit nicht eben zuträglich. Hatte Frau Uffenbacher ihr nicht gesagt, daß die Herrschaft verreist sei? Der Gärtner mochte durch ein Trinkgeld zu gewinnen sein. Cornelie lächelte ein wenig in sich hinein. Sie mußte sich vorstellen, daß die Herrschaft anwesend war, sie ihre Karte hinaufschickte – und ob dies unter andern Verhältnissen nicht genügt haben würde, damit man ihr den Park, solange sie es wünschte, zur Verfügung stellte? Es war ihr in diesem Augenblick wieder alles gegenwärtig, was dieses letzte Jahr ihr gebracht hatte. Sie sah ihre altmodischen Stuben angefüllt mit den üppigen, schwer duftenden Gewächshausblumen, sie sah die Stöße von Zeitungen, die Tag um Tag gesandt wurden von Menschen, die sie nicht kannte, in deren jeder ihr Name – der Name Cornelie Reimann – als ein aufgehender Morgenstern, ein Fanal in der Dunkelheit gepriesen wurde – sie sah bewundernde Augen, verehrende Blicke von Männern und Frauen auf sich gerichtet – sie hörte das Flüstern, welches um sie her entstand, sobald sie ein Theater, einen Gesellschaftssaal betrat – sie atmete wieder die allgemeine Huldigung, die zu ihr empordrang und sie, wo sie auch ging und stand, gleichsam in einen feinen Weihrauchduft hüllte. Sie spürte wieder mit einem seltsamen Vibrieren ihres Herzens die Flammen des Begehrens, die entzündet aus den Weihrauchdüften des Ruhmes heiß zu ihr emporgezüngelt waren, die ihr mit einem Male die verlorene Jugend zurückzuerobern schienen . . . Nein – der Ruhm war nicht kalt, des Lorbeers Blüten dufteten betäubend, waren umflochten von Girlanden blutroter Rosen . . . Und die Welt gehörte ihr – zu Genuß und Besitz . . . Ihre Lippen wölbten sich voll und rosig in ihrem glühenden Antlitz und ihre Augen glänzten . . . Ihr Verweilen in Frau Uffenbachers geheimnisvollem Häuschen erhielt jetzt plötzlich nur die Bedeutung einer vorübergehenden abenteuerlichen Laune, es bekam den Reiz eines Exils, in dem eine Herrscherin zeitweilig ihre Krone verbirgt – in dem sie, der noch unermeßliche Macht und Gewalt vorbehalten ist, sich aus eigenem Willen aller ihrer Ehren und Herrlichkeiten für eine kurze Weile begibt . . .

Annerle stand vor der Tür und wartete, sie stand dort, eine neue Flanellwindel behäkelnd, schon geraume Zeit, um Corneliens Rückkehr nicht zu versäumen. Als sie die lange Gestalt in dem sandfarbenen Mantel kommen sah, ging sie ihr bescheiden entgegen und schlug die Augen andachtsvoll zu ihr auf. Cornelie fragte hochmütig und obenhin nach dem Weg zum gräflichen Park.

Annerle bot sich sogleich als Führerin an. Sie äußerte Bedenken, ob der Gärtner eine Fremde wohl einlassen würde. – Sie selbst dagegen – oh, sie hatte ja der Gärtnerin erst letzte Woche Stoff zu einem Unterrock besorgt. Cornelie wagte, durch Annerles Ansprache jäh aus allen Phantasien gerissen, keinerlei Widerspruch gegen ihren Vorschlag zu erheben, trotzdem dadurch der Zweck der Sache völlig vereitelt wurde. Sie fühlte sich wieder in die schüchterne Wehrlosigkeit versinken, die sie so oft dem andringenden Leben gegenüber befiel. Sie hätte dem Mädchen nicht einmal andeuten können, daß sie zu arbeiten beabsichtige. Es würde ihr wie eine Entweihung vorgekommen sein, als zeige sie vorwitzig ihre verborgene Krone – das Manuskript, das sie in einem Leinenbeutelchen am Arme hängend trug. Mochte Annerle ruhig denken, das Beutelchen enthalte nur eine Windel und etwas rosa Wolle mit einer Häkelnadel.

Ergeben dachte Cornelie: Auch dieser Nachmittag in Annerles Gesellschaft werde vorübergehen, wie schon so manches vorüber gegangen war. Zerstreut aß sie auf ihrem Zimmer ein Beefsteak, welches Frau Uffenbacher mit unmäßig viel Zwiebeln zuzubereiten pflegte, und streckte sich dann, ermüdet von dem sonnigen, warmen Morgen, auf dem alten Kanapee aus.

Annerle hatte inzwischen beschlossen, die SchweizerMari und die arme Toni an der Ehre eines Spazierganges mit der geheimnisvollen Neuen teilnehmen zu lassen. Ihr gutes Herz konnte einmal keine Freude allein genießen, und ihr Tatendrang ergriff mit Begeisterung jede Gelegenheit eine kleine Rolle zu spielen, sich selbst mit einer liebenswürdigen Wichtigkeit in den Mittelpunkt der Ereignisse zu bringen. Es war nicht leicht, Tonis Menschenscheu und Maris bäuerliche Schüchternheit zu überwinden und sie aufzumuntern, die Einladung der gnädigen Frau zum Spaziergang im gräflichen Park, die Annerle ihnen mit der größten Feierlichkeit, mit flüsternder und geheimnisvoller Stimme überbrachte, auch wirklich anzunehmen. Die Uffenbacherin dürfe beileibe nichts davon erfahren, denn die gnädige Frau wolle halt nit mit der alten wüschten Hex’ sich zeigen . . . Frau Uffenbacher indessen, die es für die Pflicht einer mütterlichen Freundin der jungen Schar ansehen mochte, sich über das Gewisper hinter den Türen vermittels der zu solchem Zwecke angebrachten Schlüssellöcher auf dem Laufenden zu halten, hatte das Wort von der „alten wüschten Hex’“ gleichfalls vernommen. Da es nun in allen Kammern alsbald an ein eiliges Kämmen, Waschen und Putzen ging – wobei denn in der Küche mehrfach warmes Wasser und Schuhwichse verlangt wurde, zogen sich die Wolken eines finsteren Unwetters dichter und dichter über Frau Uffenbachers Brauen zusammen. Äußerlich besaß die breite, gewaltige Frau wenig Ähnlichkeit mit dem blonden molligen Annerle, und doch war beiden ein rege schaffendes Phantasiespiel gleich eigen. Das hatte in der alten Hebamme gewirkt und sich auf dasselbe Objekt geworfen. Es schien auch Frau Uffenbacher lieblich, mit der vornehmen Dame im gräflichen Park zu promenieren. Bei dem Gärtner, dem Verwalter, am Ende gar dem Herrn Pfarrer oder dem Dr. Schwärzle, dem sie leicht begegnen mochten, konnte man sich als Beschützerin einer geheimnisvollen Fremden von hohem Range aufspielen. Der einfache bürgerliche Name, den Cornelie angegeben hatte, war der alten Schwäbin längst nicht interessant genug. Dahinter steckte noch manches, und die gute Frau Uffenbacher erging sich sowohl abends in ihren Träumen unter dem karrierten Federbett, wie auch bei ihren Besuchen im Dorf in den üppigsten Vorstellungen, was alles an herrlichen Dingen für ihre eigene Zukunft aus so hohen Beziehungen entsprießen könne! Sie hätte dabei schwerlich auseinander zu halten vermocht, wieviel sie mit Überlegung log, wieviel sie von ihren Phantasien allmählich selbst glaubte. Cornelie ahnte wenig, daß man schon am abendlichen Biertisch in der „Wirtschaft“ oben im Dorf darüber dischkutierte, ob sie eine „Regierende“ oder nur „halt so eine Fürschtin“ sei, und welche romantische oder gar politische Umtriebe sie in den abgelegenen Erdenwinkel verjagt hatten. Es wurden in diesen Tagen in Schopfingen uralte Sagen vom Manne mit der eisernen Maske und von in Wäldern gefundenen stummen Prinzenkindern aus dem Gedächtnisse hervorgeholt – auch von der Macht der Freimaurer raunte man sich seltsame Mären in die Ohren. Cornelies gleichgültiges Ablehnen von Frau Uffenbachers Anerbieten, sie in Dorf und Park umherzuführen, hatte diese schwerer gekränkt, als sie ahnen konnte. Aber die Uffenbacherin hatte es verschmerzt und eine gelegenere Stunde abgewartet. Und nun wollte ihr die freche kleine Person, das Annerle, deren Freundschaft zu dem Geheimrat ihr ohnehin ein Dorn im Auge war, den Triumph mir nichts dir nichts vorweg nehmen!

Der Sturm der Wut begann bereits in ihrer gewaltigen Brust zu kochen und ihr das Blut in den Kopf zu treiben. Als die Mari, die Toni und das Annerle gegen drei Uhr, die auseinandergegangenen Gestalten zum erstenmal wieder in Korsetts gezwängt, mit Jacken, Hüten, Schleiern und Sonnenschirmen, die Treppe hinab kamen, brach das Unheil furchtbar aus und es gab ein Toben schwäbischer Flüche und Verwünschungen, daß das kleine Haus darob in seinen Grundfesten erzitterte. Cornelie, die weder ihrer Absage an die Uffenbacherin noch ihrer Zusage an das Annerle die geringste Wichtigkeit beimaß, machte zu derselben Zeit die Erfahrung, daß das Kölnische Wasser, welches sie über ihr Kanapee entleert hatte, die ihm entsteigenden Dünste keineswegs beseitigte, sondern nur um einen neuen vermehrte.

Sie wollte sich deshalb erheben und gleichfalls ankleiden, als das Gekreisch auf dem Flur bis zu ihr empor drang. Verstimmt öffnete sie ihre Tür, um Frau Uffenbacher anzurufen, und dadurch den wüsten Auftritt zu unterbrechen. Da hörte sie die zornige Stimme der Frau schreien: „Wer hat die Erlaubnis für den gräflichen Park? Ich oder ihr? Das gäb’ Geschichte, wann die Herrschaft solchem Sauvolk wie ihr eins seid, ihren Park auftun wollt’! Der Herr Vollrat hat mir eigens gesagt: Sie, Frau Uffenbacher, jederzeit – ! Aber das Gesindel, das Sie da beherbergen, ja – ‚Gesindel‘ hat er gesagt! Was fallt euch bei – daß ihr euch hier herausputzt – schämen solltet ihr euch vorm hellen Tageslicht! Ihr H . . . !“

„Frau Uffenbacher!“ rief über ihr eine Stimme mit hartem, hochmütigen Klang, „ich wünsche Sie zu sprechen! Sofort!“

Das war keine Bitte mehr, das war ein Befehl – so streng, und aus einer so fernen Höhe herab gegeben, daß er auf den wollüstigen Zorn der Frau wirkte wie ein Sturzbad kalten Wassers auf tobende Flammen. Sie verstummte jäh und sagte nach einigen Sekunden ganz sanft: „Ich komm’ schon!“

„Ich warte,“ antwortete Cornelie mit derselben hochmütigen Kälte, die im Gegensatz zu der freundlichen Milde, in der sie sonst zu sprechen pflegte, wie eine unerhörte Beleidigung wirkte. Sie verschwand und schloss die Tür ihres Zimmers.

Einige Sekunden später tappte der schwere Tritt der Uffenbacherin die schmale Holztreppe hinauf.

„Das gnädige Fräulein sind gewiß erschrocken,“ begann die Frau, ihr dunkelrotes, aufgeblähtes Gesicht zu einem harmlosen Lächeln zwingend, „ja, die Gesellschaft, die ich hier hab’, da muß man als mal dreinfahre, anders ischt da kei Ordnung zu halte!“

Cornelie erhob sich von dem Stuhl, auf dem sie gesessen hatte, und die Hebamme bekam plötzlich den Eindruck, sie habe nicht gewußt, daß die Gestalt vor ihr so viel größer und höher sei, als sie selbst. Auch sonst hatte sich das Gesicht des Fräuleins verändert. Aus der schmerzhaften Gleichgültigkeit war plötzlich eine Entschlossenheit geworden, die die weichen Züge straffte. Die großen Augen blickten mit einer so strengen Macht, daß die Uffenbacherin fast eine Schwäche und ein Zittern in den Knien befiel.

Cornelie sprach zu ihr, nicht laut und ziemlich langsam. Aber jedes Wort besaß einen Klang, spröde und scharf wie ein Diamantensplitter.

„Frau Uffenbacher,“ sagte sie und hielt das Weib fortwährend unter ihrem Blick, „ich will Ihnen jetzt etwas sagen und danach mögen Sie sich einrichten! Wenn ich hier im Hause bleiben soll, so darf niemals wieder ein solcher Auftritt stattfinden, wie gestern und wie eben dort draußen! Hören Sie – ! Niemals wieder! Wie können Sie sich unterstehen, junge Mädchen, die sich zu Ihnen in Pension begeben haben, deren Geld Sie nehmen, über die Sie keine Macht und Gewalt irgendeiner Art besitzen, mit Worten und Gebärden, wie ich sie hier gehört und gesehen habe, zu beschimpfen – ?“

Die Uffenbacherin öffnete den Mund zu einer Verteidigung, aber Cornelie hob die Hand und Frau Uffenbacher senkte den Kopf und schluckte und schloß den breiten Mund.

„Das Leben dieser Mädchen draußen in der Welt geht Sie gar nichts an, verstehen Sie mich? Erlauben Sie sich noch ein einziges Mal in Worten oder Taten ein Urteil darüber, vergessen Sie noch einmal die Höflichkeit gegen die Mädchen, die sich Ihnen anvertraut haben, dann werde ich deren Partei ergreifen. Dann werde ich dafür sorgen, daß sie ein würdigeres Unterkommen finden – ich werde es für sie suchen, und Sie werden mir wohl glauben, daß ich es ohne Mühe finden kann. Der Vater der Toni und dieser Geheimrat, von dem Sie abhängen, werden durch mich benachrichtigt werden, was hier vorgeht. Und wir verlassen alle – hören Sie – alle! an demselben Tage das Haus. Sie sind dann ruiniert. Das werden Sie wohl begreifen! Ich werde dafür sorgen, daß jedermann erfährt, wie Sie Ihr Amt hier ausführen . . . “

Cornelie hielt inne und ließ der Uffenbacherin einige Sekunden Zeit zur Überlegung. Sie genügten, die Frau zur Besinnung zu bringen.

„Ich hab’ mich hinreiße lasse,“ brummte sie stammelnd. „Die Geduld geht einem halt aus! Es soll schon nit wieder vorkomme.“

„Das erwarte ich von Ihnen. Sie wissen nun, was Ihnen bevorsteht, und Sie werden wohl nicht zweifeln, daß ich mein Wort halte.“

Frau Uffenbacher bewegte wie in einem krampfhaften Kauen und Würgen die Kinnbacken. Dergleichen war ihr noch nicht geschehen, in ihrer ganzen Praxis nicht. Immer hatte sie nur winselnde, hilflose, ihrer Macht preisgegebene Weiber unter ihren Händen gehabt. Nun fühlte sie mit dumpfem Staunen etwas Fremdes, die Kraft eines Geistes, vor der ihre brutale und dumme Macht sich feige verkroch, wie der Hund vor dem Blick des Herrn.
