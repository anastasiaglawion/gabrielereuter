ner Geister erfreuen zu können, sollte sie vor der trivialen Melancholie schützen, die ringsumher in der Luft verborgen lauerte. Sie hatte bei den Bestellungen in den Bibliotheken auch ein wenig an ihre Hausgenossinnen gedacht, doch fand sie nur bei Annerle Dank und Begeisterung für geliehene Bücher. Der Toni war von Mutter und Großmutter der Genuß eines Buches höchstens im Verein mit dem Strickstrumpf gestattet worden.\n\nAnnerle dagegen stopfte sich mit Liebesgeschichten voll wie mit Kuchen und Zuckerwerk. Der mythische Hans wie der unwahrscheinliche Geheimrat versorgten sie schon reichlich mit solcher Art von Druckerschwärze, die leidenschaftlich Liebende nach schauerlichen Abenteuern endlich zum ersehnten Ziele führt. Rote, grüne und gelbe Bändchen türmten sich auf ihrer Kommode zu fast ebenso hohen Stößen, wie in Corneliens Zimmer kulturhistorische und philosophische Werke. Und das war noch nicht alles, was Annerle an Lektüre verschlang – unter den blau und rosenrot behäkelten Windeln in der Lade verbarg sich noch manches Heftchen, das allerlei wissenswerte Dinge enthielt, die verliebten Mädeln zu gewissen Stunden recht zugute kamen – von denen man aber besser nicht sprach . . .\n\nAm wenigsten zu dem Fräulein Cornelie. Freilich war es auch wieder interessant zu erfahren, was denn so gebildete und ernste Damen von der Liebe lasen . . . Man mußte ja viel überschlagen, weil die Schriftsteller in den Büchern von Fräulein Cornelie so ein langes Wesen von Dingen machten, die gar nicht zur Sache gehörten. Aber manchmal war es doch auch richtig nett unanständig, und dann wieder so schön, daß einem die Tränen kamen. Das Annerle fühlte sich in ihrer Würde mächtig gehoben, wenn sie mit dem Fräulein Cornelie literarische Gespräche führen durfte. Das Fräulein sagte zwar nicht viel, doch lächelte sie zuweilen. Das war jedesmal für Annerle ein Triumph. Sie kramte aus ihren mancherlei Lebenserfahrungen so viel aus, als ihre Erinnerung und ihre Phantasie nur irgend hergab. Und so erreichte sie es mehr als einmal, daß Cornelie nach dem Abendessen eine Weile mit ihr auf dem schmalen Rain über den Haferfeldern, bis zu dem Wäldchen alter Apfelbäume hin- und herwanderte. Cornelie begann gefesselt zu werden von den Erzählungen aus dieser Zwischenwelt, wo das scheinbar Unzusammengehörigste durch ein Gewirr mannigfachster Fäden verbunden wurde. Wie Annerles Sprache eine Mischung aus schwäbischem und bayerischem Dialekt bildete, so war sie auch unaufhörlich unterwegs zwischen Württemberg, Bayern und Baden. Durch ihr langjähriges Verhältnis zu dem Sohn ihres Chefs hatte sie eine sonderbare Art von Vertrauensstellung auch bei dessen Eltern und wurde zu allerlei diplomatischen Missionen unter dem Personal der Filialen des großen Warenhauses verwendet. Sie gehörte gewissermaßen zur Familie und gehörte auch wieder nicht dazu, es war einfach eine Taktfrage, die sie, wie es schien, richtig zu stellen und geschmeidig zu beantworten wußte. Sie zeigte Geschenke von der Mutter ihres Gefährten und seine Brüder schrieben ihr neckische Postkarten. Wo sie nur einige Wochen geweilt hatte, besaß sie gleich eine Unzahl von Freundinnen und Verehrern, wußte sich überall nützlich zu machen und war alsbald durch ein kunstvolles Gewebe von hin- und hergehenden Gefälligkeiten mit den verschiedensten Gesellschaftsschichten verknüpft. „Mei Hansel“ wurde beständig in Atem gehalten durch Besorgungen und Vermittelungen, von denen die wenigsten ihr selbst zugute kamen. Denn so gern sie Geschenke entgegennahm, gleich überlegte sie auch, wem sie mit der eben erhaltenen Gabe nun wieder eine Freude machen könne.\n\nZum erstenmal lernte Cornelie in der kleinen Buchhalterin eine jener munteren Lebenskünstlerinnen kennen, die ihr in der Historie wohl unter klingenderen Namen, in der Literaturgeschichte zuweilen durch die Schilderung eines verliebten Autors, in ihrer bürgerlichen Mädchenexistenz aber noch nie entgegengetreten waren.", "nfText": "Es kam nun eine stille Zeit. Ein Friede, der dem Annerle schier unheimlich dünkte, herrschte zwischen der Uffenbacherin und ihren Fräuleins. Die Alte bezeigte ihnen demütige Unterwürfigkeit und nur die Hanne erfuhr, wenn Türen und Fenster geschlossen waren, in der Küche die wahre Meinung der Gekränkten.\n\nDie Schweizer-Mari übte sich auf der Wiese im Spiel mit dem dicken Ziehkind des Hauses, das die Fräuleins das Versuchskind nannten, in mütterlichen Handgriffen. Die Toni räumte ihre Kommodenschubladen auf, kaute an einem Landjäger, untersuchte die Gurken im dreieckigen Gärtchen, ob sie noch nicht bald einen Salat geben könnten und erhielt an den Sonntagen den Besuch ihres Vaters, eines protestantischen Lehrers an der Mittelschule einer kleinen bayerischen Stadt, den keines der anderen Mädchen jemals erblicken durfte.\n\nAm Sonntag kam häufig die Rose von Ulm, um ihr Kleines bei der Frau Lebzelter in der unteren Dorfstraße zu besuchen. Zuweilen wurde sie von dem Leutnant in Zivil begleitet, dann frühstückten sie beide oben im Wirtshaus und die Rose bezahlte. Aber auch an solchen Tagen ließ sie es sich nicht nehmen, bei der Frau Uffenbacher einzuschauen. Eine sonderbare Anhänglichkeit fesselte die\n früheren Gäste an das Tränenhaus, daß sie immer wieder kamen und mit Seufzen und Stöhnen sich in den niederen Stuben umschauten, wo sie ihres jungen Lebens bitterste Schmerzen gelitten hatten. Nur die Mutter des Agathle, das bei der rothaarigen Bärbe in der Pflege war, ließ sich niemals blicken, sondern fragte zuweilen brieflich an, ob die Kleine immer noch lebe, andere Kinder stürben doch, wenn man sie zu einer Ziehmutter gebe. Die Bärbe hatte nun erst recht einen Trotz darauf, das Agathle groß zu bringen, und lief die Nächte durch mit dem Kind auf den Armen im Stübchen auf und nieder, weil es zahnte und unruhig war. Am Tage saß sie an der Maschine und nähte für die Bäuerinnen Kinderwäsche – denn das Kostgeld für die Agath' hatte die Mutter aus lauter Ärger über den Eigensinn der Bärbe schon lange zu schicken vergessen.\n\nDas Annerle war immer geschäftig, sie führte eine ausgebreitete Korrespondenz, packte und verschnürte zahllose Pakete und empfing andere aus allen Windrichtungen. Es war immer mit ihr ein eifriges und geheimnisvolles Treiben, als sei man acht Tage vor Weihnachten.\n\nCornelie hatte sich eine Tagesordnung aus Arbeit, Ruhe und Umherschlendern gemacht, die eine angenehme Gleichförmigkeit und dadurch so etwas wie Häuslichkeitsgefühl mit sich brachte. In ihrem Zimmer lagen große Stöße von Büchern; die Empfindung zu haben, jeden Augenblick sich der Gesellschaft auserlesener Geister erfreuen zu können, sollte sie vor der trivialen Melancholie schützen, die ringsumher in der Luft verborgen lauerte.\n\nAnnerle hingegen stopfte sich mit abenteuerlichen Liebesgeschichten voll wie mit Kuchen und Zuckerwerk. Der mythische Hans wie der unwahrscheinliche Geheimrat versorgten sie reichlich mit solcher Art von Druckerschwärze.\n\nCornelie begann gefesselt zu werden von dem kleinen Annerle und ihren Erzählungen aus dieser Zwischenwelt, wo das scheinbar Unzusammengehörigste durch ein Gewirr mannigfacher Fäden verbunden wurde. Wie Annerles Sprache eine Mischung aus schwäbischem und bayerischem Dialekt bildete, so war sie auch unaufhörlich unterwegs zwischen Württemberg, Bayern und Baden. Durch ihr langjähriges Verhältnis zu dem Sohn ihres Chefs hatte sie eine sonderbare Art von Vertrauensstellung auch bei dessen Eltern und wurde zu allerlei diplomatischen Missionen unter dem Personal der Filialen des großen Warenhauses verwendet. Sie gehörte gewissermaßen zur Familie und gehörte auch wieder nicht dazu, es war einfach eine Taktfrage, die sie, wie es schien, richtig zu stellen und geschmeidig zu beantworten wußte. Sie zeigte Geschenke von der Mutter ihres Gefährten, und seine Brüder schrieben ihr neckische Postkarten. Wo sie nur einige Wochen geweilt hatte, besaß sie gleich eine Unzahl von Freundinnen und Verehrern, wußte sich überall nützlich zu machen und war alsbald durch ein kunstvolles Gewebe von hin- und hergehenden Gefälligkeiten mit den verschiedensten Gesellschaftsschichten verknüpft. »Mei Hansel« wurde beständig in Atem gehalten durch Besorgungen und Vermittlungen, von denen die wenigsten\n ihr selbst zugute kamen. Denn so gern sie Geschenke entgegennahm, gleich überlegte sie auch, wem sie mit der eben erhaltenen Gabe nun wieder eine Freude machen könne.\n\nZum erstenmal lernte Cornelie in der kleinen Buchhalterin eine jener munteren Lebenskünstlerinnen kennen, die ihr in der Historie wohl unter klingenderen Namen, in der Literaturgeschichte zuweilen durch die Schilderung eines verliebten Autors, in ihrer bürgerlichen Mädchenexistenz aber noch nie entgegengetreten waren."}, {"id": "K08_02_S", "kap": 8, "typ": "Szene", "titel": "In der Laube: Annerle erzählt vom Hansel", "fig": "Cornelie, Annerle, Schweizer-Mari; Hanne serviert", "was": "Annerle erzählt, dass der Hansel eine Kellnerin geschwängert hat und sie dem Mädchen ein Unterkommen verschaffte. Cornelie bittet, nicht „gnädige Frau“ genannt zu werden.", "sol": "Annerles Würdebegriff: „Meine Würde trag’ ich in mir selbst.“ Cornelie: „Ich bin nichts anderes als Sie alle.“ Annerle weist die Gleichsetzung zurück.", "anm": "unangetastete Szene! NF_K06_02_NS ", "eaVon": "„O Jesses – mei Mädeles, was so ein Mann", "eaBis": "Mari, „mir steigt der Ekel schon im Hals herauf.“", "nfVon": "O Jesses – mei Mädeles, was so ein Mann", "nfBis": "Bauern nicht essen wollten, für ein paar Pfennige vom", "nfText": "Die jungen Fräuleins saßen bei dem schönen warmen Sonnenschein in der Laube und warteten auf das Mittagessen. Annerles Häkelnadel fuhr eilig zwischen grauen Wollmaschen hin und wider. Sie verfertigte ein warmes Tuch für die Mutter ihrer Freundin Lucie, die Frau Fabrikbesitzer Bubenberg in Ilferlingen, die so arg das Reißen in der Schulter hatte. Dabei erzählte sie vom Hansel.\n„O Jesses – mei Mädeles, was so ein Mann alles von einem verlangt! Hat sich mei Hansel an einem luschtigen Abend mit einer Kellnerin verscharmiert – betrunken ist er gewesen, – das hat er mir geschwore, und ich glaub’s ihm schon – aber nun denkt’s euch, das Ding kommt in die Hoffnung und mei Hansel weiß sich kein Rat – und das End’ von der Geschicht ischt, ich muß zu dem Mädele hin und muß es tröste und ihm ein Unterkommen schaffe. – Ich hab’ mir die Augen fast aus dem Kopf geheult, dazumal – und der Hansel sagt noch ganz getrost: das tut doch unserer Lieb’ keinen Abbruch . . . Gar schon . . . ! ’s hat ihr auf die letzt’ auch keinen getan, aber ich war halt kreuzunglücklich zu dere Zeit. Seine Ruh’ hat man keine Stund’ mit so ein’m Leichtfuß – ! Aber wie der Herr Tirektor“ – Annerle sagte vor lauter Hochachtung und Wichtigkeit stets „Tirektor“ statt Direktor – „der Herr Tirektor Häberle von Pforzheim, der als die Tapetenfabrik hat, und wann er in Geschäften nach Stuggert kommt, tut er immer in der Konditorei sitzen, wo ich mit meiner Freundin bedient hab’ – als nur so aus Gefälligkeit – wie der mir einen Heiratsantrag gemacht hat – da hab’ ich in mich hineingelacht und hab’ gedacht: Mei Hansel ist doch ein anders goldiger Kerl. Der Herr Tirektor ist ja kein Unebner; nur ein bissel arg dürr!“\n„Weischt, Annerle, da muß ich dich gerad’ bewundern, daß du zu dem andern Maidli gange bischt,“ rief die Mari, „nimmer hätt’ ich das gekonnt und wenn ich hätt’ sollen sterben . . . Du bischt halt gar gut!“ . . .\n„Die Frau Bubenberg von Ilferlingen hat auch gesagt, es wär’ gegen mei’ Würd’ gewesen,“ sagte das Annerle und reckte sich und ihr Näschen in die Höh’. „Ich hab’ ihr als geantwortet: Mei Würd’ trag’ ich in mir selbst und eine Ehefrau, die ihre Würd’ zu wahre hätt’, die bin ich nit, und will ich auch gar nit sein. Das wär’ mir schon viel zu fad, wenn ich nur als jeden Tag an mei Würd’ zu denken hätt’. – Die Ehefrauen, die habbe gut rede, die wisset nix. Unsereins fühlt’s, wie’s so einem arm’ Ding zu Mut ischt . . . Jesses – und mei Hansel, der hätt’ mich bald auffressen vor Lieb’ und Reumütigkeit . . . Er ist nun schon so, denkt nit weiter als an sein Vergnügen, wenn er luschtig ist, ich mag ihn auch nit anders . . . Ja . . . gnädige Frau – so geht’s zu in dere Welt!“\n„Nennen Sie mich nicht immer gnädige Frau,“ sagte Cornelie, „ich bin keine ‚gnädige Frau‘. Ich bin nichts anderes als Sie alle. Nennen Sie mich ruhig Fräulein Cornelie.“\n„Cornelie ist ein arg schöner Name und wie geschaffen für die gnä . . . – für das Fräulein.“ Annerle sprach das Fräulein pointiert hochdeutsch aus. „Wir wisset’s doch, daß Sie aus einem andern Holz geschnitten sind als mir, mir haben auch Augen im Kopf . . . “\nCornelie zog die Brauen zusammen. „Bitte nicht . . . “ sagte sie nervös und hob, um die Aufmerksamkeit abzulenken, den Deckel von der Schüssel, die Hanne soeben mit einem Krach auf den Tisch gestellt hatte.\n„Ach du lieber Gott, wieder Lunge!“\n„Der Satan!“ schimpft Mari, „mir steigt der Ekel schon im Hals herauf.“", "eaText": "Die jungen Fräuleins saßen bei dem schönen warmen Sonnenschein in der Laube und warteten auf das Mittagessen. Annerles Häkelnadel fuhr eilig zwischen grauen Wollmaschen hin und wider. Sie verfertigte ein warmes Tuch für die Mutter ihrer Freundin Lucie, die Frau Fabrikbesitzer Bubenberg in Ilferlingen, die so arg das Reißen in der Schulter hatte. Dabei erzählte sie vom Hansel.\n\n„O Jesses – mei Mädeles, was so ein Mann alles von einem verlangt! Hat sich mei Hansel an einem luschtigen Abend mit einer Kellnerin verscharmiert – betrunken ist er gewesen, – das hat er mir geschwore, und ich glaub’s ihm schon – aber nun denkt’s euch, das Ding kommt in die Hoffnung und mei Hansel weiß sich kein Rat – und das End’ von der Geschicht ischt, ich muß zu dem Mädele hin und muß es tröste und ihm ein Unterkommen schaffe. – Ich hab’ mir die Augen fast aus dem Kopf geheult, dazumal – und der Hansel sagt noch ganz getrost: das tut doch unserer Lieb’ keinen Abbruch . . . Gar schon . . . ! ’s hat ihr auf die letzt’ auch keinen getan, aber ich war halt kreuzunglücklich zu dere Zeit. Seine Ruh’ hat man keine Stund’ mit so ein’m Leichtfuß – ! Aber wie der Herr Tirektor“ – Annerle sagte vor lauter Hochachtung und Wichtigkeit stets „Tirektor“ statt Direktor – „der Herr Tirektor Häberle von Pforzheim, der als die Tapetenfabrik hat, und wann er in Geschäften nach Stuggert kommt, tut er immer in der Konditorei sitzen, wo ich mit meiner Freundin bedient hab’ – als nur so aus Gefälligkeit – wie der mir einen Heiratsantrag gemacht hat – da hab’ ich in mich hineingelacht und hab’ gedacht: Mei Hansel ist doch ein anders goldiger Kerl. Der Herr Tirektor ist ja kein Unebner; nur ein bissel arg dürr!“\n„Weischt, Annerle, da muß ich dich gerad’ bewundern, daß du zu dem andern Maidli gange bischt,“ rief die Mari, „nimmer hätt’ ich das gekonnt und wenn ich hätt’ sollen sterben . . . Du bischt halt gar gut!“ . . .\n„Die Frau Bubenberg von Ilferlingen hat auch gesagt, es wär’ gegen mei’ Würd’ gewesen,“ sagte das Annerle und reckte sich und ihr Näschen in die Höh’. „Ich hab’ ihr als geantwortet: Mei Würd’ trag’ ich in mir selbst und eine Ehefrau, die ihre Würd’ zu wahre hätt’, die bin ich nit, und will ich auch gar nit sein. Das wär’ mir schon viel zu fad, wenn ich nur als jeden Tag an mei Würd’ zu denken hätt’. – Die Ehefrauen, die habbe gut rede, die wisset nix. Unsereins fühlt’s, wie’s so einem arm’ Ding zu Mut ischt . . . Jesses – und mei Hansel, der hätt’ mich bald auffressen vor Lieb’ und Reumütigkeit . . . Er ist nun schon so, denkt nit weiter als an sein Vergnügen, wenn er luschtig ist, ich mag ihn auch nit anders . . . Ja . . . gnädige Frau – so geht’s zu in dere Welt!“\n„Nennen Sie mich nicht immer gnädige Frau,“ sagte Cornelie, „ich bin keine ‚gnädige Frau‘. Ich bin nichts anderes als Sie alle. Nennen Sie mich ruhig Fräulein Cornelie.“\n„Cornelie ist ein arg schöner Name und wie geschaffen für die gnä . . . – für das Fräulein.“ Annerle sprach das Fräulein pointiert hochdeutsch aus. „Wir wisset’s doch, daß Sie aus einem andern Holz geschnitten sind als mir, mir haben auch Augen im Kopf . . . “\nCornelie zog die Brauen zusammen. „Bitte nicht . . . “ sagte sie nervös und hob, um die Aufmerksamkeit abzulenken, den Deckel von der Schüssel, die Hanne soeben mit einem Krach auf den Tisch gestellt hatte.\n„Ach du lieber Gott, wieder Lunge!“\n„Der Satan!“ schimpft Mari, „mir steigt der Ekel schon im Hals herauf.“"}, {"id": "K08_03_NS", "kap": 8, "typ": "Nicht-Szene (iterativ)", "titel": "Die Mahlzeiten", "fig": "Frau Uffenbacher, Hanne, Cornelie, Annerle, Schweizer-Mari, Toni, die Fischerin", "was": "Lunge zweimal wöchentlich; seit Cornelies Entschluss, mit den anderen zu essen, keine Sonderkost mehr. An Lungentagen kauft sie heimlich ein Ei bei der Fischerin. Nachmittagstee mit Beiträgen aller.", "sol": "„so lieferte schwesterlich ein jedes, was es eben erreichen konnte, zur Verschönerung der gemeinsamen Feierstunde“.", "anm": "", "eaVon": "Lunge mit saurer Sauß’ war ein Gericht, das, wie", "eaBis": "wurde dabei von Annerle aufmunternd in die Seite gepufft.", "nfVon": "war ein Gericht, das, wie Frau Uffenbacher den Damen", "nfBis": "mir nicht bös – ich dacht' nur, weil, wenn", "nfText": "Lunge mit saurer Soß' war ein Gericht, das, wie Frau Uffenbacher den Damen erklärt hatte, besonders bekömmlich für ihren Zustand sei. Sie erhielt die Lunge, welche die Bauern nicht essen wollten, für ein paar Pfennige vom Metzger, und so setzte sie sie den Fräuleins jede Woche zweimal vor, denn es gab zwei Metzger in Schopfingen. So wurde der Nachmittagstee, den Annerle aus der Konditorei bezog, die einzige angenehme Mahlzeit des Tages.\n", "eaText": "Lunge mit saurer Sauß’ war ein Gericht, das, wie Frau Uffenbacher den Damen erklärt hatte, besonders bekömmlich für ihren Zustand sei. Sie erhielt die Lunge, welche die Bauern nicht essen wollten, für ein paar Pfennige vom Metzger, und so setzte sie sie den Fräuleins jede Woche zweimal vor, denn es gab zwei Metzger in Schopfingen. Und hätten diese zwei Metzger jede Woche mehr als zweimal geschlachtet, so hätten sie sie eben viermal vorgesetzt bekommen. Seit Cornelie erklärt hatte, sie wolle mit den andern Mädchen essen, war es zu Ende mit den Koteletts und Beefsteaks. Cornelie fühlte, daß es unmöglich sei, unter diesen Verhältnissen auf eine besondere Kost zu dringen.\n\nSo versuchte sie denn, von den großen Würfeln des weichlichen porösen Gewebes in der dicken graulichen Mehltunke einige Bissen herunterzuwürgen. Aber so lange sie lebte, befiel sie hinfort ein unnatürlich heftiger Schauder und Ekel, sobald sie nur irgendwo das Wort Lunge aussprechen hörte. Toni und Mari halfen sich mit Kartoffeln, die sie in Mengen und mit anscheinendem Genuß verzehrten. Die Kartoffeln verursachten Cornelie Magendruck. So verzichtete sie denn an den „Lungentagen“ lieber auf das Mittagsmahl und kaufte sich unten bei der Fischerin ein frischgelegtes Hühnerei. Mehr als eines am Tage bekam sie dort nicht, weil die Gastwirtin die andern nahm, und eine solche Frau nicht verletzt werden durfte.\n\nDer Nachmittagstee war das beste vom Tag. Die Sonne schien auf die hohen dunkelblau blühenden Salbeistauden, auf die rosigen Esparsetteträubchen und die Sternblumen der schönen Wiese. Vom Tal herauf glitzerte zwischen dem grauen Erlengebüsch das muntere Flüßchen und in der Ferne glänzten am Horizont, aus feinem Duft der Ferne tauchend, die Umrisse der Schneealpen. Annerle sorgte, daß der Tee gut und stark war. Sie bezog eine vorzügliche Sorte aus der „Konditorei“, und die unter den Süßigkeiten dort waltende Freundin, wie auch die mütterliche Frau Bubenberg aus Ilferlingen sandten abwechselnd gutes schwäbisches Gebäck. Als die SchweizerMari nach Stuttgart zu Einkäufen fuhr, beauftragte Cornelie sie, auch für ihre Rechnung einen Kuchen zu besorgen, und sie selbst brachte die ersten Kirschen. So lieferte schwesterlich ein jedes, was es eben erreichen konnte, zur Verschönerung der gemeinsamen Feierstunde. Nur die arme Toni vermochte nichts beizusteuern, denn sie besaß weder Geld noch Leckereien in ihrer Schatzkammer. Die Landjäger wurden von den andern verschmäht. Darum lehnte sie auch mit schweigsam-trotziger Zurückhaltung ab, an dem Kuchenmahl teilzunehmen. Cornelie wußte nicht, ob sie gut daran täte, den ein wenig beschränkten doch sicheren bürgerlichen Ehrbegriff, der hier waltete, durch Zureden zu erschüttern. Endlich traf nach einem Besuch des Vaters, dem Toni wohl ihre Pein, sich nicht revanchieren zu könnten, gebeichtet hatte, ein Napfkuchen von der Großmutter ein. Da griff auch Toni wacker zu, und man sah nun an ihrem gierigen Einbeißen, wie viel ihr die Enthaltsamkeit gekostet haben mochte. "}, {"id": "K08_04_S", "kap": 8, "typ": "Szene", "titel": "Die Mundtasse", "fig": "Cornelie, Schweizer-Mari, Annerle", "was": "Mari bringt aus Stuttgart eine Mundtasse mit blauem C als Andenken mit und verrät dabei, dass die bisherige Tasse nachts das Gebiss der Uffenbacherin enthielt.", "sol": "Fürsorgliche Aufmerksamkeit von unten; die Freude am Geschöpf überwindet den Ekel.", "anm": "Tränen der Mari aus Angst, das Fräulein beleidigt zu haben. NF_K06_03_NS ", "eaVon": "„Ich hab’ Ihne auch was mitgebracht, Freile Cornelie,“ kam’s", "eaBis": "Freude an dem prächtigen, treuherzigen Geschöpf den Ekel überwand.", "nfVon": "Ich hab' Ihne auch was mitgebracht, Freile Cornelie,« kam's", "nfBis": "der Kunst, oder ist die Kunst nur ein sichtbares", "nfText": "Als die Mari aus Stuttgart von einigen Einkäufen heimkehrte, trat das breitschulterige Schweizermädel, dunkelrot vor Aufregung, mit einem in Seidenpapier gehüllten Päckchen vor Cornelie. Sie lächelte schüchtern und wurde dabei von Annerle aufmunternd in die Seite gepufft.\n\n»Ich hab' Ihne auch was mitgebracht, Freile Cornelie,« kam's unbeholfen kindlich in den harten Kehllauten ihres kaum verständlichen Schwizerdütsch. »Nehmen Sie's nicht für ungut – seien's mir nicht bös – ich dacht' nur, weil, wenn mein Stündle kommt und ich bald fortgeh, wollt' ich einer jeden ein klein's Andenken ...«\n\nDie Tränen quollen ihr, in der Angst, das Fräulein könne beleidigt sein. Cornelie aber lächelte liebenswürdig und nahm aus ihren Händen eine Mundtasse mit dem Buchstaben »C« groß und deutlich in blauer Farbe darauf gemalt, entgegen. Sie dankte herzlich, und bewunderte die Tasse nach Gebühr. Annerle rief triumphierend: »Siehscht, die Fräulein Cornelie ischt nit so kleinlich, ich hab' dir's gleich gesagt, daß sie sich freuen wird.«\n\n»Gewiß freu' ich mich,« rief Cornelie, »und ich werde täglich aus der Tasse trinken, die von der Frau Uffenbacher ist so schwer und grob.«\n\n»Es ischt nur,« stotterte die erglühende Mari, »weil ich's nicht mit anschauen konnt', daß das Fräulein aus der Tass' trinke mußt, wo die Frau Uffenbacher des Nachts ihre Zähn' drin aufbewahrt!«\n\n»O Gott im Himmel!« rief Cornelie, die Hände vors\n Gesicht schlagend und Annerle schrie: »Mari, du Schneegans, das hatte' wir ihr doch nit sage wolle!«\n\n»Ja, mein Heiland, 's ischt mir so heraus gefahren,« beteuerte die Mari und sah so lieb und verstört aus, daß Cornelie über dem Trösten und der Freude an dem prächtigen, treuherzigen Geschöpf den Ekel überwand.", "eaText": "Als die Mari aus Stuttgart von ihren Einkäufen heimkehrte, trat das breitschulterige Schweizer-Mädel, dunkelrot vor Aufregung, mit einem in Seidenpapier gehüllten Päckchen vor Cornelie. Sie lächelte schüchtern und wurde dabei von Annerle aufmunternd in die Seite gepufft.\n\n„Ich hab’ Ihne auch was mitgebracht, Freile Cornelie,“ kam’s unbeholfen kindlich in den harten Kehllauten ihres kaum verständlichen Schwizerdütsch. „Nehmen Sie’s nicht für ungut – seien’s mir nicht bös – ich dacht’ nur, weil, wenn mein Stündle kommt und ich bald fortgeh, wollt’ ich einer jeden ein klein’s Andenken . . . “\n\nDie Tränen quollen ihr, in der Angst, das Fräulein könne beleidigt sein. Cornelie aber lächelte liebenswürdig und nahm aus ihren Händen eine Mundtasse mit dem Buchstaben „C“ groß und deutlich in blauer Farbe darauf gemalt, entgegen. Sie dankte herzlich, und bewunderte die Tasse nach Gebühr. Annerle rief triumphierend: „Siehscht, die Fräulein Cornelie ischt nit so kleinlich, ich hab’ dir’s gleich gesagt, daß sie sich freuen wird.“\n\n„Gewiß freu’ ich mich,“ rief Cornelie, „und ich werde täglich aus der Tasse trinken, die von der Frau Uffenbacher ist so schwer und grob.“\n\n„Es ischt nur,“ stotterte die erglühende Mari, „weil ich’s nicht mit anschauen konnt’, daß das Freile aus der Tass’ trinken mußt, wo die Frau Uffenbacher des Nachts ihre Zähn’ drin aufbewahrt!“\n\n„O Gott im Himmel!“ rief Cornelie, die Hände vors Gesicht schlagend und Annerle schrie: „Mari, du Schneegans, das hatte’ wir ihr doch nit sage wolle!“\n\n„Ja, mein Heiland, ’s ischt mir so heraus gewutscht,“ beteuerte die Mari und sah so lieb und verstört aus, daß Cornelie über dem Trösten und der Freude an dem prächtigen, treuherzigen Geschöpf den Ekel überwand.\n"}, {"id": "K09_01_S", "kap": 9, "typ": "Szene", "titel": "Die Schreibszene", "fig": "Cornelie", "was": "Cornelie schreibt am offenen Fenster. Binnentext: Essay über die Frau in der Kunst (Primitive, Renaissance, Rokoko, Gegenwart).", "sol": "—", "anm": "Kein Werk wird genannt; Epochentypen statt Bildbeschreibungen.", "eaVon": "Cornelie saß in ihrem Zimmer an dem etwas wackeligen", "eaBis": "dem Vergnügen an der Formel, die sie dafür gefunden.", "nfVon": "Cornelie saß in ihrem Zimmer an dem wurmstichigen Tisch,", "nfBis": "aufgerissen, das Annerle stürzte herein, durch Zorn und Weinen", "nfText": "\nCornelie saß in ihrem Zimmer an dem wurmstichigen Tisch, den sie ans offene Fenster gerückt hatte, und schrieb:\n\n»Modelt die Frau sich nach der Kunst, oder ist die Kunst nur ein sichtbares Symbol für Umwandlungen im Wesen des Weibes?\n\nRuhevoll unschuldig blühten die heiligen Jungfrauen und die jungfräulichen Mütter der Primitiven, unbewußt der eigenen Lieblichkeit, gleich den Lilien auf dem Felde. Das Weib der Renaissance aber wurde das Weib-Siegerin. Königlich thronte sie auf dem Sessel ihrer Macht und ihre Macht ruhte auf der Begierde des Mannes. Das Wissen hatten die Jahrhunderte ihr verliehen, und es gab ihrem Lächeln einen satten Stolz, ihren Händen die sichere Haltung der Besitzenden.\n\nIn den Frauen des Rokoko zeigt sich schon der leise Zynismus, der alle Reize seiner Reichtümer durchforscht hat, dem die eigene Macht kein heiliges Geheimnis mehr ist, der leichtfertig zu spötteln beginnt über die Grenzen der königlichen Herrschaft – über ihre Allgewalt und ihre Unzulänglichkeit.\n\nDas kokette Lächeln der gepuderten Reifrockdamen, die ihre wollüstigen Busen zur Schau tragen, wie die Insignien ihres fleischlichen und galanten Königreichs, birgt schon ein wenig Verachtung des Besiegten. In ihren lüstern blickenden Augen dämmert der noch in Scherz verhüllte Schmerz über eine Herrschaft, die ihrem Ende naht, weil das Weib ihrer überdrüssig zu werden beginnt.\n\nWelche geheimnisvollen Gesetze treiben sie, den Gebieten ihrer unumschränkten Gewalt entschlossen den Rücken zu kehren?\n\nDie Frau von heute, wie die Kunst sie in ihrer typischen Wesensart zu erfassen sucht, ist eine Gestalt der Sehnsucht geworden. Sie trauert weder, noch genießt sie – ihre ranken, schlanken Glieder dehnen sich nach etwas Unendlichem; die Linien ihres Profils bedeuten ein Lechzen nach dem Unaussprechlichen, ihre Augen suchen das Übersinnliche hinter den Dingen dieses Staubes ... Ihre Hände – müde und doch verlangend geöffnet – tasten unsicher nach Kostbarkeiten und Früchten des Wissens, die nur ihren Träumen sichtbar, über ihnen in blauen Lüften zu schweben scheinen – ihre Füße berühren nur noch flüchtig diesen Boden und streben nach unbekannten Fernen, wo in dunklen Tiefen die Erkenntnisse des Lebens ruhen, zu denen bisher nur der Mann den Schlüssel besaß. Genügt der stolzen unzufriedenen Frau unserer Gegenwart noch eine Herrschaft über die Sinne des Mannes, den sie liebt? Einer mystischen Vereinigung der Seelen und der Geister strebt sie, von dunklem Drange getrieben, entgegen. Und doch ahnt sie – eine neue Eva – schon, daß das Kosten von jener lockenden Frucht der Erkenntnis sie für ewig\n aus dem Paradiese ihrer Jugend und alles selig blinden Glückes vertreiben wird.«\n\nNachdem Cornelie diese Sätze beendet hatte, hielt sie inne und ruhte ein wenig. Resignierte Wehmut im Erfassen der auch für ihr eigenes Dasein so verhängnisvollen Wahrheit mischte sich mit dem Vergnügen an der Formel, die sie dafür gefunden.\n", "eaText": "Cornelie saß in ihrem Zimmer an dem etwas wackeligen Tisch, den sie ans offene Fenster gerückt hatte, und schrieb: „Modelt die Frau sich nach der Kunst, oder ist die Kunst nur ein sichtbares Symbol für Umwandlungen im Wesen des Weibes?\n\nRuhevoll unschuldig blühten die heiligen Jungfrauen und die jungfräulichen Mütter der Primitiven, unbewußt der eigenen Lieblichkeit, gleich den Lilien auf dem Felde. Das Weib der Renaissance aber wurde das Weib-Siegerin. Königlich thronte sie auf dem Sessel ihrer Macht und ihre Macht ruhte auf der Begierde des Mannes. Das Wissen hatten die Jahrhunderte ihr verliehen, und es gab ihrem Lächeln einen satten Stolz, ihren Händen die sichere Haltung der Besitzenden. In den Frauen des Rokoko zeigt sich schon der leise Zynismus, der alle Reize seiner Reichtümer durchforscht hat, dem die eigene Macht kein heiliges Geheimnis mehr ist, der leichtfertig zu spötteln beginnt über die Grenzen der königlichen Herrschaft – über ihre Allgewalt und ihre Unzulänglichkeit.\n\nDas kokette Lächeln der gepuderten Reifrockdamen, die ihre wollüstigen Busen zur Schau tragen, wie die Insignien ihres fleischlichen und galanten Königreichs, birgt schon ein wenig Verachtung des Besiegten. In ihren lüstern blickenden Augen dämmert der noch in Scherz verhüllte Schmerz über eine Herrschaft, die ihrem Ende naht, weil das Weib ihrer überdrüssig zu werden beginnt. Welche geheimnisvollen Gesetze treiben sie, den Gebieten ihrer unumschränkten Gewalt so entschlossen den Rücken zu kehren?\n\nDie Frau von heute, wie die Kunst sie in ihrer typischen Wesensart zu erfassen sucht, ist eine Gestalt der Sehnsucht geworden. Sie trauert weder, noch genießt sie – ihre ranken, schlanken Glieder dehnen sich nach etwas Unendlichem; die Linien ihres Profils bedeuten ein Lechzen nach dem Unaussprechlichen, ihre Augen suchen das Übersinnliche hinter den Dingen dieses Staubes . . . Ihre Hände – müde und doch verlangend geöffnet – tasten unsicher nach Kostbarkeiten und Früchten des Wissens, die nur ihren Träumen sichtbar, über ihnen in blauen Lüften zu schweben scheinen – ihre Füße berühren nur noch flüchtig diesen Boden und streben nach unbekannten Fernen, wo in dunklen Tiefen die Erkenntnisse des Lebens ruhen, zu denen bisher nur der Mann den Schlüssel besaß. Genügt der stolzen unzufriedenen Frau unserer Gegenwart noch eine Herrschaft über die Sinne des Mannes, den sie liebt? Einer mystischen Vereinigung der Seelen und der Geister strebt sie, von dunklem Drange getrieben, entgegen. Und doch ahnt sie – eine neue Eva – schon, daß das Kosten von jener lockenden Frucht der Erkenntnis sie für ewig aus dem Paradiese ihrer Jugend und alles selig blinden Glückes vertreiben wird.“\n\nNachdem Cornelie diese Sätze beendet hatte, hielt sie inne und ruhte ein wenig. Resignierte Wehmut im Erfassen der auch für ihr eigenes Dasein so verhängnisvollen Wahrheit mischte sich mit dem Vergnügen an der Formel, die sie dafür gefunden.\n"}, {"id": "K09_02_S", "kap": 9, "typ": "Szene", "titel": "Annerle stürzt herein", "fig": "Cornelie, Annerle", "was": "Annerle wirft der Uffenbacherin anonyme Briefe an ihre Familie und an die Konditorei vor. Sie fährt zum Geheimrat nach Stuttgart.", "sol": "Die Rache gilt Cornelie, trifft aber Annerle: „an Sie und die Fräulein Toni da wagt sie sich nit!“", "anm": "", "eaVon": "Jetzt hörte sie, zum ersten Male wieder seit manchem", "eaBis": "ihr Leben als eine von finsteren Dingen erfüllte Tiefe.", "nfVon": "Jetzt hörte sie, zum ersten Male wieder seit manchem", "nfBis": "bat sie, ihm ihren Aufenthaltsort und die Zeit, da", "eaText": "Jetzt hörte sie, zum ersten Male wieder seit manchem Tage, vom Flur herauf ein Geheul und Gekreisch böser Weiberstimmen tönen. In der nächsten Minute wurde ihre Türe aufgerissen, das Annerle stürzte herein, durch Zorn und Weinen zerzaust, rot, geschwollen und fürchterlich entstellt.\n\n„Die Sau!“ schrie sie gellend, „das Weib – das Aas von einem Weib! Die Augen wenn ich ihr auskratzen könnt, dem Satansbraten!“\n\n„Um Gottes willen – Annerle – was ist geschehen – ? Beruhigen Sie sich doch!“\n\n„Beruhigen?“ heulte Annerle, „ob, mei Freile Cornelie, was das Weib mir antan hat, die böse, böse Hex . . . Hab’ ich Ihnen nit gesagt – anonyme Brief’ schreibt’s, das Vieh . . . An meine Leut’ daheim! Und nun wissen’s alle, wie’s um mich steht – und daß ich zum zweitenmal in der Hoffnung bin . . . Oh, mei Jesus . . . Mei Mutter möcht gerad ins Wasser geh’n vor Scham!“\n\nCornelie starrte sie an, eiskalt vor Schrecken.\n\n„Das hat die Uffenbacher getan . . . “\n\nAnnerle trocknete sich mit dem bereits völlig durchweichten Taschentuch das tränentropfende Gesicht.\n\n„In der Konditorei wissets sie’s auch allbereits,“ schluchzte sie. „Oh, mei Fräulein Cornelie, was hat unsereins zu leide.“\n\n„Annerle – sind Sie ganz sicher, daß die Uffenbacher – ? Haben Sie Beweise?“\n\n„Beweise? Ja, wenn doch mei Mutter einen Brief bekommen hat . . . ‚Eine die ’s gut mit Ihne meint‘ hat drunter gestanden – ja – gut meine – das Lügenmensch das! Und die Kellnerin – das Mädele, das eine Bas’ ist von der Uffenbacher ihrer Schwägerin, das hat ’s in Stuggert ’rumbracht, schreibt mei Freundin!“\n\n„Das klingt freilich verdächtig.“\n\n„Fräulein Cornelie, das Weib hat sich rächen wollt’, weil Sie so freundlich mit uns verkehrn, und mit ihr nur so sprechen, wie halt zu ’ner Untergebnen, das bost sie arg – das müssen mir alle Tag’ hören . . . Ich habe dran glaube müssen, ich arm’s Hascherle, an Sie und die Fräulein Toni da wagt sie sich nit! Da hat sie Angscht! O je, o je! Mei arm’s Mutterle, die kann ihre Augen ja nimmer aufschlagen, die kann ja in Pfaffenhofen nimmer auf die Straß’ unter die Leut gehn!“\n\n„Aber Annerle, Ihre Mutter wußte doch vom Ersten, und daß sie das Verhältnis mit Ihrem Hansel haben, da kann sie doch nicht so überrascht worden sein!“\n\n„Ja – aber daß wir halt so saudumm sein würden, das hat sie doch nit denkt,“ gestand das Annerle kleinlaut.\n\n„Wenn sie nur nit in der erschten Rag’ gleich den Brief hätt’ verbrannt! Ich hätt’ kei Ruh’ geben – das Weib hätt’ ich ins Zuchthaus bracht! Das hätt’ ich getan! Bei allem was mir heilig ischt, das hätt’ ich getan,“ schrie Annerle und ihre blauen Augen blitzten rachgierig. „Wenn’s doch wenigschtens nit noch so ausverschämt lügen wollt’ – und von Beleidigung reden – und ich müßt noch heut’ aus dem Haus . . . Auf der Stell’ pack’ ich mei Sach’ und fahr’ zum Herrn Geheimrat nach Stuggert. Der soll die Geschicht wissen, der soll jetzt wissen, wie’s hier steht.“\n\nSie stürzte, voll dieses neuen Entschlusses, zur Tür hinaus. Cornelie begriff vollständig, daß das Mädchen keine Stunde länger mit Frau Uffenbacher unter einem Dache sein wollte. Es tat ihr leid, sie fühlte einen Schmerz in der Brust, den sie vor zwei Wochen noch nicht für möglich gehalten haben würde. Der Verlust dieses munteren und originellen Mädchens, die ihr so manche öde Stunde vergnüglich verplaudert hatte, kam sie hart an. Doch auch hierin hatte man sich eben zu fügen.\n\nEs war ihr fast unheimlich gewesen, daß sie auf einen Schlag sollte über die Hebamme gesiegt haben. Nun nahm diese ihre Revanche – und sie würde noch manche nehmen für die Stunde der Demütigung, die sie hier vor dem tabaksduftigen Kanapee erlitten hatte . . . Sie waren Feinde, und würden es bleiben, bis die Zeit in diesem Hause durchlitten war – ja vielleicht – wer konnte in die Zukunft sehen – für länger noch – für viel länger . . . Cornelie senkte ihren Kopf tief in der Erkenntnis, daß mit dem Augenblick, da sie zum erstenmal menschliches Glück genossen hatte, sie eingetreten war in den Kreis der Gehetzten, Verfolgten, Verfehmten – preisgegeben jeder Gemeinheit – nichts anderes mehr als eines jener armen, kleinen, mißhandelten Mädchen um sie her. Und vor ihr gähnte ihr Leben als eine von finsteren Dingen erfüllte Tiefe.\n", "nfText": "Jetzt hörte sie, zum ersten Male wieder seit manchem Tage, vom Flur herauf ein Geheul und Gekreisch böser Weiberstimmen tönen. In der nächsten Minute wurde ihre Türe aufgerissen, das Annerle stürzte herein, durch Zorn und Weinen zerzaust, rot, geschwollen und fürchterlich entstellt.\n\n»Die Sau!« schrie sie gellend, »das Aas von einem Weib! Die Augen, wenn ich ihr auskratzen könnt, dem Satansbraten!«\n\n»Um Gottes willen – Annerle –, was ist geschehen –? Beruhigen Sie sich doch!«\n\n»Beruhigen?« heulte Annerle, »oh, mei Freile Cornelie, was das Weib mir antan hat, die böse, böse Hex ... Hab' ich Ihnen nit gesagt – anonyme Brief' schreibt's, das Vieh ... An meine Leut' daheim! Und nun wissen's alle, wie's um mich steht – und daß ich zum zweitenmal in der Hoffnung bin ... Oh, mei Jesus ... Mei Mutter möcht gerad ins Wasser gehn vor Scham!«\n\nCornelie starrte sie an, eiskalt vor Schrecken.\n\n»Das hat die Uffenbacher getan ...«\n\nAnnerle trocknete sich mit dem bereits völlig durchweichten Taschentuch das tränentropfende Gesicht.\n\n»In der Kontitorei wissets sie's auch allbereits,« schluchzte sie. »Oh, mei Fräulein Cornelie, was hat unsereins zu leide.«\n"}, {"id": "K09_03_S", "kap": 9, "typ": "Szene", "titel": "Cornelie und Toni", "fig": "Cornelie, Toni", "was": "Toni argumentiert für Versöhnung. Erklärung der „Garantie“: der Dekan zahlt über den Geheimrat nur, solange Annerle zurückgezogen bei der Uffenbacherin bleibt.", "sol": "—", "anm": "", "eaVon": "Nach einer Weile ging sie hinüber um zu sehen,", "eaBis": "herunter zu schlucken, sonst käme sie in arge Ungelegenheit.", "nfVon": "Sie fand das Mädchen friedlich und erlöst in ihrem", "nfBis": "Annerle?« fragte Cornelie. Die Hebamme sah an Cornelie vorüber", "eaText": "Nach einer Weile ging sie hinüber um zu sehen, ob sie Annerle mit Trost und Hilfe beistehen könne. Sie fand das Mädchen nicht, und hörte von Toni, Annerle sei ins Dorf gelaufen, um sich mit der Fischerin und der roten Bärbe zu beraten.\n\nToni sprach ruhig und verständig zugunsten einer Versöhnung der Streitenden. Die Uffenbacherin versichere, nichts von der Angelegenheit zu wissen. Sie behauptete, daß Annerle das Geschwätz selbst veranlaßte, indem sie vor kurzem erst, wo doch ihr Zustand schon deutlich sichtbar gewesen sei, in Stuttgart mit eben jener Bas der Schwägerin geschwatzt habe. Und woher der Brief komme, das könne doch kein Mensch wissen, wo das Annerle jedwedem auf der Gasse ihre Geheimnisse anzuvertrauen pflege!\n\nDies war alles richtig. Cornelie wurde wieder ein wenig unsicher, ob man ihrer Hauswirtin mit dem Verdacht nicht am Ende Unrecht tue.\n\nÜbrigens deutete die Toni auch noch an, die Frau Uffenbacher habe gesagt, sie könne das Annerle gar nicht fortlasse, denn sie habe „Garantie für sie übernommen“ beim Herrn Geheimrat, der im Auftrage des Herrn Dekans, Annerles Onkel, für ihren Unterhalt bezahle. Der geistliche Herr aber gebe das Geld nur unter der Bedingung, daß Annerle sich still bei der Uffenbacher, und strenge von der Welt zurückgezogen halte! Darum müsse man dem Annerle, wenn man es gut mit ihr meine, auch zureden, ihren Zorn herunter zu schlucken, sonst käme sie in arge Ungelegenheit.\n", "nfText": "Auf der Stelle wollte das Annerle das Tränenhaus verlassen und dem Herrn Geheimrat ihr Leid klagen, doch die Toni vermittelte verständig, sie meinte, Annerle sei selbst unvorsichtig gewesen.\n"}, {"id": "K09_04_NS", "kap": 9, "typ": "Nicht-Szene (iterativ)", "titel": "Was danach geschah", "fig": "Annerle, Frau Uffenbacher, Annerles Mutter, der Onkel Dekan, der Hansel", "was": "Annerle bleibt; Weinanfälle; der angeheftete Zeitungsartikel. Die Mutter findet sich ab; der Dekan zieht katholische Ziehfamilien einer Heirat mit einem ungetauften Juden vor.", "sol": "—", "anm": "Zweite konfessionell-antisemitische Passage der EA nach Kap. 6.", "eaVon": "So geschah es denn auch. Annerle packte ihre Sachen", "eaBis": "seine Bravheit bewahren . . . O Jesus Marie!", "nfVon": "schleuderte der Uffenbacherin im Vorübergehen vergiftete Bemerkungen zu, über", "nfBis": "Fräulein Cornelie, 's ischt gerad' zum Staunen!« Cornelie blickte", "eaText": "So geschah es denn auch. Annerle packte ihre Sachen nicht, sondern blieb im Tränenhaus. Sie hatte nur zuweilen Weinanfälle oder schleuderte der Uffenbacherin im Vorübergehen vergiftete Bemerkungen zu über Personen, die wegen Absendung anonymer Schmähbriefe zu vielen Jahren Zuchthaus verurteilt waren. Eines Abends fand die Hebamme einen Zeitungsartikel, der sich mit einem solchen Falle beschäftigte, durch Stecknadeln auf dem karrierten Kopfkissen ihres Bettes befestigt. Diese Tat gewährte Annerle eine entschiedene Erleichterung. Seitdem wurde sie ruhiger.\n\nAuch ihre Mutter in Pfaffenhofen schien sich, nachdem sie durch heftige Vorwürfe ihr moralisches Gewissen befriedigt hatte, mit den Tatsachen abzufinden. Schon der nächste Brief beschäftigte sich mit der Frage der Unterbringung des zu erwartenden Enkels. Der Vater habe erklärt, ins Haus nehme er nicht noch ein zweites, aber eine Bas auf dem Lande wollte gern das Kopfgeld verdienen. Und der Bruder, der geistliche Herr, habe gemeint, es sei immer noch besser, die Kinder würden in einer christlich-katholischen Familie erzogen, als seine Nichte heirate einen ungetauften Juden. Seine Schwester möge in Geduld ihr Kreuz tragen. Das wolle sie denn auch, nur möge Annerle dafür sorgen, daß der Hans den Kleinen auch ein Stück Geld verschreibe – haben tue er’s ja dazu! Als Annerle diesen Passus am Teetisch in der Laube vorlas, lächelte sie befriedigt in sich hinein und erklärte: „Ist schon längst geschehen. Vierzigtausend läßt er auf die Kinder schreiben, und wenn’s ein Bub’ ist, macht er’s notariell. Mei Hansel laßt sich nit lumpen!“\n\nAm bittersten blieb ihr die Vorstellung, welchen Eindruck die Nachricht in der ‚Konditorei‘ gemacht haben möge, und daß die Herren, die dort verkehrten, sie nun nicht mehr für ein „braves Mädele“ halten würden! Und sie hatte doch nie von ihnen Trinkgeld genommen, hatte sich mit ihrer Freundin ’s Wort drauf geben . . . Sogar als der Türke, der auf der technischen Hochschul’ studierte, ihr ein Zwanzigmarkstückel in die Hand drücken wollt’, habe sie es abgelehnt: „Mein Herr – eine Kellnerin, die Trinkgeld nimmt, bin ich nicht . . . “\n\nUnd nun war ihr guter Ruf doch verloren! Wie würde das den Herrn Tirektor Häberle kränken – arg nah gehen würd’s ihm – er habe gar viel von ihr gehalten und stets gesagt: Da kann man sehen, wie eins luschtig sein kann und doch seine Bravheit bewahren . . . O Jesus Marie!\n\n„Mein gutes Annerle,“ versuchte Cornelie zu trösten, „Sie leben doch schon lange mit Ihrem Hans und wissen, was Sie dafür aufgegeben haben, und daß er es Ihnen auch dankt . . . “\n\nAnnerle sah das Fräulein mit großen Augen an. Dann blickte sie nachdenklich und sehnsüchtig seufzend ins Weite. „Schon – schon,“ sagte sie trübselig, „aber man hat doch immer das Verlangen und möcht’ von die Leut’ für ein anständiges Mädele gehalten sein! Mei Freile Cornelie, wenn ich jetzt als nur erfahre möcht’, was der Herr Tirektor Häberle von mir denkt!“\n", "nfText": "Und so blieb am Ende alles beim alten. Annerle nahm ihre Rache auf ihre eigne Art. Sie schleuderte der Uffenbacherin im Vorübergehen vergiftete Bemerkungen zu, über Personen, die wegen Absendung anonymer Schmähbriefe zu vielen Jahren Zuchthaus verurteilt waren. Eines Abends fand die Hebamme einen Zeitungsartikel, der sich mit einem solchen Falle beschäftigte, durch Stecknadeln auf dem karrierten Kopfkissen ihres Bettes befestigt. Diese Tat gewährte Annerle eine entschiedene Erleichterung.\n\nZuweilen seufzte sie noch: »Wenn ich jetzt als nur erfahre möcht', was der Herr Tirektor Häberle von mir denkt!«\n"}, {"id": "K09_05_S", "kap": 9, "typ": "Szene", "titel": "Die Tortenfeier", "fig": "Cornelie, Annerle, Toni, Frau Uffenbacher; Schweizer-Mari im Bett", "was": "Nußtorte aus der Konditorei; gemeinsame Feier in der Laube. Die Uffenbacherin liest den Heiratsantrag eines Ulmer Schneidermeisters vor. Cornelie erhält ihr Honorar in Goldstücken.", "sol": "Annerle versorgt sogar ihre Feindin mit Kuchen. Cornelies „wir drei“. Tonis Kirschenrechnung zeigt den ökonomischen Abstand.", "anm": "Maris Frühgeburt und der Tod des Kindes stehen in einem Nebensatz.", "eaVon": "Sie sollte es erfahren und das wurde ein glorreicher", "eaBis": "gewiß zehn Pfund Kirschen kaufen,“ sagte die arme Toni.", "nfVon": "Sie sollte es erfahren, und das wurde ein glorreicher", "nfBis": "überfielen, und sie wimmernd durch das Dunkel nach der", "nfText": "Sie sollte es erfahren, und das wurde ein glorreicher Tag für das Annerle von Pfaffenhofen. Aus der Konditorei kam durch die Post eine runde Schachtel an ihre Adresse, die enthielt eine köstliche, mit bunten Früchten belegte Nußtorte. In weißen Zuckerperlen stand in ihrer Mitte zu lesen: Dem Fräulein Anna in unveränderter Verehrung und Hochschätzung  ein entsagender Freund.\n\nDie zwischen den Kuchen waltende Freundin aber schrieb als Kommentar:»Der Herr Tirektor Häberle läßt Dir herzlich Glück wünschen. Er fragte mich, womit er Dir eine Freud' machen könnt', da hab' ich gesagt, in Dei'm Zustand wär' man als arg auf Süßes. ›So nehmen wir eine Nußtorte, die hat sie immer am liebsten gegessen,‹ hat er gesagt – ›aber mit viel Früchten drauf – Sie wissen schon, Fräulein!‹ Und dazu hat er einen tiefen Seufzer getan, und ganz blaß ist er gewesen, und hat kein Wort geredt den ganzen Abend.«\n\nAnnerle strahlte. »Ein sehr anständiger Mann, der Herr Tirektor Häberle,« sagte sie in tadellosem Hochdeutsch, was bei ihr stets das höchste Maß der Anerkennung ausdrücken sollte.\n", "eaText": "Sie sollte es erfahren und das wurde ein glorreicher Tag für das Annerle von Paffenhofen. Aus der Konditorei kam durch die Post eine runde Schachtel an ihre Adresse, die enthielt eine köstliche, mit bunten Früchten belegte Nußtorte. In weißen Zuckerperlen stand in ihrer Mitte zu lesen: Dem Fräulein Anna in unveränderter Verehrung und Hochschätzung ein entsagender Freund.\n\nDie zwischen den Kuchen waltende Freundin aber schrieb als Kommentar: „Der Herr Tirektor Häberle läßt Dir herzlich Glück wünschen. Er fragte mich, womit er Dir eine Freud’ machen könnt’, da hab’ ich gesagt, in Dei’m Zustand wär’ man als arg auf Süßes. ‚So nehmen wir eine Nußtorte, die hat sie immer am liebsten gegessen,‘ hat er gesagt – ‚aber mit viel Früchten drauf – Sie wissen schon, Fräulein!‘ Und dazu hat er einen tiefen Seufzer getan, und ganz blaß ist er gewesen und hat kein Wort geredt den ganzen Abend.“\n\nAnnerle strahlte. „Ein sehr anständiger Mann, der Herr Tirektor Häberle,“ sagte sie in tadellosem Hochdeutsch, was bei ihr stets das höchste Maß der Anerkennung ausdrücken sollte. \n\nSie lud alle Fräuleins zu der Torte ein. Aber der Mari mußte ihr Teil ans Bett gebracht werden, denn aus lauter Aufregung und Teilnahme war sie vier Wochen zu früh niedergekommen und das Kleine war Gott sei Dank gleich gestorben. Sie war dem Annerle recht dankbar für diese Guttat. Annerle selbst war in der Freude, den treuen Verehrer nicht verloren zu haben, so versöhnlich gestimmt, daß sie selbst ihre Feindin, Frau Uffenbacher, zu der kleinen Feier holte und sie reichlich mit Kuchen versorgte. Nur das Mittelstück, das die Widmung trug, behielt sie für sich selbst und knabberte gerührt, mit Tränen in den Augen, an den Zuckerperlen, die so viel Güte und Liebe verrieten.\n\nCornelie hob ihre Teetasse und rief lachend, mit einem übermütigen Glänzen in ihren grauen Augen: „Der Herr Tirektor soll leben, hoch – hoch und dreimal hoch – !“ Alle stimmten begeistert ein.\n\nFrau Uffenbacher wollte sich erkenntlich erweisen, zog einen Brief aus der Tasche und sagte geheimnisvoll: sie habe eine gute Nachricht für die Damen, vielleicht könne noch eine von ihnen ihr Glück machen. Darauf hakte sie ihre Brille an den Ohren fest und las ein in sonderbar verschnörkeltem Kanzleideutsch abgefaßtes Schreiben, in dem ein Schneidermeister aus Ulm ihr freundlich zu wissen gab, er suche eine Frau und habe keine weiteren Vorurteile, er könne einem Mädchen mit Kind eine gute Versorgung bieten, weil er mit der Absicht umgehe, sein Geschäft auf feinere Tuche auszudehnen und einiger tausend Taler dazu benötige.\n\nDie Frau Uffenbacher schaute sich triumphierend unter ihren Damen um, und sprach: „Das wär’ als eine Gelegenheit, die ich mir nit würd’ entgehen lasse. S’ ischt doch immer besser, so ein Würmle hat sei Vater, wann’s auch ein Sümm’le koschtet – der Schneider ischt ein rechtschaffner Mann – da ischt nix gegen zu sagen . . . “ Sie hielt verwundert inne – Cornelie, die ernsthafte Cornelie, hatte sich gegen die Holzwand der Laube gelehnt, lachte laut und schallend und konnte sich aus ihrer Heiterkeit gar nicht wieder zurechtfinden.\n\n„Ja – die Freile Cornelie ischt als wohl zu vornehm,“ sagte die Uffenbacherin beleidigt. „Aber für die andere Freile wär’s doch vielleicht was! – Nun, ich hab’ als mei Pflicht getan, und mei Auftrag ausgericht! Und so lache wie die Schneegäns’ brauchtet ihr als auch nit, wenn ein rechtschaffner Mann euch ehelichen will.“\n\n„Nein, Frau Uffenbacher, da haben Sie ganz recht,“ sagte Cornelie mit verdächtiger Sanftmut. „Manch’ eine würde Ihnen gewiß herzlich dankbar sein! – Nur – ich glaube – wir drei eignen uns nicht gerade zur Vergrößerung des Tuchgeschäftes mit feinerer Ware!“\n\n„Wenn’s ein Kaufmann wär’, aber ein Schneider . . . “ sagte die arme Toni leise und nachdenklich.\n\nCornelie wurde hinausgerufen, der Briefträger habe Geld für sie. Und sie trat, die Hand voll Goldstücke, wieder ein. Es war das Honorar für ihren Essay über die Sehnsucht des modernen Weibes. Die andern schielten neidisch und neugierig nach dem Schatz in ihrer Hand. „Dafür könnt’ man gewiß zehn Pfund Kirschen kaufen,“ sagte die arme Toni"}];

function words(p){return p.toLowerCase().replace(/[^a-zäöüß]+/g," ").trim().split(" ").filter(Boolean);}
function pat(w){return w.replace(/ss/g,"\u0001").replace(/ß/g,"\u0001")
  .replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\u0001/g,"(?:ss|ß)");}
function locate(hay,phrase,fromEnd){
  if(!phrase||!phrase.trim())return -1;
  const w=words(phrase);
  for(let n=Math.min(w.length,8);n>=3;n--){
    const q=fromEnd?w.slice(w.length-n):w.slice(0,n);
    const re=new RegExp(q.map(pat).join("[^A-Za-zÄÖÜäöüß]+"),"i");
    const m=re.exec(hay);
    if(m)return fromEnd?m.index+m[0].length:m.index;
  }
  return -1;
}
function slice(ed,von,bis,cap){
  const t=TXT[ed]; const a=locate(t,von,false); if(a<0)return null;
  const w=t.slice(a, a+(cap||60000));
  const b=locate(w,bis,true); if(b<0)return null;
  return t.slice(a,a+b);
}
function eaLen(r){const x=slice("ea",r.eaVon,r.eaBis);return x?x.length:4000;}
function paras(s){
  if(!s)return null;
  return s.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(x=>x.length>1);
}
function splitSent(t){
  return (t||"").split(/\n+/).flatMap(p=>p.split(/(?<=[.!?»“«])\s+(?=[„»(]?[A-ZÄÖÜ])/))
    .map(x=>x.trim()).filter(Boolean);
}
function key(s){return s.toLowerCase().replace(/ß/g,"ss").replace(/[^a-zäöü ]+/g,"").replace(/\s+/g," ").trim();}
function lcsOps(a,b,keyf){
  const n=a.length,m=b.length;
  const A=a.map(keyf),B=b.map(keyf);
  const dp=new Int32Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i*(m+1)+j]= A[i]===B[j] ? dp[(i+1)*(m+1)+j+1]+1
      : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){
    if(A[i]===B[j]){ops.push(["=",a[i],b[j]]);i++;j++;}
    else if(dp[(i+1)*(m+1)+j]>=dp[i*(m+1)+j+1]){ops.push(["-",a[i],null]);i++;}
    else {ops.push(["+",null,b[j]]);j++;}
  }
  while(i<n)ops.push(["-",a[i++],null]);
  while(j<m)ops.push(["+",null,b[j++]]);
  return ops;
}
function toks(s){return s.match(/\s+|[^\s]+/g)||[];}
function wordDiff(x,y){
  const a=toks(x),b=toks(y);
  if(a.length*b.length>200000)return [[a.join(""),b.join(""),true]];
  const ops=lcsOps(a,b,t=>key(t));
  const L=[],R=[];
  for(const[o,l,r]of ops){
    if(o==="="){L.push(["",l]);R.push(["",r]);}
    else if(o==="-"){L.push([/\S/.test(l)?"del":"",l]);}
    else {R.push([/\S/.test(r)?"ins":"",r]);}
  }
  return [L,R];
}
function esc2(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function paint(arr){return arr.map(([c,t])=>c?`<span class="${c}">${esc2(t)}</span>`:esc2(t)).join("");}
function diffHTML(ea,nf){
  if(!ea||!nf)return null;
  const A=splitSent(ea),B=splitSent(nf);
  const ops=lcsOps(A,B,key);
  let L="",R="",pend=[];
  const sim=(x,y)=>{
    const A=new Set(key(x).split(" ").filter(w=>w.length>3));
    const B=new Set(key(y).split(" ").filter(w=>w.length>3));
    if(!A.size||!B.size)return 0;
    let n=0; A.forEach(w=>{if(B.has(w))n++;});
    return 2*n/(A.size+B.size);
  };
  const flush=()=>{
    if(!pend.length)return;
    const dels=pend.filter(o=>o[0]==="-").map(o=>o[1]);
    const inss=pend.filter(o=>o[0]==="+").map(o=>o[2]);
    const cand=[];
    for(let i=0;i<dels.length;i++)for(let j=0;j<inss.length;j++){
      const v=sim(dels[i],inss[j]); if(v>=0.45)cand.push([v,i,j]);
    }
    cand.sort((a,b)=>b[0]-a[0]);
    const pd=new Map(), pi=new Map();
    for(const[v,i,j]of cand){ if(pd.has(i)||pi.has(j))continue; pd.set(i,j); pi.set(j,i); }
    const cache=new Map();
    const pair=(i,j)=>{ const k=i+":"+j;
      if(!cache.has(k))cache.set(k,wordDiff(dels[i],inss[j]));
      return cache.get(k); };
    for(let i=0;i<dels.length;i++)
      L += pd.has(i) ? paint(pair(i,pd.get(i))[0])+" "
                     : `<span class="del">${esc2(dels[i])}</span> `;
    for(let j=0;j<inss.length;j++)
      R += pi.has(j) ? paint(pair(pi.get(j),j)[1])+" "
                     : `<span class="ins">${esc2(inss[j])}</span> `;
    pend=[];
  };
  for(const op of ops){
    if(op[0]==="="){flush();L+=esc2(op[1])+" ";R+=esc2(op[2])+" ";}
    else pend.push(op);
  }
  flush();
  return [L,R];
}

        <b>Solidarität</b><textarea rows="3" oninput="upd(${i},'sol',this.value)">${esc(r.sol)}</textarea>
        <b>Anmerkungen</b><textarea rows="2" oninput="upd(${i},'anm',this.value)">${esc(r.anm)}</textarea>
        <b>1908 von</b><input value="${esc(r.eaVon)}" oninput="upd(${i},'eaVon',this.value)">
        <b>1908 bis</b><input value="${esc(r.eaBis)}" oninput="upd(${i},'eaBis',this.value)">
        <b>1926 von</b><input value="${esc(r.nfVon)}" oninput="upd(${i},'nfVon',this.value)">
        <b>1926 bis</b><input value="${esc(r.nfBis)}" oninput="upd(${i},'nfBis',this.value)">
       </div>
      </div>
      <div class="btns">
       <button class="pri" onclick="oeffne(${i},'ea')">Vollständige Szene 1908</button>
       <button class="pri" onclick="oeffne(${i},'nf')">Vollständige Szene 1926</button>
       <button onclick="this.closest('.card').classList.toggle('edit')">Bearbeiten</button>
       ${(eaOK||r.eaText)?"":"<span class='miss'>1908 leer</span>"}
       ${(nfOK||r.nfText)?"":"<span class='miss'>1926 leer</span>"}
       <span class="hands">${handMark(r)}</span>
      </div>
     </div>`;
    l.appendChild(d);
  });
}
function upd(i,k,v){ROWS[i][k]=v;save();
  const c=document.querySelectorAll(".card")[i];
  if(k.endsWith("Von")||k.endsWith("Bis")){
    const ed=k.startsWith("ea")?"ea":"nf";
    const ok=slice(ed,ROWS[i][ed+"Von"],ROWS[i][ed+"Bis"])!==null;
    c.querySelector(".btns").dataset.x=ok;
  }}
let CUR=-1;
function autoText(r,ed){
  const t=slice(ed, r[ed+"Von"], r[ed+"Bis"], ed==="nf"?Math.round(eaLen(r)*2.2)+1500:60000);
  if(!t)return "";
  return t.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>1).join("\n\n");
}
function getText(r,ed){
  const o=r[ed+"Text"];
  return (o!==undefined&&o!==null)?o:autoText(r,ed);
}
function setText(ed,v){
  if(CUR<0)return;
  ROWS[CUR][ed+"Text"]=v; save(); markOv(); wcUpdate();
  const c=document.querySelectorAll(".card")[CUR];
  const b=c.querySelector(".hands"); if(b)b.innerHTML=handMark(ROWS[CUR]);
}
function reset(ed){
  if(CUR<0)return;
  delete ROWS[CUR][ed+"Text"]; save();
  document.getElementById("t"+ed).value=autoText(ROWS[CUR],ed);
  markOv(); wcUpdate(); render2(CUR);
}
let DIFF=false;
function toggleDiff(){DIFF=!DIFF;zeigeDiff();}
function zeigeDiff(){
  const t=document.getElementById("tgl"), lg=document.getElementById("dleg");
  const ta=[document.getElementById("tea"),document.getElementById("tnf")];
  const dv=[document.getElementById("dea"),document.getElementById("dnf")];
  if(!DIFF){t.textContent="Unterschiede zeigen";lg.hidden=true;
    ta.forEach(x=>x.hidden=false);dv.forEach(x=>x.hidden=true);return;}
  t.textContent="Bearbeiten";lg.hidden=false;
  const r=ROWS[CUR], a=getText(r,"ea"), b=getText(r,"nf");
  const d=diffHTML(a,b);
  if(!d){dv[0].innerHTML="<span class='leer'>Vergleich nicht möglich — eine Fassung ist leer.</span>";
    dv[1].innerHTML="";}
  else {dv[0].innerHTML=d[0];dv[1].innerHTML=d[1];}
  ta.forEach(x=>x.hidden=true);dv.forEach(x=>x.hidden=false);
}
function speichern(){
  save();
  const e=document.getElementById("msave");
  e.textContent="gespeichert"; setTimeout(()=>e.textContent="",2000);
}
function wcUpdate(){
  if(CUR<0)return; const r=ROWS[CUR];
  document.getElementById("wea").textContent=fmt(wc(document.getElementById("tea").value))+" W";
  document.getElementById("wnf").textContent=fmt(wc(document.getElementById("tnf").value))+" W";
  const c=document.querySelectorAll(".card")[CUR];
  const s=c&&c.querySelector(".wcnt"); if(s)s.innerHTML=countLine(r);
}
function markOv(){
  const r=ROWS[CUR];
  document.getElementById("oea").textContent=(r.eaText!==undefined)?"eigene Fassung":"";
  document.getElementById("onf").textContent=(r.nfText!==undefined)?"eigene Fassung":"";
}
function handMark(r){
  const a=[]; if(r.eaText!==undefined)a.push("1908 eigene Fassung");
  if(r.nfText!==undefined)a.push("1926 eigene Fassung");
  return a.length?"<span class='hand'>"+a.join(" · ")+"</span>":"";
}
function render2(i){
  const c=document.querySelectorAll(".card")[i];
  const b=c.querySelector(".hands"); if(b)b.innerHTML=handMark(ROWS[i]);
}
function oeffne(i,ed){
  CUR=i; const r=ROWS[i];
  document.getElementById("mt").textContent=r.id+" — "+r.titel;
  document.getElementById("tea").value=getText(r,"ea");
  document.getElementById("tnf").value=getText(r,"nf");
  document.getElementById("cea").className="col"+(ed==="ea"?" focus":"");
  document.getElementById("cnf").className="col"+(ed==="nf"?" focus":"");
  markOv(); wcUpdate(); zeigeDiff();
  document.getElementById("ov").classList.add("on");
  document.getElementById("t"+ed).focus();
}
function zu(){document.getElementById("ov").classList.remove("on");}
function flt(k){document.querySelectorAll(".card").forEach(c=>{
  c.style.display=(k===0||+c.dataset.kap===k)?"":"none";});}
function exportJSON(){
  const b=new Blob([JSON.stringify(ROWS,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="traenenhaus_szenen.json";a.click();}
function importJSON(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{ROWS=JSON.parse(r.result);save();render();}catch(e){alert("Datei nicht lesbar");}};
  r.readAsText(f);}
document.addEventListener("keydown",e=>{if(e.key==="Escape")zu();});
render();
</script></body></html>
