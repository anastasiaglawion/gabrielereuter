Zwölftes Kapitel

Die Geschichte der fetten Münchener Kellnerin nahm eine überraschende Wendung. Sie hatte ohne sonderliche Beschwerden einem Knaben das Leben gegeben. Ihr Herr, der stille Mann in altmodischem braunem Rock, war gleich darauf eingetroffen und hatte das Aufgebot beim Schulzen und beim Pfarrer bestellt.

Am zehnten Tage nach seiner Geburt sollte das Büblein getauft werden. Die Hebamme in ihrem besten Staat trug es hinauf zur Kirche, die Wöchnerin neben dem zukünftigen Gatten ging verdrossen hinterdrein.

Der Pfarrer nahm die heilige Handlung, um kein unliebsames Aufsehen zu erregen, in der Sakristei vor, er richtete dann einige mahnende Worte an die Brautleute. Und zwar belobte er den Bräutigam, daß er sich endlich zur Ehe entschließe, da doch nun schon das zweite Kindlein dem Bunde entsprossen sei.

Der stille, ernste Mann machte ihn auf seinen Irrtum aufmerksam, der Pfarrer aber blickte die Braut noch einmal forschend an und sagte: »Ich kannte Sie gleich wieder als Sie herein traten – Sie haben schon ein Kind an dieser Stelle taufen lassen – die Vorgängerin der Frau Uffenbacher trug es. Wir können ja im Kirchenbuch nachschlagen, in welchem Jahr es gewesen ist. – Lebt denn
 das Kind nicht mehr, daß Sie es so gänzlich vergessen haben?«

Die Braut stand schweigend mit trotzig aufgeworfenen Lippen.

Der stille, ernste Freund aber ließ sie samt der Hebamme allein ins Wirtshaus gehen, wo ein Frühstück bereit stand. Er begleitete den Pfarrer in seine Wohnung, um sich selbst im Kirchenbuche die Bestätigung zu holen. Der weiße Zettel im schwarzen Kasten wurde entfernt. Der Bub kam bei der Fischerin in Pflege. »Später nehm' ich ihn zu mir, ins Geschäft,« sagte der fragliche Vater wehmütig. Er zeigte sich nur noch, um die Rechnung für die Taufe zu begleichen. Es war anzunehmen, daß die Uffenbacherin ihn bei dieser Gelegenheit noch weiter aufklärte. Dann verschwand der stille Mann aus Schopfingen. Cornelie sah ihn die Landstraße hinab zum Bahnhof gehen, eine gestickte Reisetasche trug er in der Hand. Sie blickte lange hinter ihm her, auf den gebeugten traurigen Rücken in dem braunen Rock.

Die fette Blonde kehrte rosenrot blühend mit einem bösen Hohnlachen zu ihrem nächtlichen Schenkinnenamte zurück.

Nach diesem wurde es wieder still und friedlich im Häuschen an der Hügelflanke. Die Birnen vom großen Baum waren geerntet, und die Toni kaute den lieben langen Tag an den harten, grünen Früchten. Über die Stoppelfelder flogen im goldnen Herbstsonnenschein die Fäden des Altweibersommers. Der Storchenvater lehrte seine Brut.
 Rings um den Kirchturm sah man das unbeholfene Flügelschlagen der jungen Störchlein, die für die Winterreise gewaltig üben mußten.

Wenn Cornelie die schwermütigen und hoffnungslosen Gedanken allzu sehr bedrängen wollten, ging sie die untere Dorfstraße hinab und saß ein Weilchen bei der roten Bärbe, auf der hölzernen Bank, die um die Wand der kleinen Stube lief, wo die Bärbe mit ihrer Mutter und ihren Ziehkindern hauste. Zwar trug die Bärbe den Trauring am Finger, aber eine »Verlassene« war sie auch, und von Ehe und Mutterschaft war ihr nichts geblieben als ein leerer Kinderwagen mit himmelblauen Gardinen, den der Mann ihr in einer großartigen Laune geschenkt hatte, ehe er eines Tages mit andern italienischen Bahnarbeitern von dannen zog und nicht mehr wiederkehrte. Die Bärbe sprach nie von diesen Traurigkeiten. Sie tat alles, was eine Mutter tun kann für ihre Pfleglinge – nur den Wagen, unter dessen blauen Gardinen ihr eigenes totes Kindchen geschlummert hatte, den durfte keines von ihnen benutzen. Er stand, sorglich in ein weißes Laken gehüllt, auf dem Speicher des kleinen Hauses. Das Stübchen unten war immer voll Sonne, das Liesl mit den schönen Füßchen spielte und lachte, und das Agathle, dessen Mutter so bitter gekränkt war, daß es noch immer lebte, krähte jauchzend auf dem Arm der alten Frau mit dem lieben Großmutterlächeln, als warte ein Dasein voll Wonne und Herrlichkeit auf das ausgestoßene, arme, überflüssige Geschöpfchen. Die Nähmaschine klapperte
 unter den großen kräftigen Händen der Bärbe, die ab und zu gesäumte Stücke Leinenzeug in den Korb neben sich warf, und dabei mit ihrem guten schwäbischen Humor etwas Drolliges zu erzählen wußte.

Hatte Cornelie die stille, gesunde Friedensluft geatmet, die das Heim der zwei Frauen erfüllte, so kehrte sie immer ein wenig froher ins Tränenhaus zurück.

Dem Annerle war meistens »nit recht extra zumut.«

Das letzte Ereignis hatte einen Stachel in ihrer Seele zurückgelassen. Sie hatte es bisher für ganz selbstverständlich gehalten, die Zeit, da sie dem Hansel nicht gefiel, in der langweiligen Abgeschiedenheit zu verbringen. Nachdem sie die zarte Fürsorge des Mannes im braunen Rocke beobachtet hatte, nagte das Bedürfnis an ihr, sich selbst und dem Fräulein Cornelie zu beweisen, daß der Hansel hinter jenem nicht zurückstehe. Als der Herr Geheimrat einmal wieder die Villa Uffenbacher mit seinem Besuche beehrte, weinte das Annerle und erklärte ihm, die Sehnsucht müsse dem Kindle schaden, wenn der Herr Geheimrat es nicht zuwege bringe, daß der Hans sie einmal besuche. Sie wisse wohl, da sei ein reiches Judenmädle, das er längst hätte heiraten sollen, und es käme ihr arg verdächtig vor, daß er sich gar nicht einmal nach ihr umschauen wolle. Versprochen habe er's ihr längst – aber wer niemals Wort hielte, das sei der Hans.

Am folgenden Sonntag kam der Hans. Der Bub vom Weichensteller trug einen Korb mit zwei Flaschen Sekt hinter ihm drein.

Annerle hatte die grauen Filzpantoffeln gegen ein paar allerliebste Schühchen mit hohen Hacken vertauscht, die spitzenumflatterte Matinee, ein Geschenk der Lucie Bubenberg, verhüllte ihre umfängliche kleine Gestalt. Die Stirnlöckchen waren zierlich gekräuselt.

Frau Uffenbacher band die weiße Schürze vor, die sie anzulegen pflegte, wenn ein »Herr« ihrer Anstalt die Ehre seines Besuches verschaffte. Auch die arme Toni putzte sich ein wenig heraus und erwähnte ihre Genugtuung, daß der Besuch des Hans auf den Sonntag falle, an dem der Papa mit dem seinen aussetzte.

Cornelie ließ sich das Essen auf ihr Zimmer bringen und lud die Toni dazu ein. Gegen Abend, während sie, die jetzt oft an großer Schwäche litt, auf dem von den unangenehmen Düften durchzogenen Kanapee ruhte, kam Annerle zu ihr herüber. Heiß und rot war das kleine mollige Mädchen, mit verzaustem Haar und glänzenden Augen. Sie wollte das Fräulein Cornelie recht schön bitten, ob sie nicht nach dem Nachtmahl ein wenig herüberkommen möchte und ein Glas Sekt trinken. Es sei französischer und der Hans sei so begierig, sie kennenzulernen, und so dankbar für die Freundschaft, die das Fräulein Cornelie seinem Mädle bewiesen habe. Und mit dem reichen Judenmädele, daran denke er jetzt gar nimmer. – »Aber wissens,« gestand sie zuletzt kleinlaut zu Corneliens Ohr hinabgeneigt, »im Kopf rumgangen ist ihm die Partie doch – sonst wär' er längst schon einmal hier
 gewesen! Ach, Fräulein Cornelie – die Mannsleut'! ... wenn man sie nur nit so arg gern hätt'.«

Cornelie ging hinüber in Annerles Zimmer, und sie tranken französischen Sekt aus den Waschtischgläsern, der Hansel, ein hübscher blonder Mann mit lachenden blauen Augen und gesunden weißen Zähnen, und sein Schatz, Hand in Hand auf dem Sofa sitzend, die Toni, welche gleich einen Schwips bekam und fortwährend kicherte, und Cornelie, für die der Hansel die besten seiner salonfähigen Anekdoten hervorsuchte.

Als der Hansel Abschied nahm, denn Frau Uffenbacher hielt auf ihre Reputation im Hause, übernachten durfte niemals ein Herr, und sei er auch Vater oder Bruder zu einem der Fräuleins – mußte Cornelie es sich gestehen, daß sie sich heiter angeregt fühlte und einen fröhlichen Abend verbracht hatte – unbeschadet der Tatsache, daß der Sekt nur aus Waschtischgläsern getrunken worden war. Oder vielleicht gerade deshalb.

Als Annerle endlich ihre Mutterschmerzen leiden mußte, kannte ihr Zorn über eine solche Ungehörigkeit der Natur keine Grenzen. Sie bekamen es alle zu hören, die Natur, das Schicksal – der liebe Gott auch. – Gar dem abwesenden Hansel, dem unmittelbarsten Anstifter dieser Ängste, wurden Kosenamen zuteil, wie er sie sonst nicht von den liebevollen Lippen seines Mädchen zu hören bekam.

Auch mit der Frau Uffenbacher zankte Annerle zwischen Stöhnen und Wimmern wie ein schwäbischer Rohrspatz.
 Aber wenn die sonst so zornwütige Hebamme im Dienst war, hatte sie sich ganz zur weisen Frau umgewandelt. Mit unerschütterlicher Sanftmut waltete sie ihres Amtes und nahm die seltsamsten Beleidigungen von ihren Fräuleins hin, während sie versicherte: Schimpfen täte den Kindbetterinnen gut und wär' gesünder als Schreien.

Zuhörer mußte das Annerle haben, sonst wäre ja die ganze Geschichte nur der halbe Spaß gewesen. Sie war nicht zufrieden, bis sie nicht abwechselnd alles, was sie in Schopfingen kannte, um ihr Bett versammelt sah. Cornelien und Toni ließ sie schon gar nicht von ihrer Seite, auch die Bärbe und die Fischerin sprachen am späten Abend noch vor und gaben Ratschläge und Meinungen.

Mit sanfter Gewalt brachte Cornelie Toni endlich zu Bett und legte sich ebenfalls nieder. Die Uffenbacherin hatte versichert, es könne Morgen werden, ehe das Ereignis stattfinden möchte. Cornelie versank in Schlaf, die Ohren noch erfüllt von dem Geschrei Annerles, da wurde sie am Arm gefaßt, Toni stand, ein Licht in der zitternden Hand, vor ihrem Bett ...

»Sie hat noch eben geschimpft: Kreuzsakra, jetzt ischt's mir aber zu arg – da war der Bub' da! Kommen Sie nur – er ist herzig –, Annerle sagt, Sie müssen ihn gleich anschauen! –«

Cornelie lief hinüber. Annerle lachte über das ganze von Schweiß betaute Gesicht.

»Einen Buben, gebt mir meinen Buben!« rief sie übermütig wie ein Kind, das glücklich aus dem Dunkel in die
 helle Stube kommt. »Jetzt bin ich aber stolz! Der Hansel hat mich immer geuzt, ich könnt' nie einen Buben zur Welt bringen – jetzt hat er die Bescherung, der Fratz!«

»Wenn du so weiter fortschwätzt, nachher hascht' morgen ein braves Milchfieber,« sagte die Uffenbacherin unter fürchterlichem Gähnen. »Hier ischt die Klingel – den Buben nehm' ich mit in mei Bett – nun geht schlafen, alle miteinand'.«

Dreizehntes Kapitel

Cornelie legte müde und zerschlagen von den Folgen dieser Nacht ihr Manuskript in die Lade ihrer Kommode. Sie gab nun auf, es hier zu beenden, wie sie doch inbrünstig gehofft hatte. Mitten unter den wilden Schmerzen ihrer sterbenden Leidenschaft hatte sie zu arbeiten vermocht – vor den jetzt von allen Seiten auf sie einströmenden Erfahrungen floh jede Konzentrationsmöglichkeit.

In banger Vorfreude war sie am frühen Morgen schon auf und bei dem in der Nacht geborenen Kindchen, das in ein Federbett gewickelt unten im Wohnzimmer still auf der Wandbank schlief. Man hatte den braunen Kachelofen geheizt, es war warm und behaglich unter den niederen Deckenbalken. Behutsam nahm Cornelie das schlummernde Kleine in ihre Arme, es zuckte nur ein weniges in dem netten Gesichtchen, dann schlief es weiter. Sie konnte die rosigen Fingerchen küssen, sie atmete entzückt den feinen Duft, der dem winzigen Körper entströmte.

Und während sie dort saß, mit dem fremden Kinde im Arm und ihr Kleid sich ab und zu leise bewegte unter dem Regen der kleinen Glieder des noch Unsichtbaren, überfiel sie eine Sehnsucht, aus den tiefsten Tiefen ihres Seins emporgerungen und wurde zur Ahnung eines kommenden großen Glückes.

Das Kind stieß ein quäkendes Tönchen aus. Cornelie hüllte es in ihr Tuch und ging die Frau Uffenbacher zu rufen. Die schlurfte kauend herein, sie hatte bei ihrem zweiten Frühstück gesessen. Dem Kleinen wurde ein Löffelchen Tee eingeflößt, und dann kam er wieder auf die Ofenbank.

»Schläft Annerle?« fragte Cornelie.

Die Hebamme sah an Cornelie vorüber. Es war etwas Beunruhigtes in ihrem Gesicht.

»'s ischt ein Herr bei ihr,« flüsterte sie.

»Ein Herr? Der Hans?«

»Nein – ein fremder Herr – schon bald eine Stund'. Mich graust's grad – eine Wöchnerin braucht doch Schlaf! Was Gut's will der nicht ...«

»Aber Frau Uffenbacher – haben Sie denn nicht genug an dem einen Todesfall ...« rief Cornelie erregt, »eine Stunde ist er drin? Nach dieser Nacht! Das darf man doch nicht leiden! Holen Sie ihn wieder heraus – das ist doch Ihre Pflicht.«

Die Uffenbacherin zeigte ein schlaffes Gesicht.

»Wenn er doch sagt, er sei ein Verwandter!«

»Vor Verwandten sollte man die Mädchen hier am meisten schützen. Finden Sie nicht den Mut, ihn hinauszuwerfen, so tue ich's.«

Sie war schon auf der Treppe und lief schnell die schmalen Stufen hinauf. In ihr brannte ein ehrlicher Zorn über die Gefühllosigkeit dieses Unbekannten.

Sie klopfte kurz und trat ein.

Annerle saß aufrecht im Bett, fieberrote Flecke auf den Wangen, ihre Augen glänzten kriegerisch. Vor ihr hatte ein schwerer, älterer Herr mit großer Glatze, in einem eleganten Anzug, Platz genommen und sprach mit leiser Stimme eindringlich zu ihr. Auf dem Tisch lagen Papiere, er hielt einen goldnen Bleistift in der Hand.

»Machen Sie doch keine Weitläufigkeiten,« hörte Cornelie ihn sagen, »unterzeichnen Sie – und alles ist erledigt.«

Er wandte sich bei dem Geräusch, das ihr Eintritt verursachte, nach der Tür und maß Cornelies hohe Erscheinung vom Kopf bis zu den Füßen mit einem einzigen erstaunten Blick.

Sie stand vor ihm und sah auf ihn nieder. Ihr Gesicht war ernst. »Mein Herr – ich muß Sie bitten, dieses Zimmer zu verlassen. Fräulein Anna ist jetzt nicht in dem Zustand, eine so lange Unterhaltung zu führen.«

»Es liegt nur in dem Willen des Fräuleins, die Unterhaltung sofort zu beenden,« sagte der Herr verbindlich, eine plötzliche Verwirrung unter einer höhnischen Selbstsicherheit verbergend.

Annerle lachte hell. »Ich habe Ihnen schon dreimal gesagt, daß ich Ihnen keine Rechenschaft über den Vater meines Kindes schuldig bin! Das sind meine Privatangelegenheiten. Das hat mit meiner Stellung in Ihrem Geschäft nicht das mindeste zu tun!«

Cornelie zog die Brauen zusammen und legte die Hand auf den Tisch. Ihre Augen wurden gebieterisch, sie richtete sie fest auf den Mann vor sich.

»Ich habe leider kein Recht, Sie mit Gewalt entfernen zu lassen,« sagte sie höflich, aber bestimmt. »Ich erinnere Sie nur daran, daß Sie in diesem Augenblick die Verantwortung für zwei Menschenleben tragen! Fräulein Anna hat vor wenigen Stunden ein Kind geboren ... Ich weiß nicht, ob Sie Vater und Gatte sind – aber alt genug sind Sie, um zu wissen, was eine Frau in diesen Stunden zu leiden hat! Sie danach im ersten Schlaf zu stören – sie über eine Stunde lang mit verantwortlichen Geschäften zu peinigen, ist mehr als unüberlegt – es ist eine Roheit – eine raffinierte Grausamkeit.«

Der ältere Herr hörte Cornelie aufmerksam zu. Das unverschämte Lächeln verschwand dabei von seinem Gesicht, es verkroch sich gleichsam unter dem Bart und machte einem demütigen und wollüstigen Dulden Platz. Es war fast, als empfände er die harten Worte der Frau, die so unbegreiflich fremd in dieser zweideutigen Umgebung stand, wie Peitschenhiebe, die ihn entflammten.

Cornelie ahnte plötzlich die unerwartete Wirkung ihrer Worte. Ihr Mund verzog sich im Ekel. Sie wendete den Kopf, trat zu Annerle, glättete ihr das Kissen und bat sie leise, sich niederzulegen.

»Ich wußte in der Tat nicht, daß unsere Unterhaltung schon so lange dauerte,« sagte der Mann sanft, beinahe schmachtend, »glauben Sie mir – ich habe nur das eigne
 Beste der jungen Dame im Auge – es war mir unbekannt, daß ich zu so ungelegener Stunde komme.«

»Es ist Ihnen gesagt worden,« rief Cornelie hart.

»Nun – ich will Ihnen versprechen, das Fräulein sehr zu schonen. Nur noch wenige Minuten. Es hängt, wie gesagt, nur von des Fräuleins Willen ab ... Wir sind gleich fertig.«

»In einer Viertelstunde bin ich wieder hier,« sagte Cornelie kalt und entfernte sich.

Der Besucher wartete ihren wiederholten Eintritt nicht ab. Er entfernte sich noch vorher. Cornelie begab sich dann zum Annerle.

»Jesses –,« rief die ihr lachend und zornig entgegen, »war das eine Geschicht'! Die Uffenbacherin soll der Teufel holen, daß sie mir den herein läßt! Ich denk' mich rührt der Schlag wie ich aufwach', und er steht an meinem Bett!«

»Annerle, um Gottes willen, Sie fiebern vor Aufregung! Reden Sie nicht ...«

»Ach – jetzt ist's schon alles eins! Der Onkel vom Hans war's! Hat der mich sekkiert! Aber seinen Willen hat er doch nit erreicht!«

»Was wollte er nur?«

»Die Familie hat ihn geschickt. Die Alten! Wegen der reichen Partie. Das hab' ich gleich 'raus gehabt. Geld wollt' er mir bieten – vierzigtausend Mark hat er hier in Wertpapieren vor mich auf den Tisch gelegt – wenn ich schriftlich allen Ansprüchen auf den Hans entsagen
 wollt. Der hat gewußt, wie's um mich steht – oh, der ist so klug – der hat schon auf der Lauer gelegen, und hat gemeint, heut kriegt er mich am ehesten mürb! Ja – Pfefferkuchen!«

»Annerle – Sie haben widerstanden?«

Annerle lachte pfiffig. »Ich bin nit umsonst in dem seiner Schul' gewesen – all' die Jahr' her im Geschäft! Wissen's, was ich ihm geantwort' hab'? ›Ihr Anerbieten ischt sehr großmütig, Herr Kommerzienrat,‹ hab ich gesagt – ›aber ich wüßt' nit, wie ich dazu käm', es anzunehmen. Ihr Herr Neffe ist immer sehr gütig zu mir gewesen, und ich bin ihm dankbar, daß er mir den Urlaub verschafft hat – aber dafür verdien' ich doch nit vierzigtausend Mark –! Ansprüche habe ich überhaupt nit an ihn. Ich weiß halt gar nit, wie Sie darauf kommen, daß er der Vater zu meinem Kind sein soll? Er ist mein Herr Chef, und ich würd' mich so etwas nie unterstanden haben!‹«

»Annerle, Sie sind kostbar,« rief Cornelie lachend. »Hat er sich denn mit dieser Versicherung begnügt?«

»Er mußte schon – ich bin halt dabei blieben, trotz allem seinem Gerede. Wie beim Gericht hat er mich geplagt. Wissen's – mei Hansel sagt alleweil: nur sich nichts beweisen lassen! Wenn ich ihn verraten hätt' – das würd' er mir nimmer verziehen haben.«

Cornelie wurde nachdenklich. »Sind Sie sicher, daß der Hans nichts wußte, von diesem – Anerbieten?« Sie fragte es leise, Annerle lachte froh.

»Ach gehen's, Fräulein Cornelie – wenn man mit einem Mann sechs Jahr in einer guten Ehe gelebt hat – da weiß man wie man miteinander steht! Aber jetzt hätt' ich schon gern eine Bouillon!«

Und Cornelie lief eilig, der Siegerin die wohlverdiente Stärkung zu holen.

Vierzehntes Kapitel

Annerles Bübchen war unheimlich brav – es schlief Tag und Nacht, kaum, daß man nach dem Bade sein Quäkstimmchen hörte. Toni entdeckte die Ursache dieser Bravheit und zog Cornelie in ihr Vertrauen. Hinter dem Spiegel in der Schlafkammer der Uffenbacher fanden sie eine Reihe von Fläschchen mit dem braunen Mohnsaft, den die Hebamme den Kindern einzuflößen pflegte, damit ihre nächtliche Ruhe nicht gestört werde. Cornelie zog das Weib zur Rechenschaft, drohte mit Anzeige beim Kreisphysikus und erreichte doch nur, daß sie fühlte, wie der Ingrimm in der Brust des herrschsüchtigen Weibes gegen sie kochte. In ihrer schwersten Stunde würde sie einer erbitterten Feindin preisgegeben sein.

Ein Zufall, wie ihn niemand hätte voraussehen können, führte einen völligen Umschwung in der Gesinnung der Frau Uffenbacher gegen Cornelie herbei.

Es war ein Regentag zu Anfang des Oktober. Cornelie saß in der niederen, vor Hitze glühenden Bauernstube, an deren Ofen die Windeln des Ziehkindes und der nasse Rock der alten Hebamme trockneten und hörte ihr Geschwätz mit den zwei dürren Fräulein Hottinger und dem Annerle über eine ganz erschreckliche Entbindung, die sie einmal
 erlebt hatte und nun mit allen grausigen Einzelheiten wollüstig beschrieb. Dazwischen hinein quäkte Annerles Bübchen auf dem Arm der hagern Dorfjungfer, die gekommen war, es abzuholen. Das dicke Ziehkind gröhlte am Boden, wo es sich auf einem schmutzigen Federbett wälzte und von der blassen Luis vergeblich durch das Schnarren einer Holzknarre beruhigt werden sollte. Cornelie nähte an einem Kissenbezug für ihr Kleines – oben in ihrem Zimmer konnte sie sich nicht mehr aufhalten, weil der Ofen dort zerfallen und nicht zu heizen war. Und dieselbe Cornelie hatte draußen in der Welt eine Macht errungen, um ihren Einfluß tobte der Kampf der Parteien, eine Macht, die da weiter und weiter wirkte. Ihr Name war ein Kriegsruf geworden, den andere nun schon auf ihre Fahne schrieben, mit dem sie, unabhängig von ihr selbst, freie Bahn und Glück und Erfolg suchten ... Da draußen in einer Welt, die so unendlich ferne lag ...

Wie von einem Märchen las sie in dem großen, englischen Journal, das der Briefträger ihr soeben gebracht: Von ihren Vorfahren – von ihrer Kindheit – las kleine, lustige Geschichten aus ihren Schultagen und feine, geistvolle Worte eines gescheiten Mannes über das Werk ihres Lebens und von dem, was sie der Zukunft schuldig sei ... Sie lächelte in Gedanken versunken ihr stilles Mädchenlächeln. Plötzlich überfiel sie mit jäher Gewalt das Bewußtsein, erreicht zu haben, wonach Tausende von kraftvollen Männern vergebens ringen und kämpfen ...

Es kam wie aus weiter Ferne durch das Rauschen des Regens, vorüber am Stöhnen des Windes ein Ruf zu ihr, wie eine helle Geisterstimme –. Dort draußen lebte sie ja! War denn dies alles um sie her nicht nur ein wirres beängstigendes Traumland? Hinaus – hinaus in das wahre Leben! Zum Kampf – zum Wirken – zu neuen Taten, neuen Siegen! schrie plötzlich jubelnd ihr erwachender Mut.

Ungeduldig warf sie das Nähzeug hin, sprang auf und reckte die Arme. Die niedren Balken drückten auf sie, die übelriechende Glut des Raumes beklemmte sie.

»Ja, Fräulein Cornelie, wollen's denn hinaus bei dem argen Wetter?« fragte die Uffenbacherin erstaunt.

»Nur an die frische Luft,« sagte Cornelie zerstreut. »Der Regen tut mir nichts!«

Als sie heimkam, zog das Annerle sie unter hellem Gelächter in ihr Zimmer und berichtete eine tolle Geschichte.

Cornelie hatte das Haus kaum verlassen, da sprang die Alte hinauf, um das Bett für die Nacht zu richten. Zwei Minuten später winkte sie Annerle und Toni, ihnen in dem grünen Heft das Bild des Fräuleins zu zeigen. Vergebens aber hielt sie die Druckschrift bald nah bald weit vor die Brille, sie konnte doch nichts weiter entziffern, als den Namen »Cornelie Reimann«, der sowohl unter dem Bilde, als auch auf der folgenden Seite immer wieder zwischen dem sonst so unverständlichen Gedruckten auftauchte. Nun sollte Annerle weiter helfen.

»Das wird ihr Herr sein,« riet die findige Hebamme und betrachtete kritisch den neugewählten Londoner Bürgermeister, dessen Bild das Blatt auf derselben Seite brachte, »jung ischt er nit – aber ein feiner Mann!«

Des Annerles Englisch war nicht gar weit her, dennoch buchstabierte sie zuversichtlich an der Unterschrift.

»Lordmajor von London ist er,« sagte sie oben hin.

»Donnerschlag!« rief die Hebamme, »machst mir auch nix weiß?«

Sie buchstabierte nun selbst und fand denselben geheimnisvollen und hochtrabenden Titel heraus. Mit offnem Munde starrte sie auf Corneliens Bett – auf ihren Waschtisch, ihren Kleiderschrank und das tabaksduftige Kanapee.

»Lordmajor von London ...« wiederholte sie erschüttert, und von plötzlicher Gewissensangst befallen. »Lordmajor von London« – und sie hatte dem Fräulein Lunge mit saurer Soß' vorgesetzt – zweimal die Woche ...

Ja – wer das hätt' denken können ...

Das Annerle aber stachelte der Schelm. Sie kauerte sich auf das Kanapee und studierte eifrig an dem Aufsatz, der von der Cornelie Reimann handelte. Und endlich auf das Flehen und Bitten der Alten, ließ sie sich herbei, ihr dessen Inhalt zu übersetzen, obschon er ein großes Geheimnis enthielt.

Cornelie Reimann war die angetraute Gemahlin des Lordmajor von London, und in der goldnen Kutsche mit den vielen Pferden, die alle nickende Federbüsche auf den Köpfen trugen, war das junge Paar nach der Hochzeit
 im Triumph durch London gefahren. Aber eine nahe Verwandte der alten Königin hatte sollen den Lordmajor heiraten. Deshalb verbannte die Königin Cornelie von ihrem Hof, sie mußte fliehen und sich unter falschem Namen verbergen, sonst hätte die Prinzessin ihr nach dem Leben getrachtet. Endlich habe der Lordmajor die Verzeihung der Königin erhalten, und wenn das Kind geboren sei, dürfe Cornelie an den Hof von England und in die Arme ihres Gatten zurückkehren.

Alles dieses las Annerle aus dem grünen Heft der andächtig lauschenden Hebamme vor.

»Am End' gar kommt der Herr Major selbst, seine Frau Gemahlin zu holen ...« sagte atemlos die Uffenbacherin.

»Lordmajor,« verbesserte Annerle, »das ischt was anders Vornehmes, als ein simpler Herr Major.«

Die alte Schwäbin aber sah in ihrer Phantasie bereits die verschnörkelte goldne Kutsche mit den Pferden, die nickende Federbüsche auf den Köpfen trugen, mit den Dienern hinten und vorn, in den wunderlichen Hüten und Kleidern, die Straße vom Bahnhof herabgefahren kommen, vorüber an den Vorgärtchen der Witwen mit den Kinderwagen – sie sah das Gefährt vor ihrer Anstalt stillestehen – und sie sah sich selbst hineinsteigen, in einem schwarzseidenen Kleide mit einer großen Flügelhaube auf dem Kopfe, wie sie sich die Kindsfrauen in vornehmen Häusern vorstellte – das Neugeborene unter weißen Schleiern auf dem Arme tragend ...

– Das wär ein anderes Pöstle für sie, als hier das Gefrett' mit den ledigen Mädeles, bei dem man nit sein trocknes Brot herausschlagen könnt', erklärte sie dem Annerle und der Toni. Sie war ganz bereit mit nach England zu gehen, und eine Vertrauensstellung bei der Frau Lordmajor einzunehmen – der Herr müsse sich doch auch dankbar erweisen, dafür, daß sie die verlassene Frau in ihrer schweren Zeit bei sich aufgenommen und gehegt und gepflegt habe! Es sei nicht zuviel, wenn er in ihren alten Tagen für sie sorge!

Cornelie fiel es bei diesem sonderbaren Bericht ein, wieviel Schönes, Verwunderliches und Tolles die ausbündige schwäbische Phantasie der deutschen Welt schon geschenkt habe – und sie beschloß, die Hebamme in ihren verworrenen Träumen vorläufig nicht zu stören.

Oh – wie war die zornige, herrschsüchtige und boshaftige Alte nun so demütig und dienstbeflissen!

Dreierlei Knöpfle gab's in die Supp', Zwetschgenkuchen und Zwiebelkuchen wurde abwechselnd gebacken, und es war schier, als wär's im Tränenhaus mit einemmal Kirmes geworden. Fast kam den Fräuleins eine Furcht an, wie es mit dem guten Leben, das sie jetzt führten, einmal schrecklich enden könne.

Auch die arme Toni mußte Cornelie noch durch ihre schwere Stunde geleiten. Sie ging mit dem ächzenden Mädchen im Zimmer auf und nieder – sie hielt sie in den Armen, wenn die Schmerzen sie überfielen, und sie wimmernd durch das Dunkel nach der Mutter rief – mit der
 angstvollen, verzweifelten Kinderstimme – nach der Mutter, die ihre junge Tochter allein das Furchtbare tragen ließ. Sie waren beide zufrieden, daß die Uffenbacherin fest schlief und Toni wehrte immer wieder ab, wenn Cornelie sie rufen wollte. Endlich mußte es doch geschehen, Corneliens Kräfte waren plötzlich zu Ende. Taumelnd, an den Wänden sich entlang tastend, versuchte sie im Dunkel ihr Zimmer zu erreichen, da klingelte die Alte schon der Hanne und schrie nach Badewasser.

Cornelie hörte durch die Wand das dünne Quäkstimmchen des Neugeborenen.

Toni bat sie am folgenden Morgen, ihre Eltern zu benachrichtigen. Corneliens Augen strömten von Tränen, während ihre Feder über das Papier glitt. Man nannte sie eine Meisterin des Wortes, die an der Menschen Herzen zu rühren verstand – nie noch hatte sie so inbrünstig begehrt, mit dem Worte zu wirken, wie in diesem Brief, in dem sie den fernen Eltern sprach von dem tapferen Ausharren, von dem klagelosen Dulden ihrer Tochter – von der Hochachtung, die sie in allen diesen Monaten vor dem stillen Mädchen bekommen habe – und – sie konnte es nicht lassen – sie mußte die Mutter fragen, ob sie nicht im Geiste empfunden, wie das Kind in seinen Schmerzen so unablässig nach ihr gerufen habe?

Fünfzehntes Kapitel

Cornelie war früh zu Bett gegangen. Es mochte noch nicht Mitternacht sein, als sie aus dem Schlaf emporfuhr, überfallen von einem jähen Schmerzensanfall, der ihr untrüglich kündete, daß ihre Stunde gekommen sei. Sie erhob sich, warf ihren Schlafrock über und rief die Alte.

Unwirsch, weil man sie geweckt hatte, murrte diese: »Das kommt noch ganz anders und vor morgen Abend wird's einmal nix mit Ihne – deshalb hätten's mich nit im Schlaf zu störe brauche. Halten's nur aus – das müssen wir Weiber alle.«

Cornelie begab sich in ihr Zimmer zurück. Schlafen konnte sie doch nicht mehr, also entzündete sie die Lampe, kleidete sich vollends an, und wenn die Wehen kamen, klammerte sie sich an die Seitenlehne des alten tabaksduftigen Kanapees und zerbiß ihr Taschentuch, um die nebenan schlummernde Toni nicht durch ein Stöhnen zu erschrecken.

Eine Weile erholte sie sich etwas, und vermochte das Hemdchen, das Jäckchen und die Windeln für das Erwartete zu richten.

Plötzlich erinnerte sie sich des Schlafzimmers in ihrem Elternhause, wo die kleinen Geschwister zur Welt gekommen
 waren – in all dem luxuriösen Behagen, mit dem ihr Vater die Frau, die er liebte, sorgend umgab –, und sie sah auf das alte, schmutzige Kanapee – auf die dürftige, häßliche und zweideutige Umgebung, in der ihr Kind geboren werden sollte. Da nahm sie jedes einzelne Stück der Kleidung, die sie ihm bereitet hatte, und küßte es mit heißen schmerzverzogenen Lippen, als könne sie es dadurch weihen und heiligen. Und dann kam die Angst der Verlassenheit und der Einsamkeit und riß sie nieder, daß sie den Kopf in die Kissen wühlte, daß sie wimmerte wie ein sterbendes Tier, dem auch niemand hilft auf dieser Gotteserde.

Sie hörte unten an der Haustür läuten, sie hörte, daß man die Uffenbacherin ins Dorf zu ihrem Amte rief. Die Schulzenfrau erwartete ebenfalls diese Nacht.

Cornelie hob den Kopf. War es denn möglich, daß die Alte fortging und sie so allein ließ?

Cornelie ging umher, rang die Hände und fühlte doch zugleich eine von Sekunde zu Sekunde sich steigernde Spannung, eine Begierde, sich in dieses grausame Leiden hineinzustürzen – sich ihm ganz hinzugeben, bis zur Vernichtung leiden zu dürfen ...

Zuweilen empfand sie, daß die Oktobernacht kalt war, während ihr der Schweiß von der Stirne rann, erstarrten ihre Hände. Sie hüllte sich in ihr Tuch, griff nach einem Buche – sie mußte versuchen, sich zu zerstreuen. Sie versuchte einige Seiten zu lesen – von irgendeinem Liebespaar,
 das sich in Florenz an der unsterblichen Kunst ästhetisch ergötzte ...

Mit solchen feinen geistreichen Unterhaltungen hatte einst auch ihre Liebe begonnen, bis das Leben brutal und gewaltig die Ästhetik zerschlug, und ihr nun die Glieder auseinanderriß, um neues Leben zu gebären ...

Ob dies der Tod war, der in ihrem armen Leibe wütete –?

Nun – so würde sie ihm widerstehen!

Sie erhob sich, sie stand in der dunklen Nacht ihm Auge in Auge gegenüber, die Hände geballt, jede Muskel gespannt – jede Kraft der Seele und des Willens hell wach – zum äußersten Kampfe gerichtet ...

Sie wollte ihr Kind nicht allein lassen! Sie wollte es küssen und an ihrem Herzen halten – sie wollte leben – leben – leben!

Und die Qualen stiegen – stiegen – stiegen – bis alles in ihr und um sie nur noch wie eine wirbelnde Hölle war.

Die Uffenbacher war zurückgekehrt, hatte alle wilden Zukunftswünsche vergessen, fragte nicht mehr nach Mittag- und Veschperbrot, stand wie ein Soldat in der Schlacht, tapfer, geduldig und brav.

Ein fremder Mann erschien neben Corneliens Bett, sprach mit dem Dr. Schwärzle und sagte, er werde am Abend wiederkommen.

Am Abend –? würde es da noch nicht vorüber sein? Sie wollte nicht mehr leben – sie flehte nur noch, daß
 man sie töten möge – daß man doch Barmherzigkeit haben und ein Ende machen möge!

Und dann waren Stunden, wo sie überhaupt nichts mehr von sich und ihrer Umgebung wußte. Plötzlich hörte sie einen Angstruf, der nicht aus ihrem Munde kam: »Herr Doktor, Erbarmen, sie verliert den Verstand ...«

Und eine fremde Stimme sagte: »Jetzt ist es Zeit.«

Etwas wurde über ihr Gesicht gelegt, sie atmete einen süßlichen, fremden Duft – murmelte Zahlen – und sank erlöst in ein tiefes Dunkel, wie in die göttliche Ruhe der Vernichtung.

Nach einer langen Weile tauchten aus dem Dunkel Stimmen auf, die klangen wie hinter vielen schwarzen Schleiern, welche den Schall bis zu einem fernen Murmeln dämpften. Sie hatte die Empfindung, daß sie die Augen öffnen möchte und es doch nicht könnte.

Und aus diesem Dunkel, aus diesem Murmeln und Bewegen um sie her, löste sich eine Stimme, die sagte heller und lauter, dicht an ihrem Ohr: »Es ischt ein Mädele! Fräulein Cornelie, ein Mädele ischt's!«

»Ein Mädele ...?« wiederholte sie lallend zufrieden. Und die Dunkelheit legte sich aufs neue über sie.

Endlich – es mochte eine geraume Zeit vergangen sein, da war es ihr, als spüre sie ein beizendes Brennen an ihren Augenlidern und einen süßen zarten Rosenduft.

Sie atmete ein paarmal – er war immer da, der süße zarte Duft. Und nun schlug sie die Augenlider weit auf und blickte um sich. Sie fühlte keine Schmerzen mehr.

Im Zimmer, an der niedern Decke schwelten graue Rauchwolken, die aus dem zerbrochenen Ofen quollen. Eine Lampe brannte. Der fremde Arzt, ein eleganter Herr in einem langen, schwarzen Rock, befestigte sich die Manschetten mit goldnen Knöpfen. Der kleine Dr. Schwärzle stand mit hochaufgestreiften Hemdärmeln, eine blaue Schürze der Frau Uffenbacher war sonderbar um seinen Hals gebunden, er wusch sich in der Waschschüssel etwas Rotes von den Armen. Und auf den weißen Dielen sah Cornelie einen roten trägen Strom langsam gegen den Ofen zu schleichen. Eine alte Frau mit entzündeten Augen in dem hexenhaften Gesicht tauchte einen Scheuerlappen in den roten Strom und wand ihn dann in einem Eimer aus. Konnte das Blut sein? Ihr eigenes Blut?

Cornelie blickte an sich nieder, reine Linnentücher umhüllten sie, man hatte sie sauber gebettet, auf ihrer Brust lag eine voll erblühte Rose.

Und nun befiel sie ein jäher, fürchterlicher Schrecken.

Dort hinten standen die Uffenbacherin und die rote Bärbe – und weiter sah sie nichts.

In der abendlichen Stille drang ein Ton zu ihr – der energische Schrei eines neuen Lebens ...

Man brachte ihr das Kind – in ein weißes Tuch war es gehüllt; kraftvoll, rot, mit derben Fäustchen, lag es in ihrem Arm und schrie, daß man das Zünglein in dem Mündchen zittern sah.

»Es lebt – es ist gesund,« murmelte Cornelie, noch wie in einem wirren Traume befangen.

»Neun Pfund wiegt's,« rief die alte Hebamme befriedigt. »Alle Achtung. Das hätt' dem Fräulein wohl keins zugetraut.«

»Meinen Glückwunsch,« sagte auch der fremde Arzt. »Der Doktor Schwärzle hat heut' sein Meisterstück vollbracht. Eine Leistung, die unseren ersten Professoren zur Ehre gereichen würde.«

Das rosenrote Kindlein rührte sich in Corneliens Arm, spreizte die Finger, blinzelte mit den Äuglein, machte ein verdrießliches Gesicht und begann zu schlafen.

Cornelie lächelte still in sich hinein. Ein unendlicher Friede war in ihrer Seele.

Zwanzig Jahre hatte die Sehnsucht, immer wach und nimmer müde jede Nacht an ihrem Lager gestanden und mit heißen Händen an ihr Herz gerührt. Zwanzig Jahre hatte dies heilig-glühende Herz sich bezwungen im strengen Tempeldienst der Kunst.

Und nun kam die Erfüllung ...

– – – Unbegreiflich schien es Cornelie, daß Mädchen und Frauen zu Müttern wurden im gegebenen alltäglichen Verlauf der Dinge. Nein: in Trümmer das bisherige Dasein – zerscheitert alle Vergangenheit – verbrannt alle Schiffe – so war es recht – so mußte es sein! So stieg aus den grauen Salzwogen öder Schmerzen das grüne Eiland ihrer Mutterschaft der Geretteten selig empor.

Nicht in die Einsamkeit fliehen! Dort, wo sie früher gelebt und gewirkt, wollte sie mit ihrem Kinde leben und
 wirken, Zeugnis mußte sie ablegen für sich und die Schwestern, denen sie sich durch unzerreißbare Bande vereint fühlte. Zwingen die Menschen zur Achtung vor selbsterwähltem Lebenslos, zu einer Achtung, die auch den Verfolgten zugut kommen sollte.

Sechzehntes Kapitel

Annerle, die einmal wieder für einige Tage bei der Frau Uffenbacher eingekehrt war, weil sie nicht so recht wußte, wo sie sich sonst aufhalten sollte, war im Verein mit der Toni beschäftigt, das Zimmer des Fräulein Cornelie wohnlich herzurichten. Über das tabakduftige Kanapee ergoß Annerle ihr ganzes Veilchenparfüm, so daß eine neue Nuance in der Geruchssymphonie entstand, welche seine zerschlissenen Polster umspielte. Auf Tisch und Kommode prangten rot und blau die letzten Herbstblumen aus den bunten Vorgärtchen der Witwen in der unteren Dorfstraße. Die kleinen Fenster waren weit geöffnet, als sei es mit einem Male wieder Frühling geworden – so linde floß der Sonnenschein ins Zimmer, so warm spielten die Luftwellen um Cornelies Stirne. Noch immer war sie durch den strengen Befehl des Dr. Schwärzle ans Lager gebannt – sie wußte selbst nicht so recht, warum, denn sie fühlte sich frisch und wohl.

Und sie hatte sich auch geschmückt, in einem wunderlichen Stolz und Selbstbewußtsein – sie wollte keinen mitleiderweckenden Eindruck hervorrufen.

»Ha,« rief das Annerle, »jetzt hol' ich aber einen Spiegel, jetzt müssen Sie schauen, Fräulein Cornelie, 's ischt gerad' zum Staunen!«

Cornelie blickte in das Glas und war verblüfft über das in den zartesten Farben schimmernde Gesicht mit den dunkel leuchtenden Augen, das, umrahmt von einem seinen, alten, spitzenbesetzten Schleiertuch, wie ein ihr fremdes, unbegreifliches Bild auf den weißen Kissen ruhte.

Die Mädchen gaben ihr die kleine Gerda in die Arme, Annerle küßte sie hingerissen und flüsterte ihr ins Ohr: »Am End' gibt's doch noch eine Hochzeit!«

Cornelie schüttelte lächelnd den Kopf. Sie war über sich selbst verwundert – wie froh und leicht ihr zu Sinne war. Das schöne Kind an ihrer Brust war ihre Rechtfertigung – ihre Mutterschaft war wie ein goldenes Gitter um sie her.

Rudi Imgart kniete vor ihrem Bett, sein Kopf lag an ihrer Schulter, sie hatte den Arm um seinen Hals gelegt und küßte ihn auf das kurze blonde Haar. Ein Strom von mütterlicher Liebe ergoß sich aus ihrem Herzen, überflutete den Mann, löschte alle Vergangenheit, erlöste sie von jedem Haß, von jeder Kälte ...

Sie tauschten leise zarte Worte, wie Menschen tun, die sich hüten müssen, Wunden zu berühren. Aber Cornelie wurde fröhlich und sicher, während sie ihm das Kind zeigte und von ihm zu sprechen begann. Um sie her war es wie draußen in der Natur: ein linder, fast unheimlich süßer, warmer Sonnenschein, eine milde Frühlingsluft – in der man doch den Hauch von welkenden Blumen, von moderndem Laube spürt – den herben Duft des Herbstes.

Es war ein sanftes Staunen zwischen ihnen, daß es so schön war, wieder beisammen zu sein, und ein zitterndes Bangen, daß es ja doch nicht bleiben könne und ein inneres Danken, weil sie sich diese friedvoll goldene Stunde gegenseitig schenken durften.

Und dann wollte er Abschied nehmen.

Ein letzter Schrei der Sehnsucht stieg aus ihrem Herzen: »Bleibe noch bei mir – gehe noch nicht!«

Aber ihre Lippen flüsterten es nur leise und scheu und sie sah auch gleich, daß ein Schatten, eine Unruhe über sein Gesicht flog.

»Sieh' – was soll ich bei dir – du bist noch krank – du kannst mir jetzt nichts sein ...«

Ihre Augenlider schlossen sich für die Dauer einer Sekunde.

»Gewiß – du mußt wohl gehen,« sagte sie freundlich.

»Ich werde auch erwartet, du weißt ...«

»Ja – ja ...«

Er küßte sie sacht. »Du bist mir nicht böse? Später – nicht wahr?«

Sie antwortete nicht, der Blick ihrer Augen ging an ihm vorüber und senkte sich auf das Kind an ihrer Seite.

Cornelie wußte nun, daß sie allein bleiben mußte. Und es war gut so.

Der Frau Uffenbacher zerrann ein lockender Zukunftstraum, als sie den Mann in der Lodenjoppe, den zerbeulten Filz auf dem kurz geschorenen Kopf, mit dem rüstigen
 Schritte des Wanderers, der nach fernen Zielen strebt, die Straße zum Bahnhof hinabgehen sah. Das war nun und nimmer der Lordmajor von London, und niemals würde sie in der goldenen Kutsche durch die jubelnde Menge fahren.

Aus Rache über die Enttäuschung steckte sie am nächsten Morgen die kleine Gerda mit dem dicken Ziehkind und dem Säugling der Luis in ein Badewasser.

Nach einer Woche rüstete sich Cornelie zur Abreise.

Das Annerle gestand ihr, daß der Hans am Tage von Corneliens Entbindung im Tränenhaus gewesen und ihr Stöhnen gehört habe, die Rose sei von ihm. Nun sei er mit einem Male bereit, dem Annerle eine Filiale einzurichten.

»Und für den Buben macht er's notariell – vierzigtausend Mark, wenn einmal sein Vater gestorben ist,« fügte sie hinzu. »Mei Hansel läßt sich nicht lumpen!«

Die Toni aber hatte von ihren Eltern die Erlaubnis erhalten, Weihnachten heim zu kommen, dann wolle man ihr verzeihen. Cornelie spürte, wieviel tiefer das junge Geschöpf noch im Boden des Elternhauses wurzelte als in der neuen Mutterschaft, die ihr kaum andere als unheimliche Gefühle erwecken konnte.

So sah Cornelie die beiden guten Kinder, die ihr zumeist lieb geworden waren, auf dem Wege zu sicherem, tüchtigen Leben. Cornelie umarmte sie innig, und mit heißen Tränen hingen die Mädchen ihr am Hals, als es zum Scheiden ging.

Einsam war sie gekommen, nun gab eine Schar seltsamer Freunde ihr das Geleit. Die Uffenbacherin, das kleine Fräulein würdevoll auf den Armen tragend, ging mit manchem guten Ratschlag und schier gerührt über die Feierlichkeit dieses Abschiedes an ihrer Seite. Es fehlte nicht die Hanne mit dem Versuchskind, das Annerle, die Toni und die Luis, die rote Barbe, die Cornelie heim begleiten sollte und ihre Freundin, die Fischerin. – Es traten auch der kleine Dr. Schwärzle und seine freundliche Frau mit Blumen und Abschiedgrüßen vor ihre Haustür. Fast wie ein Taufzug anzuschauen wandelte die lange Reihe Leut' die Landstraße zum Bahnhof hinab – die Landstraße, auf der Cornelie im Laufe dieses Sommers so viele Menschen mit so vielen Schicksalen beladen, hatte kommen und gehen sehen; vorüber an den Häuschen der Witwen mit den Vorgärten, darin im blassen Novembersonnenschein die Kinderwagen standen.

Hinter ihr blieb das Tränenhaus, das sich, seines sommerlichen Blütenschmuckes entkleidet, als die armselige, baufällige Hütte, die es in Wirklichkeit war, unter dem knorrigen Gerippe des alten Birnbaumes an die Hügelflanke schmiegte. Cornelie schaute zurück und umfaßte es mit einem langen, zärtlichen Blick.

Hier hatte ihr Glück die Augen zum Lichte geöffnet – hier hatte ihr Kind zum ersten Male gelächelt.

Vor dem Bahnzug stehend, nahm sie das kleine Mädchen aus den Armen der Uffenbacherin entgegen und
 drückte es mutvoll und freudig an ihr Herz. Liebkosend umfaßte ihre Hand sein festes, rundes Köpfchen, das ihr fast das Leben gekostet hatte, und dabei dachte die Mutter: Gott erhalte dir deinen harten Schädel und einen harten Willen geb' er dir dazu, denn beides kann ein Weib gebrauchen.

Ende

let ROWS=[{"id": "K03_01_NS", "kap": 3, "typ": "Nicht-Szene (deskriptiv-iterativ)", "titel": "Das Haus und sein Betrieb", "fig": "Frau Uffenbacher, Hanne, das Ziehkind, die Gäste (kollektiv)", "was": "Lage und Ruf des Hauses; wiederkehrender Ablauf der Aufenthalte; Goldstücke, Inserate, Prospekte.", "sol": "—", "anm": "Tränenhaus-Mütter: „die Gäste“, „die Damen“, „ihr Baggasch“. In 1926 der Romananfang (NF_K01_01_NS); letzter Satz fehlt dort.", "eaVon": "Das kleine Haus lag in einer freundlichen Wiesengegend Württembergs.", "eaBis": "euch schon zusammennehme, das sag’ ich euch, ihr Baggasch!“", "nfVon": "Das kleine Haus lag in einer freundlichen Wiesengegend Württembergs.", "nfBis": "mit Begeisterung jede Gelegenheit, sich in den Mittelpunkt der", "nfText": "Das kleine Haus lag in einer freundlichen Wiesengegend Württembergs. Oben auf dem höchsten Punkt des lang hingestreckten Hügels hob ein graues Grafenschloß seine Dächer über das Grün der Parkbäume, die Dorfstraße mit den Bauernhöfen zog sich über den Rücken der Erdhebung. Unten, wo der helle junge Fluß durch Weidengebüsch und über weiße Kiesel plätscherte, gab es noch eine zweite Straße. Hier wohnten nur arme Weiblein in bescheidenen Hütten, mit winzigen, blumenreichen Vorgärten.\n\nDas kleine Haus aber lag ganz allein und abseits von den beiden Dorfstraßen, am linken Abhang des Hügels, in seine Flanke gleichsam verschüchtert hineingedrückt. Der Weg, der vom Dorf zu ihm hinunter führte, war steil und steinicht, voller Löcher und Pfützen. Rechts und links neben den Schlehdornhecken wuchs ein Gestrüpp von Brennnesseln. Alles zeigte, daß niemand ein Interesse daran nahm, den Pfad in gangbarem Zustande zu erhalten. Er führte ja auch nur zu einem Gehöft notorisch verkommener armer Leute, und weiter zu dem kleinen Häuschen, von dem die Frauen im Dorf mit einem gewissen halblauten Ton der Scheu redeten, und die Männer mit einem zweideutigen Grinsen.\n\nFreundlich genug schaute es aus unter dem großen blühenden Birnbaum, durch den die Bienen summten. Helle Gardinen hingen vor allen Fenstern, und seine stattliche Eigentümerin stand meistens würdevoll vor ihrer Türe, irgend etwas Gutes zwischen ihren großen weißen Zähnen behaglich kauend, während die kleine Schar ihrer Gäste um sie her auf der Schwelle oder auf der Bank an der Hauswand zu hocken pflegte, gähnend, träumend oder schwatzend, wie es sich eben fügen mochte.\n\nDie Gäste waren das Bedenkliche in diesem kleinen Hause, von dessen Türe man unendlich weit ins Land schauen konnte, über das heitere Flüßchen hinweg, bis zu den duftigen Umrissen der Schweizeralpen fern am wolkigen Horizont, und das doch trotz dieser weiten und freien Aussicht so schüchtern sich hinter der Hügelflanke versteckte.\n\nScheue und stille Gäste waren es, die das kleine Häuschen beherbergte. Meistens trafen sie in der Dämmerung bei der stattlichen Frau Uffenbacher ein. Ein trübes Geheimnis umgab sie, die blassen Mädchen mit unförmigen Gestalten, die zu zweien und dreien in den einsamen Feldwegen spazieren gingen, bis sie eines Tages wieder verschwunden waren. Nach solchem Verschwinden tauchte in der unteren Straße bei den armen Witwen in einem der bunten Vorgärtchen ein neuer Kinderwagen auf, und der scheue Gast ließ dem Dorf einen munter krähenden Erdenbürger als Pfand seines Besuches zurück.\n\nFrau Uffenbacher aber zählte zufrieden einige Goldstücke und schloß sie in ihre Kommode. Sie hatte kürzlich, um mit der Neuzeit fortzuschreiten und ihrer Anstalt einen höheren Aufschwung zu verleihen, Inserate in verschiedenen großen Blättern erscheinen lassen. Es waren auch Prospekte gedruckt worden. Gebildeten Damen höherer Stände, welche sich für eine Zeitlang von der Welt zurückzuziehen wünschten, waren darin alle Vorteile, die ein mehrmonatlicher Aufenthalt in dem gastlichen Hause von Frau Uffenbacher bot, mit unwiderstehlicher Liebenswürdigkeit auseinandergesetzt worden.", "eaText": "Das kleine Haus lag in einer freundlichen Wiesengegend Württembergs. Oben auf dem höchsten Punkt des lang hingestreckten Hügels hob ein graues Grafenschloß seine Dächer über das Grün der Parkbäume, die Dorfstraße mit den Bauernhöfen zog sich über den Rücken der Erdhebung entlang. Unten, wo der helle junge Fluß durch Weidengebüsch und über weiße Kiesel plätscherte, gab es freilich noch eine zweite Straße. Hier wohnten nur arme Weiblein in bescheidenen Hütten, mit winzigen, blumenreichen Vorgärten. \n\nDas kleine Haus aber lag ganz allein und abseits von den beiden Dorfstraßen, am linken Abhang des Hügels, in seine Flanke gleichsam verschüchtert hineingedrückt. Der Weg, der vom Dorf zu ihm hinunter führte, war steil und steinicht, voller Löcher und Pfützen. Rechts und links neben den Schlehdornhecken wuchs ein Gestrüpp von Brennesseln. Alles zeigte, daß niemand ein Interesse daran nahm, den Pfad in gangbarem Zustand zu erhalten. Er führte ja auch nur zu einem Gehöft notorisch verkommener armer Leute, und weiter zu dem kleinen Häuschen, von dem die Frauen im Dorf mit einem gewissen halblauten Ton der Scheu redeten, und die Männer mit einem zweideutigen Grinsen.\n\nFreundlich genug schaute es aus unter dem großen blühenden Birnbaum, durch den die Bienen summten. Helle Gardinen hingen vor allen Fenstern, und seine stattliche Eigentümerin stand meistens würdevoll vor ihrer Türe, irgend etwas Gutes zwischen ihren großen weißen Zähnen behaglich kauend, während die kleine Schar ihrer Gäste um sie her auf der Schwelle oder auf der Bank an der Hauswand zu hocken pflegte, gähnend, träumend oder schwatzend, wie es sich eben fügen mochte.\n\nDie Gäste waren das Bedenkliche in diesem kleinen Hause, von dessen Türe man unendlich weit ins Land schauen konnte, über das heitere Flüßchen hinweg, bis zu den duftigen Umrissen der Schweizeralpen fern am wolkigen Horizont, und das doch trotz dieser weiten und freien Aussicht so schüchtern sich hinter der Hügelflanke versteckte. Scheue und stille Gäste waren es, die das kleine Häuschen beherbergte. Meistens trafen sie in der Dämmerung bei der stattlichen Frau Uffenbacher ein. Sie trieben dann eine Weile in dem Hüttchen ihr geheimnisvolles Wesen, – blasse Mädchen mit unförmigen Gestalten, die zu zweien und dreien in den einsamen Feldwegen spazieren gingen, bis sie eines Tages wieder verschwunden waren. Gewöhnlich tauchte nach solchem Verschwinden in der unteren Straße bei den armen Witwen in einem der bunten Vorgärtchen ein neuer Kinderwagen auf, und der scheue Gast ließ dem Dorf einen munter krähenden Erdenbürger als Pfand seines Besuches zurück.\n\nFrau Uffenbacher aber zählte zufrieden einige Goldstücke und schloß sie in ihre Kommode und harrte einem anderen Gast entgegen. Sie hatte kürzlich, um mit der Neuzeit fortzuschreiten und ihrer Anstalt einen Aufschwung zu verleihen, Inserate in verschiedenen großen Blättern erscheinen lassen. Es waren auch Prospekte gedruckt worden. Gebildeten Damen höherer Stände, welche sich für eine Zeitlang von der Welt zurückzuziehen wünschten, waren darin alle Vorteile, die ein mehrmonatlicher Aufenthalt in dem gastlichen Hause von Frau Uffenbacher bot, mit unwiderstehlicher Liebenswürdigkeit auseinandergesetzt worden.\n\nDas verfallene und von der ärmsten Dorfmagd verachtete Hüttchen an der Hügelflanke nahm in diesen Darlegungen den Charakter eines heiteren buen retiro an, in dessen Lauben und Ruheplätzen ein weltabgeschiedener Friede herrschte, während alle Bequemlichkeiten an Fluß- und Wannenbädern, an vorzüglicher Kost, an fachgemäßer ärztlicher Pflege mit einer Art von fachmännischer Selbstverständlichkeit zugesichert wurden, ebenso wie den Damen die allerstrengste Diskretion und eine gewissermaßen über die allerstrengste Diskretion noch hinausgehende Geheimhaltung ihrer Lebensumstände treuherzig und zugleich mit geschäftlichem Ernste zugesichert wurde."}, {"id": "K03_02_S", "kap": 3, "typ": "Szene", "titel": "Der Brief wird begutachtet", "fig": "Frau Uffenbacher, Annerle, Schweizer-Mari, Toni, Hanne, das Ziehkind", "was": "Die Runde begutachtet Cornelies Anfrage und rät, ob sie von einem Herrn oder einer Frau stammt. Streit über die Kost.", "sol": "In der Deutung des Briefes spiegeln sich Wunschvorstellungen und Verletzungen der Tränenhausmütter. „Am End’ die Mutter!“ bleibt ohne Sprecherzuordnung.", "anm": "", "eaVon": "„Zeigen Sie den Brief her, Frau Uffenbacher!“", "eaBis": "Haarnadeln und den sehr fettigen Spielkarten ihren Platz fand.", "nfVon": "Zeigen Sie den Brief her, Frau Uffenbacher!« Cornelies Anfrage,", "nfBis": "vorüber an den kleinen Häuschen der Witwen, in deren", "eaText": "Frau Uffenbacher suchte einen dieser meisterhaften Prospekte aus der Schublade ihres Wohnzimmertisches hervor, wo sich außerdem zwischen Brotrinden und Wurstschalen, Haarnadeln und sehr fettigen Spielkarten ein Fläschchen Tinte, ein Löschblatt und ein Federhalter befanden. Sie setzte ihre gewichtige Brille auf, und rief die zur Zeit bei ihr weilenden jungen Mädchen, das Annerle von Pfaffenhofen, die Schweizer-Mari und die bayerische Toni herbei, sowie ihre Magd, die Hanne, die ein dickes rotes Ziehkind auf ihren dicken roten Armen schaukelte. Ohne diese Hilfe wäre es Frau Ursula Uffenbacher nicht möglich gewesen, einen so bedeutungsvollen Brief zu schreiben, wie es jetzt geschehen mußte. Sie legte sich feierlich einen Papierbogen auf dem Löschblatt zurecht, rückte ihn rechts und rückte ihn links, leckte die Feder, putzte die Brille, schaute darüber hinweg auf das Annerle von Pfaffenhofen, ein molliges blondes Fräulein, das schmunzelnd in dem Prospekte las, und fragte etwas unsicher: „Sag’, Annerle, meinscht, die Anfrag’ ischt von einem Herrn? Ja, soll ich da adressieren: Sehr geehrter Herr oder Sehr geehrtes Fräulein? Eine bessere Herrschaft ischt’s jedenfalls – da müßt ihr euch schon zusammennehme, das sag’ ich euch, ihr Baggasch!“\n\n„Zeigen Sie den Brief her, Frau Uffenbacher!“\n\nCornelies Anfrage, die sie auf das in der Zeitung gefundene Inserat hin an Frau Uffenbacher gerichtet hatte, ging von Hand zu Hand und erregte eine lebhafte Meinungsverschiedenheit.\n\n„So sachgemäß fragt nur ein Herr – und zwar ein Geschäftsmann,“ erklärte Annerle, „ich kenn’ mich da aus! Und die Handschrift – ja – und doch, wenn ich’s recht bedenk’ . . . “\n\n„Sie werden doch nicht glauben, daß so eine Frau schreibt,“ rief die Schweizer-Mari, das ischt doch alleweil sicher, daß das ein Mann geschrieben hat! Das Maidli hat gewiß einen lieben Herrn, der sich um sie kümmern tut . . . “\n\n„Am End’ ihr Vater!“ überlegte Annerle. „Wisset’s – so das nach allem fragen – nach dem Bad und so – das tut schon so leicht kein Liebhaber – macht mir nix weiß . . . “\n\n„Am End’ die Mutter!“\n\n„Ach geh’ – kennst die Mütter! – Was tun denn die, als weine und schimpfe! Die kümmern sich doch den Teifi drum, was ihre Kinder gut täte in dere Zeit . . . Ja, die verheirateten Töchter – die werde gepflegt und gehegt – aber mir arme Luder . . . Ha!“\n\nDas Annerle schwang sich auf die Tischkante, baumelte mit ihren Füßen, die in grauen Filzpantoffeln steckten, und las den Brief noch einmal aufmerksam von Anfang bis zu Ende durch. Ihre hellen und klugen, etwas hervorstehenden Augen bekamen dabei einen gesammelten Ausdruck von Nachdenklichkeit. „Ich mein’ doch, es ischt eine Frau,“ sagte sie dann bestimmt. „Vielleicht eine Verheiratete. Eine Dame. Mädels paßt auf! Das wird interessant!“\n\n„Die macht doch kehrt, wann’s die Räuberhöhlen hier sieht!“ bemerkte die bayerische Toni. Hanne puffte sie sofort in die Seite und murrte: „Ihr tut auch gerad’, als wär’t ihr anders gewöhnt!“\n\n„Sind wir auch!“ entgegnete Annerle scharf, während die Toni den Kopf wandte und schwieg.\n\n„Für eure sechzig Mark, dafür ischt’s lange gut,“ schimpfte Frau Uffenbacher. „Soll ich euch Schneegäns’ eine extra Wurscht brate? Ich möchte’ mehr nehmen von der hier!“\n\n„Ja, Frau Uffenbacher, da müßten Sie aber auch mehr geben . . . “\n\n„Mehr gebe – mein’ ich geb’ mehr als genug! Ein Brot und ein Backsteinkäs’ – mehr gibt’s Sommer und Winter nit bei der Frau Wurzler in Ulm, und die hatte die feinschten Fräuleins. Was wird dann die Neue viel sein? Wird auch nur . . . !“\n\nSie brauchte einen sehr derben und volkstümlichen Ausdruck, die gute Frau Uffenbacher. Die Mädchen quiekten ein bißchen aus Schadenfreude und vor Vergnügen an der Unanständigkeit. Und dann wurde unter der energischen Beihilfe des klugen Annerle, die von Beruf Buchhalterin in einem Warenhause war, die Antwort an die rätselhafte und aufregende Persönlichkeit verfaßt.\n\n„Vergesse Sie nit ‚Dischkretion Ehrensache‘. Das verlange die Leut!“ rief Annerle zum Schluß, „Ehrensach’“ mit einem ‚H‘“. Sie baumelte vergnügt mit den grauen Filzpantoffeln. Hier unter all den Frauenspersonen – warum sollte man sich’s nicht bequem machen?\n\n„Ich werd’ als wissen, wie ‚Ehrensach‘ geschrieben wird,“ sagte Frau Uffenbacher würdig, zeichnete ihren Namen und schob die Antwort, nebst einem der verheißungsvollen Prospekte in den Umschlag. Drauf lehnte sie sich im Stuhl zurück, strich befriedigt mit beiden Händen über ihre gestärkte weiße Schürze, und blickte triumphierend im Kreise umher. „Nu wolle wir veschpern.“ Sie nahm Cornelies Brief aus Tonis Hand und legte ihn in die Tischlade, wo ihre diskrete Korrespondenz bei Brotresten und Wurstschalen, Bindfaden, Haarnadeln und den sehr fettigen Spielkarten ihren Platz fand.", "nfText": "Frau Uffenbacher suchte einen dieser Prospekte aus der Schublade ihres Wohnzimmertisches hervor, wo sich zwischen Brotrinden und Wurstschalen, Haarnadeln und sehr fettigen Spielkarten ein Fläschchen Tinte, ein Löschblatt und ein Federhalter befanden. Sie setzte ihre gewichtige Brille auf, und rief die zur Zeit bei ihr weilenden jungen Mädchen, das Annerle von Pfaffenhofen, die Schweizer-Mari und die bayerische Toni herbei, sowie ihre Magd, die Hanne, die ein dickes rotes Ziehkind auf ihren dicken roten Armen schaukelte. Ohne diese Hilfe wäre es Frau Ursula Uffenbacher nicht möglich gewesen, einen so bedeutungsvollen Brief zu schreiben, wie es jetzt geschehen mußte. Sie legte sich feierlich einen Papierbogen auf dem Löschblatt zurecht, rückte ihn rechts und rückte ihn links, leckte die Feder, putzte die Brille, schaute darüber hinweg auf das Annerle von Pfaffenhofen, ein molliges blondes Fräulein, das schmunzelnd in dem Prospekte las, und fragte etwas unsicher: »Sag', Annerle, meinscht, die\n Anfrag' ischt von einem Herrn? Ja, soll ich da adressieren: Sehr geehrter Herr oder sehr geehrtes Fräulein? Eine bessere Herrschaft ischt's jedenfalls – da müßt ihr euch schon zusammennehme, das sag' ich euch, ihr Baggasch!«\n\n»Zeigen Sie den Brief her, Frau Uffenbacher!«\n\nCornelies Anfrage, die sie auf das in der Zeitung gefundene Inserat hin an Frau Uffenbacher gerichtet hatte, ging von Hand zu Hand und erregte eine lebhafte Meinungsverschiedenheit.\n\n»So sachgemäß fragt nur ein Herr – und zwar ein Geschäftsmann,« erklärte Annerle, »ich kenn' mich da aus! Und die Handschrift – ja – und doch, wenn ich's recht bedenk' ...«\n\nDie Schweizer-Mari meinte bedächtig: »Das hat gewiß einen lieben Herrn, der sich um sie kümmert ...«\n\n»Am End' ihr Vater!« überlegte Annerle. »Wisset's – so nach allem fragen – nach dem Bad und so – das tut schon kein Liebhaber – macht mir nix weiß ...«\n\n»Am End' die Mutter!«\n\n»Ach geh' – kennst die Mütter! – Was tun denn die, als weine und schimpfe! Die kümmern sich doch den Teifi drum, was ihre Kinder gut täte in dere Zeit ... Ja, die verheirateten Töchter – die werde gepflegt und gehegt – aber mir arme Luder ... Ha!«\n\nDas Annerle schwang sich auf die Tischkante, baumelte mit ihren Füßen, die in grauen Filzpantoffeln steckten, und las den Brief noch einmal aufmerksam von Anfang bis zu Ende durch. Ihre hellen und klugen, etwas hervorstehenden Augen bekamen dabei einen gesammelten Ausdruck von Nachdenklichkeit. »Ich mein' doch, es ischt eine Frau,« sagte sie dann bestimmt. »Vielleicht eine Verheiratete. Eine Dame. Mädeles paßt auf! Das wird interessant!«\n\n»Die macht doch kehrt, wann's die Räuberhöhlen hier sieht!« bemerkte die bayerische Toni. Hanne puffte sie sofort in die Seite und murrte: »Ihr tut auch gerad', als wär't ihr anders gewöhnt!«\n\n»Sind wir auch!« entgegnete Annerle scharf, während die Toni den Kopf wandte und schwieg.\n\n»Für eure sechzig Mark, dafür ischt's lange gut,« schimpfte Frau Uffenbacher. »Soll ich euch Schneegäns' eine extra Wurscht brate? Ich möcht' mir mehr bezahlen lassen von der hier!«\n\n»Ja, Frau Uffenbacher, da müßten Sie aber auch mehr geben ...«\n\n»Mehr gebe – mein' ich geb' mehr als genug! Ein Brot und ein Backsteinkäs – anders gibt's Sommer und Winter nit bei der Frau Wurzler in Ulm, und die hatte die feinschten Fräuleins. Was wird dann die Neue viel sein? Wird auch nur ...«\n\nSie brauchte einen sehr derben und volkstümlichen Ausdruck, die gute Frau Uffenbacher. Die Mädchen quiekten ein bißchen aus Schadenfreude und vor Vergnügen an der Unanständigkeit.\n\nUnd dann wurde unter der energischen Beihilfe des klugen Annerle, die von Beruf Buchhalterin in einem Warenhause war, die Antwort an die rätselhafte und aufregende Persönlichkeit verfaßt.\n\n»Vergesse Sie nit ›Diskretion Ehrensache‹. Das verlange die Leut'!« rief Annerle zum Schluß, »Ehrensach' mit einem ›H‹«. Sie baumelte vergnügt mit den grauen Filzpantoffeln. Hier unter all den Frauenspersonen – warum sollte man sich's nicht bequem machen?\n\n»Ich werd' als wissen, wie ›Ehrensach‹ geschrieben wird,« sagte Frau Uffenbacher würdig, zeichnete ihren Namen und schob die Antwort, nebst einem der verheißungsvollen Prospekte in den Umschlag. Drauf lehnte sie sich im Stuhl zurück, strich befriedigt mit beiden Händen über ihre gestärkte weiße Schürze, und blickte triumphierend im Kreise umher. »Nu wolle wir veschpern.« Sie nahm Cornelies Brief aus Tonis Hand und legte ihn in die Tischlade, wo ihre diskrete Korrespondenz bei Brotresten und Wurstschalen, Bindfaden, Haarnadeln und den sehr fettigen Spielkarten ihren Platz fand.\n"}, {"id": "K03_03_S", "kap": 3, "typ": "Szene", "titel": "Ankunft im Dorf", "fig": "Cornelie, das Ziehkind Lisle, die Fischerin, die rote Bärbe", "was": "Cornelie trifft in Schopfingen ein, hört das Gespräch der Dorffrauen, spricht das Ziehkind an.", "sol": "—", "anm": "", "eaVon": "Einige Tage später traf Cornelie Reimann in Schopfingen ein.", "eaBis": "hinüberführten. Wie dieser Winkel beschaffen sein mochte, war gleichgültig.", "nfVon": "Einige Tage später traf Cornelie Reimann in Schopfingen ein.", "nfBis": "summten friedlich sommerliche Melodien. Eine »Anstalt« in irgendeinem Sinne", "nfText": "Einige Tage später traf Cornelie Reimann in Schopfingen ein. Der verheißungsvolle Prospekt hatte seine Wirkung getan. Sie ging in ihrem langen, sandfarbenen Mantel den Weg vom Bahnhof, vorüber an den kleinen Häuschen der Witwen, in deren Vorgärten je ein bis zwei Kinderwagen standen. Wo die Hütten zu Ende waren, fragte sie eine knochige rothaarige Frau mit einem freundlichen Gesicht nach der Besitzung von Frau Uffenbacher.\n Ihre Stimme war leise und tonlos. Die Frau blickte sie erstaunt an und sah dann schüchtern zur Seite, während sie Auskunft gab. Eine zweite Frau gesellte sich zu ihr. »Ja – will denn die zur Uffenbacherin – das ischt doch eine Dam'?« fragte die andere, und die Rothaarige schüttelte bestürzt den Kopf.\n\n»Am End' für ein Verwandtes?« »Nein, schau – sie ist in der Hoffnung.«\n\n»Ja, ja – schon – – Das sind Geschichte! Da wird die Uffenbacherin sich arg wichtig tun! Gel' sie kommt schon und verzählt! Sie kann doch nichts bei sich behalte! Wirst schon alles höre, Fischerin!«\n\n»Da schau ich heut' abend noch bei dir ein!« flüsterte die Freundin, und die Rothaarige lachte über den Eifer der anderen.\n\n»Komm, Lisle, geh' her, hole ein Brot zur Veschper. Und bring' ein Bier mit!«\n\nDas zierliche Kind hüpfte mit dem Krug davon und hatte die langsam schreitende Cornelie bald überholt. Cornelie sah die reizend gebildeten nackten Füßchen der Kleinen mit den feinen Gelenken vor sich her über den Staub der Dorfstraße tanzen und freute sich der Schönheit ihres leichten Ganges.\n\n»War das deine Mutter?« fragte sie freundlich das Kind. Es schüttelte den Kopf. »Meine Ziehmutter,« sagte es verlegen, am Schürzenzipfel drehend.\n\n»So – deine Ziehmutter,« wiederholte Cornelie. Sie\n sprach nicht weiter, die Kleine lief davon. Corneliens Schritte wurden müder und müder.\n\nNur Ruhe finden ...\n\nNur einen Winkel, der außerhalb, ganz außerhalb ihrer eigenen Welt lag – zu dem gar keine Fäden mehr hinüberführten. Wie dieser Winkel beschaffen sein mochte, war gleichgültig.\n"}, {"id": "K03_04_S", "kap": 3, "typ": "Szene", "titel": "Verhandlung mit der Uffenbacherin", "fig": "Cornelie, Frau Uffenbacher", "was": "Cornelie wird handelseinig und stellt zur Hauptbedingung, in keinerlei Beziehung zu den anderen Damen gebracht zu werden.", "sol": "Ausgangspunkt: Cornelie verlangt die Isolation selbst, vertraglich. Alles Spätere ist Abweichung davon.", "anm": "", "eaVon": "Ein warmer Nachmittagssonnenschein wob um die windschiefe Hütte der", "eaBis": "Damen gleichfalls zur Verfügung, die Herrschafte sind nie anwesend.“", "nfVon": "Ein warmer Nachmittagssonnenschein wob um die windschiefe Hütte der", "nfBis": "Sie fragte sich, ob sie dies werde ertragen können", "nfText": "Ein warmer Nachmittagssonnenschein wob um die windschiefe Hütte der Uffenbacherin einen feinen Märchenduft, und Tausende von Bienen, die durch die Zweige des blühenden Birnbaumes aus- und einschwärmten, summten friedlich sommerliche Melodien. Eine »Anstalt« in irgendeinem Sinne von modern hygienischem Komfort war dies nun freilich nicht, aber Cornelie war es lieber so. Die Uffenbacherin in ihrer breiten mütterlichen Würde einer »weisen Frau« des Dorfes mißfiel ihr nicht, das Bett des kleinen Zimmers war gut und sauber. So wurde sie schnell mit ihr handelseinig und beschloß, den Sommer über zu bleiben und ihre Stunde hier zu erwarten. Die Mahlzeiten wollte sie auf ihrem Zimmer nehmen. Ein oder das andere Fräulein, das vielleicht im Laufe der Zeit noch einkehren würde oder jetzt schon hier war, – o nur bessere Damen, dafür garantierte Frau Uffenbacher – ja, von denen würde die gnädige Frau nicht das mindeste zu sehen bekommen. Denn ...\n\nGewiß – das machte Cornelie zur Hauptbedingung, sie durfte in keinerlei Beziehung zu diesen anderen Damen gebracht werden, sie mußte ganz einsam für sich leben können.\n\n»Aber das ischt ja selbstverständlich,« beteuerte die Uffenbacherin treuherzig. »Sehen Sie, gnädige Frau, die Damen sind ja alle auf Dischkretion angewiese, wie sollte denn eine solche Anstalt bestehe, wenn sie nicht auf Dischkretion gebaut wäre – und überhaupt mein Beruf – eine Hebamm' – da könnte ich ja Geschichte erzähle – da erfährt man ja die Geheimnisse von ganze Familie! Schau'n Sie, da ischt jetzt so ein junges Fräulein bei mir« – sie hob die Hand an den Mund, ihr breites Gesicht erglänzte vor Wichtigkeit, sie senkte die Stimme: »Der Vater besucht sie jeden Sonntag – niemand darf ihn sehen! Der Mann verliert seine Stellung, wenn was verlautet! – Das Ding war siebzehn Jahr – gnädige Frau – da geschehen Verbrechen, wenn man davon reden dürfte ...«\n\n»Also, dann lassen Sie meinen Koffer holen,« sagte Cornelie ungeduldig.\n\n»Darf ich Ihnen auch die Laube zeige? Der Schloßpark steht den Damen gleichfalls zur Verfügung, die Herrschafte sind nie anwesend.«\n\nFrau Uffenbacher schritt Cornelie voran, das Treppchen hinunter über den kleinen Flur, rechts aus der Tür guckten blonde und braune neugierige Köpfe. Cornelie ging abgewendeten Hauptes vorüber. Sie fragte sich, ob sie dies werde ertragen können? Aber war nicht schließlich alles gleich unerträglich?", "eaText": "Ein warmer Nachmittagssonnenschein wob um die windschiefe Hütte der Uffenbacherin einen feinen Märchenduft, und tausende von Bienen, die durch die Zweige des blühenden Birnbaumes aus- und einschwärmten, summten friedlich sommerliche Melodien dazu. Eine „Anstalt“ in irgend einem Sinne von modern hygienischem Komfort war dies nun freilich nicht, aber Cornelie war es lieber so. Die Uffenbacherin in ihrer breiten mütterlichen Würde einer „weisen Frau“ des Dorfes mißfiel ihr nicht, das Bett des kleinen Zimmers war gut und sauber. So wurde sie schnell mit ihr handelseinig und beschloß, den Sommer über zu bleiben und ihre Stunde hier zu erwarten. Die Mahlzeiten wollte sie auf ihrem Zimmer nehmen. Ein oder das andere Fräulein, das vielleicht im Laufe der Zeit noch einkehren würde oder jetzt schon hier war, – o nur bessere Damen, dafür garantierte Frau Uffenbacher – ja, von denen würde die gnädige Frau nicht das mindeste zu sehen bekommen. Denn . . .\n\nGewiß – das machte Cornelie zur Hauptbedingung, sie durfte in keinerlei Beziehung zu diesen anderen Damen gebracht werden, sie mußte ganz einsam für sich leben können.\n\n„Aber das ischt ja selbstverständlich,“ beteuerte die Uffenbacherin treuherzig. „Sehen Sie, gnädige Frau, die Damen sind ja alle auf Dischkretion angewiese, wie sollte denn eine solche Anstalt bestehe, wenn sie nicht auf Dischkretion gebaut wäre – und überhaupt mein Beruf – eine Hebamm’ – da könnte ich ja Geschichte erzähle – da erfährt man ja die Geheimnisse von ganze Familie! Schau’n Sie, da ischt jetzt so ein junges Fräulein bei mir“ – sie hob die Hand an den Mund, ihr breites Gesicht erglänzte vor Wichtigkeit, sie senkte die Stimme: „Der Vater besucht sie jeden Sonntag – niemand darf ihn sehen! Der Mann verliert seine Stellung, wenn was verlautet! – Das Ding war siebzehn Jahr – gnädige Frau – da geschehen Verbrechen, wenn man davon reden dürfte . . . “\n\n„Also, dann lassen Sie meinen Koffer holen,“ sagte Cornelie ungeduldig.\n\n„Darf ich Ihnen auch die Laube zeige? Der Schloßpark steht den Damen gleichfalls zur Verfügung, die Herrschafte sind nie anwesend.“\n\nFrau Uffenbacher schritt Cornelie voran, das Treppchen hinunter über den kleinen Flur, rechts aus der Tür guckten blonde und braune neugierige Köpfe. Cornelie ging abgewendeten Hauptes vorüber. Sie fragte sich, ob sie dies werde ertragen können? Aber war nicht schließlich alles gleich unerträglich? "}, {"id": "K03_05_S", "kap": 3, "typ": "Szene", "titel": "Die Rose von Ulm", "fig": "Cornelie, Frau Uffenbacher, die Rose von Ulm", "was": "Gang durch das Haus, neugierige Köpfe an der Tür. Das Bild der jungen Frau in der Laube, darüber der Storch. Die Uffenbacherin nennt Namen und Sachverhalt.", "sol": "—", "anm": "Kapitelende mit Tränen. Storch (1).", "eaVon": "Frau Uffenbacher schritt Cornelie voran, das Treppchen hinunter über", "eaBis": "soll eine reiche Baas freien, eine Tuchfabrikantenstochter aus Reutlingen.“", "nfVon": "Frau Uffenbacher schritt Cornelie voran, das Treppchen hinunter über", "nfBis": "sie eine leise Abneigung nie hatte überwinden können, auch", "nfText": "Einige Augenblicke später sah sie vor sich ein Bild, das sie seltsam bewegte. Die Laube auf dem Hügel, eine Bretterhütte mit schrägem Dach, von jener einfachen Form, wie altdeutsche Darstellungen aus der Heiligen Schrift sie zeigen, war erfüllt von goldenem Abendlicht. Auf der Wiese, die sie umgab, standen blaue und weiße Blumen auf schlanken Stengeln, die von den schrägfallenden Sonnenstrahlen zu einer unirdischen, gläsernen Schönheit verklärt wurden. In dem goldenen Duft saß ein junges Weib von einer holden Lieblichkeit der Erscheinung. Ihre schmalen und bleichen Hände lagen ihr müde im Schoß, ihre braunen, durchsichtigen Augen blickten durch Tränen über die frühlingsblühende Weite in ein Tal von Schmerzen, das nur ihrem Blicke sichtbar wurde. Und über ihr, am blauen Himmel, unter den schneeglänzenden, goldumsäumten Sommerwölkchen flog gemächlichen Flügelschlages ein großer schwarz-weißer Storch.\n\n»Der hält sich immer hier in der Näh',« sagte Frau Uffenbacher mit einem fröhlichen Stolz. »Die Freilen füttern ihn. Er gehört ja auch zu uns.«\n\n»Wer ist das Mädchen?« fragte Cornelie leise.\n\n»Das ischt die Rose von Ulm. Hat letzte Woche entbunden. Morgen geht sie heim. Das Kind ischt vor einer Stunde geholt.«\n\nCornelie stürzten die Tränen aus den Augen.\n\n»Ja freilich,« sprach Frau Uffenbacherin in einem strengen Ton. »'s ischt so – ich sag's alleweil: Ein Wochenbett ischt kein Brautbett! Das bedenkt so ein Mädle nit vorher. Ei – Rösle, muscht nit heule! Kanscht doch jede Woche herüber und das Kleine sehen! Gut hat's das Ding bei der Frau Lebzelter – sauber – da ischt nichts zu sage! Der Herr Papa wird ja doch einmal nachschauen! Na ja ... Denket Sie an die Freilein Toni – das ischt ein Elend ... Ihne wollte doch die Eltern von Eurem Herrn was gebe fürs Kindle ...«\n\n»Ja, Frau Uffenbacher,« sagte die Rose von Ulm in einem gereizten Ton, »ich weiß schon – aber ich will ihr Geld nicht – ich will einen Vater für mein Kind!«\n\nIhr feines Mädchengesicht zog sich zusammen zu der krampfhaften Energie eines Entschlusses, der mit der Wucht einer fixen Idee ihre Zukunft regieren würde: Ich will einen Vater für mein Kind!\n\nDie Rose von Ulm ... Wie sie dort saß im goldenen Licht, im holden Blühen ihrer unschuldsvollen Schönheit, hätte man der jungen Madonna gern den Göttersohn geglaubt – den Jupiter, der aus Himmelshöhen sich zu ihr niedergesenkt hatte. Doch Frau Uffenbacher flüsterte Cornelie ins Ohr: »'s ischt ein Leutenant – die Eltern wollen's nit leide – er soll eine reiche Baas freien, eine Tuchfabrikantenstochter aus Reutlingen.«\n", "eaText": "Einige Augenblicke später sah sie vor sich ein Bild, das sie seltsam bewegte. Die Laube auf dem Hügel, eine Bretterhütte mit schrägem Dach, von jener einfachen Form, wie altdeutsche Darstellungen aus der heiligen Schrift sie zeigen, war erfüllt von goldenem Abendlicht. Auf der Wiese, die sie umgab, standen blaue und weiße Blumen mit schlanken Stengeln, die von den schrägfallenden Sonnenstrahlen beleuchtet, in einer unirdischen, gläsernen Schönheit erglänzten. In der offenen Holzlaube, mitten in dem goldenen Duft saß ein junges Weib von einer holden, süßen, leidenden Lieblichkeit der Erscheinung. Ihre schmalen und bleichen Hände lagen ihr müde im Schoß, ihre braunen durchsichtigen Augen blickten durch Tränen über die frühlingsblühende Weite in ein Tal von Schmerzen, das nur ihrem Blicke sichtbar wurde. Und über ihr, am blauen Himmel, unter den schneeglänzenden, goldumsäumten Sommerwölkchen flog gemächlichen Flügelschlages ein großer schwarz-weißer Storch.\n\n„Der hält sich immer hier in der Näh’,“ sagte Frau Uffenbacher mit einem fröhlichen Stolz. „Die Freilen füttern ihn. Er gehört ja auch zu uns.“\n\n„Wer ist das Mädchen?“ fragte Cornelie leise.\n\n„Das ischt die Rose von Ulm. Hat letzte Woche entbunden. Morgen geht sie heim. Das Kind ischt vor einer Stunde geholt.“\n\nCornelie stürzten die Tränen aus den Augen.\n\n„Ja freilich,“ sprach Frau Uffenbacherin in einem strengen Ton. „’s ischt so – ich sag’s alleweil: Ein Wochenbett ischt kein Brautbett! Das bedenkt so ein Mädle nit vorher. Ei – Rösle, muscht nit heule! Kanscht doch jede Woche herüber und das Kleine sehen! Gut hat’s das Ding bei der Frau Lebzelter – sauber – da ischt nichts zu sage! Der Herr Papa wird ja doch einmal nachschauen! Na ja . . . Denket Sie an die Freilein Toni – das ischt ein Elend . . . Ihne wollte doch die Eltern von Eurem Herrn was gebe fürs Kindle . . . “\n\n„Ja, Frau Uffenbacher,“ sagte die Rose von Ulm in einem gereizten Ton, „ich weiß schon – aber ich will ihr Geld nicht – ich will einen Vater für mein Kind!“\n\nIhr feines Mädchengesicht zog sich zusammen zu der krampfhaften Energie eines Entschlusses, der mit der Wucht einer fixen Idee ihre Zukunft regieren würde: Ich will einen Vater für mein Kind!\n\nDie Rose von Ulm . . . Wie sie dort saß im goldenen Licht, im holden Blühen ihrer unschuldsvollen Schönheit hätte man der jungen Madonna gern den Göttersohn geglaubt – den Jupiter, der aus Himmelshöhen sich zu ihr niedergesenkt hatte. Doch Frau Uffenbacher flüsterte Cornelie ins Ohr: „’s ischt ein Leutenant – die Eltern wollen’s nit leide – er soll eine reiche Baas freien, eine Tuchfabrikantenstochter aus Reutlingen.“"}, {"id": "K08_01_NS", "kap": 8, "typ": "Nicht-Szene (deskriptiv-iterativ)", "titel": "Die stille Zeit", "fig": "Frau Uffenbacher, Hanne, Schweizer-Mari, das Ziehkind, Toni, Tonis Vater, Annerle, Cornelie, ehemalige Gäste, die rote Bärbe, das Agathle", "was": "Bestandsaufnahme des eingespielten Hausbetriebs. Bücherkontrast Annerle/Cornelie; versteckte Heftchen. Toni empfängt sonntags ihren Vater.", "sol": "Die ehemaligen Gäste kehren freiwillig an den Ort ihres schlimmsten Leidens zurück.", "anm": "Tränen: Toni wöchentlich, Annerle beim Lesen. Tränenhaus-Mütter: „die Fräuleins“.NF_K06_01_NS ", "eaVon": "Es kam nun eine stille Zeit. Ein Friede, der", "eaBis": "in der Schulter hatte. Dabei erzählte sie vom Hansel.", "nfVon": "Es kam nun eine stille Zeit. Ein Friede, der", "nfBis": "– das hat er mir geschwore, und ich glaub", "eaText": "Es kam nun eine stille Zeit. Ein Friede, der dem Annerle schier unheimlich dünkte, herrschte zwischen der Uffenbacherin und ihren Fräuleins. Die Alte bezeigte ihnen demütige Unterwürfigkeit und nur die Hanne erfuhr, wenn Türen und Fenster geschlossen waren, in der Küche die wahre Meinung der Gekränkten.\n\nDie Schweizer-Mari übte sich auf der Wiese im Spiel mit dem dicken Ziehkind des Hauses, das die Fräuleins das Versuchskind nannten, in mütterlichen Handgriffen. Die Toni räumte ihre Kommodenschubladen auf, kaute an einem Landjäger, untersuchte die Gurken im dreieckigen Gärtchen, ob sie noch nicht bald einen Salat geben könnten und erhielt an den Sonntagen den Besuch ihres Vaters, eines protestantischen Lehrers an der Volksschule einer kleinen bayerischen Stadt, den keines der anderen Mädchen jemals erblicken durfte. Das Essen wurde der Toni dann aufs Zimmer gebracht und man hörte ab und zu ein leises Gemurmel. Die Toni schrieb unter der Aufsicht ihres Vaters Postkarten an ihre Freundinnen, die er mitnahm, und auf der Rückreise in Augsburg in den Postkasten warf. Dort in Augsburg lernte Toni offiziell die Wirtschaft. Nach der Abreise ihres Vaters, die jedesmal um fünf Uhr nachmittags erfolgte, hatte Toni rote Augen und ein vom Weinen aufgeschwollenes Gesicht.\n\nAm Sonntag kam auch gewöhnlich die Rose von Ulm, um ihr Kleines bei der Frau Lebzelter in der unteren Dorfstraße zu besuchen. Zuweilen wurde sie von dem Leutnant in Zivil begleitet, dann frühstückten sie beide warm oben im Wirtshaus und die Rose bezahlte. Aber auch an solchen Tagen ließ sie es sich nicht nehmen, bei der Frau Uffenbacher einzuschauen. Eine sonderbare Anhänglichkeit fesselte alle die früheren Gäste an das kleine Tränenhaus, daß sie immer wiederkamen und mit Seufzen und Stöhnen sich in den niederen Stuben umschauten, wo sie ihres jungen Lebens bitterste Schmerzen gelitten hatten. Nur die Mutter des Agathle, das bei der rothaarigen Bärbe in der Pflege war, ließ sich niemals blicken, sondern fragte zuweilen brieflich an, ob die Kleine immer noch lebe, andere Kinder stürben doch, wenn man sie zu einer Ziehmutter gebe. Die Bärbe hatte nun erst recht einen Trotz darauf, das Agathle groß zu bringen, und lief die Nächte durch mit dem Kind auf den Armen im Stübchen auf und nieder, weil es zahnte und unruhig war. Am Tage saß sie an der Maschine und nähte für die Bäuerinnen Kinderwäsche – denn das Kostgeld für die Agath’ hatte die Mutter aus lauter Ärger über den Eigensinn der Bärbe schon lange zu schicken vergessen.\n\nDas Annerle war immer geschäftig, sie führte eine ausgebreitete Korrespondenz, packte und verschnürte zahllose Pakete und empfing andere aus allen Windrichtungen. Es war immer mit ihr ein eifriges und geheimnisvolles Treiben, als sei man acht Tage vor Weihnachten.\n\nCornelie hatte sich eine Tagesordnung aus Arbeit, Ruhe und Umherschlendern gemacht, die eine angenehme Gleichförmigkeit und dadurch so etwas wie Häuslichkeitsgefühl mit sich brachte. In ihrem Zimmer lagen große Stöße von Büchern; die Empfindung zu haben, jeden Augenblick sich der Gesellschaft auserlese
